<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Mine Bombers: Configurable</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            background-color: #000;
            color: #ddd;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        #game-frame {
            position: relative;
            width: 1024px;
            height: 598px;
            border: 2px solid #444;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            background: #222;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        /* UI OVERLAYS */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        h1 {
            color: #d32f2f;
            font-size: 40px;
            margin-bottom: 20px;
            text-shadow: 4px 4px #000;
        }

        h2 {
            color: #fbc02d;
            font-size: 20px;
            margin-bottom: 30px;
        }

        .btn {
            background: #b71c1c;
            border: 4px solid #8c1212;
            color: white;
            padding: 15px 30px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            width: 250px;
        }

        .btn:hover {
            background: #f44336;
        }

        .btn.small {
            width: auto;
            padding: 10px;
            font-size: 12px;
        }

        /* SETTINGS GRID */
        #keys-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .key-col {
            text-align: center;
        }

        .key-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 10px;
        }

        .key-btn {
            background: #333;
            border: 2px solid #555;
            color: #fff;
            padding: 5px;
            cursor: pointer;
            width: 80px;
            text-align: center;
            font-family: monospace;
        }

        .key-btn.waiting {
            background: #ffeb3b;
            color: #000;
        }

        #player-count-sel {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .sel-opt {
            opacity: 0.5;
            cursor: pointer;
            border: 2px solid transparent;
            padding: 10px;
        }

        .sel-opt.active {
            opacity: 1;
            border-color: #fff;
        }
    </style>
</head>

<body>

    <div id="game-frame" style="width:1024px; max-width:100%;">
        <canvas id="gameCanvas" width="1024" height="598"></canvas>

        <div id="menu-overlay" class="overlay" style="display:flex;">
            <h1>MINE BOMBERS</h1>
            <div id="player-count-sel">
                <div class="sel-opt active" onclick="Game.setCount(2)">2 PLAYERS</div>
                <div class="sel-opt" onclick="Game.setCount(3)">3 PLAYERS</div>
                <div class="sel-opt" onclick="Game.setCount(4)">4 PLAYERS</div>
            </div>
            <button class="btn" onclick="Game.startGame()">START GAME</button>
            <button class="btn" onclick="Game.openSettings()">CONTROLS</button>
        </div>

        <div id="settings-overlay" class="overlay">
            <h2>CONFIGURE CONTROLS</h2>
            <div id="keys-container"></div>
            <button class="btn" onclick="Game.saveSettings()">BACK</button>
            <button class="btn small" onclick="Game.resetKeys()"
                style="margin-top:20px; background:#444; border-color:#222;">RESET DEFAULTS</button>
        </div>
    </div>

    <script>
        /**
         * MINE BOMBERS: CONFIGURABLE
         * 4 Player Support, Custom Keys, LocalStorage
         */

        const CFG = {
            W: 64, H: 33, TILE: 16,
            HUD_H: 60, BAR_H: 10, GAME_H: 528, ROUND_TIME: 225
        };

        const HP = { SOFT: 40, HARD: 200, GOLD: 40, URETAN: 80, PLASMO: 200 };
        const WEAR = { 0: '0', 1: '0.25', 2: '0.5', 3: '0.75' };

        const TILE = { EMPTY: 0, HARD: 1, SOFT: 2, GOLD: 4, URETAN: 5, PLASMO: 6 };

        // Default Controls
        const DEFAULTS = [
            { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', stop: 'Digit3', act: 'KeyE', det: 'Digit2', next: 'Digit1', prev: 'KeyF' },      // P1
            { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', stop: 'KeyO', act: 'KeyL', det: 'KeyI', next: 'KeyU', prev: 'Digit7' }, // P2
            { up: 'KeyI', down: 'KeyK', left: 'KeyJ', right: 'KeyL', stop: 'Quote', act: 'Semicolon', det: 'KeyP', next: 'BracketRight', prev: 'BracketLeft' }, // P3
            { up: 'Numpad8', down: 'Numpad5', left: 'Numpad4', right: 'Numpad6', stop: 'NumpadDecimal', act: 'Numpad0', det: 'NumpadEnter', next: 'NumpadAdd', prev: 'NumpadSubtract' } // P4
        ];

        const ITEMS = {
            // Row 1
            'bomb_s': { n: "S.Bomb", p: 1, i: 'bomb_s', t: 'ammo', q: 5, r: 1, dmg: 50, trigger: (g, p, x, y) => g.bombs.push({ x: x, y: y, t: 100, r: 1, o: p, dmg: 50 }) },
            'bomb_b': { n: "B.Bomb", p: 3, i: 'bomb_b', t: 'ammo', q: 3, r: 3, dmg: 100, trigger: (g, p, x, y) => g.bombs.push({ x: x, y: y, t: 100, r: 3, o: p, dmg: 100 }) },
            'tnt': { n: "TNT", p: 10, i: 'tnt', t: 'ammo', q: 2, r: 4, hard: true, dmg: 150, trigger: (g, p, x, y) => g.bombs.push({ x: x, y: y, t: 100, r: 4, o: p, hard: true, dmg: 150 }) },
            'atom': { n: "Atom", p: 500, i: 'atom', t: 'ammo', q: 1, r: 12, hard: true, dmg: 1000, trigger: (g, p, x, y) => g.bombs.push({ x: x, y: y, t: 100, r: 12, o: p, hard: true, dmg: 1000 }) },
            'rem_s': { n: "S.Rem", p: 15, i: 'rem_s', t: 'ammo', q: 3, r: 2, trigger: (g, p, x, y) => { let b = { x: x, y: y, t: 999999, r: 2, o: p, dmg: 50 }; g.bombs.push(b); p.activeRemote = b; } },
            // Row 2
            'rem_b': { n: "B.Rem", p: 50, i: 'rem_b', t: 'ammo', q: 2, r: 5, trigger: (g, p, x, y) => { let b = { x: x, y: y, t: 999999, r: 5, o: p, dmg: 100 }; g.bombs.push(b); p.activeRemote = b; } },
            'grenade': { n: "Grenade", p: 25, i: 'grenade', t: 'ammo', q: 3, trigger: (g, p, x, y) => { let dx = Math.sign(p.vx) || 0; let dy = Math.sign(p.vy) || 1; g.projectiles.push({ x: p.x, y: p.y, vx: dx * 4, vy: dy * 4, life: 20, r: 3, o: p }); } },
            'mine': { n: "Mine", p: 20, i: 'mine', t: 'ammo', q: 3, trigger: (g, p, x, y) => g.bombs.push({ x: x, y: y, t: 999999, r: 2, o: p, type: 'mine', safeT: 5, dmg: 100 }) },
            'flame': { n: "Flame", p: 300, i: 'flame', t: 'ammo', q: 50, trigger: (g, p, x, y) => { let dx = Math.sign(p.vx) || 0; let dy = Math.sign(p.vy) || 1; g.floodFlame(x, y, dx, dy, 10); } },
            // Row 3 (Using exact logic from before)
            'canist': { n: "Canist", p: 80, i: 'canist', t: 'ammo', q: 1, trigger: (g, p, x, y) => g.bombs.push({ x: x, y: y, t: 100, r: 3, o: p, dmg: 75 }) }, // Assuming canister bomb?
            'oil': { n: "Oil", p: 50, i: 'oil', t: 'ammo', q: 1, trigger: (g, p, x, y) => g.bombs.push({ x: x, y: y, t: 100, r: 2, o: p, dmg: 60 }) },
            'bomb_h': { n: "H.Bomb", p: 30, i: 'bomb_h', t: 'ammo', q: 3, r: 5, dir: 'h', trigger: (g, p, x, y) => g.bombs.push({ x: x, y: y, t: 100, r: 5, o: p, dir: 'h', dmg: 80 }) },
            'bomb_v': { n: "V.Bomb", p: 30, i: 'bomb_v', t: 'ammo', q: 3, r: 5, dir: 'v', trigger: (g, p, x, y) => g.bombs.push({ x: x, y: y, t: 100, r: 5, o: p, dir: 'v', dmg: 80 }) },
            // Row 4
            'bomb_hb': { n: "B.H.Bmb", p: 100, i: 'bomb_hb', t: 'ammo', q: 1, r: 30, dir: 'h', trigger: (g, p, x, y) => g.bombs.push({ x: x, y: y, t: 100, r: 30, o: p, dir: 'h', dmg: 100 }) },
            'bomb_vb': { n: "B.V.Bmb", p: 100, i: 'bomb_vb', t: 'ammo', q: 1, r: 30, dir: 'v', trigger: (g, p, x, y) => g.bombs.push({ x: x, y: y, t: 100, r: 30, o: p, dir: 'v', dmg: 100 }) },
            'uretan': { n: "Urethane", p: 60, i: 'uretan', t: 'ammo', q: 3, trigger: (g, p, x, y) => g.floodFill(x, y, 20, TILE.URETAN) },
            'plastic': { n: "Plastic", p: 120, i: 'plastic', t: 'ammo', q: 2, trigger: (g, p, x, y) => g.floodFill(x, y, 20, TILE.PLASMO) },
            // Row 5
            'miner': { n: "Miner", p: 200, i: 'miner', t: 'ammo', q: 1, trigger: (g, p, x, y) => g.floodMine(x, y, 20) },
            'rock': { n: "Rock", p: 10, i: 'rock', t: 'ammo', q: 5, trigger: (g, p, x, y) => { if (g.map[y][x] === TILE.EMPTY) { g.map[y][x] = TILE.HARD; g.hpMap[y][x] = HP.HARD; } else return false; } },
            'dig_s': { n: "Dig S", p: 100, i: 'dig_s', t: 'buff', val: 1, trigger: (g, p) => p.digSpeed += 1 },
            'dig_m': { n: "Dig M", p: 500, i: 'dig_m', t: 'buff', val: 3, trigger: (g, p) => p.digSpeed += 3 },
            // Row 6
            'dig_l': { n: "Dig L", p: 1500, i: 'dig_l', t: 'buff', val: 10, trigger: (g, p) => p.digSpeed += 10 },
            'pipe': { n: "Pipe", p: 80, i: 'pipe', t: 'ammo', q: 2, trigger: (g, p, x, y) => g.pipes.push({ x: x, y: y }) },
            'clone': { n: "Clone", p: 400, i: 'clone', t: 'ammo', q: 1, trigger: (g, p, x, y) => g.clones.push({ x: p.x, y: p.y, vx: 0, vy: 0, intent: { x: 0, y: 0 }, dead: false, speed: 2, tool: 0 }) },
            'shield': { n: "Shield", p: 300, i: 'shield', t: 'buff', trigger: (g, p) => p.hp = 200 },
            // Row 7
            'cracker': { n: "Crackrs", p: 150, i: 'cracker', t: 'ammo', q: 3, trigger: (g, p, x, y) => g.bombs.push({ x: x, y: y, t: 100, r: 2, o: p, type: 'cracker', dmg: 50 }) },
            'speed': { n: "Speed", p: 200, i: 'speed', t: 'buff', val: 0.5, trigger: (g, p) => p.speed += 0.5 },
            'leave': { n: "LEAVE", p: 0, i: 'leave', t: 'exit', trigger: (g) => { /* handled in buy/logic special case? or trigger ready? */ } }
        };

        const SHOP_KEYS = [
            'bomb_s', 'bomb_b', 'tnt', 'atom', 'rem_s',
            'rem_b', 'grenade', 'mine', 'flame',
            'canist', 'oil', 'bomb_h', 'bomb_v',
            'bomb_hb', 'bomb_vb', 'uretan', 'plastic',
            'miner', 'rock', 'dig_s', 'dig_m',
            'dig_l', 'pipe', 'clone', 'shield',
            'cracker', 'speed', 'leave'
        ];

        const Gfx = {
            c: {},
            init: function () {
                this.g('hard', '#444', c => { c.fillStyle = '#222'; c.fillRect(0, 0, 16, 16); c.fillStyle = '#555'; c.fillRect(2, 2, 12, 12); c.fillStyle = '#000'; c.fillRect(4, 4, 2, 2); c.fillRect(10, 4, 2, 2); });
                this.g('soft', '#5d4037', c => { c.fillStyle = '#3e2723'; c.fillRect(0, 0, 16, 16); c.fillStyle = '#5d4037'; c.fillRect(2, 2, 12, 2); c.fillRect(2, 6, 8, 2); c.fillRect(6, 11, 7, 2); });
                this.g('gold', '#5d4037', c => { c.drawImage(this.c.soft, 0, 0); c.fillStyle = '#ffd700'; c.beginPath(); c.arc(8, 8, 4, 0, 7); c.fill(); });
                this.g('floor', '#1a1a1a', c => { c.fillStyle = '#222'; c.fillRect(4, 4, 2, 2); c.fillRect(12, 12, 2, 2); });

                const face = (k, shirt, hair) => this.g(k, '#333', c => {
                    c.fillStyle = '#ffccbc'; c.fillRect(4, 4, 24, 24);
                    c.fillStyle = hair; c.fillRect(4, 0, 24, 6);
                    c.fillStyle = '#fff'; c.fillRect(8, 12, 6, 6); c.fillRect(18, 12, 6, 6);
                    c.fillStyle = '#000'; c.fillRect(10, 14, 2, 2); c.fillRect(20, 14, 2, 2);
                    c.fillStyle = shirt; c.fillRect(0, 26, 32, 6);
                }, 32);

                face('p1', '#0d47a1', '#000'); // Blue
                face('p2', '#e65100', '#ffd700'); // Orange
                face('p3', '#2e7d32', '#5d4037'); // Green
                face('p4', '#6a1b9a', '#9e9e9e'); // Purple

                const ic = (k, fn) => this.g(k, '#222', c => {
                    // Background gradient for premium feel
                    let g = c.createLinearGradient(0, 0, 32, 32);
                    g.addColorStop(0, '#333'); g.addColorStop(1, '#111');
                    c.fillStyle = g; c.fillRect(0, 0, 32, 32);
                    // Inner bevel
                    c.strokeStyle = '#444'; c.lineWidth = 1; c.strokeRect(0.5, 0.5, 31, 31);
                    fn(c);
                }, 32);

                // Bombs
                ic('bomb_s', c => {
                    // Black Bomb
                    c.fillStyle = '#111'; c.beginPath(); c.arc(16, 18, 9, 0, 7); c.fill();
                    // Highlight
                    c.fillStyle = '#444'; c.beginPath(); c.arc(13, 15, 3, 0, 7); c.fill();
                    // Fuse
                    c.strokeStyle = '#d7ccc8'; c.lineWidth = 2; c.beginPath(); c.moveTo(16, 9); c.quadraticCurveTo(20, 5, 24, 6); c.stroke();
                    // Cap
                    c.fillStyle = '#555'; c.fillRect(14, 8, 4, 3);
                    // Spark
                    c.fillStyle = '#ffeb3b'; c.beginPath(); c.arc(24, 6, 2, 0, 7); c.fill(); c.fillStyle = '#f44336'; c.beginPath(); c.arc(24, 6, 1, 0, 7); c.fill();
                });
                ic('bomb_b', c => {
                    c.fillStyle = '#000'; c.beginPath(); c.arc(16, 19, 11, 0, 7); c.fill();
                    c.fillStyle = '#333'; c.beginPath(); c.arc(12, 15, 4, 0, 7); c.fill(); // Shine
                    c.strokeStyle = '#8d6e63'; c.lineWidth = 3; c.beginPath(); c.moveTo(16, 8); c.quadraticCurveTo(12, 2, 8, 4); c.stroke();
                    c.fillStyle = '#444'; c.fillRect(13, 7, 6, 4);
                    // Big Spark
                    c.fillStyle = '#ff9800'; c.beginPath(); c.arc(8, 4, 3, 0, 7); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(8, 4, 1.5, 0, 7); c.fill();
                });
                ic('tnt', c => {
                    // Wooden Box
                    c.fillStyle = '#b71c1c'; c.fillRect(6, 10, 20, 16);
                    // Slats
                    c.fillStyle = '#801313'; c.fillRect(6, 14, 20, 1); c.fillRect(6, 19, 20, 1);
                    c.fillStyle = '#ffeb3b'; c.font = 'bold 9px monospace'; c.fillText("TNT", 8, 21);
                    // Wires
                    c.strokeStyle = '#fff'; c.lineWidth = 1; c.beginPath(); c.moveTo(10, 10); c.lineTo(10, 6); c.moveTo(16, 10); c.lineTo(16, 5); c.moveTo(22, 10); c.lineTo(22, 6); c.stroke();
                });
                ic('atom', c => {
                    // Nucleus
                    c.fillStyle = '#000'; c.beginPath(); c.arc(16, 16, 10, 0, 7); c.fill();
                    // Rings
                    c.strokeStyle = '#00e676'; c.lineWidth = 1;
                    c.beginPath(); c.ellipse(16, 16, 12, 4, Math.PI / 4, 0, 7); c.stroke();
                    c.beginPath(); c.ellipse(16, 16, 12, 4, -Math.PI / 4, 0, 7); c.stroke();
                    c.fillStyle = '#00e676'; c.font = '9px monospace'; c.fillText("ATM", 8, 19);
                });

                // Remotes
                ic('rem_s', c => {
                    c.fillStyle = '#616161'; c.fillRect(8, 10, 16, 18);
                    c.fillStyle = '#212121'; c.fillRect(10, 12, 12, 6); // Screen
                    c.fillStyle = '#f44336'; c.beginPath(); c.arc(16, 22, 3, 0, 7); c.fill(); // Button
                    c.strokeStyle = '#bdbdbd'; c.lineWidth = 1; c.beginPath(); c.moveTo(20, 10); c.lineTo(20, 2); c.stroke(); // Antenna
                });
                ic('rem_b', c => {
                    c.fillStyle = '#424242'; c.fillRect(6, 12, 20, 14);
                    c.fillStyle = '#000'; c.fillRect(8, 14, 8, 6); // Screen
                    c.strokeStyle = '#0f0'; c.lineWidth = 1; c.strokeRect(9, 15, 6, 4); // Waveform
                    c.fillStyle = '#f44336'; c.fillRect(20, 16, 4, 4); // Button
                    c.strokeStyle = '#9e9e9e'; c.lineWidth = 2; c.beginPath(); c.moveTo(10, 12); c.lineTo(10, 4); c.stroke();
                });

                // Grenades & Mines
                ic('grenade', c => {
                    c.fillStyle = '#33691e'; c.beginPath(); c.ellipse(16, 18, 9, 11, 0, 0, 7); c.fill(); // Body
                    c.strokeStyle = '#1b5e20'; c.lineWidth = 1; for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(8 + i * 8, 10); c.lineTo(8 + i * 8, 26); c.stroke(); } // Grid
                    c.fillStyle = '#555'; c.fillRect(14, 6, 4, 4); // Pin block
                    c.strokeStyle = '#bdbdbd'; c.beginPath(); c.arc(12, 8, 3, 0, Math.PI * 1.5); c.stroke(); // Pin ring
                });
                ic('mine', c => {
                    c.fillStyle = '#3e2723'; c.beginPath(); c.arc(16, 22, 10, Math.PI, 0); c.fill(); // Dome
                    c.fillStyle = '#f44336'; c.beginPath(); c.arc(16, 18, 2, 0, 7); c.fill(); // Light
                    c.fillStyle = '#5d4037'; c.fillRect(4, 22, 24, 4); // Base
                });
                ic('cracker', c => {
                    c.fillStyle = '#d32f2f'; for (let i = 0; i < 5; i++) c.fillRect(6 + i * 4, 12 + (i % 2) * 4, 3, 10);
                    c.strokeStyle = '#ffeb3b'; c.beginPath(); c.moveTo(6, 12); c.lineTo(26, 12); c.stroke(); // String
                });

                // Fluids / Mats
                ic('flame', c => {
                    c.fillStyle = '#ff6f00'; c.beginPath(); c.moveTo(16, 6); c.quadraticCurveTo(6, 16, 10, 28); c.quadraticCurveTo(16, 32, 22, 28); c.quadraticCurveTo(26, 16, 16, 6); c.fill();
                    c.fillStyle = '#ffca28'; c.beginPath(); c.moveTo(16, 12); c.quadraticCurveTo(12, 18, 14, 24); c.quadraticCurveTo(16, 26, 18, 24); c.quadraticCurveTo(20, 18, 16, 12); c.fill();
                });
                ic('canist', c => {
                    c.fillStyle = '#b71c1c'; c.fillRect(8, 10, 16, 18); // Body
                    c.fillStyle = '#b71c1c'; c.fillRect(8, 6, 6, 4); // Spout
                    c.strokeStyle = '#e53935'; c.lineWidth = 2; c.beginPath(); c.moveTo(10, 10); c.lineTo(22, 26); c.stroke(); // X mark
                });
                ic('oil', c => {
                    c.fillStyle = '#212121'; c.beginPath(); c.arc(16, 20, 9, 0, 7); c.fill();
                    c.beginPath(); c.moveTo(16, 6); c.lineTo(10, 16); c.lineTo(22, 16); c.fill(); // Drop top
                    c.fillStyle = '#424242'; c.beginPath(); c.arc(13, 16, 2, 0, 7); c.fill(); // Shine
                });
                ic('uretan', c => {
                    c.fillStyle = '#fbc02d'; c.fillRect(8, 8, 16, 20); // Barrel
                    c.strokeStyle = '#f57f17'; c.lineWidth = 2; c.beginPath(); c.moveTo(8, 12); c.lineTo(24, 12); c.moveTo(8, 24); c.lineTo(24, 24); c.stroke(); // Ribs
                    c.fillStyle = '#000'; c.font = 'bold 10px monospace'; c.fillText("U", 13, 22);
                });
                ic('plastic', c => {
                    c.fillStyle = '#ec407a'; c.fillRect(6, 12, 20, 12); // Block
                    c.fillStyle = '#f8bbd0'; c.fillRect(6, 12, 20, 3); // Highlight
                    c.fillStyle = '#fff'; c.font = 'bold 8px monospace'; c.fillText("C4", 10, 21);
                });

                // Bombs Special
                ic('bomb_h', c => {
                    c.drawImage(this.c.bomb_s, 0, 0);
                    c.fillStyle = '#00e676'; c.beginPath(); c.moveTo(2, 16); c.lineTo(8, 10); c.lineTo(8, 22); c.fill(); // Left arrow
                    c.beginPath(); c.moveTo(30, 16); c.lineTo(24, 10); c.lineTo(24, 22); c.fill(); // Right arrow
                });
                ic('bomb_v', c => {
                    c.drawImage(this.c.bomb_s, 0, 0);
                    c.fillStyle = '#00e676'; c.beginPath(); c.moveTo(16, 2); c.lineTo(10, 8); c.lineTo(22, 8); c.fill(); // Up
                    c.beginPath(); c.moveTo(16, 30); c.lineTo(10, 24); c.lineTo(22, 24); c.fill(); // Down
                });
                ic('bomb_hb', c => { c.drawImage(this.c.bomb_b, 0, 0); c.strokeStyle = '#00e676'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, 16); c.lineTo(32, 16); c.stroke(); });
                ic('bomb_vb', c => { c.drawImage(this.c.bomb_b, 0, 0); c.strokeStyle = '#00e676'; c.lineWidth = 3; c.beginPath(); c.moveTo(16, 0); c.lineTo(16, 32); c.stroke(); });

                // Tools
                ic('miner', c => {
                    c.strokeStyle = '#8d6e63'; c.lineWidth = 3; c.beginPath(); c.moveTo(16, 28); c.lineTo(26, 6); c.stroke(); // Handle
                    c.strokeStyle = '#cfd8dc'; c.lineWidth = 3; c.beginPath(); c.moveTo(12, 10); c.quadraticCurveTo(26, 6, 28, 14); c.stroke(); // Head
                    c.fillStyle = '#b0bec5'; c.beginPath(); c.moveTo(26, 6); c.lineTo(10, 12); c.lineTo(24, 4); c.fill(); // Pick
                });
                ic('rock', c => {

                ic('dig_m', c => { c.drawImage(this.c.dig_s, 0, 0); c.strokeStyle = '#0f0'; c.lineWidth = 2; c.strokeRect(2, 2, 28, 28); });
                ic('dig_l', c => { c.fillStyle = '#ffa000'; c.fillRect(10, 6, 12, 20); c.fillStyle = '#212121'; for (let i = 0; i < 4; i++) c.fillRect(10, 8 + i * 5, 12, 2); });

                ic('pipe', c => { c.fillStyle = '#2e7d32'; c.fillRect(10, 4, 12, 24); c.fillRect(6, 12, 20, 8); c.fillStyle = '#1b5e20'; c.fillRect(12, 6, 8, 20); });
                ic('clone', c => { c.fillStyle = '#9e9e9e'; c.fillRect(8, 6, 16, 20); c.fillStyle = '#000'; c.fillRect(10, 10, 4, 4); c.fillRect(18, 10, 4, 4); c.fillRect(12, 20, 8, 2); });
                ic('shield', c => { c.fillStyle = '#3f51b5'; c.beginPath(); c.moveTo(8, 6); c.lineTo(24, 6); c.lineTo(24, 18); c.quadraticCurveTo(16, 28, 8, 18); c.fill(); c.fillStyle = '#fff'; c.fillText("+", 13, 18); });
                ic('speed', c => { c.fillStyle = '#d32f2f'; c.beginPath(); c.moveTo(6, 20); c.lineTo(18, 20); c.lineTo(18, 10); c.lineTo(26, 10); c.lineTo(26, 26); c.lineTo(6, 26); c.fill(); c.fillStyle = '#ffeb3b'; c.fillRect(14, 12, 8, 2); c.fillRect(16, 16, 6, 2); });

            g: function (k, c, fn, s = 16) { let cv = document.createElement('canvas'); cv.width = s; cv.height = s; let cx = cv.getContext('2d'); if (c) { cx.fillStyle = c; cx.fillRect(0, 0, s, s); } if (fn) fn(cx); this.c[k] = cv; }
        };

        const Game = {
            c: null, ctx: null,
            state: 'MENU',
            level: 1,
            time: CFG.ROUND_TIME,

            playerCount: 2,
            controls: [],
            players: [],

            // Shop Logic
            shopPhase: 0,
            shopCursors: [0, 0],
            ready: [false, false],

            map: [],
            hpMap: [], // Health for each tile
            dMap: [], // Visual damage state (0-3) map
            bombs: [],
            projectiles: [],
            pipes: [],
            clones: [],
            cam: { x: 0, y: 0 },

            init: function () {
                this.c = document.getElementById('gameCanvas');
                this.ctx = this.c.getContext('2d');
                this.ctx.imageSmoothingEnabled = false; // Pixel art look

                Gfx.init();

                // Load Controls
                let saved = localStorage.getItem('mb_controls');
                this.controls = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULTS));

                // Input handling
                window.addEventListener('keydown', e => {
                    if (this.state === 'GAME' && e.code === 'Escape') {
                        this.endRound('ABORT');
                        return;
                    }
                    this.input(e); // Call the existing input handler
                });

                this.renderKeys(); // Init UI
                this.loop();
            },

            setCount: function (n) {
                this.playerCount = n;
                document.querySelectorAll('.sel-opt').forEach((el, i) => {
                    el.classList.toggle('active', (i + 2) === n);
                });
            },

            startGame: function () {
                document.getElementById('menu-overlay').style.display = 'none';
                this.initPlayers();
                this.startShop();
            },

            initPlayers: function () {
                this.players = [];
                for (let i = 0; i < this.playerCount; i++) {
                    this.players.push({
                        id: i, name: `P${i + 1}`, cash: 750,
                        hp: 100, maxHp: 100, x: 0, y: 0, dead: false,
                        vx: 0, vy: 0, speed: 2,
                        digSpeed: 0, // Damage per tick. 0 is base.
                        intent: { x: 0, y: 0 }, // Queued direction
                        inv: {}, wep: 'bomb_s', tool: 0
                    });
                }
            },

            startShop: function () {
                this.state = 'SHOP';
                this.shopPhase = 0;
                this.ready = [false, false];
                this.shopCursors = [0, 0];
            },

            startRound: function () {
                this.state = 'GAME';
                this.time = CFG.ROUND_TIME;
                this.bombs = [];

                // Map & HP
                this.map = [];
                this.hpMap = [];
                this.dMap = [];
                for (let y = 0; y < CFG.H; y++) {
                    let row = [];
                    let hpRow = [];
                    let dRow = [];
                    for (let x = 0; x < CFG.W; x++) {
                        let t = TILE.EMPTY, h = 0;
                        if (x === 0 || y === 0 || x === CFG.W - 1 || y === CFG.H - 1) { t = TILE.HARD; h = HP.HARD; }
                        else {
                            let r = Math.random();
                            if (r < 0.3) { t = TILE.SOFT; h = HP.SOFT; }
                            else if (r < 0.4) { t = TILE.HARD; h = HP.HARD; }
                        }
                        row.push(t);
                        hpRow.push(h);
                        dRow.push(0);
                    }
                    this.map.push(row);
                    this.hpMap.push(hpRow);
                    this.dMap.push(dRow);
                }

                // Spawn Corners
                // P1: UL (2,2), P2: LR (61,30), P3: UR (61,2), P4: LL (2,30)
                let locs = [
                    { x: 2, y: 2 }, { x: 61, y: 30 },
                    { x: 61, y: 2 }, { x: 2, y: 30 }
                ];

                this.players.forEach((p, i) => {
                    p.x = locs[i].x * 16;
                    p.y = locs[i].y * 16;
                    p.dead = false;
                    p.hp = 100;
                    // Clear spawn area
                    this.map[locs[i].y][locs[i].x] = TILE.EMPTY;
                    this.hpMap[locs[i].y][locs[i].x] = 0;
                });

                if (this.timer) clearInterval(this.timer);
                this.timer = setInterval(() => {
                    if (this.state === 'GAME') {
                        this.time -= 0.05; // 20 TPS so 0.05s per tick
                        if (this.time <= 0) this.endRound("TIME");
                    }
                }, 50); // 20 TPS
            },

            input: function (e) {
                if (this.binding) {
                    this.bindKey(e.code);
                    return;
                }

                if (this.state === 'SHOP') {
                    // Determine active players for this phase
                    let pIdx1 = this.shopPhase * 2;
                    let pIdx2 = this.shopPhase * 2 + 1;

                    // Left Side Input
                    if (this.players[pIdx1] && !this.ready[0]) {
                        let k = this.controls[pIdx1];
                        let max = SHOP_KEYS.length - 1;
                        if (e.code === k.up) this.shopCursors[0] = Math.max(0, this.shopCursors[0] - 4);
                        if (e.code === k.down) this.shopCursors[0] = Math.min(max, this.shopCursors[0] + 4);
                        if (e.code === k.left) this.shopCursors[0] = Math.max(0, this.shopCursors[0] - 1);
                        if (e.code === k.right) this.shopCursors[0] = Math.min(max, this.shopCursors[0] + 1);
                        if (e.code === k.act) this.buy(pIdx1, this.shopCursors[0]);
                    }
                    // Right Side Input
                    if (this.players[pIdx2] && !this.ready[1]) {
                        let k = this.controls[pIdx2];
                        let max = SHOP_KEYS.length - 1;
                        if (e.code === k.up) this.shopCursors[1] = Math.max(0, this.shopCursors[1] - 4);
                        if (e.code === k.down) this.shopCursors[1] = Math.min(max, this.shopCursors[1] + 4);
                        if (e.code === k.left) this.shopCursors[1] = Math.max(0, this.shopCursors[1] - 1);
                        if (e.code === k.right) this.shopCursors[1] = Math.min(max, this.shopCursors[1] + 1);
                        if (e.code === k.act) this.buy(pIdx2, this.shopCursors[1]);
                    }
                }
                else if (this.state === 'GAME') {
                    this.players.forEach(p => {
                        if (p.dead) return;
                        let k = this.controls[p.id];
                        // Set Intent (Queued Move)
                        if (e.code === k.up) p.intent = { x: 0, y: -1 };
                        if (e.code === k.down) p.intent = { x: 0, y: 1 };
                        if (e.code === k.left) p.intent = { x: -1, y: 0 };
                        if (e.code === k.right) p.intent = { x: 1, y: 0 };
                        if (e.code === k.stop) p.intent = { x: 0, y: 0 };

                        // Item Switching
                        if (e.code === k.next) this.cycleItem(p, 1);
                        if (e.code === k.prev) this.cycleItem(p, -1);

                        // Interaction
                        if (e.code === k.act) this.action(p);
                        if (e.code === k.det) this.detonateRemote(p);
                    });
                }
            },

            buy: function (pid, idx) {
                let p = this.players[pid];
                let key = SHOP_KEYS[idx];
                let item = ITEMS[key];
                let side = pid % 2; // 0 or 1 on screen

                if (item.n === "LEAVE") {
                    this.ready[side] = true;
                    this.checkShopNext();
                } else if (p.cash >= item.p) {
                    p.cash -= item.p;
                    if (item.t === 'tool') p.tool = item.v || 1; // Assuming tools have value or generic
                    else if (item.t === 'heal') p.hp = 100;
                    else {
                        if (!p.inv[key]) p.inv[key] = 0;
                        p.inv[key] += item.q || item.a || 1;
                        if (item.t === 'ammo' || item.t === 'wep') p.wep = key;
                    }
                }
            },

            checkShopNext: function () {
                let p1OK = !this.players[this.shopPhase * 2] || this.ready[0];
                let p2OK = !this.players[this.shopPhase * 2 + 1] || this.ready[1];

                if (p1OK && p2OK) {
                    // Check if more players
                    if (this.players.length > (this.shopPhase + 1) * 2) {
                        this.shopPhase++;
                        this.ready = [false, false];
                        this.shopCursors = [0, 0];
                    } else {
                        this.startRound();
                    }
                }
            },

            updatePhysics: function () {
                this.players.forEach(p => {
                    if (p.dead) return;
                    if (p.teleportDelay > 0) p.teleportDelay--;

                    // Pipe Interaction
                    if (p.teleportDelay <= 0) {
                        let pipe = this.pipes.find(pi => Math.abs(pi.x * 16 - p.x) < 8 && Math.abs(pi.y * 16 - p.y) < 8);
                        if (pipe) {
                            // Find other pipe
                            let others = this.pipes.filter(pi => pi !== pipe);
                            if (others.length > 0) {
                                let target = others[Math.floor(Math.random() * others.length)];
                                p.x = target.x * 16;
                                p.y = target.y * 16;
                                p.teleportDelay = 60; // 1s cooldown
                                p.vx = 0; p.vy = 0; // Stop momentum
                            }
                        }
                    }

                    // 1. Check if at Grid Center (Node)
                    // Coordinates are top-left. Center of 16x16 tile is +8,+8 relative? 
                    // No, we draw top-left. A "cell" is at x%16 === 0.
                    // We want to snap to when x is a multiple of 16.
                    let atNode = (p.x % 16 === 0) && (p.y % 16 === 0);

                    // 2. Handle Direction Changes at Node or 180 flips
                    if (atNode) {
                        // We are perfectly aligned. Can we switch to intent?
                        let idx = p.intent.x;
                        let idy = p.intent.y;

                        // Check if intent is different from current or if we are stopped
                        if (idx !== 0 || idy !== 0) {
                            // Trying to move. Check collision for the NEXT tile in that direction
                            // We occupy the current tile. We want to enter the next.
                            let targetRect = {
                                x: p.x + idx * 16, // Check full tile head
                                y: p.y + idy * 16,
                                w: 14, h: 14
                            };

                            // NOTE: AABB is slight smaller (14) centered, but here we just check grid
                            // Let's use simpler grid check for new move start
                            let tx = (p.x / 16) + idx;
                            let ty = (p.y / 16) + idy;
                            let canMove = this.canMoveTo(p, tx, ty);

                            if (canMove) {
                                let t = this.map[ty][tx];
                                // Apply Slow Effects
                                let moveSpeed = p.speed;
                                if (t === TILE.URETAN) moveSpeed *= 0.5;
                                if (t === TILE.PLASMO) moveSpeed *= 0.2;

                                p.vx = idx * moveSpeed;
                                p.vy = idy * moveSpeed;
                            } else {
                                p.vx = 0; p.vy = 0;
                            }
                        } else {
                            // Intent is STOP
                            p.vx = 0; p.vy = 0;
                        }
                    } else {
                        // Not at node. We are "coasting".
                        // Allow 180 reverse immediately?
                        // Current dir: p.vx/speed. 
                        let cx = Math.sign(p.vx);
                        let cy = Math.sign(p.vy);

                        if ((p.intent.x !== 0 && p.intent.x === -cx) ||
                            (p.intent.y !== 0 && p.intent.y === -cy)) {
                            p.vx = p.intent.x * p.speed;
                            p.vy = p.intent.y * p.speed;
                        }
                    }

                    // 3. Apply Velocity
                    if (p.vx === 0 && p.vy === 0) return;

                    let nextX = p.x + p.vx;
                    let nextY = p.y + p.vy;

                    // 4. Stop at Grid Centers if Blocked or Stopping
                    // If we overshoot a grid center (multiple of 16), snap to it and re-eval
                    // Moving Right (vx > 0)
                    if (p.vx > 0 && Math.floor(nextX / 16) > Math.floor(p.x / 16)) {
                        nextX = (Math.floor(p.x / 16) + 1) * 16;
                        // We arrived at node. Logic next frame handles turn/stop.
                    }
                    // Left
                    if (p.vx < 0 && Math.ceil(nextX / 16) < Math.ceil(p.x / 16)) {
                        nextX = (Math.ceil(p.x / 16) - 1) * 16;
                    }
                    // Down
                    if (p.vy > 0 && Math.floor(nextY / 16) > Math.floor(p.y / 16)) {
                        nextY = (Math.floor(p.y / 16) + 1) * 16;
                    }
                    // Up
                    if (p.vy < 0 && Math.ceil(nextY / 16) < Math.ceil(p.y / 16)) {
                        nextY = (Math.ceil(p.y / 16) - 1) * 16;
                    }

                    p.x = nextX;
                    p.y = nextY;
                });
            },

            canMoveTo: function (p, tx, ty) {
                tx = Math.floor(tx);
                ty = Math.floor(ty);
                if (tx < 0 || tx >= CFG.W || ty < 0 || ty >= CFG.H) return false;
                let t = this.map[ty][tx];
                if (t === TILE.HARD) return false;
                if (t === TILE.URETAN || t === TILE.PLASMO) return true; // Can move but slow
                if (t === TILE.SOFT || t === TILE.GOLD) {
                    if (p.tool >= 0) {
                        // Apply Damage
                        let dmg = p.digSpeed;
                        if (dmg <= 0) dmg = 1; // Minimum 1 damage/tick

                        // Reduce HP
                        this.hpMap[ty][tx] -= dmg;

                        // Update Visual Wear
                        let maxHp = (t === TILE.SOFT || t === TILE.GOLD) ? HP.SOFT : HP.URETAN;
                        let pct = this.hpMap[ty][tx] / maxHp;
                        if (pct <= 0) {
                            if (t === TILE.GOLD) p.cash += 50;
                            this.map[ty][tx] = TILE.EMPTY;
                            this.hpMap[ty][tx] = 0;
                            this.dMap[ty][tx] = 0;
                            return true; // Dig complete, move
                        } else {
                            // Update wear state (0=100%, 1=75%, 2=50%, 3=25%)
                            if (pct < 0.25) this.dMap[ty][tx] = 3;
                            else if (pct < 0.5) this.dMap[ty][tx] = 2;
                            else if (pct < 0.75) this.dMap[ty][tx] = 1;
                            else this.dMap[ty][tx] = 0;
                        }
                        return false; // Still digging
                    }
                    return false;
                }
                return true;
            },

            // Deprecated Old Collision
            checkCollision: function (p, rect) { return false; },

            move: function (p, dx, dy) {
                // Deprecated by updatePhysics, kept if needed for other refs or removed
            },

            updateCam: function () {
                // Manage Projectiles
                this.projectiles.forEach((p, i) => {
                    p.x += p.vx; p.y += p.vy; p.life--;

                    // Collision with players/clones
                    // If p.o is player, hit enemies. If p.o is clone, hit enemies/players?
                    // Simplified: Projectiles hit anything except owner

                    if (p.life <= 0 || this.checkCollision(p, { x: p.x, y: p.y, w: 8, h: 8 })) {
                        this.projectiles.splice(i, 1);
                        let bx = Math.floor((p.x + 8) / 16), by = Math.floor((p.y + 8) / 16);
                        this.bombs.push({ x: bx, y: by, t: 100, r: p.r, o: p.o, hard: false });
                    }
                });

                // Clones Logic
                this.clones.forEach(c => {
                    if (c.dead) return;
                    // Random Move (Simulating input)
                    if (Math.random() < 0.05) {
                        let dirs = [{ x: 0, y: -1 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 1, y: 0 }, { x: 0, y: 0 }];
                        c.intent = dirs[Math.floor(Math.random() * dirs.length)];
                    }

                    // Shoot (if enemy nearby)
                    if (Math.random() < 0.02) {
                        // Fire projectile
                        let dx = Math.sign(c.vx), dy = Math.sign(c.vy);
                        if (dx === 0 && dy === 0) { dx = 0; dy = 1; }
                        this.projectiles.push({ x: c.x, y: c.y, vx: dx * 4, vy: dy * 4, life: 20, r: 2, o: c });
                    }

                    // Physics (Reuse player logic via spoofing?)
                    // Easier to duplicate physics step for clones or generalize
                    // Generalizing for now:
                    this.updateEntityPhysics(c);
                });

                // Cam update no longer needed for scrolling, but maybe for other effects?
                // this.updateCam(); 
                this.cam.x = 0;
                this.cam.y = 0;
            },

            updateEntityPhysics: function (p) {
                // Simplified Grid Snap for Clones
                if (p.vx === 0 && p.vy === 0 && p.intent) {
                    // Apply intent if valid
                    let tx = (Math.floor(p.x / 16)) + p.intent.x;
                    let ty = (Math.floor(p.y / 16)) + p.intent.y;
                    if (this.canMoveTo(p, tx, ty)) {
                        p.vx = p.intent.x * 2;
                        p.vy = p.intent.y * 2;
                    }
                }

                p.x += p.vx;
                p.y += p.vy;

                // Stop at nodes?
                if (p.x % 16 === 0 && p.y % 16 === 0) {
                    // Check if should continue or change
                    let tx = (p.x / 16) + Math.sign(p.vx);
                    let ty = (p.y / 16) + Math.sign(p.vy);
                    if (!this.canMoveTo(p, tx, ty)) {
                        p.vx = 0; p.vy = 0;
                    }
                }
            },

            cycleItem: function (p, dir) {
                // Get all items p has > 0 count of
                let owned = Object.keys(p.inv).filter(k => p.inv[k] > 0);
                if (owned.length === 0) return;

                let idx = owned.indexOf(p.wep);
                if (idx === -1) idx = 0;

                idx += dir;
                if (idx >= owned.length) idx = 0;
                if (idx < 0) idx = owned.length - 1;

                p.wep = owned[idx];
            },

            action: function (p) {
                let key = p.wep;
                if (!key || !p.inv[key]) return;

                let item = ITEMS[key];
                if (item && item.trigger) {
                    let bx = Math.floor((p.x + 8) / 16);
                    let by = Math.floor((p.y + 8) / 16);

                    // Execute Trigger
                    // Trigger returns undefined usually or false if failed?
                    // Let's assume trigger always succeeds if called, logic check inside trigger.
                    // Special case: Rock returns false if not placed.

                    let res = item.trigger(this, p, bx, by);

                    // Consume if not false explicitly
                    if (res !== false) {
                        if (item.t === 'ammo' || item.t === 'wep') {
                            p.inv[key]--;
                            if (p.inv[key] <= 0) {
                                // Auto switch? or stay 0?
                                // Stay 0 is fine, HUD shows 0
                            }
                        }
                    }
                }
            },

            detonateRemote: function (p) {
                if (p.activeRemote) {
                    p.activeRemote.t = 1; // Explode next frame
                    p.activeRemote = null;
                }
            },

            explode: function (b) {
                let q = [{ x: b.x, y: b.y, d: 0 }]; // d = distance from origin
                let visited = new Set();
                let affectedTiles = new Set(); // To track unique tiles for damage application

                while (q.length > 0) {
                    let c = q.shift();
                    let key = c.x + "," + c.y;

                    if (visited.has(key)) continue;
                    visited.add(key);

                    if (c.x < 0 || c.x >= CFG.W || c.y < 0 || c.y >= CFG.H) continue;

                    // Apply damage to players/clones in this tile
                    this.players.forEach(p => {
                        if (!p.dead && Math.floor((p.x + 8) / 16) === c.x && Math.floor((p.y + 8) / 16) === c.y) {
                            p.hp -= b.dmg;
                            if (p.hp <= 0) p.dead = true;
                        }
                    });
                    this.clones.forEach(cl => {
                        if (!cl.dead && Math.floor((cl.x + 8) / 16) === c.x && Math.floor((cl.y + 8) / 16) === c.y) {
                            cl.hp -= b.dmg; // Clones might not have HP, add if needed
                            if (cl.hp <= 0) cl.dead = true;
                        }
                    });

                    // Add tile to affected list for later processing
                    affectedTiles.add(key);

                    // Check if explosion should propagate further
                    if (c.d >= b.r) continue; // Max range reached

                    let t = this.map[c.y][c.x];

                    // Stop propagation for hard blocks unless bomb is hard-breaking
                    if (t === TILE.HARD && !b.hard) continue;

                    // Add neighbors to queue
                    // Standard propagation
                    if (!b.dir) {
                        q.push({ x: c.x + 1, y: c.y, d: c.d + 1 });
                        q.push({ x: c.x - 1, y: c.y, d: c.d + 1 });
                        q.push({ x: c.x, y: c.y + 1, d: c.d + 1 });
                        q.push({ x: c.x, y: c.y - 1, d: c.d + 1 });
                    } else {
                        // Directional bomb
                        if (b.dir === 'h') {
                            q.push({ x: c.x + 1, y: c.y, d: c.d + 1 });
                            q.push({ x: c.x - 1, y: c.y, d: c.d + 1 });
                        } else if (b.dir === 'v') {
                            q.push({ x: c.x, y: c.y + 1, d: c.d + 1 });
                            q.push({ x: c.x, y: c.y - 1, d: c.d + 1 });
                        }
                    }
                }

                // Now apply damage to tiles based on affectedTiles
                affectedTiles.forEach(key => {
                    let [x, y] = key.split(',').map(Number);

                    // Spawn Explosion Effect
                    this.spawnEffect(x, y, 'EXPLOSION');

                    if (x < 0 || x >= CFG.W || y < 0 || y >= CFG.H) return;

                    let t = this.map[y][x];
                    if (t === TILE.EMPTY) return; // Don't damage empty tiles

                    this.hpMap[y][x] -= b.dmg;

                    if (this.hpMap[y][x] <= 0) {
                        this.map[y][x] = TILE.EMPTY;
                        this.hpMap[y][x] = 0;
                        this.dMap[y][x] = 0;
                    } else {
                        // Update wear state
                        let maxHp = 0;
                        if (t === TILE.SOFT) maxHp = HP.SOFT;
                        else if (t === TILE.HARD) maxHp = HP.HARD;
                        else if (t === TILE.GOLD) maxHp = HP.GOLD;
                        else if (t === TILE.URETAN) maxHp = HP.URETAN;
                        else if (t === TILE.PLASMO) maxHp = HP.PLASMO;

                        if (maxHp > 0) {
                            let pct = this.hpMap[y][x] / maxHp;
                            if (pct < 0.25) this.dMap[y][x] = 3;
                            else if (pct < 0.5) this.dMap[y][x] = 2;
                            else if (pct < 0.75) this.dMap[y][x] = 1;
                            else this.dMap[y][x] = 0;
                        }
                    }
                });
            },

            floodMine: function (x, y, max) {
                let q = [{ x, y }];
                let visited = new Set();
                let count = 0;
                // Find connected HARD blocks (looking at neighbors of current pos, if hard destroy it)
                // Actually Miner should be used NEXT to hard blocks. 
                // Let's scan 3x3 around player, if HARD found, start flood fill destroy on it

                let starts = [];
                for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
                    let tx = x + dx, ty = y + dy;
                    if (tx >= 0 && tx < CFG.W && ty >= 0 && ty < CFG.H && this.map[ty][tx] === TILE.HARD) {
                        starts.push({ x: tx, y: ty });
                    }
                }

                starts.forEach(s => {
                    q.push(s);
                });

                while (q.length > 0 && count < max) {
                    let c = q.shift();
                    let key = c.x + "," + c.y;
                    if (visited.has(key)) continue;
                    visited.add(key);

                    if (c.x < 0 || c.x >= CFG.W || c.y < 0 || c.y >= CFG.H) continue;
                    if (this.map[c.y][c.x] === TILE.HARD) {
                        this.map[c.y][c.x] = TILE.EMPTY;
                        count++;
                        q.push({ x: c.x + 1, y: c.y }); q.push({ x: c.x - 1, y: c.y });
                        q.push({ x: c.x, y: c.y + 1 }); q.push({ x: c.x, y: c.y - 1 });
                    }
                }
            },

            floodFill: function (x, y, max, tileType) {
                let q = [{ x, y }];
                let count = 0;
                let visited = new Set(); // Added visited set for floodFill
                while (q.length > 0 && count < max) {
                    let c = q.shift();
                    let key = c.x + "," + c.y;
                    if (visited.has(key)) continue;
                    visited.add(key);

                    if (c.x < 0 || c.x >= CFG.W || c.y < 0 || c.y >= CFG.H) continue;
                    let t = this.map[c.y][c.x];
                    if (t !== TILE.EMPTY && t !== tileType && t !== TILE.SOFT) continue; // Only fill empty/soft or self

                    // Fill
                    if (t === TILE.EMPTY) {
                        this.map[c.y][c.x] = tileType;
                        count++;
                    }

                    q.push({ x: c.x + 1, y: c.y }); q.push({ x: c.x - 1, y: c.y });
                    q.push({ x: c.x, y: c.y + 1 }); q.push({ x: c.x, y: c.y - 1 });
                }
            },

            floodFlame: function (x, y, dx, dy, max) {
                // "Narrow beam: go side 1 tile each 4 tiles gone forwards"
                // "except if it is like a narrow tunnel, then follow the tunnel for a bit"
                // "spawn only 20 tiles altogether"

                let q = [{ x, y, df: 0, ds: 0 }]; // df: dist forward, ds: dist side
                let closed = new Set();
                let count = 0;
                // Max limit is 20
                if (!max) max = 20; else max = Math.min(max, 20);

                while (q.length > 0 && count < max) {
                    // Sort queue to prioritize forward? Or just standard BFS. 
                    // To make it look like a beam, we should prioritize low ds?
                    // Let's sort: low ds first, then low df.
                    q.sort((a, b) => {
                        if (a.ds !== b.ds) return a.ds - b.ds;
                        return a.df - b.df; // fill beam width then length? or length then width?
                    });

                    let c = q.shift();
                    let key = c.x + "," + c.y;
                    if (closed.has(key)) continue;
                    closed.add(key);

                    if (c.x < 0 || c.x >= CFG.W || c.y < 0 || c.y >= CFG.H) continue;
                    let t = this.map[c.y][c.x];

                    // Destroy Soft/Gold
                    if (t === TILE.SOFT || t === TILE.GOLD) {
                        this.map[c.y][c.x] = TILE.EMPTY;
                        this.spawnEffect(c.x, c.y, 'FLAME');
                        this.triggerAt(c.x, c.y); // Chain
                        count++;
                        continue; // Blocked by the soft block (it burns but stops flow this tick usually)
                    }
                    if (t === TILE.HARD) continue; // Blocked

                    // It's empty or we are just passing through source
                    if (t === TILE.EMPTY && !(c.x === x && c.y === y)) {
                        // Only spawn flame if empty (and not source, though source is ok)
                        this.spawnEffect(c.x, c.y, 'FLAME');
                        this.triggerAt(c.x, c.y); // Chain
                        count++;
                    } else if (c.x === x && c.y === y) {
                        // source
                    }

                    // Spread neighbors
                    // We have direction dx, dy.
                    // Forward: x+dx, y+dy. df+1
                    // Side 1:  x-dy, y+dx. ds+1
                    // Side 2:  x+dy, y-dx. ds+1

                    // 1. Forward
                    q.push({ x: c.x + dx, y: c.y + dy, df: c.df + 1, ds: c.ds });

                    // 2. Sides
                    // Rule: side 1 tile each 4 tiles forwards.
                    // Max side dist allowed = 1 + floor(df / 4) ? 
                    // At df=0..3, max ds=0 (width 1). df=4..7, max ds=1 (width 3).

                    let maxSide = Math.floor(c.df / 4);

                    // Tunnel Logic: If forward is blocked (we can peak ahead), allow sides?
                    // We can't easily peek ahead without accessing map again.
                    // But if we are in a "narrow tunnel", standard beam logic might fail if tunnel turns.
                    // User says "follow the tunnel for a bit". This implies loosen constraint if enclosed.
                    // Let's add a "tunnel" bonus to side spread if we are constrained.
                    // Simply: if we are low on count, allow standard fill? No user was specific.
                    // Let's stick to the formula first.

                    if (c.ds < maxSide) {
                        q.push({ x: c.x - dy, y: c.y + dx, df: c.df, ds: c.ds + 1 });
                        q.push({ x: c.x + dy, y: c.y - dx, df: c.df, ds: c.ds + 1 });
                    } else {
                        // Check for tunnel turn: if we are at the end of possible forward, maybe check sides?
                        // If next forward is HARD, maybe allow side spread 1?
                        let nx = c.x + dx, ny = c.y + dy;
                        if (nx >= 0 && nx < CFG.W && ny >= 0 && ny < CFG.H && this.map[ny][nx] === TILE.HARD) {
                            // Forward blocked by Hard. Allow side spread 1 "for a bit" (reset df?)
                            // This is complex. Let's just trust the user's specific "1 per 4" formula as base.
                            // If they want turns, they usually dig turns.
                        }
                    }
                }
            },

            loop: function () {
                if (this.state === 'SHOP') this.drawShop();
                else if (this.state === 'GAME') {
                    this.updatePhysics();
                    this.updateEffects(); // Update effects
                    this.updateCam();
                    this.drawGame();
                }
                requestAnimationFrame(() => this.loop());
            },

            // --- Effects System ---
            effects: [],

            spawnEffect: function (x, y, type) {
                // x,y in grid coords
                let id = Math.random();
                let maxT = (type === 'EXPLOSION') ? 20 : (type === 'FLAME') ? 20 : 60; // Slower explosion (20f)
                if (type === 'SMOKE') {
                    // Smoke drifts up
                    this.effects.push({ x: x * 16, y: y * 16, type: type, t: maxT, maxT: maxT, vx: (Math.random() - 0.5) * 0.5, vy: -0.2 - Math.random() * 0.3 });
                } else {
                    this.effects.push({ x: x, y: y, type: type, t: maxT, maxT: maxT });
                }
            },

            updateEffects: function () {
                for (let i = this.effects.length - 1; i >= 0; i--) {
                    let e = this.effects[i];
                    e.t--;

                    if (e.type === 'SMOKE') {
                        e.x += e.vx;
                        e.y += e.vy;
                    }

                    if (e.t <= 0) {
                        // Transitions
                        if (e.type === 'EXPLOSION' || e.type === 'FLAME') {
                            this.spawnEffect(e.x, e.y, 'SMOKE');
                        }
                        this.effects.splice(i, 1);
                    }
                }
            },

            drawEffects: function (ctx) {
                this.effects.forEach(e => {
                    let pct = e.t / e.maxT; // 1.0 -> 0.0

                    if (e.type === 'EXPLOSION' || e.type === 'FLAME') {
                        // Unified Particle Logic
                        // Grid coords to pixel center
                        let cx = e.x * 16 + 8;
                        let cy = e.y * 16 + 8;

                        // Random jitter for natural look
                        let r = 8 + Math.random() * 4;
                        let yOff = (1 - pct) * -5; // Rise slightly

                        let c1, c2;
                        if (e.type === 'EXPLOSION') {
                            c1 = `rgba(255, 235, 59, ${pct})`; // Yellow
                            c2 = `rgba(255, 255, 255, ${pct})`; // White
                        } else {
                            c1 = `rgba(255, 87, 34, ${pct})`; // Orange
                            c2 = `rgba(255, 193, 7, ${pct})`; // Amber
                        }

                        ctx.fillStyle = c1;
                        ctx.beginPath(); ctx.arc(cx, cy + yOff, r * pct, 0, 7); ctx.fill();

                        ctx.fillStyle = c2;
                        ctx.beginPath(); ctx.arc(cx, cy + yOff, r * pct * 0.6, 0, 7); ctx.fill();
                    }
                    else if (e.type === 'SMOKE') {
                        // e.x, e.y are already pixels
                        let r = 4 + (1 - pct) * 5;
                        ctx.fillStyle = `rgba(100, 100, 100, ${pct * 0.5})`;
                        ctx.beginPath(); ctx.arc(e.x + 8, e.y + 8, r, 0, 7); ctx.fill();
                    }
                });
            },

            drawShop: function () {
                let ctx = this.ctx;
                ctx.fillStyle = '#666'; ctx.fillRect(0, 0, 1024, 598);

                // Header
                ctx.fillStyle = '#444'; ctx.fillRect(362, 0, 300, 80);
                ctx.fillStyle = '#333'; ctx.font = '40px monospace';
                ctx.fillText("SHOP", 462, 50);

                // Draw active phase players
                [0, 1].forEach(i => {
                    let pid = this.shopPhase * 2 + i;
                    if (!this.players[pid]) return;

                    let p = this.players[pid];
                    let xOff = i * 512;

                    // Player Panel
                    ctx.fillStyle = '#000'; ctx.fillRect(xOff + 10, 10, 230, 85);

                    // Name
                    ctx.fillStyle = '#fff'; ctx.font = '14px monospace';

                    ctx.fillStyle = '#ff0'; ctx.fillText(p.cash, xOff + 40, 65);

                    ctx.fillStyle = '#aaa'; ctx.fillText("ITEMS: " + count, xOff + 20, 85);

                    // Grid
                    let gx = xOff + 50, gy = 100;
                    for (let k = 0; k < SHOP_KEYS.length; k++) {

                        let it = ITEMS[key];
                        let r = Math.floor(k / 4), c = k % 4;
                        let dx = gx + c * 75, dy = gy + r * 65;

                        ctx.fillStyle = '#444'; ctx.fillRect(dx, dy, 70, 60);
                        if (this.shopCursors[i] === k) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(dx, dy, 70, 60); }
                        if (it.n === "LEAVE" && this.ready[i]) ctx.fillStyle = '#0f0';

                        if (Gfx.c[it.i]) ctx.drawImage(Gfx.c[it.i], dx + 20, dy + 10, 32, 32);
                        ctx.fillStyle = '#ff0'; ctx.font = '10px monospace'; ctx.fillText(it.p + "$", dx + 5, dy + 55);
                    }
                });
            },

            drawGame: function () {
                let ctx = this.ctx;
                // HUD
                ctx.fillStyle = '#222'; ctx.fillRect(0, 0, 1024, CFG.HUD_H);

                // Draw HUD slots dynamically based on player count
                let slotW = 1024 / this.players.length;
                this.players.forEach((p, i) => {
                    let x = i * slotW;

                    // Background Panel
                    ctx.fillStyle = '#111'; ctx.fillRect(x + 5, 5, slotW - 10, 50);

                    // 1. Face / Name
                    ctx.drawImage(Gfx.c['p' + (p.id + 1)] || Gfx.c.p1, x + 10, 10, 40, 40);
                    ctx.fillStyle = '#fff'; ctx.font = '10px monospace';
                    ctx.fillText(p.name, x + 55, 20);

                    // 2. Info Grid (Money, Tool, Count)
                    // Money
                    ctx.fillStyle = '#ff0'; ctx.fillText("$" + p.cash, x + 55, 45);

                    // Current Item Icon + Count
                    // We need a way to look up item icon from ID. iterating SHOP_ITEMS is slow but fine for HUD
                    let itemDef = ITEMS[p.wep] || ITEMS['bomb_s'];
                    if (Gfx.c[itemDef.i]) ctx.drawImage(Gfx.c[itemDef.i], x + 120, 10, 32, 32);

                    ctx.fillStyle = '#fff'; ctx.font = '14px monospace';
                    ctx.fillText(p.inv[p.wep] || 0, x + 155, 30);

                    // Health Bar (Vertical)
                    // Right side of the panel
                    let bx = x + slotW - 25;
                    ctx.fillStyle = '#555'; ctx.fillRect(bx, 10, 10, 40);
                    let h = (p.hp / 100) * 40;
                    ctx.fillStyle = p.hp > 50 ? '#0f0' : '#f00';
                    ctx.fillRect(bx, 10 + (40 - h), 10, h);

                    // Label
                    ctx.save();
                    ctx.translate(bx + 10, 10);
                    ctx.rotate(Math.PI / 2);
                    ctx.font = '8px monospace'; ctx.fillStyle = '#aaa';
                    ctx.fillText("HEALTH", 0, -12);
                    ctx.restore();
                });

                // Game Clip
                ctx.save(); ctx.beginPath(); ctx.rect(0, CFG.HUD_H, 1024, CFG.GAME_H); ctx.clip();
                ctx.fillStyle = '#000'; ctx.fillRect(0, CFG.HUD_H, 1024, CFG.GAME_H);
                ctx.translate(-this.cam.x, -this.cam.y + CFG.HUD_H);

                // Map
                let c1 = 0, c2 = CFG.W;
                let r1 = 0, r2 = CFG.H;

                for (let y = r1; y < r2; y++) for (let x = c1; x < c2; x++) {
                    if (this.map[y] && this.map[y][x]) {
                        let t = this.map[y][x];
                        if (t === TILE.HARD) ctx.drawImage(Gfx.c.hard, x * 16, y * 16);
                        else if (t === TILE.SOFT) ctx.drawImage(Gfx.c.soft, x * 16, y * 16);
                        else if (t === TILE.GOLD) ctx.drawImage(Gfx.c.gold, x * 16, y * 16);
                        else if (t === TILE.URETAN) ctx.drawImage(Gfx.c.uretan, x * 16, y * 16, 16, 16);
                        else if (t === TILE.PLASMO) ctx.drawImage(Gfx.c.plastic, x * 16, y * 16, 16, 16);
                        else ctx.drawImage(Gfx.c.floor, x * 16, y * 16);

                        // Wear Overlay
                        if (this.dMap[y][x] > 0) {
                            ctx.fillStyle = `rgba(0,0,0,${WEAR[this.dMap[y][x]]})`;
                            ctx.fillRect(x * 16, y * 16, 16, 16);
                        }
                    }
                }

                // Check for single survivor (if < 2 players alive)
                // Only if more than 1 player started, and map is valid (not menu)
                if (this.state === 'GAME' && this.players.length > 1) {
                    let alive = this.players.filter(p => !p.dead).length;
                    if (alive < 2) {
                        this.endRound('WINNER'); // Or just end
                    }
                }

                this.projectiles.forEach(p => {
                    ctx.fillStyle = '#0f0'; ctx.beginPath(); ctx.arc(p.x + 4, p.y + 4, 3, 0, 7); ctx.fill();
                });

                this.bombs.forEach(b => {
                    if (b.type === 'mine') {
                        if (b.safeT > 0) b.safeT--;
                        else {
                            if (trigger) b.t = 1;
                        }
                        ctx.drawImage(Gfx.c.mine, b.x * 16, b.y * 16, 16, 16);
                        return;
                    }

                    if (b.type === 'cracker') {
                        // Different visual or standard bomb
                        b.t--; if (b.t <= 0) this.explode(b);
                        else ctx.drawImage(Gfx.c.bomb_s, b.x * 16, b.y * 16, 16, 16);
                        return;
                    }

                    b.t--; if (b.t <= 0) this.explode(b);
                    else {
                        ctx.drawImage(Gfx.c.bomb_s, b.x * 16, b.y * 16, 16, 16);
                    }
                });

                this.pipes.forEach(p => {
                    // Pipe Graphix
                    ctx.fillStyle = '#1b5e20'; ctx.fillRect(p.x * 16 + 2, p.y * 16 + 2, 12, 12);
                    ctx.fillStyle = '#000'; ctx.fillRect(p.x * 16 + 4, p.y * 16 + 4, 8, 8);
                });

                this.clones.forEach(c => {
                    // Clone Gfx (Grey Player)
                    ctx.fillStyle = '#888'; ctx.fillRect(c.x, c.y, 14, 14);
                });

                this.players.forEach(p => {
                    if (!p.dead) {
                        ctx.fillStyle = ['#0d47a1', '#e65100', '#2e7d32', '#6a1b9a'][p.id];
                        ctx.fillRect(p.x, p.y, 14, 14);
                    }
                });

                this.drawEffects(ctx); // Draw Effects on top of map/players? Or below players? Top seems safer for flash.

                ctx.restore();

                // Time Bar
                let by = 598 - CFG.BAR_H;
                ctx.fillStyle = '#000'; ctx.fillRect(0, by, 1024, CFG.BAR_H);
                ctx.fillStyle = '#ffeb3b'; ctx.fillRect(0, by, 1024 * (Math.max(0, this.time) / CFG.ROUND_TIME), CFG.BAR_H);
            },

            triggerAt: function (x, y) {
                this.bombs.forEach(b => {
                    if (Math.floor(b.x) === x && Math.floor(b.y) === y) {
                        // Found a bomb at this tile. Trigger it!
                        if (b.t > 5) b.t = 5; // Explode in 5 frames (chain ripple)
                    }
                });
            },

            explode: function (b) {
                this.bombs = this.bombs.filter(x => x !== b);
                if (b.o && b.o.activeRemote === b) b.o.activeRemote = null;

                // Firecracker: Spawn sub-bombs
                if (b.type === 'cracker') {
                    // Spawn 4 small bombs
                    this.bombs.push({ x: b.x + 1, y: b.y, t: 20, r: 1, o: b.o, dmg: 50 });
                    this.bombs.push({ x: b.x - 1, y: b.y, t: 20, r: 1, o: b.o, dmg: 50 });
                    this.bombs.push({ x: b.x, y: b.y + 1, t: 20, r: 1, o: b.o, dmg: 50 });
                    this.bombs.push({ x: b.x, y: b.y - 1, t: 20, r: 1, o: b.o, dmg: 50 });
                    // Also explode center?
                }

                // Default Damage
                let damage = b.dmg || 50;
                // Look up store item damage if possible, or use defaults
                // We didn't store item ID in bomb, maybe should have.
                // Re-deriving from b.r/hard is tricky.
                // Assuming defaults if not set:
                if (!b.dmg) {
                    if (b.r === 2) damage = 50; // S
                    else if (b.r === 4) damage = 100; // B
                    else if (b.r === 3 && b.hard) damage = 150; // TNT
                    else if (b.r === 12) damage = 1000; // ATOM
                }

                let hit = (x, y) => {
                    if (x < 0 || x >= CFG.W || y < 0 || y >= CFG.H) return;

                    // Spawn Effect
                    this.spawnEffect(x, y, 'EXPLOSION');

                    // Trigger Chain Reaction
                    this.triggerAt(x, y);

                    // Deal Damage to Tile
                    if (this.map[y][x] !== TILE.EMPTY && this.map[y][x] !== TILE.FLOOR) { // Floor isn't tile type but check logic
                        this.hpMap[y][x] -= damage;

                        let maxHp = HP.SOFT;
                        let t = this.map[y][x];
                        if (t === TILE.HARD) maxHp = HP.HARD;
                        else if (t === TILE.URETAN) maxHp = HP.URETAN;
                        else if (t === TILE.PLASMO) maxHp = HP.PLASMO;

                        let pct = this.hpMap[y][x] / maxHp;

                        if (this.hpMap[y][x] <= 0) {
                            if (this.map[y][x] === TILE.GOLD) { /* cash logic? owner? */ }
                            this.map[y][x] = TILE.EMPTY;
                            this.hpMap[y][x] = 0;
                            this.dMap[y][x] = 0;
                        } else {
                            // Update Wear
                            if (pct < 0.25) this.dMap[y][x] = 3;
                            else if (pct < 0.5) this.dMap[y][x] = 2;
                            else if (pct < 0.75) this.dMap[y][x] = 1;
                            else this.dMap[y][x] = 0;
                        }
                    }

                    // Kill Players
                    this.players.forEach(p => {
                        if (!p.dead && Math.floor((p.x + 8) / 16) === x && Math.floor((p.y + 8) / 16) === y) {
                            p.dead = true; p.hp = 0; p.inv = {}; // Clear inv
                            if (this.players.every(pl => pl.dead)) this.endRound("DEAD");
                        }
                    });
                };

                hit(b.x, b.y);

                // Determine pattern
                // S.Bomb (r=1, Cross) -> The user requested small bomb: "cells above, to the left, below, and right. i.e, distance <= 1"
                // This means CENTER + 4 neighbors.

                // Big Bomb (r=3, Circle/Square?) -> User: "distance <= 3"
                // TNT (r=4) -> User: "distance <= 4"
                // Atom (r=12) -> User: "distance <= 12"

                // We can use generic circle distance check < r
                // But previously we used linear arms.
                // Let's implement circle/diamond distance for all based on R.
                // distance check: Math.abs(dx) + Math.abs(dy) <= r (Diamond/Manhattan) OR Math.sqrt(...) (Euclidean)
                // "distance <= 1" usually implies Manhattan in grid games or Euclidean < 1.5. 
                // "current cell... above, left, below, right" is Manhattan <= 1.

                let range = b.r;
                let shape = 'circle'; // or manhattan
                if (range === 1) shape = 'manhattan';

                for (let dy = -range; dy <= range; dy++) {
                    for (let dx = -range; dx <= range; dx++) {
                        if (dx === 0 && dy === 0) continue; // Already hit center

                        let dist = 0;
                        if (shape === 'manhattan') dist = Math.abs(dx) + Math.abs(dy);
                        else dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist <= range + 0.5) { // +0.5 for circle rounding
                            hit(b.x + dx, b.y + dy);
                        }
                    }
                }
            },

            endRound: function () {
                clearInterval(this.timer);
                this.players.forEach(p => { p.dead = false; p.hp = 100; });
                this.startShop();
            },

            // --- CONTROLS UI ---
            openSettings: function () {

            renderKeys: function () {
                let c = document.getElementById('keys-container'); c.innerHTML = '';
                let grid = document.createElement('div'); grid.id = 'keys-grid';

                for (let i = 0; i < 4; i++) {
                    let col = document.createElement('div'); col.className = 'key-col';
                    col.innerHTML = `<h3>P${i + 1}</h3>`;
                    ['Up', 'Down', 'Left', 'Right', 'Stop', 'Act', 'Det', 'Next', 'Prev'].forEach(act => {
                        let k = act.toLowerCase();
                        let row = document.createElement('div'); row.className = 'key-row';
                        row.innerHTML = `<span>${act}</span> <div class="key-btn" onclick="Game.waitBind(${i}, '${k}', this)">${this.controls[i][k]}</div>`;
                        col.appendChild(row);
                    });
                    grid.appendChild(col);
                }
                c.appendChild(grid);
            },
            waitBind: function (pIdx, action, el) {
                if (this.binding) return;
                el.innerText = '...'; el.classList.add('waiting');
                this.binding = { p: pIdx, a: action, el: el };
            },
            bindKey: function (code) {
                if (!this.binding) return;
                this.controls[this.binding.p][this.binding.a] = code;
                this.binding.el.innerText = code;
                this.binding.el.classList.remove('waiting');
                this.binding = null;
            }
        };

        window.onload = () => Game.init();
    </script>
</body>

</html>
