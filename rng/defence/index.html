<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maze Defense: Architect</title>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
        body { margin: 0; padding: 0; background: #111; overflow: hidden; font-family: 'Segoe UI', monospace; color: white; }
        
        /* Game Canvas */
        #gameCanvas { display: block; margin: 0 auto; background: #1a1a1a; box-shadow: 0 0 30px rgba(0,0,0,0.8); }

        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* Top HUD */
        #hud { background: rgba(0,0,0,0.85); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; pointer-events: auto; border-bottom: 2px solid #333; }
        .stat { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; letter-spacing: 1px;}
        #wave-btn { background: #0077ff; color: white; border: none; padding: 8px 20px; border-radius: 4px; font-weight: 900; cursor: pointer; pointer-events: auto; box-shadow: 0 4px 0 #004499; transition: transform 0.1s; text-transform: uppercase; }
        #wave-btn:active { transform: translateY(4px); box-shadow: none; }

        /* Bottom Controls */
        #controls { pointer-events: auto; background: rgba(0,0,0,0.95); padding: 8px; overflow-x: auto; display: flex; gap: 8px; height: 100px; align-items: center; border-top: 2px solid #333; }
        .card-slot { min-width: 70px; height: 80px; border: 2px solid #444; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; background: #222; position: relative; transition: 0.1s; }
        .card-slot.selected { border-color: #0f0; background: #153315; transform: translateY(-5px); box-shadow: 0 0 10px #0f0; }
        .card-slot span { margin-top: 4px; font-weight: bold; text-align: center; }
        .card-slot .icon { font-size: 20px; margin-bottom: 2px; }
        .count-badge { position: absolute; top: -6px; right: -6px; background: #f00; color: white; border-radius: 4px; padding: 2px 6px; font-size: 12px; font-weight: bold; border: 1px solid white; }

        /* Draft Overlay */
        #draft-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; backdrop-filter: blur(8px); }
        #draft-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; width: 100%; max-width: 600px; }
        .draft-card { background: linear-gradient(145deg, #333, #222); border: 1px solid #555; padding: 15px; border-radius: 4px; text-align: center; cursor: pointer; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .draft-card:active { transform: scale(0.96); }
        .draft-card.picked { border-color: gold; background: #443300; opacity: 0.3; pointer-events: none; }
        .draft-card h3 { margin: 0 0 5px 0; font-size: 14px; color: #fff; text-transform: uppercase; }
        .draft-card p { margin: 0; font-size: 11px; color: #aaa; line-height: 1.3; }
        
        #message-overlay { position: absolute; top: 40%; width: 100%; text-align: center; font-size: 28px; font-weight: 900; color: white; text-shadow: 0 0 10px #000; pointer-events: none; opacity: 0; transition: opacity 0.3s; letter-spacing: 3px; background: rgba(0,0,0,0.6); padding: 20px 0; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="hud">
            <div class="stat" style="color:#f44">❤ <span id="hp-display">20</span></div>
            <div class="stat" style="color:#4af">WAVE <span id="wave-display">1</span></div>
            <button id="wave-btn">START</button>
        </div>
        <div id="message-overlay">WAVE COMPLETE</div>
        <div id="controls">
            </div>
    </div>

    <div id="draft-screen">
        <h2 style="margin-bottom:5px; text-transform: uppercase; letter-spacing: 2px;">Reinforcements</h2>
        <p style="margin-top:0; color:#888; font-size: 14px;">Select <span id="picks-left" style="color:#fff">3</span></p>
        <div id="draft-grid"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
/**
 * GAME CONSTANTS
 */
const TILE_SIZE = 32;
const GRID_W = 15; // Odd numbers work best for maze gen
const GRID_H = 19;
const FPS = 60;

// Colors
const C_BG = '#111';
const C_WALL = '#3a3a3a';
const C_FLOOR = '#1a1a1a';
const C_CASTLE = '#0077ff';

// Enums
const TYPE_FLOOR = 0;
const TYPE_WALL = 1;
const TYPE_CASTLE = 2;

// Global State
let canvas, ctx;
let lastTime = 0;
let grid = [];
let flowField = []; 
let enemies = [];
let towers = [];
let projectiles = [];
let particles = [];
let inventory = {
    pistol: 1,
    sand: 2,
    salvage: 1,
    missile: 0,
    poison: 0
};

let gameState = {
    hp: 20,
    wave: 1,
    active: false,
    spawnQueue: [],
    spawnTimer: 0,
    selectedCard: null,
    picksLeft: 0,
    gameOver: false
};

const CARD_TYPES = {
    pistol:  { name: "Pistol",  icon: "🔫", color: "#ddd", range: 3.5, cd: 35, damage: 10, target: 'wall', desc: "Place on Wall. Fast single shot." },
    missile: { name: "Missile", icon: "🚀", color: "#f90", range: 5.0, cd: 110, damage: 45, target: 'wall', desc: "Place on Wall. Area damage." },
    poison:  { name: "Poison",  icon: "🧪", color: "#2d2", range: 3.0, cd: 50, damage: 3, target: 'wall', desc: "Place on Wall. Damage over time." },
    sand:    { name: "Sand",    icon: "⏳", color: "#c96", range: 0, target: 'floor', desc: "Place on Floor. Slows enemies." },
    salvage: { name: "Salvage", icon: "🔧", color: "#88f", range: 0, target: 'turret', desc: "Remove a turret." }
};

/**
 * INITIALIZATION
 */
function init() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    
    resize();
    window.addEventListener('resize', resize);
    
    // Input
    canvas.addEventListener('mousedown', (e) => handleInput(e.clientX, e.clientY));
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault(); 
        handleInput(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive: false});

    document.getElementById('wave-btn').addEventListener('click', startWave);

    resetGame();
    requestAnimationFrame(loop);
}

function resize() {
    let availW = window.innerWidth;
    let availH = window.innerHeight;
    let scale = Math.min(availW / (GRID_W * TILE_SIZE), availH / (GRID_H * TILE_SIZE));
    
    canvas.width = GRID_W * TILE_SIZE;
    canvas.height = GRID_H * TILE_SIZE;
    canvas.style.width = (canvas.width * scale) + "px";
    canvas.style.height = (canvas.height * scale) + "px";
}

function resetGame() {
    generateMazeMap();
    
    // Castle
    let cx = Math.floor(GRID_W/2);
    let cy = Math.floor(GRID_H/2);
    grid[cy][cx].type = TYPE_CASTLE;
    // Ensure castle area is open
    getNeighbors(cx, cy).forEach(n => grid[n.y][n.x].type = TYPE_FLOOR);

    towers = [];
    enemies = [];
    projectiles = [];
    particles = [];
    
    gameState.hp = 20;
    gameState.wave = 1;
    gameState.active = false;
    gameState.gameOver = false;
    
    inventory = { pistol: 2, missile: 0, poison: 0, sand: 3, salvage: 1 };
    
    updateUI();
    calcFlowField();
}

/**
 * MAZE GENERATION
 */
function generateMazeMap() {
    // 1. Fill with walls
    grid = [];
    for(let y=0; y<GRID_H; y++) {
        let row = [];
        for(let x=0; x<GRID_W; x++) {
            row.push({type: TYPE_WALL, item: null});
        }
        grid.push(row);
    }

    // 2. Recursive Backtracker for Maze
    // Start from center
    let cx = Math.floor(GRID_W/2);
    let cy = Math.floor(GRID_H/2);
    
    let stack = [{x:cx, y:cy}];
    grid[cy][cx].type = TYPE_FLOOR;

    while(stack.length > 0) {
        let current = stack[stack.length - 1];
        // Check 2 steps away
        let neighbors = [];
        let dirs = [[0,-2], [0,2], [-2,0], [2,0]];
        
        for(let d of dirs) {
            let nx = current.x + d[0];
            let ny = current.y + d[1];
            if(nx > 0 && nx < GRID_W-1 && ny > 0 && ny < GRID_H-1) {
                if(grid[ny][nx].type === TYPE_WALL) {
                    neighbors.push({x:nx, y:ny, dx:d[0]/2, dy:d[1]/2});
                }
            }
        }

        if(neighbors.length > 0) {
            let next = neighbors[Math.floor(Math.random() * neighbors.length)];
            // Carve path
            grid[next.y][next.x].type = TYPE_FLOOR;
            grid[current.y + next.dy][current.x + next.dx].type = TYPE_FLOOR;
            stack.push(next);
        } else {
            stack.pop();
        }
    }

    // 3. Ensure corners are open
    let corners = [[0,0], [GRID_W-1, 0], [0, GRID_H-1], [GRID_W-1, GRID_H-1]];
    corners.forEach(c => {
        grid[c[1]][c[0]].type = TYPE_FLOOR;
        // Ensure connection to maze
        if (c[0]===0) grid[c[1]][1].type = TYPE_FLOOR;
        else grid[c[1]][GRID_W-2].type = TYPE_FLOOR;
    });
}

function getNeighbors(x, y) {
    let res = [];
    [[0,1],[0,-1],[1,0],[-1,0]].forEach(d => {
        let nx = x+d[0], ny = y+d[1];
        if(nx>=0 && nx<GRID_W && ny>=0 && ny<GRID_H) res.push({x:nx, y:ny});
    });
    return res;
}

/**
 * CORE LOGIC
 */
function update() {
    if (gameState.gameOver) return;

    if (gameState.active && gameState.spawnQueue.length > 0) {
        gameState.spawnTimer++;
        if (gameState.spawnTimer > 30) {
            spawnEnemy(gameState.spawnQueue.shift());
            gameState.spawnTimer = 0;
        }
    } else if (gameState.active && gameState.spawnQueue.length === 0 && enemies.length === 0) {
        endWave();
    }

    towers.forEach(t => t.update());
    
    for(let i = projectiles.length-1; i>=0; i--) {
        if (!projectiles[i].update()) projectiles.splice(i, 1);
    }

    for(let i = enemies.length-1; i>=0; i--) {
        let e = enemies[i];
        e.update();
        if (e.dead) {
            enemies.splice(i, 1);
        } else if (e.reachedGoal) {
            gameState.hp -= 1;
            enemies.splice(i, 1);
            createExplosion(e.x, e.y, "#f44", 15);
            updateUI();
            if (gameState.hp <= 0) gameOver();
        }
    }
    
    for(let i = particles.length-1; i>=0; i--) {
        if (!particles[i].update()) particles.splice(i, 1);
    }
}

function draw() {
    ctx.fillStyle = C_BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for(let y=0; y<GRID_H; y++) {
        for(let x=0; x<GRID_W; x++) {
            let px = x * TILE_SIZE;
            let py = y * TILE_SIZE;
            let cell = grid[y][x];

            // Render Floor vs Wall
            if (cell.type === TYPE_WALL) {
                // 3D effect
                ctx.fillStyle = '#222'; // side
                ctx.fillRect(px, py+4, TILE_SIZE, TILE_SIZE-4);
                ctx.fillStyle = C_WALL; // top
                ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE-4);
                
                // Highlight border
                ctx.strokeStyle = '#444';
                ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE-4);
            } else {
                ctx.fillStyle = C_FLOOR;
                ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            }
            
            // Render Sand
            if (cell.item && cell.item.type === 'sand') {
                ctx.fillStyle = '#764';
                ctx.beginPath();
                ctx.arc(px+TILE_SIZE/2, py+TILE_SIZE/2, 10, 0, Math.PI*2);
                ctx.fill();
                // Cracks
                let hpPct = cell.item.hp / 30;
                ctx.fillStyle = `rgba(0,0,0,${1-hpPct})`;
                ctx.font = '10px Arial';
                if(hpPct < 0.9) ctx.fillText("⚡", px+10, py+20);
            }
            
            // Render Castle
            if (cell.type === TYPE_CASTLE) {
                ctx.fillStyle = C_CASTLE;
                ctx.fillRect(px+4, py+4, TILE_SIZE-8, TILE_SIZE-8);
                // Pulse
                ctx.strokeStyle = `rgba(0,120,255,${(Math.sin(Date.now()/200)+1)/2})`;
                ctx.lineWidth = 2;
                ctx.strokeRect(px+2, py+2, TILE_SIZE-4, TILE_SIZE-4);
            }
        }
    }

    towers.forEach(t => t.draw(ctx));
    enemies.forEach(e => e.draw(ctx));
    projectiles.forEach(p => p.draw(ctx));
    particles.forEach(p => p.draw(ctx));
}

function loop(timestamp) {
    let dt = timestamp - lastTime;
    lastTime = timestamp;
    update();
    draw();
    requestAnimationFrame(loop);
}

/**
 * PATHFINDING
 */
function calcFlowField() {
    flowField = [];
    for(let y=0; y<GRID_H; y++) {
        let row = [];
        for(let x=0; x<GRID_W; x++) row.push(null);
        flowField.push(row);
    }

    let queue = [];
    let cx = Math.floor(GRID_W/2);
    let cy = Math.floor(GRID_H/2);
    
    flowField[cy][cx] = 0;
    queue.push({x: cx, y: cy});

    const dirs = [[0,1], [0,-1], [1,0], [-1,0]];
    
    while(queue.length > 0) {
        let cur = queue.shift();
        let dist = flowField[cur.y][cur.x];

        for(let d of dirs) {
            let nx = cur.x + d[0];
            let ny = cur.y + d[1];

            if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H) {
                // Enemies can only walk on FLOORS (and Castle)
                // Walls block path. Sand is on Floor, so it's walkable.
                if (grid[ny][nx].type !== TYPE_WALL && flowField[ny][nx] === null) {
                    flowField[ny][nx] = dist + 1;
                    queue.push({x: nx, y: ny});
                }
            }
        }
    }
}

/**
 * ENTITIES
 */
class Enemy {
    constructor(type) {
        let corners = [[0,0], [GRID_W-1, 0], [0, GRID_H-1], [GRID_W-1, GRID_H-1]];
        let corner = corners[Math.floor(Math.random()*corners.length)];
        
        this.gx = corner[0];
        this.gy = corner[1];
        this.x = this.gx * TILE_SIZE + TILE_SIZE/2;
        this.y = this.gy * TILE_SIZE + TILE_SIZE/2;
        this.type = type;
        
        let waveMult = Math.pow(1.15, gameState.wave);
        let baseHp = 40;

        if (type === 'boss') {
            this.hp = 400 * waveMult;
            this.speed = 0.6;
            this.color = '#d0d';
            this.radius = 12;
        } else if (type === 'fast') {
            this.hp = 20 * waveMult;
            this.speed = 2.4;
            this.color = '#ee0';
            this.radius = 6;
        } else if (type === 'tank') {
            this.hp = 80 * waveMult;
            this.speed = 0.7;
            this.color = '#d22';
            this.radius = 10;
        } else {
            this.hp = baseHp * waveMult;
            this.speed = 1.3;
            this.color = '#f55';
            this.radius = 8;
        }

        this.maxHp = this.hp;
        this.frozen = 0;
        this.poisoned = 0;
        this.vx = 0;
        this.vy = 0;
        this.reachedGoal = false;
        this.dead = false;
    }

    update() {
        let gx = Math.floor(this.x / TILE_SIZE);
        let gy = Math.floor(this.y / TILE_SIZE);

        let cx = Math.floor(GRID_W/2) * TILE_SIZE + TILE_SIZE/2;
        let cy = Math.floor(GRID_H/2) * TILE_SIZE + TILE_SIZE/2;
        let distToCastle = Math.hypot(this.x - cx, this.y - cy);
        
        if (distToCastle < TILE_SIZE * 0.7) {
            this.reachedGoal = true;
            return;
        }

        // Sand Logic
        let cell = (grid[gy] && grid[gy][gx]) ? grid[gy][gx] : null;
        let speedMod = 1;
        
        if (cell && cell.item && cell.item.type === 'sand') {
            speedMod = 0.4;
            if (Math.random() < 0.03) {
                cell.item.hp--;
                createExplosion(this.x, this.y, '#aa8', 1);
                if (cell.item.hp <= 0) {
                    cell.item = null;
                    createExplosion(gx*TILE_SIZE+16, gy*TILE_SIZE+16, "#c94", 8);
                }
            }
        }

        if (this.poisoned > 0) {
            this.hp -= (this.maxHp * 0.003) + 0.1; 
            this.poisoned--;
            if(Math.random()<0.1) createExplosion(this.x, this.y, '#0f0', 1);
            if (this.hp <= 0) { this.dead = true; return; }
        }

        // Move along Flow Field
        let bestDist = 9999;
        let targetX = this.x; 
        let targetY = this.y;

        const dirs = [[0,1], [0,-1], [1,0], [-1,0]];
        for(let d of dirs) {
            let nx = gx + d[0];
            let ny = gy + d[1];
            if (ny >= 0 && ny < GRID_H && nx >= 0 && nx < GRID_W) {
                let dist = flowField[ny][nx];
                if (dist !== null && dist < bestDist) {
                    bestDist = dist;
                    targetX = nx * TILE_SIZE + TILE_SIZE/2;
                    targetY = ny * TILE_SIZE + TILE_SIZE/2;
                }
            }
        }

        let dx = targetX - this.x;
        let dy = targetY - this.y;
        let dist = Math.hypot(dx, dy);
        
        if (dist > 1) {
            this.vx = (dx/dist) * this.speed * speedMod;
            this.vy = (dy/dist) * this.speed * speedMod;
            this.x += this.vx;
            this.y += this.vy;
        }
    }

    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.stroke();

        let pct = this.hp / this.maxHp;
        ctx.fillStyle = '#400';
        ctx.fillRect(this.x-8, this.y-12, 16, 4);
        ctx.fillStyle = pct > 0.5 ? '#0f0' : '#f00';
        ctx.fillRect(this.x-8, this.y-12, 16 * pct, 4);
    }
}

class Tower {
    constructor(gx, gy, type) {
        this.gx = gx;
        this.gy = gy;
        this.x = gx * TILE_SIZE + TILE_SIZE/2;
        this.y = gy * TILE_SIZE + TILE_SIZE/2;
        this.type = type;
        this.stats = CARD_TYPES[type];
        this.cooldown = 0;
        this.angle = 0;
    }

    update() {
        if (this.cooldown > 0) this.cooldown--;
        else this.shoot();
    }

    shoot() {
        let target = null;
        let minD = this.stats.range * TILE_SIZE;

        for(let e of enemies) {
            let d = Math.hypot(e.x - this.x, e.y - this.y);
            if (d < minD) {
                minD = d;
                target = e;
            }
        }

        if (target) {
            this.cooldown = this.stats.cd;
            this.angle = Math.atan2(target.y - this.y, target.x - this.x);
            projectiles.push(new Projectile(this.x, this.y, target, this.type));
        }
    }

    draw(ctx) {
        let px = this.gx*TILE_SIZE;
        let py = this.gy*TILE_SIZE;
        
        // Base
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(this.x, this.y-2, 10, 0, Math.PI*2);
        ctx.fill();
        
        // Turret Top
        ctx.save();
        ctx.translate(this.x, this.y-2);
        ctx.rotate(this.angle);
        ctx.fillStyle = this.stats.color;
        ctx.fillRect(-6, -6, 12, 12);
        ctx.fillStyle = 'black';
        ctx.fillRect(0, -2, 12, 4); // Barrel
        ctx.restore();
    }
}

class Projectile {
    constructor(x, y, target, type) {
        this.x = x; this.y = y; this.type = type;
        this.speed = 8;
        let angle = Math.atan2(target.y - y, target.x - x);
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.damage = CARD_TYPES[type].damage;
        this.life = 50;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
        if(this.life <= 0) return false;

        for(let e of enemies) {
            if (Math.hypot(e.x - this.x, e.y - this.y) < e.radius + 8) {
                this.hit(e);
                return false; 
            }
        }
        return true;
    }

    hit(target) {
        if (this.type === 'missile') {
            createExplosion(this.x, this.y, "orange", 15);
            for(let e of enemies) {
                if (Math.hypot(e.x - this.x, e.y - this.y) < TILE_SIZE * 2.0) {
                    e.hp -= this.damage;
                    if(e.hp<=0) { e.dead=true; createExplosion(e.x, e.y, "#e44", 8); }
                }
            }
        } else if (this.type === 'poison') {
            target.poisoned = 150; 
            target.hp -= 2;
        } else {
            target.hp -= this.damage;
            createExplosion(this.x, this.y, "#fff", 5);
        }
        
        if (target.hp <= 0 && !target.dead) {
            target.dead = true;
            createExplosion(target.x, target.y, "#e44", 8);
        }
    }

    draw(ctx) {
        ctx.fillStyle = CARD_TYPES[this.type].color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 4, 0, Math.PI*2);
        ctx.fill();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        let a = Math.random() * 6.28;
        let s = Math.random() * 3;
        this.vx = Math.cos(a)*s; this.vy = Math.sin(a)*s;
        this.life = 15 + Math.random()*15;
    }
    update() { this.x+=this.vx; this.y+=this.vy; this.life--; return this.life>0; }
    draw(ctx) { 
        ctx.globalAlpha = this.life/30; 
        ctx.fillStyle = this.color; 
        ctx.fillRect(this.x, this.y, 3, 3); 
        ctx.globalAlpha = 1; 
    }
}

function createExplosion(x, y, c, n) {
    for(let i=0; i<n; i++) particles.push(new Particle(x, y, c));
}

/**
 * CONTROL LOGIC
 */
function handleInput(cx, cy) {
    if (gameState.gameOver) return;

    let rect = canvas.getBoundingClientRect();
    let x = (cx - rect.left) * (canvas.width / rect.width);
    let y = (cy - rect.top) * (canvas.height / rect.height);
    
    let gx = Math.floor(x / TILE_SIZE);
    let gy = Math.floor(y / TILE_SIZE);

    if (gx < 0 || gx >= GRID_W || gy < 0 || gy >= GRID_H) return;

    if (gameState.selectedCard && !gameState.active && inventory[gameState.selectedCard] > 0) {
        let tile = grid[gy][gx];
        let cardKey = gameState.selectedCard;
        let cardData = CARD_TYPES[cardKey];

        // 1. SALVAGE LOGIC
        if (cardKey === 'salvage') {
            if (tile.type === TYPE_WALL && tile.item) {
                // Remove tower from array
                towers = towers.filter(t => !(t.gx === gx && t.gy === gy));
                // Clear tile
                tile.item = null;
                inventory.salvage--;
                createExplosion(gx*TILE_SIZE+16, gy*TILE_SIZE+16, "#88f", 15);
                updateUI();
            }
            return;
        }

        // 2. FLOOR PLACEMENT (Sand)
        if (cardData.target === 'floor') {
            // Must be floor, empty, not castle
            if (tile.type === TYPE_FLOOR && !tile.item && tile.type !== TYPE_CASTLE) {
                tile.item = { type: cardKey, hp: 30 };
                inventory[cardKey]--;
                createExplosion(gx*TILE_SIZE+16, gy*TILE_SIZE+16, "#c96", 8);
                updateUI();
            }
            return;
        }

        // 3. WALL PLACEMENT (Turrets)
        if (cardData.target === 'wall') {
            // Must be wall, no existing turret
            if (tile.type === TYPE_WALL && !tile.item) {
                tile.item = { type: cardKey };
                towers.push(new Tower(gx, gy, cardKey));
                inventory[cardKey]--;
                createExplosion(gx*TILE_SIZE+16, gy*TILE_SIZE+16, "#fff", 8);
                updateUI();
            }
            return;
        }
    }
}

function startWave() {
    if (gameState.active) return;
    gameState.active = true;
    gameState.spawnQueue = [];
    document.getElementById('wave-btn').style.display = 'none';
    
    let count = 6 + Math.floor(gameState.wave * 1.8);
    
    if (gameState.wave % 3 === 0) {
        showMessage("BOSS WAVE", "#f0f");
        gameState.spawnQueue.push('boss');
        count += 4; 
    }

    for(let i=0; i<count; i++) {
        let r = Math.random();
        if (gameState.wave > 2 && r > 0.75) gameState.spawnQueue.push('tank');
        else if (gameState.wave > 1 && r > 0.55) gameState.spawnQueue.push('fast');
        else gameState.spawnQueue.push('norm');
    }
}

function spawnEnemy(type) { enemies.push(new Enemy(type)); }

function endWave() {
    gameState.active = false;
    gameState.wave++;
    showMessage("WAVE CLEARED");
    setTimeout(openDraft, 1200);
}

function gameOver() {
    gameState.gameOver = true;
    showMessage("GAME OVER", "red");
}

function showMessage(msg, col) {
    let el = document.getElementById('message-overlay');
    el.innerText = msg;
    el.style.color = col || 'white';
    el.style.opacity = 1;
    setTimeout(() => el.style.opacity = 0, 2500);
}

/**
 * UI & DRAFT
 */
function updateUI() {
    document.getElementById('hp-display').innerText = Math.ceil(gameState.hp);
    document.getElementById('wave-display').innerText = gameState.wave;
    
    let c = document.getElementById('controls');
    c.innerHTML = '';
    
    Object.keys(inventory).forEach(key => {
        if (inventory[key] > 0 || gameState.selectedCard === key) {
            let div = document.createElement('div');
            let data = CARD_TYPES[key];
            div.className = 'card-slot' + (gameState.selectedCard === key ? ' selected' : '');
            div.innerHTML = `
                <div class="count-badge">${inventory[key]}</div>
                <div class="icon">${data.icon}</div>
                <div style="color:${data.color}">${data.name}</div>
            `;
            div.onclick = () => {
                gameState.selectedCard = (gameState.selectedCard === key) ? null : key;
                updateUI();
            };
            c.appendChild(div);
        }
    });
}

function openDraft() {
    let screen = document.getElementById('draft-screen');
    let gridEl = document.getElementById('draft-grid');
    gridEl.innerHTML = '';
    
    gameState.picksLeft = 3;
    document.getElementById('picks-left').innerText = gameState.picksLeft;
    screen.style.display = 'flex';

    let pool = ['pistol', 'sand', 'salvage'];
    if (gameState.wave >= 2) pool.push('pistol'); // increase weight
    if (gameState.wave >= 3) pool.push('poison');
    if (gameState.wave >= 5) pool.push('missile');

    for(let i=0; i<6; i++) {
        let type = pool[Math.floor(Math.random() * pool.length)];
        let data = CARD_TYPES[type];
        let card = document.createElement('div');
        card.className = 'draft-card';
        card.style.borderBottom = `3px solid ${data.color}`;
        card.innerHTML = `
            <div style="font-size:24px; margin-bottom:4px">${data.icon}</div>
            <h3 style="color:${data.color}">${data.name}</h3>
            <p>${data.desc}</p>
        `;
        card.onclick = () => pickCard(type, card);
        gridEl.appendChild(card);
    }
}

function pickCard(type, element) {
    if (gameState.picksLeft <= 0) return;
    
    inventory[type]++;
    gameState.picksLeft--;
    
    element.classList.add('picked');
    document.getElementById('picks-left').innerText = gameState.picksLeft;
    
    if (gameState.picksLeft === 0) {
        setTimeout(() => {
            document.getElementById('draft-screen').style.display = 'none';
            document.getElementById('wave-btn').style.display = 'block';
            updateUI();
        }, 300);
    }
}

init();
</script>
