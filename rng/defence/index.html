<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maze Defense: Investment</title>
    <style>
        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }
        body { margin: 0; padding: 0; background: #0d0d0d; overflow: hidden; font-family: 'Courier New', monospace; color: white; }
        
        /* Game Canvas */
        #gameCanvas { display: block; margin: 0 auto; background: #1a1a1a; box-shadow: 0 0 30px rgba(0,0,0,0.8); }

        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* Top HUD */
        #hud { background: rgba(0,0,0,0.9); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; pointer-events: auto; border-bottom: 2px solid #333; height: 50px; }
        .stat { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; }
        .money-stat { color: #fd0; text-shadow: 0 0 5px #aa0; font-size: 20px; }
        
        #wave-btn { background: #0077ff; color: white; border: none; padding: 6px 16px; border-radius: 2px; font-weight: 900; cursor: pointer; pointer-events: auto; box-shadow: 0 4px 0 #004499; transition: all 0.1s; text-transform: uppercase; letter-spacing: 1px; font-size: 12px; }
        #wave-btn:active { transform: translateY(4px); box-shadow: none; }
        #wave-btn:disabled { background: #444; box-shadow: none; color: #888; transform: translateY(4px); cursor: not-allowed; }

        /* Bottom Controls (Hand) */
        #hand-container { pointer-events: auto; background: rgba(0,0,0,0.95); padding: 10px; display: flex; justify-content: center; gap: 6px; height: 100px; align-items: center; border-top: 2px solid #333; }
        
        .card-slot { width: 19%; max-width: 75px; height: 80px; border: 2px dashed #444; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; background: #111; position: relative; transition: 0.1s; }
        
        /* Filled Card State */
        .card-slot.filled { border-style: solid; border-color: #666; background: linear-gradient(160deg, #333, #222); }
        .card-slot.selected { border-color: #0f0; background: #153315; transform: translateY(-8px); box-shadow: 0 0 15px rgba(0,255,0,0.2); z-index: 10; }
        .card-slot .icon { font-size: 20px; margin-bottom: 2px; }
        .card-slot .name { font-weight: bold; text-align: center; font-size: 9px; text-transform: uppercase; }
        .card-slot .price-tag { position: absolute; bottom: 2px; right: 2px; color: #fd0; font-size: 9px; font-weight: bold; }

        .card-slot.empty { opacity: 0.3; }
        
        /* SHOP OVERLAY */
        #shop-screen { position: absolute; top: 50px; left: 0; width: 100%; bottom: 100px; background: rgba(0,0,0,0.95); z-index: 50; display: none; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; backdrop-filter: blur(5px); }
        #shop-grid { display: flex; gap: 15px; margin-bottom: 20px; }
        .shop-item { width: 90px; height: 130px; background: #222; border: 2px solid #555; border-radius: 8px; display: flex; flex-direction: column; align-items: center; padding: 10px; cursor: pointer; transition: 0.1s; position: relative; }
        .shop-item:active { transform: scale(0.95); }
        .shop-item h3 { margin: 5px 0; font-size: 12px; color: #fff; text-transform: uppercase;}
        .shop-item .cost { color: #fd0; font-weight: bold; font-size: 16px; margin-top: auto; }
        .shop-item p { font-size: 10px; color: #aaa; text-align: center; line-height: 1.2; }
        .shop-item.too-expensive { opacity: 0.5; border-color: #500; cursor: not-allowed; }

        #shop-controls { display: flex; gap: 20px; }
        .shop-btn { padding: 10px 20px; border: 2px solid #555; background: #333; color: white; font-family: inherit; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .shop-btn.reroll { border-color: #d80; color: #d80; }
        .shop-btn.done { border-color: #0f0; background: #050; }

        #message-overlay { position: absolute; top: 30%; width: 100%; text-align: center; font-size: 28px; font-weight: 900; color: white; text-shadow: 0 0 10px #000; pointer-events: none; opacity: 0; transition: opacity 0.3s; letter-spacing: 3px; background: rgba(0,0,0,0.7); padding: 20px 0; z-index: 100; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="hud">
            <div class="stat" style="color:#f44">❤ <span id="hp-display">20</span></div>
            <div class="stat money-stat">$<span id="money-display">150</span></div>
            <div class="stat" style="color:#4af">WAVE <span id="wave-display">1</span></div>
            <button id="wave-btn">START</button>
        </div>
        
        <div id="message-overlay">WAVE COMPLETE</div>

        <div id="shop-screen">
            <h2 style="color:#fd0; margin-top:0;">BLACK MARKET</h2>
            <div id="shop-grid"></div>
            <div id="shop-controls">
                <button class="shop-btn reroll" onclick="rerollShop()">Reroll ($10)</button>
                <button class="shop-btn done" onclick="closeShop()">Ready</button>
            </div>
            <p style="color:#888; font-size: 12px; margin-top: 15px;">Buy weapons. Unused cards convert to cash after wave.</p>
        </div>

        <div id="hand-container">
            </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
/**
 * GAME CONFIGURATION
 */
const TILE_SIZE = 32;
const GRID_W = 15; 
const GRID_H = 19;
const HAND_SIZE = 5;

// Colors
const C_BG = '#111';
const C_WALL = '#3a3a3a';
const C_FLOOR = '#161616';
const C_CASTLE = '#0077ff';

// Enums
const TYPE_FLOOR = 0;
const TYPE_WALL = 1;
const TYPE_CASTLE = 2;

// Global State
let canvas, ctx;
let lastTime = 0;
let grid = [];
let flowField = []; 
let enemies = [];
let towers = [];
let projectiles = [];
let particles = [];

// Inventory & Economy
let hand = [null, null, null, null, null]; 
let selectedSlotIndex = -1;
let shopItems = []; // Array of 3 card keys

let gameState = {
    hp: 20,
    money: 250, // Starting money
    wave: 1,
    active: false,
    spawnQueue: [],
    spawnTimer: 0,
    gameOver: false,
    shopOpen: false
};

const CARD_TYPES = {
    pistol:  { name: "Pistol",  price: 50,  icon: "🔫", color: "#ddd", range: 3.5, cd: 35, damage: 10, target: 'wall', desc: "Fast single shot" },
    missile: { name: "Missile", price: 150, icon: "🚀", color: "#f90", range: 5.0, cd: 110, damage: 45, target: 'wall', desc: "Splash damage" },
    poison:  { name: "Poison",  price: 80,  icon: "🧪", color: "#2d2", range: 3.0, cd: 50, damage: 3, target: 'wall', desc: "Damage over time" },
    sand:    { name: "Sand",    price: 30,  icon: "⏳", color: "#c96", range: 0, target: 'floor', desc: "Slows enemies" },
    salvage: { name: "Salvage", price: 20,  icon: "🔧", color: "#88f", range: 0, target: 'turret', desc: "Remove turret" }
};

/**
 * INITIALIZATION
 */
function init() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    
    resize();
    window.addEventListener('resize', resize);
    
    // Input
    canvas.addEventListener('mousedown', (e) => handleInput(e.clientX, e.clientY));
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault(); 
        handleInput(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive: false});

    document.getElementById('wave-btn').addEventListener('click', () => {
        if(!gameState.active && !gameState.shopOpen) startWave();
    });

    resetGame();
    requestAnimationFrame(loop);
}

function resize() {
    let availW = window.innerWidth;
    let availH = window.innerHeight;
    let scale = Math.min(availW / (GRID_W * TILE_SIZE), availH / (GRID_H * TILE_SIZE));
    canvas.width = GRID_W * TILE_SIZE;
    canvas.height = GRID_H * TILE_SIZE;
    canvas.style.width = (canvas.width * scale) + "px";
    canvas.style.height = (canvas.height * scale) + "px";
}

function resetGame() {
    generateMazeMap();
    let cx = Math.floor(GRID_W/2);
    let cy = Math.floor(GRID_H/2);
    grid[cy][cx].type = TYPE_CASTLE;
    getNeighbors(cx, cy).forEach(n => grid[n.y][n.x].type = TYPE_FLOOR);

    towers = [];
    enemies = [];
    projectiles = [];
    particles = [];
    
    gameState.hp = 20;
    gameState.money = 250; 
    gameState.wave = 1;
    gameState.active = false;
    gameState.gameOver = false;
    
    hand = [null, null, null, null, null];
    
    updateUI();
    calcFlowField();
    
    // Start with empty hand and open shop
    openShop();
}

/**
 * MAP GENERATION
 */
function generateMazeMap() {
    grid = [];
    for(let y=0; y<GRID_H; y++) {
        let row = [];
        for(let x=0; x<GRID_W; x++) row.push({type: TYPE_WALL, item: null});
        grid.push(row);
    }
    let cx = Math.floor(GRID_W/2);
    let cy = Math.floor(GRID_H/2);
    let stack = [{x:cx, y:cy}];
    grid[cy][cx].type = TYPE_FLOOR;

    while(stack.length > 0) {
        let current = stack[stack.length - 1];
        let neighbors = [];
        let dirs = [[0,-2], [0,2], [-2,0], [2,0]];
        for(let d of dirs) {
            let nx = current.x + d[0];
            let ny = current.y + d[1];
            if(nx > 0 && nx < GRID_W-1 && ny > 0 && ny < GRID_H-1) {
                if(grid[ny][nx].type === TYPE_WALL) neighbors.push({x:nx, y:ny, dx:d[0]/2, dy:d[1]/2});
            }
        }
        if(neighbors.length > 0) {
            let next = neighbors[Math.floor(Math.random() * neighbors.length)];
            grid[next.y][next.x].type = TYPE_FLOOR;
            grid[current.y + next.dy][current.x + next.dx].type = TYPE_FLOOR;
            stack.push(next);
        } else {
            stack.pop();
        }
    }
    // Open Corners
    let corners = [[0,0], [GRID_W-1, 0], [0, GRID_H-1], [GRID_W-1, GRID_H-1]];
    corners.forEach(c => {
        grid[c[1]][c[0]].type = TYPE_FLOOR;
        if (c[0]===0) grid[c[1]][1].type = TYPE_FLOOR; else grid[c[1]][GRID_W-2].type = TYPE_FLOOR;
    });
}

function getNeighbors(x, y) {
    let res = [];
    [[0,1],[0,-1],[1,0],[-1,0]].forEach(d => {
        let nx = x+d[0], ny = y+d[1];
        if(nx>=0 && nx<GRID_W && ny>=0 && ny<GRID_H) res.push({x:nx, y:ny});
    });
    return res;
}

/**
 * GAME LOOP
 */
function update() {
    if (gameState.gameOver) return;

    if (gameState.active && gameState.spawnQueue.length > 0) {
        gameState.spawnTimer++;
        if (gameState.spawnTimer > 30) {
            spawnEnemy(gameState.spawnQueue.shift());
            gameState.spawnTimer = 0;
        }
    } else if (gameState.active && gameState.spawnQueue.length === 0 && enemies.length === 0) {
        endWave();
    }

    towers.forEach(t => t.update());
    for(let i = projectiles.length-1; i>=0; i--) { if (!projectiles[i].update()) projectiles.splice(i, 1); }
    for(let i = enemies.length-1; i>=0; i--) {
        let e = enemies[i];
        e.update();
        if (e.dead) {
            // NO MONEY FROM KILLS
            enemies.splice(i, 1);
        } else if (e.reachedGoal) {
            gameState.hp -= 1;
            enemies.splice(i, 1);
            createExplosion(e.x, e.y, "#f44", 15);
            updateUI();
            if (gameState.hp <= 0) gameOver();
        }
    }
    for(let i = particles.length-1; i>=0; i--) { if (!particles[i].update()) particles.splice(i, 1); }
}

function draw() {
    ctx.fillStyle = C_BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for(let y=0; y<GRID_H; y++) {
        for(let x=0; x<GRID_W; x++) {
            let px = x * TILE_SIZE;
            let py = y * TILE_SIZE;
            let cell = grid[y][x];

            if (cell.type === TYPE_WALL) {
                ctx.fillStyle = '#222'; ctx.fillRect(px, py+4, TILE_SIZE, TILE_SIZE-4); 
                ctx.fillStyle = C_WALL; ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE-4); 
                ctx.strokeStyle = '#444'; ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE-4);
            } else {
                ctx.fillStyle = C_FLOOR; ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            }
            
            if (cell.item && cell.item.type === 'sand') {
                ctx.fillStyle = '#875';
                ctx.beginPath(); ctx.arc(px+16, py+16, 12, 0, Math.PI*2); ctx.fill();
                let pct = cell.item.hp / 30;
                ctx.fillStyle = `rgba(0,0,0,${1-pct})`; 
                ctx.beginPath(); ctx.arc(px+16, py+16, 8, 0, Math.PI*2); ctx.fill();
            }
            
            if (cell.type === TYPE_CASTLE) {
                ctx.fillStyle = C_CASTLE;
                ctx.fillRect(px+4, py+4, TILE_SIZE-8, TILE_SIZE-8);
                ctx.strokeStyle = 'white'; ctx.lineWidth=2; ctx.strokeRect(px+6, py+6, TILE_SIZE-12, TILE_SIZE-12);
            }
        }
    }

    towers.forEach(t => t.draw(ctx));
    enemies.forEach(e => e.draw(ctx));
    projectiles.forEach(p => p.draw(ctx));
    particles.forEach(p => p.draw(ctx));
}

function loop(timestamp) {
    let dt = timestamp - lastTime;
    lastTime = timestamp;
    update();
    draw();
    requestAnimationFrame(loop);
}

/**
 * ECONOMY & SHOP LOGIC
 */
function openShop() {
    gameState.shopOpen = true;
    document.getElementById('shop-screen').style.display = 'flex';
    document.getElementById('wave-btn').style.display = 'none';
    rerollShop(true); // Initial free roll or standard roll
    updateUI();
}

function closeShop() {
    gameState.shopOpen = false;
    document.getElementById('shop-screen').style.display = 'none';
    document.getElementById('wave-btn').style.display = 'block';
    updateUI();
}

function rerollShop(free) {
    if (!free) {
        if (gameState.money >= 10) {
            gameState.money -= 10;
        } else {
            return;
        }
    }
    
    // Generate 3 random items
    shopItems = [];
    let keys = Object.keys(CARD_TYPES);
    for(let i=0; i<3; i++) {
        shopItems.push(keys[Math.floor(Math.random() * keys.length)]);
    }
    updateShopUI();
    updateUI();
}

function buyCard(index) {
    let type = shopItems[index];
    let price = CARD_TYPES[type].price;
    
    // Check if hand full
    let emptySlot = hand.indexOf(null);
    if (emptySlot === -1) {
        showMessage("HAND FULL!", "red");
        return;
    }

    if (gameState.money >= price) {
        gameState.money -= price;
        hand[emptySlot] = type;
        updateUI();
        updateShopUI();
    }
}

function updateShopUI() {
    let grid = document.getElementById('shop-grid');
    grid.innerHTML = '';
    
    shopItems.forEach((type, i) => {
        let data = CARD_TYPES[type];
        let el = document.createElement('div');
        let canAfford = gameState.money >= data.price;
        
        el.className = 'shop-item' + (canAfford ? '' : ' too-expensive');
        el.innerHTML = `
            <div style="font-size:24px">${data.icon}</div>
            <h3>${data.name}</h3>
            <p>${data.desc}</p>
            <div class="cost">$${data.price}</div>
        `;
        el.onclick = () => buyCard(i);
        grid.appendChild(el);
    });
}

function sellHand() {
    let gain = 0;
    for(let i=0; i<HAND_SIZE; i++) {
        if (hand[i] !== null) {
            gain += CARD_TYPES[hand[i]].price;
            hand[i] = null;
        }
    }
    gameState.money += gain;
    if(gain > 0) showMessage(`SOLD UNUSED: +$${gain}`, "#fd0");
}


/**
 * ENTITIES & CLASSES
 */
class Enemy {
    constructor(type) {
        let corners = [[0,0], [GRID_W-1, 0], [0, GRID_H-1], [GRID_W-1, GRID_H-1]];
        let corner = corners[Math.floor(Math.random()*corners.length)];
        this.gx = corner[0]; 
        this.gy = corner[1];
        this.x = this.gx * TILE_SIZE + 16; 
        this.y = this.gy * TILE_SIZE + 16;
        this.type = type;
        
        let mult = Math.pow(1.15, gameState.wave);
        if (type === 'boss') { this.hp=400*mult; this.speed=0.6; this.color='#c0c'; this.r=12; }
        else if (type === 'fast') { this.hp=20*mult; this.speed=2.4; this.color='#ee0'; this.r=6; }
        else if (type === 'tank') { this.hp=80*mult; this.speed=0.7; this.color='#c22'; this.r=10; }
        else { this.hp=40*mult; this.speed=1.3; this.color='#f55'; this.r=8; }
        
        this.maxHp = this.hp;
        this.poisoned = 0;
        this.vx=0; this.vy=0;
        this.dead = false; 
        this.reachedGoal = false;
    }

    update() {
        let gx = Math.floor(this.x/TILE_SIZE); 
        let gy = Math.floor(this.y/TILE_SIZE);
        let cx = Math.floor(GRID_W/2)*TILE_SIZE+16; 
        let cy = Math.floor(GRID_H/2)*TILE_SIZE+16;
        
        if (Math.hypot(this.x-cx, this.y-cy) < 20) { this.reachedGoal = true; return; }

        let cell = (grid[gy] && grid[gy][gx]) ? grid[gy][gx] : null;
        let speedMod = 1;
        if (cell && cell.item && cell.item.type === 'sand') {
            speedMod = 0.4;
            if (Math.random() < 0.03) {
                cell.item.hp--;
                createExplosion(this.x, this.y, '#aa8', 1);
                if (cell.item.hp <= 0) { cell.item = null; createExplosion(gx*32+16, gy*32+16, "#c94", 8); }
            }
        }
        
        if (this.poisoned > 0) {
            this.hp -= (this.maxHp * 0.003) + 0.1; this.poisoned--;
            if (this.hp <= 0) { this.dead = true; return; }
        }

        let best = 9999; let tx = this.x; let ty = this.y;
        [[0,1],[0,-1],[1,0],[-1,0]].forEach(d => {
            let nx=gx+d[0], ny=gy+d[1];
            if(nx>=0 && nx<GRID_W && ny>=0 && ny<GRID_H) {
                let dist = flowField[ny][nx];
                if(dist!==null && dist<best) { best=dist; tx=nx*TILE_SIZE+16; ty=ny*TILE_SIZE+16; }
            }
        });

        let dx = tx-this.x, dy = ty-this.y;
        let dist = Math.hypot(dx, dy);
        if(dist>1) {
            this.vx = (dx/dist)*this.speed*speedMod;
            this.vy = (dy/dist)*this.speed*speedMod;
            this.x+=this.vx; this.y+=this.vy;
        }
    }
    
    draw(ctx) {
        ctx.fillStyle = this.color; 
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, 6.28); ctx.fill();
        ctx.fillStyle = '#400'; ctx.fillRect(this.x-8, this.y-12, 16, 4);
        ctx.fillStyle = (this.hp/this.maxHp)>0.5?'#0f0':'#f00'; ctx.fillRect(this.x-8, this.y-12, 16*(this.hp/this.maxHp), 4);
    }
}

class Tower {
    constructor(gx, gy, type) {
        this.gx=gx; this.gy=gy; this.type=type;
        this.x=gx*TILE_SIZE+16; this.y=gy*TILE_SIZE+16;
        this.stats=CARD_TYPES[type]; this.cd=0; this.angle=0;
    }
    update() { if(this.cd>0) this.cd--; else this.shoot(); }
    shoot() {
        let target=null, min=this.stats.range*TILE_SIZE;
        for(let e of enemies) {
            let d = Math.hypot(e.x-this.x, e.y-this.y);
            if(d<min) { min=d; target=e; }
        }
        if(target) {
            this.cd=this.stats.cd; this.angle=Math.atan2(target.y-this.y, target.x-this.x);
            projectiles.push(new Projectile(this.x, this.y, target, this.type));
        }
    }
    draw(ctx) {
        ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(this.x, this.y-2, 10, 0, 6.28); ctx.fill();
        ctx.save(); ctx.translate(this.x, this.y-2); ctx.rotate(this.angle);
        ctx.fillStyle=this.stats.color; ctx.fillRect(-6,-6,12,12);
        ctx.fillStyle='black'; ctx.fillRect(0,-2,12,4); ctx.restore();
    }
}

class Projectile {
    constructor(x,y,t,type) {
        this.x=x; this.y=y; this.type=type; this.speed=8; this.life=50;
        let a=Math.atan2(t.y-y, t.x-x); this.vx=Math.cos(a)*8; this.vy=Math.sin(a)*8;
        this.dmg=CARD_TYPES[type].damage;
    }
    update() {
        this.x+=this.vx; this.y+=this.vy; this.life--;
        if(this.life<=0) return false;
        for(let e of enemies) {
            if(Math.hypot(e.x-this.x, e.y-this.y) < e.r+8) { this.hit(e); return false; }
        }
        return true;
    }
    hit(t) {
        if(this.type==='missile') {
            createExplosion(this.x, this.y, "orange", 12);
            for(let e of enemies) { if(Math.hypot(e.x-this.x, e.y-this.y)<64) e.hp-=this.dmg; if(e.hp<=0) e.dead=true; }
        } else if(this.type==='poison') { t.poisoned=150; t.hp-=5; } 
        else { t.hp-=this.dmg; createExplosion(this.x, this.y, "#fff", 5); }
        if(t.hp<=0) { t.dead=true; createExplosion(t.x, t.y, "#e44", 8); }
    }
    draw(ctx) { ctx.fillStyle=CARD_TYPES[this.type].color; ctx.beginPath(); ctx.arc(this.x, this.y, 4, 0, 6.28); ctx.fill(); }
}

class Particle {
    constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        let a = Math.random() * 6.28;
        let s = Math.random() * 3;
        this.vx = Math.cos(a)*s; this.vy = Math.sin(a)*s;
        this.life = 20 + Math.random()*15;
    }
    update() { this.x+=this.vx; this.y+=this.vy; this.life--; return this.life > 0; }
    draw(ctx) { ctx.globalAlpha = this.life/35; ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, 3, 3); ctx.globalAlpha = 1; }
}

function createExplosion(x,y,c,n) { for(let i=0;i<n;i++) particles.push(new Particle(x, y, c)); }

/**
 * PATHFINDING
 */
function calcFlowField() {
    flowField = [];
    for(let y=0; y<GRID_H; y++) {
        let row = [];
        for(let x=0; x<GRID_W; x++) row.push(null);
        flowField.push(row);
    }
    let queue = [];
    let cx = Math.floor(GRID_W/2);
    let cy = Math.floor(GRID_H/2);
    
    flowField[cy][cx] = 0;
    queue.push({x: cx, y: cy});

    const dirs = [[0,1], [0,-1], [1,0], [-1,0]];
    while(queue.length > 0) {
        let cur = queue.shift();
        let dist = flowField[cur.y][cur.x];
        for(let d of dirs) {
            let nx = cur.x + d[0];
            let ny = cur.y + d[1];
            if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H) {
                if (grid[ny][nx].type !== TYPE_WALL && flowField[ny][nx] === null) {
                    flowField[ny][nx] = dist + 1;
                    queue.push({x: nx, y: ny});
                }
            }
        }
    }
}

/**
 * INPUT & LOGIC
 */
function handleInput(cx, cy) {
    if (gameState.gameOver || gameState.shopOpen || selectedSlotIndex === -1) return;

    let rect = canvas.getBoundingClientRect();
    let x = (cx - rect.left) * (canvas.width / rect.width);
    let y = (cy - rect.top) * (canvas.height / rect.height);
    let gx = Math.floor(x / TILE_SIZE); let gy = Math.floor(y / TILE_SIZE);
    
    if (gx < 0 || gx >= GRID_W || gy < 0 || gy >= GRID_H) return;

    let cardKey = hand[selectedSlotIndex];
    if (!cardKey) return;
    
    let tile = grid[gy][gx];
    let data = CARD_TYPES[cardKey];
    let placed = false;

    if (cardKey === 'salvage') {
        if (tile.type === TYPE_WALL && tile.item) {
            towers = towers.filter(t => !(t.gx === gx && t.gy === gy));
            tile.item = null;
            createExplosion(gx*TILE_SIZE+16, gy*TILE_SIZE+16, "#88f", 15);
            placed = true;
        }
    } 
    else if (data.target === 'floor') {
        if (tile.type === TYPE_FLOOR && !tile.item && tile.type !== TYPE_CASTLE) {
            tile.item = { type: cardKey, hp: 30 };
            createExplosion(gx*TILE_SIZE+16, gy*TILE_SIZE+16, "#c96", 8);
            placed = true;
        }
    }
    else if (data.target === 'wall') {
        if (tile.type === TYPE_WALL && !tile.item) {
            tile.item = { type: cardKey };
            towers.push(new Tower(gx, gy, cardKey));
            createExplosion(gx*TILE_SIZE+16, gy*TILE_SIZE+16, "#fff", 8);
            placed = true;
        }
    }

    if (placed) {
        hand[selectedSlotIndex] = null; 
        selectedSlotIndex = -1; 
        updateUI();
    }
}

function startWave() {
    if (gameState.active) return;
    gameState.active = true;
    gameState.spawnQueue = [];
    document.getElementById('wave-btn').disabled = true;
    document.getElementById('wave-btn').innerText = "IN PROGRESS";
    
    let count = 6 + Math.floor(gameState.wave * 1.8);
    if (gameState.wave % 3 === 0) { showMessage("BOSS WAVE", "#f0f"); gameState.spawnQueue.push('boss'); count += 4; }

    for(let i=0; i<count; i++) {
        let r = Math.random();
        if (gameState.wave > 2 && r > 0.75) gameState.spawnQueue.push('tank');
        else if (gameState.wave > 1 && r > 0.55) gameState.spawnQueue.push('fast');
        else gameState.spawnQueue.push('norm');
    }
}

function spawnEnemy(type) { enemies.push(new Enemy(type)); }

function endWave() {
    gameState.active = false;
    gameState.wave++;
    
    // 1. Sell Hand
    sellHand();
    
    // 2. Open Shop
    setTimeout(() => {
        openShop();
        document.getElementById('wave-btn').disabled = false;
        document.getElementById('wave-btn').innerText = "START";
    }, 1500);
}

function gameOver() {
    gameState.gameOver = true;
    showMessage("GAME OVER", "red");
}

function showMessage(msg, col) {
    let el = document.getElementById('message-overlay');
    el.innerText = msg; el.style.color = col || 'white'; el.style.opacity = 1;
    setTimeout(() => el.style.opacity = 0, 2500);
}

function updateUI() {
    document.getElementById('hp-display').innerText = Math.ceil(gameState.hp);
    document.getElementById('money-display').innerText = gameState.money;
    document.getElementById('wave-display').innerText = gameState.wave;
    
    let container = document.getElementById('hand-container');
    container.innerHTML = '';
    
    hand.forEach((cardKey, index) => {
        let div = document.createElement('div');
        
        if (cardKey) {
            let data = CARD_TYPES[cardKey];
            div.className = `card-slot filled ${selectedSlotIndex === index ? 'selected' : ''}`;
            div.style.borderColor = data.color;
            div.innerHTML = `
                <div class="icon">${data.icon}</div>
                <div class="name" style="color:${data.color}">${data.name}</div>
                <div class="price-tag">$${data.price}</div>
            `;
            div.onclick = () => {
                if (gameState.active) {
                     selectedSlotIndex = (selectedSlotIndex === index) ? -1 : index;
                     updateUI();
                }
            };
        } else {
            div.className = 'card-slot empty';
            div.innerHTML = `<span style="color:#333">-</span>`;
        }
        
        container.appendChild(div);
    });
}

// Start
init();
</script>
