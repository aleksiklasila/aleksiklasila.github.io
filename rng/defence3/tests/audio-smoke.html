 const buffer=_generateEffectBuffer(type,'',0,recipe),d=buffer.getChannelData(0);
 if(!d.every(Number.isFinite)||Math.abs(d[0])>.0001||Math.abs(d[d.length-1])>.0001)throw Error(type+' invalid envelope');
