            if (spawner && players[u.owner].money >= 1) {
                u.workerState = 'RETURNING_FOR_GOLD';
                u.path = findPathAStar(myGx, myGy, spawner.gx, spawner.gy);
                u.pathIndex = 0; u.commandState = CMD_MOVING;
                u._builderSpawnerTarget = spawner;
            } else {
                // No spawner or no money — go build directly (slow mode)
                u.workerState = 'MOVING_TO_BUILD';
                let dest = findNearestWalkable(target.gx, target.gy);
                u.path = findPathAStar(myGx, myGy, dest.x, dest.y);
                u.pathIndex = 0; u.commandState = CMD_MOVING;
            }
        }

        function _findClosestBuilderSpawner(u) {
            let closest = null, bestDist = Infinity;
            for (let s of collectorSpawners) {
                if (s.type === 'builder_spawner' && s.owner === u.owner && s.hp > 0 && !s.underConstruction) {
                    let d = Math.hypot(s.x - u.x, s.y - u.y);
                    if (d < bestDist) { bestDist = d; closest = s; }
                }
            }
            return closest;
        }

        function _findNearestUnderConstruction(u) {
            let owner = u.owner, bestDist = Infinity, best = null;
            let check = (b) => {
                if (!b.underConstruction || b.owner !== owner) return;
                let d = Math.hypot(b.x - u.x, b.y - u.y);
                if (d < bestDist) { bestDist = d; best = b; }
            };
            for (let t of towers) check(t);
            for (let b of barracks) check(b);
            for (let s of collectorSpawners) check(s);
            for (let fy = 0; fy < GRID_H; fy++) for (let fx = 0; fx < GRID_W; fx++) {
                let c = grid[fy][fx]; if (c.item && c.item.underConstruction) check(c.item);
            }
            return best;
        }

        function _findClosestSpawner(u, type) {
            let closest = null, bestDist = Infinity;
            for (let s of collectorSpawners) {
                if (s.type === type && s.owner === u.owner && s.hp > 0 && !s.underConstruction) {
                    let d = Math.hypot(s.x - u.x, s.y - u.y);
                    if (d < bestDist) { bestDist = d; closest = s; }
                }
            }
            return closest;
        }

        function _workerReturnPath(u) {
            let type = u.workerType === 'collector' ? 'spawner' : 'salvager';
            let closest = _findClosestSpawner(u, type);
            if (closest) {
                let myGx = Math.floor(u.x / TILE), myGy = Math.floor(u.y / TILE);
                u.path = findPathAStar(myGx, myGy, closest.gx, closest.gy) || [];
                u.pathIndex = 0; u.commandState = CMD_MOVING;
            } else {
                u.path = []; u.pathIndex = 0; u.commandState = CMD_IDLE;
            }
        }

        // ============================================================
        // ADJACENCY & LASER CONNECTIONS
        // ============================================================
        function recalculateLaserConnections() {
            towers.forEach(t => { if (t.type === 'laser') t.connectedLasers = []; });
            for (let i = 0; i < towers.length; i++) {
                let t1 = towers[i]; if (t1.type !== 'laser') continue;
                for (let j = i + 1; j < towers.length; j++) {
                    let t2 = towers[j]; if (t2.type !== 'laser' || t2.owner !== t1.owner) continue;
                    let aX = t1.gx === t2.gx, aY = t1.gy === t2.gy;
                    if (!aX && !aY) continue;
                    let blocked = false, dist;
                    if (aX) { dist = Math.abs(t1.gy - t2.gy); let mn = Math.min(t1.gy, t2.gy), mx = Math.max(t1.gy, t2.gy); for (let y = mn + 1; y < mx; y++) if (grid[y][t1.gx].type === TYPE_WALL) blocked = true; }
                    else { dist = Math.abs(t1.gx - t2.gx); let mn = Math.min(t1.gx, t2.gx), mx = Math.max(t1.gx, t2.gx); for (let x = mn + 1; x < mx; x++) if (grid[t1.gy][x].type === TYPE_WALL) blocked = true; }
                    let gap = dist - 1, limit = Math.min(t1.effectiveLevel, t2.effectiveLevel);
                    if (gap > limit || gap < 1) blocked = true;
                    if (!blocked) { t1.connectedLasers.push(t2); t2.connectedLasers.push(t1); }
                }
            }
        }

        function recalculateAdjacency() {
            areas.forEach(a => a.active = false);
            dirtyAreas = true;
            towers.forEach(t => { t.effectiveStacks = t.stacks; t.effectiveLevel = Math.floor(Math.log2(t.stacks)) + 1; });
            for (let y = 0; y < GRID_H; y++) for (let x = 0; x < GRID_W; x++) { if (grid[y][x].item) grid[y][x].item.effectiveStacks = grid[y][x].item.stacks || 1; }

            let visited = new Set();
            const gid = (x, y) => `${x},${y}`;

            for (let y = 0; y < GRID_H; y++) {
                for (let x = 0; x < GRID_W; x++) {
                    let cell = grid[y][x], type = null, isTower = false, ownerCheck = -1;
                    if (cell.type === TYPE_WALL) {
                        let t = towers.find(t => t.gx === x && t.gy === y);
                        if (t) { type = t.type; isTower = true; ownerCheck = t.owner; }
                    } else if (cell.item) { type = cell.item.type; ownerCheck = cell.owner; }
                    if (!type || visited.has(gid(x, y))) continue;

                    let group = [], queue = [{ x, y }];
                    visited.add(gid(x, y));
                    if (isTower) { let t = towers.find(t => t.gx === x && t.gy === y); if (t) group.push(t); }
                    else group.push(cell.item);
                    let touchedAreas = new Set([cell.areaId]);

                    while (queue.length > 0) {
                        let cur = queue.shift();
                        for (let [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
                            let nx = cur.x + dx, ny = cur.y + dy;
                            if (nx < 0 || nx >= GRID_W || ny < 0 || ny >= GRID_H) continue;
                            let key = gid(nx, ny), nc = grid[ny][nx], nType = null, nObj = null;
                            if (isTower) {
                                if (nc.type === TYPE_WALL) { let nt = towers.find(t => t.gx === nx && t.gy === ny); if (nt && nt.owner === ownerCheck) { nType = nt.type; nObj = nt; } }
                            } else { if (nc.item && nc.owner === ownerCheck) { nType = nc.item.type; nObj = nc.item; } }
                            if (!visited.has(key) && nType === type) {
                                visited.add(key); queue.push({ x: nx, y: ny }); group.push(nObj); touchedAreas.add(nc.areaId);
                            }
                            // Cloud bridge
                            if (isTower && nObj && nObj.baseStats && nObj.baseStats.isCloud) {
                                let partner = towers.find(pt => pt !== nObj && pt.baseStats.isCloud && pt.baseStats.pairId === nObj.baseStats.pairId && pt.owner === ownerCheck);
                                let bridges = [nObj]; if (partner) bridges.push(partner);
                                for (let b of bridges) {
                                    for (let [dx2, dy2] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
                                        let nx2 = b.gx + dx2, ny2 = b.gy + dy2;
                                        if (nx2 < 0 || nx2 >= GRID_W || ny2 < 0 || ny2 >= GRID_H) continue;
                                        let k2 = gid(nx2, ny2);
                                        if (!visited.has(k2) && grid[ny2][nx2].type === TYPE_WALL) {
                                            let nt2 = towers.find(t => t.gx === nx2 && t.gy === ny2);
                                            if (nt2 && nt2.type === type && nt2.owner === ownerCheck) {
                                                visited.add(k2); queue.push({ x: nx2, y: ny2 }); group.push(nt2); touchedAreas.add(grid[ny2][nx2].areaId);
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }

                    // Area multiplier
                    let areaMult = 1;
                    touchedAreas.forEach(aId => {
                        if (aId === -1) return;
                        let area = areas.find(a => a.id === aId);
                        if (!area) return;
                        let filled = true;
                        for (let cp of area.cells) {
                            let c = grid[cp.y][cp.x], occ = false;
                            if (isTower) { if (c.type === TYPE_WALL) { let t = towers.find(t => t.gx === cp.x && t.gy === cp.y); if (t && t.type === type && t.owner === ownerCheck) occ = true; } }
                            else { if (c.item && c.item.type === type && c.owner === ownerCheck) occ = true; }
                            if (!occ) { filled = false; break; }
                        }
                        if (filled) { area.active = true; let power = (area.multiplierLevel || 0) + 1; areaMult *= Math.pow(area.cells.length, power); }
                    });

                    let groupSize = group.length;
                    group.forEach(obj => {
                        obj.effectiveStacks = (obj.stacks || 1) * groupSize * areaMult;
                        if (obj.updateStats) {
                            obj.effectiveLevel = Math.floor(Math.log2(obj.effectiveStacks)) + 1;
                            obj.effectiveGroupSize = groupSize; obj.effectiveAreaMult = areaMult;
                            obj.updateStats();
                        } else {
                            obj.effectiveGroupSize = groupSize; obj.effectiveAreaMult = areaMult;
                            let level = Math.floor(Math.log2(obj.effectiveStacks)) + 1;
                            obj.effectiveLevel = level;
                            let stats = calculateItemStats(obj.type, level);
                            let ratio = obj.maxHp > 0 ? obj.hp / obj.maxHp : 1;
                            obj.maxHp = stats.maxHp; if (stats.damage) obj.damage = stats.damage;
                            obj.hp = obj.maxHp * ratio;
                            updateItemTextCache(obj);
                        }
                    });
                }
            }
            areas.forEach(a => { if (!a.active && a.multiplierLevel > 0) { a.multiplierLevel = 0; dirtyAreas = true; } });
        }

        // ============================================================
        // BUILDING PLACEMENT & DESTRUCTION
        // ============================================================
        function canBuildAt(gx, gy, playerId) {
            if (gx < 0 || gx >= GRID_W || gy < 0 || gy >= GRID_H) return false;
            if (grid[gy][gx].type === TYPE_WALL) return false;
            if (grid[gy][gx].item) return false;
            // Don't allow building on gold mines
            for (let m of goldMines) { if (m.gx === gx && m.gy === gy) return false; }
            // Check within 5 tiles of any fully-built owned building
            /*
            // distance thing disabled for now.
            for (let t of towers) { if (t.owner === playerId && !t.underConstruction && Math.abs(t.gx - gx) + Math.abs(t.gy - gy) <= 5) return true; }
            for (let b of barracks) { if (b.owner === playerId && !b.underConstruction && Math.abs(b.gx - gx) + Math.abs(b.gy - gy) <= 5) return true; }
            for (let s of collectorSpawners) { if (s.owner === playerId && !s.underConstruction && Math.abs(s.gx - gx) + Math.abs(s.gy - gy) <= 5) return true; }
            // Check floor items too (exclude under-construction)
            for (let y2 = 0; y2 < GRID_H; y2++) for (let x2 = 0; x2 < GRID_W; x2++) {
                if (grid[y2][x2].item && !grid[y2][x2].item.underConstruction && grid[y2][x2].owner === playerId && Math.abs(x2 - gx) + Math.abs(y2 - gy) <= 5) return true;
            }
            return false;
            */
            return true
        }

        function canStackAt(gx, gy, itemKey, playerId) {
            // Check if we can stack on an existing same-type building
            if (gx < 0 || gx >= GRID_W || gy < 0 || gy >= GRID_H) return false;
            let cardDef = CARD_TYPES[itemKey];
            if (!cardDef) return false;
            if (cardDef.target === 'wall') {
                return !!towers.find(t => t.gx === gx && t.gy === gy && t.type === itemKey && t.owner === playerId);
            }
            if (itemKey.startsWith('barrack_')) {
                let unitType = cardDef.unitType || 'norm';
                return !!barracks.find(b => b.gx === gx && b.gy === gy && b.unitType === unitType && b.owner === playerId);
            }
            if (itemKey === 'spawner' || itemKey === 'salvager' || itemKey === 'builder_spawner') {
                return !!collectorSpawners.find(s => s.gx === gx && s.gy === gy && s.type === itemKey && s.owner === playerId);
            }
            // Floor items
            let cell = grid[gy][gx];
            return cell.item && cell.item.type === itemKey && cell.owner === playerId;
        }

        const AREA_LEVEL_COLORS = ['#888', '#4f4', '#4af', '#c4f', '#f90', '#fd0'];
        const AREA_LEVEL_NAMES = ['Gray', 'Green', 'Blue', 'Purple', 'Orange', 'Gold'];

        function getAreaUpgradeCost(currentLevel) {
            return Math.floor(100 * Math.pow(3, currentLevel));
        }

        function placeBuilding(gx, gy, itemKey, playerId) {
            let cardDef = CARD_TYPES[itemKey];
            if (!cardDef) return false;

            // Area upgrader: special handling
            if (itemKey === 'area_upgrader') {
                let aId = grid[gy][gx].areaId;
                if (aId === -1) return false;
                let area = areas.find(a => a.id === aId);
                if (!area) return false;
                // Check if ALL cells in area are occupied by any building/item (any owner)
                let allFilled = area.cells.every(cp => {
                    let c = grid[cp.y][cp.x];
                    if (c.type === TYPE_WALL && towers.find(t => t.gx === cp.x && t.gy === cp.y)) return true;
                    if (c.item) return true;
                    if (barracks.find(b => b.gx === cp.x && b.gy === cp.y)) return true;
                    if (collectorSpawners.find(s => s.gx === cp.x && s.gy === cp.y)) return true;
                    return false;
                });
                if (!allFilled) return false;
                if ((area.multiplierLevel || 0) >= 5) return false;
                let cost = getAreaUpgradeCost(area.multiplierLevel || 0);
                if (players[playerId].money < cost) return false;
                players[playerId].money -= cost;
                area.multiplierLevel = (area.multiplierLevel || 0) + 1;
                dirtyAreas = true;
                recalculateAdjacency();
                return true;
            }

            let cost = cardDef.price;
            if (players[playerId].money < cost) return false;
            // Allow stacking on existing same-type buildings, otherwise check canBuildAt
            if (!canStackAt(gx, gy, itemKey, playerId) && !canBuildAt(gx, gy, playerId)) return false;

            players[playerId].money -= cost;

            if (cardDef.target === 'wall') {
                // Tower - check if same type exists for stacking
                let existing = towers.find(t => t.gx === gx && t.gy === gy && t.type === itemKey && t.owner === playerId);
                if (existing) { existing.upgrade(); }
                else {
                    grid[gy][gx].type = TYPE_WALL;
                    grid[gy][gx].owner = playerId;
                    let t = new Tower(gx, gy, itemKey, playerId);
                    t.underConstruction = true; t.hp = 1;
                    towers.push(t);
                }
                dirtyGrid = true;
                recalculateAdjacency();
                recalculateLaserConnections();
            } else if (itemKey.startsWith('barrack_')) {
                let unitType = cardDef.unitType || 'norm';
                let existing = barracks.find(b => b.gx === gx && b.gy === gy && b.unitType === unitType && b.owner === playerId);
                if (existing) { existing.stacks++; existing.level = Math.floor(Math.log2(existing.stacks)) + 1; updateItemTextCache(existing); }
                else {
                    let b = new Barrack(gx, gy, playerId, unitType);
                    b.underConstruction = true; b.hp = 1;
                    barracks.push(b);
                    grid[gy][gx].item = b;
                    grid[gy][gx].owner = playerId;
                }
                recalculateAdjacency();
            } else if (itemKey === 'spawner') {
                let existing = collectorSpawners.find(s => s.gx === gx && s.gy === gy && s.type === 'spawner' && s.owner === playerId);
                if (existing) { existing.stacks++; updateItemTextCache(existing); }
                else {
                    let s = new CollectorSpawner(gx, gy, playerId);
                    s.underConstruction = true; s.hp = 1;
                    collectorSpawners.push(s);
                    grid[gy][gx].item = s;
                    grid[gy][gx].owner = playerId;
                }
                recalculateAdjacency();
            } else if (itemKey === 'salvager') {
                let existing = collectorSpawners.find(s => s.gx === gx && s.gy === gy && s.type === 'salvager' && s.owner === playerId);
                if (existing) { existing.stacks++; updateItemTextCache(existing); }
                else {
                    let s = new SalvagerSpawner(gx, gy, playerId);
                    s.underConstruction = true; s.hp = 1;
                    collectorSpawners.push(s);
                    grid[gy][gx].item = s;
                    grid[gy][gx].owner = playerId;
                }
                recalculateAdjacency();
            } else if (itemKey === 'builder_spawner') {
                let existing = collectorSpawners.find(s => s.gx === gx && s.gy === gy && s.type === 'builder_spawner' && s.owner === playerId);
                if (existing) { existing.stacks++; updateItemTextCache(existing); }
                else {
                    let s = new BuilderSpawner(gx, gy, playerId);
                    // builder spawner starts under construction too
                    s.underConstruction = true; s.hp = 1;
                    collectorSpawners.push(s);
                    grid[gy][gx].item = s;
                    grid[gy][gx].owner = playerId;
                }
                recalculateAdjacency();
            } else {
                // Floor item
                let cell = grid[gy][gx];
                if (cell.item && cell.item.type === itemKey && cell.owner === playerId) {
                    cell.item.stacks = (cell.item.stacks || 1) + 1;
                    let level = Math.floor(Math.log2(cell.item.stacks)) + 1;
                    let stats = calculateItemStats(itemKey, level);
                    cell.item.maxHp = stats.maxHp; cell.item.hp = stats.maxHp;
                    if (stats.damage) cell.item.damage = stats.damage;
                    updateItemTextCache(cell.item);
                } else {
                    let stats = calculateItemStats(itemKey, 1);
                    let item = { type: itemKey, stacks: 1, hp: 1, maxHp: stats.maxHp, damage: stats.damage || 0, gx, gy, x: gx * TILE + 16, y: gy * TILE + 16, underConstruction: true };
                    cell.item = item;
                    cell.owner = playerId;
                    updateItemTextCache(item);
                }
                recalculateAdjacency();
            }
            return true;
        }

        function destroyBuilding(building) {
            if (building instanceof Tower || (building.constructor && building.constructor.name === 'Tower')) {
                let idx = towers.indexOf(building);
                if (idx !== -1) towers.splice(idx, 1);
                grid[building.gy][building.gx].type = TYPE_FLOOR;
                grid[building.gy][building.gx].owner = -1;
                dirtyGrid = true;
                recalculateAdjacency();
                recalculateLaserConnections();
            } else if (building instanceof Barrack || (building.type === 'barrack')) {
                let idx = barracks.indexOf(building);
                if (idx !== -1) barracks.splice(idx, 1);
                grid[building.gy][building.gx].item = null;
                grid[building.gy][building.gx].owner = -1;
                recalculateAdjacency();
            } else if (building instanceof CollectorSpawner || building instanceof SalvagerSpawner || building instanceof BuilderSpawner) {
                let idx = collectorSpawners.indexOf(building);
                if (idx !== -1) collectorSpawners.splice(idx, 1);
                grid[building.gy][building.gx].item = null;
                grid[building.gy][building.gx].owner = -1;
            } else if (building.type) {
                // Floor item
                grid[building.gy][building.gx].item = null;
                grid[building.gy][building.gx].owner = -1;
            }
            createExplosion(building.x, building.y, '#f44', 10);
            checkWinCondition();
        }

        function checkWinCondition() {
            for (let pid = 0; pid < 2; pid++) {
                let has = false;
                for (let t of towers) { if (t.owner === pid) { has = true; break; } }
                if (!has) for (let b of barracks) { if (b.owner === pid) { has = true; break; } }
                if (!has) for (let s of collectorSpawners) { if (s.owner === pid) { has = true; break; } }
                if (!has) {
                    // Check floor items
                    for (let y = 0; y < GRID_H && !has; y++) for (let x = 0; x < GRID_W && !has; x++) {
                        if (grid[y][x].item && grid[y][x].owner === pid) has = true;
                    }
                }
                if (!has) {
                    gameOver = true;
                    winner = 1 - pid;
                    showGameOver();
                }
            }
        }

        // ============================================================
        // DRAWING HELPERS
        // ============================================================
        function drawTowerIcon(ctx, x, y, color, angle, level, type, active) {
            if (type === 'laser') {
                ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(x, y, 10, 0, 6.28); ctx.fill();
                ctx.strokeStyle = '#000'; ctx.stroke();
                ctx.fillStyle = active ? '#f00' : '#400'; ctx.beginPath(); ctx.arc(x, y, 6, 0, 6.28); ctx.fill();
                return;
            }
            if (type === 'elements') {
                ctx.save(); ctx.translate(x, y - 2); ctx.rotate(angle);
                ctx.fillStyle = "#f44"; ctx.fillRect(-6, -6, 3, 12);
                ctx.fillStyle = "#4f4"; ctx.fillRect(-3, -6, 3, 12);
                ctx.fillStyle = "#4af"; ctx.fillRect(0, -6, 3, 12);
                ctx.fillStyle = "#afe"; ctx.fillRect(3, -6, 3, 12);
                ctx.fillStyle = 'black'; ctx.fillRect(-6, 2, 12, 4);
                ctx.restore(); return;
            }
            if (type && type.startsWith('cloud')) {
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x, y - 2, 12, 0, 6.28); ctx.fill();
                ctx.fillStyle = color; ctx.beginPath();
                ctx.arc(x - 4, y + 1, 5, 0, 6.28); ctx.arc(x + 4, y + 1, 5, 0, 6.28); ctx.arc(x, y - 5, 6, 0, 6.28);
                ctx.fill(); return;
            }
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(x, y - 2, 10, 0, 6.28); ctx.fill();
            ctx.save(); ctx.translate(x, y - 2); ctx.rotate(angle);
            ctx.fillStyle = color; ctx.fillRect(-6, -6, 12, 12);
            ctx.fillStyle = 'black'; ctx.fillRect(0, -2, 12, 4);
            ctx.restore();
        }

        function drawFloorItem(ctx, cell, px, py) {
            let item = cell.item;
            if (!item) return;
            let x = px + 16, y = py + 16;
            // Owner border
            if (cell.owner >= 0) {
                ctx.strokeStyle = PLAYER_COLORS_DIM[cell.owner]; ctx.lineWidth = 1;
                ctx.strokeRect(px + 1, py + 1, TILE - 2, TILE - 2);
            }
            if (item.type === 'sand' || item.type === 'lava' || item.type === 'poison_puddle' || item.type === 'ice_patch' || item.type === 'water_puddle') {
                let colors = { sand: '#875', lava: '#d22', poison_puddle: '#2d2', ice_patch: '#afe', water_puddle: '#4af' };
                ctx.fillStyle = colors[item.type]; ctx.beginPath(); ctx.arc(x, y, 12, 0, 6.28); ctx.fill();
                let hpPct = item.maxHp > 0 ? item.hp / item.maxHp : 1;
                ctx.fillStyle = `rgba(0,0,0,${Math.max(0, 1 - hpPct)})`; ctx.beginPath(); ctx.arc(x, y, 8, 0, 6.28); ctx.fill();
            } else if (item.type === 'farm') {
                ctx.fillStyle = '#da0'; ctx.beginPath(); ctx.arc(x, y, 12, 0, 6.28); ctx.fill();
                ctx.font = "14px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#fff"; ctx.fillText("\uD83C\uDF3E", x, y);
            } else if (item.type === 'mine') {
                ctx.fillStyle = '#444'; ctx.beginPath(); ctx.arc(x, y, 8, 0, 6.28); ctx.fill();
                ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(x, y, 3, 0, 6.28); ctx.fill();
            }
            if (item.textCanvas) ctx.drawImage(item.textCanvas, x - 16, y - 24);
        }

        // Thumbnail cache for build menu and sub-group icons
        let _thumbCache = {};
        function getItemThumbnail(key, size) {
            let cacheKey = key + '_' + size;
            if (_thumbCache[cacheKey]) return _thumbCache[cacheKey];
            let dpr = window.devicePixelRatio || 1;
            let c = document.createElement('canvas');
            c.width = size * dpr; c.height = size * dpr;
            c.style.width = size + 'px'; c.style.height = size + 'px';
            let ctx = c.getContext('2d');
            ctx.scale(dpr, dpr);
            let cx = size / 2, cy = size / 2;
            let s = size / 32; // scale factor relative to 32px tile

            let def = CARD_TYPES[key];
            let us = UNIT_STATS[key]; // for unit types

            if (key === 'area_upgrader') {
                ctx.fillStyle = '#fd0'; ctx.beginPath(); ctx.arc(cx, cy, 10 * s, 0, 6.28); ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.moveTo(cx, cy - 7 * s); ctx.lineTo(cx - 5 * s, cy + 3 * s); ctx.lineTo(cx + 5 * s, cy + 3 * s); ctx.closePath(); ctx.fill();
            } else if (key === 'goldmine') {
                ctx.fillStyle = '#fd0'; ctx.fillRect(cx - 10 * s, cy - 10 * s, 20 * s, 20 * s);
                ctx.fillStyle = '#a80'; ctx.fillRect(cx - 6 * s, cy - 6 * s, 12 * s, 12 * s);
            } else if (def && def.target === 'wall' && def.isCloud) {
                // Cloud tower
                ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy - 1 * s, 12 * s, 0, 6.28); ctx.fill();
                ctx.fillStyle = def.color; ctx.beginPath();
                ctx.arc(cx - 4 * s, cy + 1 * s, 5 * s, 0, 6.28); ctx.arc(cx + 4 * s, cy + 1 * s, 5 * s, 0, 6.28); ctx.arc(cx, cy - 5 * s, 6 * s, 0, 6.28);
                ctx.fill();
            } else if (def && def.target === 'wall' && def.towerHp) {
                // Tower
                let type = key;
                if (type === 'laser') {
                    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(cx, cy, 10 * s, 0, 6.28); ctx.fill();
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
                    ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(cx, cy, 6 * s, 0, 6.28); ctx.fill();
                } else if (type === 'elements') {
                    ctx.fillStyle = "#f44"; ctx.fillRect(cx - 6 * s, cy - 6 * s, 3 * s, 12 * s);
                    ctx.fillStyle = "#4f4"; ctx.fillRect(cx - 3 * s, cy - 6 * s, 3 * s, 12 * s);
                    ctx.fillStyle = "#4af"; ctx.fillRect(cx, cy - 6 * s, 3 * s, 12 * s);
                    ctx.fillStyle = "#afe"; ctx.fillRect(cx + 3 * s, cy - 6 * s, 3 * s, 12 * s);
                    ctx.fillStyle = 'black'; ctx.fillRect(cx - 6 * s, cy + 2 * s, 12 * s, 4 * s);
                } else {
                    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy, 10 * s, 0, 6.28); ctx.fill();
                    ctx.fillStyle = def.color; ctx.fillRect(cx - 6 * s, cy - 6 * s, 12 * s, 12 * s);
                    ctx.fillStyle = 'black'; ctx.fillRect(cx, cy - 2 * s, 12 * s, 4 * s);
                }
            } else if (def && def.unitType) {
                // Barrack
                let unitColor = (UNIT_STATS[def.unitType] || {}).color || '#fff';
                ctx.fillStyle = '#664'; ctx.beginPath();
                ctx.moveTo(cx - 12 * s, cy - 6 * s); ctx.lineTo(cx + 12 * s, cy - 6 * s); ctx.lineTo(cx, cy - 14 * s);
                ctx.fill();
                ctx.fillStyle = unitColor; ctx.beginPath(); ctx.arc(cx, cy + 4 * s, 5 * s, 0, 6.28); ctx.fill();
            } else if (key === 'spawner') {
                ctx.fillStyle = '#432'; ctx.fillRect(cx - 12 * s, cy - 12 * s, 24 * s, 24 * s);
                ctx.fillStyle = '#aaa'; ctx.beginPath();
                for (let i = 0; i < 5; i++) { let a = (i * 4 * Math.PI) / 5 - Math.PI / 2; ctx.lineTo(cx + Math.cos(a) * 8 * s, cy + Math.sin(a) * 8 * s); }
                ctx.closePath(); ctx.fill();
            } else if (key === 'salvager') {
                ctx.fillStyle = '#543'; ctx.fillRect(cx - 12 * s, cy - 12 * s, 24 * s, 24 * s);
                ctx.fillStyle = '#8d8'; ctx.beginPath();
                for (let i = 0; i < 3; i++) { let a = (i * 2 * Math.PI) / 3 - Math.PI / 2; ctx.lineTo(cx + Math.cos(a) * 8 * s, cy + Math.sin(a) * 8 * s); }
                ctx.closePath(); ctx.fill();
            } else if (key === 'builder_spawner') {
                ctx.fillStyle = '#354'; ctx.fillRect(cx - 12 * s, cy - 12 * s, 24 * s, 24 * s);
                ctx.fillStyle = '#8b5'; ctx.fillRect(cx - 7 * s, cy - 5 * s, 14 * s, 10 * s);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(cx - 7 * s, cy - 5 * s, 14 * s, 10 * s);
            } else if (def && def.target === 'floor') {
                // Floor items
                let floorColors = { sand: '#875', lava: '#d22', poison_puddle: '#2d2', ice_patch: '#afe', water_puddle: '#4af' };
                if (floorColors[key]) {
                    ctx.fillStyle = floorColors[key]; ctx.beginPath(); ctx.arc(cx, cy, 12 * s, 0, 6.28); ctx.fill();
                } else if (key === 'farm') {
                    ctx.fillStyle = '#da0'; ctx.beginPath(); ctx.arc(cx, cy, 12 * s, 0, 6.28); ctx.fill();
                    ctx.font = Math.round(14 * s) + "px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillStyle = "#fff"; ctx.fillText("\uD83C\uDF3E", cx, cy);
                } else if (key === 'mine') {
                    ctx.fillStyle = '#444'; ctx.beginPath(); ctx.arc(cx, cy, 8 * s, 0, 6.28); ctx.fill();
                    ctx.fillStyle = '#f00'; ctx.beginPath(); ctx.arc(cx, cy, 3 * s, 0, 6.28); ctx.fill();
                }
            } else if (us) {
                // Unit type
                let r = (us.r || 8) * s;
                if (us.vis === 'snake') {
                    ctx.lineCap = 'round'; ctx.lineWidth = r * 2;
                    ctx.strokeStyle = us.color; ctx.beginPath();
                    ctx.moveTo(cx, cy); ctx.lineTo(cx - 6 * s, cy + 4 * s); ctx.lineTo(cx - 10 * s, cy); ctx.stroke();
                    ctx.fillStyle = us.color; ctx.beginPath(); ctx.arc(cx, cy, r + 2 * s, 0, 6.28); ctx.fill();
                    ctx.fillStyle = "black";
                    ctx.beginPath(); ctx.arc(cx - 2 * s, cy - 2 * s, 2 * s, 0, 6.28); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 2 * s, cy - 2 * s, 2 * s, 0, 6.28); ctx.fill();
                } else if (us.vis === 'triangle') {
                    let tr = r * 0.5;
                    ctx.fillStyle = us.color; ctx.beginPath();
                    ctx.moveTo(cx, cy + tr); ctx.lineTo(cx - tr, cy - tr); ctx.lineTo(cx + tr, cy - tr);
                    ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
                } else if (us.vis === 'mole') {
                    ctx.fillStyle = us.color; ctx.beginPath();
                    ctx.ellipse(cx, cy, r * 0.8, r * 1.1, 0, 0, Math.PI * 2);
                    ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
                } else {
                    ctx.fillStyle = us.color; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.28); ctx.fill();
                    ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
                }
            }

            _thumbCache[cacheKey] = c.toDataURL();
            return _thumbCache[cacheKey];
        }

        // ============================================================
        // RENDER
        // ============================================================
        // Pre-compute area color lookup (rebuilt when dirtyAreas)
        let _areaColorCache = null; // Map: areaId -> color string

        function rebuildAreaColorCache() {
            _areaColorCache = new Map();
            for (let a of areas) {
                let color;
                if (a.active) {
                    let lvl = a.multiplierLevel || 0;
                    let cs = ['rgba(0,255,0,0.6)', 'rgba(0,255,0,0.8)', 'rgba(70,170,255,0.8)', 'rgba(200,0,255,0.8)', 'rgba(255,150,0,0.8)', 'rgba(255,220,0,0.9)'];
                    color = cs[lvl] || cs[cs.length - 1];
                } else { color = 'rgba(128,128,128,0.1)'; }
                _areaColorCache.set(a.id, color);
            }
        }

        // Draw grid tiles directly to main ctx for visible area only (batched)
        function drawGridDirect(ctx, minGx, minGy, maxGx, maxGy) {
            // Draw all floor tiles first, then wall tiles, to minimize state changes
            ctx.fillStyle = C_FLOOR;
            for (let y = minGy; y <= maxGy; y++) {
                for (let x = minGx; x <= maxGx; x++) {
                    if (grid[y][x].type !== TYPE_WALL && (fullVisibility || (visibilityGrid[y] && visibilityGrid[y][x] > 0))) ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
                }
            }
            // Wall shadow
            ctx.fillStyle = '#222';
            for (let y = minGy; y <= maxGy; y++) {
                for (let x = minGx; x <= maxGx; x++) {
                    if (grid[y][x].type === TYPE_WALL && (fullVisibility || (visibilityGrid[y] && visibilityGrid[y][x] > 0))) ctx.fillRect(x * TILE, y * TILE + 4, TILE, TILE - 4);
                }
            }
            // Wall face
            ctx.fillStyle = C_WALL;
            for (let y = minGy; y <= maxGy; y++) {
                for (let x = minGx; x <= maxGx; x++) {
                    if (grid[y][x].type === TYPE_WALL && (fullVisibility || (visibilityGrid[y] && visibilityGrid[y][x] > 0))) ctx.fillRect(x * TILE, y * TILE, TILE, TILE - 4);
                }
            }
            // Wall border (batched)
            ctx.strokeStyle = '#444'; ctx.lineWidth = 1;
            ctx.beginPath();
            for (let y = minGy; y <= maxGy; y++) {
                for (let x = minGx; x <= maxGx; x++) {
                    if (grid[y][x].type === TYPE_WALL && (fullVisibility || (visibilityGrid[y] && visibilityGrid[y][x] > 0))) {
                        let px = x * TILE, py = y * TILE;
                        ctx.rect(px, py, TILE, TILE - 4);
                    }
                }
            }
            ctx.stroke();
        }

        // Draw area outlines directly to main ctx for visible area only (batched by color)
        function drawAreaOutlinesDirect(ctx, minGx, minGy, maxGx, maxGy) {
            if (dirtyAreas) { rebuildAreaColorCache(); dirtyAreas = false; }
            if (!_areaColorCache) return;
            // Batch edges by color to minimize state changes
            let batches = new Map();
            for (let y = minGy; y <= maxGy; y++) {
                for (let x = minGx; x <= maxGx; x++) {
                    if (!fullVisibility && (!visibilityGrid[y] || visibilityGrid[y][x] === 0)) continue;
                    let aid = grid[y][x].areaId; if (aid === -1) continue;
                    let color = _areaColorCache.get(aid);
                    if (!color) continue;
                    let px = x * TILE, py = y * TILE;
                    if (!batches.has(color)) batches.set(color, []);
                    let edges = batches.get(color);
                    if (x === GRID_W - 1 || grid[y][x + 1].areaId !== aid) edges.push(px + TILE - 1, py, px + TILE - 1, py + TILE);
                    if (x === 0 || grid[y][x - 1].areaId !== aid) edges.push(px + 1, py, px + 1, py + TILE);
                    if (y === GRID_H - 1 || grid[y + 1][x].areaId !== aid) edges.push(px, py + TILE - 1, px + TILE, py + TILE - 1);
                    if (y === 0 || grid[y - 1][x].areaId !== aid) edges.push(px, py + 1, px + TILE, py + 1);
                }
            }
            ctx.lineWidth = 2;
            for (let [color, edges] of batches) {
                ctx.strokeStyle = color;
                ctx.beginPath();
                for (let i = 0; i < edges.length; i += 4) {
                    ctx.moveTo(edges[i], edges[i + 1]);
                    ctx.lineTo(edges[i + 2], edges[i + 3]);
                }
                ctx.stroke();
            }
        }

        function draw() {
            let vw = viewW / camera.zoom, vh = viewH / camera.zoom;
            let minGx = Math.max(0, Math.floor(camera.x / TILE) - 1);
            let minGy = Math.max(0, Math.floor(camera.y / TILE) - 1);
            let maxGx = Math.min(GRID_W - 1, Math.ceil((camera.x + vw) / TILE) + 1);
            let maxGy = Math.min(GRID_H - 1, Math.ceil((camera.y + vh) / TILE) + 1);

            ctx.save();
            let dpr = window.devicePixelRatio || 1;
            // Clear entire canvas to black (fixes artifacts outside grid)
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, viewW, viewH);
            ctx.setTransform(camera.zoom * dpr, 0, 0, camera.zoom * dpr, -camera.x * camera.zoom * dpr, -camera.y * camera.zoom * dpr);

            // Background tiles (direct draw, viewport only)
            drawGridDirect(ctx, minGx, minGy, maxGx, maxGy);

            // Area outlines (direct draw, viewport only)
            drawAreaOutlinesDirect(ctx, minGx, minGy, maxGx, maxGy);

            // Gold mines
            for (let m of goldMines) {
                if (m.gx < minGx || m.gx > maxGx || m.gy < minGy || m.gy > maxGy) continue;
                if (!fullVisibility && (!visibilityGrid[m.gy] || visibilityGrid[m.gy][m.gx] === 0)) continue;
                let alpha = m.gold > 0 ? 1 : 0.3;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#fd0'; ctx.fillRect(m.gx * TILE + 4, m.gy * TILE + 4, TILE - 8, TILE - 8);
                ctx.fillStyle = '#a80'; ctx.fillRect(m.gx * TILE + 8, m.gy * TILE + 8, TILE - 16, TILE - 16);
                ctx.font = "9px Arial"; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
                ctx.fillText(formatBigNumber(m.gold), m.x, m.y + 4);
                ctx.globalAlpha = 1;
            }

            // Floor items
            for (let y = minGy; y <= maxGy; y++) {
                for (let x = minGx; x <= maxGx; x++) {
                    if (grid[y][x].item && (fullVisibility || (visibilityGrid[y] && visibilityGrid[y][x] > 0))) drawFloorItem(ctx, grid[y][x], x * TILE, y * TILE);
                }
            }

            // Dropped money
            for (let d of droppedItems) {
                if (d.gx < minGx || d.gx > maxGx || d.gy < minGy || d.gy > maxGy) continue;
                if (!fullVisibility && (!visibilityGrid[d.gy] || visibilityGrid[d.gy][d.gx] === 0)) continue;
                ctx.fillStyle = '#fd0'; ctx.font = "900 20px Arial"; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('$', d.x, d.y);
            }

            // Towers
            for (let t of towers) {
                if (t.gx < minGx - 2 || t.gx > maxGx + 2 || t.gy < minGy - 2 || t.gy > maxGy + 2) continue;
                if (!fullVisibility && (!visibilityGrid[t.gy] || visibilityGrid[t.gy][t.gx] === 0)) continue;
                t.draw(ctx);
            }

            // Collector/Salvager spawners
            collectorSpawners.forEach(s => { 
                if (s.gx >= minGx && s.gx <= maxGx && s.gy >= minGy && s.gy <= maxGy) {
                    if (fullVisibility || (visibilityGrid[s.gy] && visibilityGrid[s.gy][s.gx] > 0)) s.draw(ctx);
                } 
            });

            // Barracks
            barracks.forEach(b => { 
                if (b.gx >= minGx && b.gx <= maxGx && b.gy >= minGy && b.gy <= maxGy) {
                    if (fullVisibility || (visibilityGrid[b.gy] && visibilityGrid[b.gy][b.gx] > 0)) b.draw(ctx);
                } 
            });

            // Units (interpolated positions for smooth rendering)
            let alpha = tickAlpha;
            for (let u of units) {
                if (u.dead) continue;
                let rx = u.x, ry = u.y;
                u.x = u.prevX + (u.x - u.prevX) * alpha;
                u.y = u.prevY + (u.y - u.prevY) * alpha;
                let ugx = Math.floor(u.x / TILE), ugy = Math.floor(u.y / TILE);
                if (ugx < minGx - 2 || ugx > maxGx + 2 || ugy < minGy - 2 || ugy > maxGy + 2) { u.x = rx; u.y = ry; continue; }
                if (fullVisibility || (visibilityGrid[ugy] && visibilityGrid[ugy][ugx] > 0)) u.draw(ctx);
                u.x = rx; u.y = ry;
            }

            // Projectiles (interpolated)
            for (let p of projectiles) {
                let rx = p.x, ry = p.y;
                p.x = p.prevX + (p.x - p.prevX) * alpha;
                p.y = p.prevY + (p.y - p.prevY) * alpha;
                let cgy = Math.floor(p.y/TILE), cgx = Math.floor(p.x/TILE);
                if (fullVisibility || (visibilityGrid[cgy] && visibilityGrid[cgy][cgx] > 0)) p.draw(ctx);
                p.x = rx; p.y = ry;
            }
            for (let p of particles) {
                let rx = p.x, ry = p.y;
                p.x = p.prevX + (p.x - p.prevX) * alpha;
                p.y = p.prevY + (p.y - p.prevY) * alpha;
                let cgy = Math.floor(p.y/TILE), cgx = Math.floor(p.x/TILE);
                if (fullVisibility || (visibilityGrid[cgy] && visibilityGrid[cgy][cgx] > 0)) p.draw(ctx);
                p.x = rx; p.y = ry;
            }

            // Salvage marks (red X on marked buildings)
            ctx.strokeStyle = '#f44'; ctx.lineWidth = 2;
            for (let t of towers) { if (t.markedForSalvage) { let px = t.gx * TILE, py = t.gy * TILE; ctx.beginPath(); ctx.moveTo(px + 4, py + 4); ctx.lineTo(px + TILE - 4, py + TILE - 4); ctx.moveTo(px + TILE - 4, py + 4); ctx.lineTo(px + 4, py + TILE - 4); ctx.stroke(); } }
            for (let b of barracks) { if (b.markedForSalvage) { let px = b.gx * TILE, py = b.gy * TILE; ctx.beginPath(); ctx.moveTo(px + 4, py + 4); ctx.lineTo(px + TILE - 4, py + TILE - 4); ctx.moveTo(px + TILE - 4, py + 4); ctx.lineTo(px + 4, py + TILE - 4); ctx.stroke(); } }
            for (let s of collectorSpawners) { if (s.markedForSalvage) { let px = s.gx * TILE, py = s.gy * TILE; ctx.beginPath(); ctx.moveTo(px + 4, py + 4); ctx.lineTo(px + TILE - 4, py + TILE - 4); ctx.moveTo(px + TILE - 4, py + 4); ctx.lineTo(px + 4, py + TILE - 4); ctx.stroke(); } }
            for (let y = minGy; y <= maxGy; y++) for (let x = minGx; x <= maxGx; x++) { let c = grid[y][x]; if (c.item && c.item.markedForSalvage) { let px = x * TILE, py = y * TILE; ctx.beginPath(); ctx.moveTo(px + 4, py + 4); ctx.lineTo(px + TILE - 4, py + TILE - 4); ctx.moveTo(px + TILE - 4, py + 4); ctx.lineTo(px + 4, py + TILE - 4); ctx.stroke(); } }

            // Selection box
            if (isBoxSelecting && selectionBox) {
                ctx.strokeStyle = 'rgba(0,255,0,0.8)'; ctx.lineWidth = 1;
                ctx.fillStyle = 'rgba(0,255,0,0.1)';
                let sx = selectionBox.sx, sy = selectionBox.sy, w = selectionBox.ex - sx, h = selectionBox.ey - sy;
                ctx.fillRect(sx, sy, w, h); ctx.strokeRect(sx, sy, w, h);
            }

            // Selected entities highlight
            for (let ent of selectedEntities) {
                if (ent.hp !== undefined && ent.hp <= 0) continue;
                let ex = ent.x || (ent.gx * TILE + 16);
                let ey = ent.y || (ent.gy * TILE + 16);
                ctx.strokeStyle = '#0f0'; ctx.lineWidth = 2;
                ctx.strokeRect(ex - 18, ey - 18, 36, 36);
                // Rally point for barracks and spawners
                if (['barrack', 'spawner', 'salvager', 'builder_spawner'].includes(ent.type) && ent.rallyX !== null) {
                    let rx = ent.rallyX, ry = ent.rallyY;
                    ctx.setLineDash([6, 4]);
                    ctx.strokeStyle = '#4f4'; ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(rx, ry); ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.fillStyle = '#4f4';
                    ctx.beginPath(); ctx.moveTo(rx, ry - 12); ctx.lineTo(rx + 8, ry - 8); ctx.lineTo(rx, ry - 4); ctx.fill();
                    ctx.strokeStyle = '#4f4'; ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx, ry - 12); ctx.stroke();
                }
            }

            // Unit waypoints (move/attack-move destinations for selected units)
            for (let u of selectedUnits) {
                if (u.dead) continue;
                let ux = u.prevX + (u.x - u.prevX) * alpha, uy = u.prevY + (u.y - u.prevY) * alpha;
                if (u.path && u.path.length > 0 && u.commandState >= CMD_MOVING && u.commandState <= CMD_ATTACK_MOVING) {
                    let lastPt = u.path[u.path.length - 1];
                    let destX = lastPt.x * TILE + 16, destY = lastPt.y * TILE + 16;
                    ctx.setLineDash([4, 3]);
                    ctx.strokeStyle = u.commandState === CMD_ATTACK_MOVING ? 'rgba(255,100,100,0.5)' : 'rgba(100,255,100,0.5)';
                    ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.moveTo(ux, uy); ctx.lineTo(destX, destY); ctx.stroke();
                    ctx.setLineDash([]);
                    // Waypoint marker
                    ctx.strokeStyle = u.commandState === CMD_ATTACK_MOVING ? '#f66' : '#4f4';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.arc(destX, destY, 6, 0, 6.28); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(destX - 4, destY); ctx.lineTo(destX + 4, destY); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(destX, destY - 4); ctx.lineTo(destX, destY + 4); ctx.stroke();
                }
                // Attack target indicator
                if (u.targetUnit && !u.targetUnit.dead && u.commandState === CMD_ATTACKING) {
                    let tx = u.targetUnit.prevX + (u.targetUnit.x - u.targetUnit.prevX) * alpha;
                    let ty = u.targetUnit.prevY + (u.targetUnit.y - u.targetUnit.prevY) * alpha;
                    ctx.strokeStyle = 'rgba(255,0,0,0.6)'; ctx.lineWidth = 1;
                    ctx.setLineDash([3, 3]);
                    ctx.beginPath(); ctx.moveTo(ux, uy); ctx.lineTo(tx, ty); ctx.stroke();
                    ctx.setLineDash([]);
                }
                if (u.targetBuilding && u.targetBuilding.hp > 0 && u.commandState === CMD_ATTACKING) {
                    ctx.strokeStyle = 'rgba(255,0,0,0.6)'; ctx.lineWidth = 1;
                    ctx.setLineDash([3, 3]);
                    ctx.beginPath(); ctx.moveTo(ux, uy); ctx.lineTo(u.targetBuilding.x, u.targetBuilding.y); ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            // Build preview ghost
            if (selectedBuildItem) {
                let gx = Math.floor(mouseWorldX / TILE), gy = Math.floor(mouseWorldY / TILE);
                if (gx >= 0 && gx < GRID_W && gy >= 0 && gy < GRID_H) {
                    let canBuild;
                    if (selectedBuildItem === 'area_upgrader') {
                        let aId = grid[gy][gx].areaId;
                        let area = aId !== -1 ? areas.find(a => a.id === aId) : null;
                        // Highlight entire hovered area to show boundaries and fill status
                        if (area) {
                            let filledCount = 0;
                            for (let cp of area.cells) {
                                let c = grid[cp.y][cp.x];
                                let occupied = false;
                                if (c.type === TYPE_WALL && towers.find(t => t.gx === cp.x && t.gy === cp.y)) occupied = true;
                                else if (c.item) occupied = true;
                                else if (barracks.find(b => b.gx === cp.x && b.gy === cp.y)) occupied = true;
                                else if (collectorSpawners.find(s => s.gx === cp.x && s.gy === cp.y)) occupied = true;
                                ctx.fillStyle = occupied ? 'rgba(0,255,0,0.2)' : 'rgba(255,100,0,0.2)';
                                ctx.fillRect(cp.x * TILE + 3, cp.y * TILE + 3, TILE - 6, TILE - 6);
                                if (occupied) filledCount++;
                            }
                            canBuild = filledCount === area.cells.length && (area.multiplierLevel || 0) < 5;
                            let upgCost = getAreaUpgradeCost(area.multiplierLevel || 0);
                            if (canBuild && players[localPlayerId].money < upgCost) canBuild = false;
                            // Draw area boundary thick (outside building borders)
                            ctx.strokeStyle = canBuild ? 'rgba(0,255,0,0.9)' : 'rgba(255,200,0,0.9)';
                            ctx.lineWidth = 3;
                            for (let cp of area.cells) {
                                let px = cp.x * TILE, py = cp.y * TILE;
                                if (cp.x === GRID_W - 1 || grid[cp.y][cp.x + 1].areaId !== aId) { ctx.beginPath(); ctx.moveTo(px + TILE, py); ctx.lineTo(px + TILE, py + TILE); ctx.stroke(); }
                                if (cp.x === 0 || grid[cp.y][cp.x - 1].areaId !== aId) { ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py + TILE); ctx.stroke(); }
                                if (cp.y === GRID_H - 1 || grid[cp.y + 1][cp.x].areaId !== aId) { ctx.beginPath(); ctx.moveTo(px, py + TILE); ctx.lineTo(px + TILE, py + TILE); ctx.stroke(); }
                                if (cp.y === 0 || grid[cp.y - 1][cp.x].areaId !== aId) { ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + TILE, py); ctx.stroke(); }
                            }
                            // Draw fill count and upgrade info
                            let cx = area.cells.reduce((s, c) => s + c.x, 0) / area.cells.length * TILE + TILE / 2;
                            let cy = area.cells.reduce((s, c) => s + c.y, 0) / area.cells.length * TILE + TILE / 2;
                            ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                            ctx.fillStyle = canBuild ? '#4f4' : '#fd0';
                            ctx.fillText(`${filledCount}/${area.cells.length}`, cx, cy);
                            if (filledCount === area.cells.length) {
                                ctx.font = '10px monospace';
                                ctx.fillStyle = canBuild ? '#4f4' : '#fd0';
                                ctx.fillText(`M${area.multiplierLevel || 0}\u2192${(area.multiplierLevel || 0) + 1}`, cx, cy + 14);
                                ctx.fillStyle = canBuild ? '#4f4' : '#f88';
                                ctx.fillText(`${upgCost}g`, cx, cy + 26);
                            }
                        } else { canBuild = false; }
                    } else {
                        canBuild = canBuildAt(gx, gy, localPlayerId) || canStackAt(gx, gy, selectedBuildItem, localPlayerId);
                    }
                    ctx.fillStyle = canBuild ? 'rgba(0,255,0,0.3)' : 'rgba(255,0,0,0.3)';
                    ctx.fillRect(gx * TILE, gy * TILE, TILE, TILE);
                }
            }

            ctx.restore();

            // Minimap
            drawMinimap();
        }

        function drawMinimap() {
            minimapCtx.fillStyle = '#111';
            minimapCtx.fillRect(0, 0, MINIMAP_SIZE, MINIMAP_SIZE);
            let scale = MINIMAP_SIZE / GRID_W; // 2 px per tile

            // Unknown areas
            if (!fullVisibility && visibilityGrid.length > 0) {
                minimapCtx.fillStyle = '#000';
                for (let y = 0; y < GRID_H; y++) {
                    for (let x = 0; x < GRID_W; x++) {
                        if (!visibilityGrid[y] || visibilityGrid[y][x] === 0) {
                            minimapCtx.fillRect(x * scale, y * scale, Math.max(1, scale), Math.max(1, scale));
                        }
                    }
                }
            }

            // Walls/buildings
            for (let t of towers) {
                if (!fullVisibility && (!visibilityGrid[t.gy] || visibilityGrid[t.gy][t.gx] === 0)) continue;
                minimapCtx.fillStyle = PLAYER_COLORS[t.owner];
                minimapCtx.fillRect(t.gx * scale, t.gy * scale, Math.max(1, scale), Math.max(1, scale));
            }
            for (let b of barracks) {
                if (!fullVisibility && (!visibilityGrid[b.gy] || visibilityGrid[b.gy][b.gx] === 0)) continue;
                minimapCtx.fillStyle = PLAYER_COLORS[b.owner];
                minimapCtx.fillRect(b.gx * scale, b.gy * scale, Math.max(1, scale), Math.max(1, scale));
            }

            // Gold mines
            for (let m of goldMines) {
                if (m.gold <= 0) continue;
                if (!fullVisibility && (!visibilityGrid[m.gy] || visibilityGrid[m.gy][m.gx] === 0)) continue;
                minimapCtx.fillStyle = '#fd0';
                minimapCtx.fillRect(m.gx * scale, m.gy * scale, Math.max(1, scale), Math.max(1, scale));
            }

            // Units
            for (let u of units) {
                if (u.dead) continue;
                let cgy = Math.floor(u.y/TILE), cgx = Math.floor(u.x/TILE);
                if (!fullVisibility && (!visibilityGrid[cgy] || visibilityGrid[cgy][cgx] === 0)) continue;
                minimapCtx.fillStyle = PLAYER_COLORS[u.owner];
                let ux = (u.x / TILE) * scale, uy = (u.y / TILE) * scale;
                minimapCtx.fillRect(ux, uy, 2, 2);
            }

            // Camera viewport rect
            let vw = viewW / camera.zoom, vh = viewH / camera.zoom;
            minimapCtx.strokeStyle = '#fff'; minimapCtx.lineWidth = 1;
            minimapCtx.strokeRect(camera.x / TILE * scale, camera.y / TILE * scale, vw / TILE * scale, vh / TILE * scale);
        }

        // ============================================================
        // CHECKSUM (desync detection)
        // ============================================================
        function computeChecksum() {
            let h = 0;
            // Hash unit positions, HP, and states
            for (let u of units) {
                h = (h * 31 + Math.round(u.x * 100)) | 0;
                h = (h * 31 + Math.round(u.y * 100)) | 0;
                h = (h * 31 + Math.round(u.hp * 100)) | 0;
                h = (h * 31 + u.commandState) | 0;
            }
            // Hash player money and pop
            for (let p of players) {
                h = (h * 31 + Math.round(p.money * 100)) | 0;
                h = (h * 31 + p.popCount) | 0;
            }
            // Hash tower/barrack HP
            for (let t of towers) h = (h * 31 + Math.round(t.hp * 100)) | 0;
            for (let b of barracks) h = (h * 31 + Math.round(b.hp * 100)) | 0;
            // Hash gold mines
            for (let m of goldMines) h = (h * 31 + Math.round(m.gold * 100)) | 0;
            return h;
        }

        let lastDesyncWarning = 0;

        function updateVisibility(playerId) {
            // Check fullVisibility toggle
            if (fullVisibility) return;

            // Allocate or reset grid
            if (visibilityGrid.length !== GRID_H || visibilityGrid[0].length !== GRID_W) {
                visibilityGrid = new Array(GRID_H);
                for (let y = 0; y < GRID_H; y++) visibilityGrid[y] = new Float32Array(GRID_W);
            } else {
                for (let y = 0; y < GRID_H; y++) visibilityGrid[y].fill(0);
            }

            let setVis = (gx, gy, r) => {
                if (gx >= 0 && gx < GRID_W && gy >= 0 && gy < GRID_H) {
                    if (r > visibilityGrid[gy][gx]) visibilityGrid[gy][gx] = r;
                }
            };

            for (let u of units) if (u.owner === playerId && !u.dead) {
                setVis(Math.floor(u.x/TILE), Math.floor(u.y/TILE), u.visionRange || 4);
            }
            for (let t of towers) if (t.owner === playerId && t.hp > 0) {
                setVis(t.gx, t.gy, t.currentStats.visionRange || 3);
            }
            for (let b of barracks) if (b.owner === playerId && b.hp > 0) setVis(b.gx, b.gy, 4);
            for (let s of collectorSpawners) if (s.owner === playerId && s.hp > 0) setVis(s.gx, s.gy, 4);
            for (let y = 0; y < GRID_H; y++) {
                for (let x = 0; x < GRID_W; x++) {
                    let cell = grid[y][x];
                    if (cell.item && cell.owner === playerId && cell.item.hp > 0) setVis(x, y, 3);
                }
            }

            // 2-pass DP flood fill (Euclidean approximation)
            for (let y = 0; y < GRID_H; y++) {
                for (let x = 0; x < GRID_W; x++) {
                    let v = visibilityGrid[y][x];
                    if (x > 0) v = Math.max(v, visibilityGrid[y][x-1] - 1);
                    if (y > 0) v = Math.max(v, visibilityGrid[y-1][x] - 1);
                    if (x > 0 && y > 0) v = Math.max(v, visibilityGrid[y-1][x-1] - 1.414);
                    if (x < GRID_W - 1 && y > 0) v = Math.max(v, visibilityGrid[y-1][x+1] - 1.414);
                    visibilityGrid[y][x] = v;
                }
            }
            for (let y = GRID_H - 1; y >= 0; y--) {
                for (let x = GRID_W - 1; x >= 0; x--) {
                    let v = visibilityGrid[y][x];
                    if (x < GRID_W - 1) v = Math.max(v, visibilityGrid[y][x+1] - 1);
                    if (y < GRID_H - 1) v = Math.max(v, visibilityGrid[y+1][x] - 1);
                    if (x < GRID_W - 1 && y < GRID_H - 1) v = Math.max(v, visibilityGrid[y+1][x+1] - 1.414);
                    if (x > 0 && y < GRID_H - 1) v = Math.max(v, visibilityGrid[y+1][x-1] - 1.414);
                    visibilityGrid[y][x] = v;
                }
            }
        }

        // ============================================================
        // GAME TICK
        // ============================================================
        function gameTick() {
            if (gameOver) return;
            gameTime++;
            pathfindBudget = 0;

            // Save previous positions for interpolation
            for (let u of units) { u.prevX = u.x; u.prevY = u.y; }
            for (let p of projectiles) { p.prevX = p.x; p.prevY = p.y; }

            // Resolve deferred pathfinding from previous ticks
            for (let u of units) {
                if (u.dead || !u._pendingPathTarget) continue;
                if (pathfindBudget >= MAX_PATHS_PER_TICK) break;
                let pt = u._pendingPathTarget;
                let ugx = Math.floor(u.x / TILE), ugy = Math.floor(u.y / TILE);
                u.path = findPathAStar(ugx, ugy, pt.gx, pt.gy, u.isFlying);
                u.pathIndex = (u.path && u.path.length > 1 && u.path[0].x === ugx && u.path[0].y === ugy) ? 1 : 0;
                u.commandState = pt.cmd;
                u._pendingPathTarget = null;
                pathfindBudget++;
            }

            // Towers
            for (let t of towers) t.update();

            // Destroy dead towers
            for (let i = towers.length - 1; i >= 0; i--) {
                if (towers[i].hp <= 0) destroyBuilding(towers[i]);
            }

            // Projectiles
            for (let i = projectiles.length - 1; i >= 0; i--) { if (!projectiles[i].update()) projectiles.splice(i, 1); }

            // Units
            for (let i = units.length - 1; i >= 0; i--) {
                let u = units[i];
                u.update();
                if (u.dead) {
                    // Drop money on death (bounty)
                    let cost = UNIT_STATS[u.unitType] ? UNIT_STATS[u.unitType].hp * 0.5 : 5;
                    let bounty = Math.floor(cost * 0.1);
                    if (bounty > 0) {
                        let gx = Math.floor(u.x / TILE), gy = Math.floor(u.y / TILE);
                        if (gx >= 0 && gx < GRID_W && gy >= 0 && gy < GRID_H && !grid[gy][gx].droppedItem) {
                            let drop = { type: 'money', value: bounty, gx, gy, x: gx * TILE + 16, y: gy * TILE + 16, timer: TICK_RATE * 120 };
                            grid[gy][gx].droppedItem = drop;
                            droppedItems.push(drop);
                        }
                    }
                    // Farm bonus
                    let fgx = Math.floor(u.x / TILE), fgy = Math.floor(u.y / TILE);
                    if (fgx >= 0 && fgx < GRID_W && fgy >= 0 && fgy < GRID_H) {
                        let cell = grid[fgy][fgx];
                        if (cell.item && cell.item.type === 'farm' && cell.owner !== u.owner) {
                            let stacks = cell.item.stacks || 1;
                            let level = Math.floor(Math.log2(stacks)) + 1;
                            players[cell.owner].money += Math.floor(10 * Math.pow(1.5, level - 1));
                        }
                    }
                    // Release worker lock on target
                    if (u.workerTarget && u.workerTarget.lockedBy === u) {
                        u.workerTarget.lockedBy = null;
                    }
                    removeUnitSpatial(u);
                    players[u.owner].popCount--;
                    selectedUnits = selectedUnits.filter(su => su !== u);
                    units.splice(i, 1);
                }
            }

            // Barracks
            for (let i = barracks.length - 1; i >= 0; i--) {
                let b = barracks[i];
                if (b.hp <= 0) { destroyBuilding(b); continue; }
                b.update();
            }

            // Collector/Salvager spawners (barrack-like)
            for (let i = collectorSpawners.length - 1; i >= 0; i--) {
                let cs = collectorSpawners[i];
                if (cs.hp <= 0) { destroyBuilding(cs); continue; }
                cs.update();
            }

            // Dropped items decay
            for (let i = droppedItems.length - 1; i >= 0; i--) {
                droppedItems[i].timer--;
                if (droppedItems[i].timer <= 0) {
                    let d = droppedItems[i];
                    if (grid[d.gy][d.gx].droppedItem === d) grid[d.gy][d.gx].droppedItem = null;
                    droppedItems.splice(i, 1);
                }
            }

            // Particles
            for (let i = particles.length - 1; i >= 0; i--) { if (!particles[i].update()) particles.splice(i, 1); }

            updateVisibility(localPlayerId);
        }

        // ============================================================
        // INPUT HANDLING
        // ============================================================
        function screenToWorld(sx, sy) {
            let gameArea = document.getElementById('game-area');
            let rect = gameArea.getBoundingClientRect();
            let x = (sx - rect.left) / camera.zoom + camera.x;
            let y = (sy - rect.top) / camera.zoom + camera.y;
            return { x, y };
        }

        function initInput() {
            let gameArea = document.getElementById('game-area');

            gameArea.addEventListener('mousedown', (e) => {
                if (!gameStarted || gameOver) return;
                let world = screenToWorld(e.clientX, e.clientY);

                if (e.button === 0) { // Left click
                    if (selectedBuildItem) {
                        // Place building
                        let gx = Math.floor(world.x / TILE), gy = Math.floor(world.y / TILE);
                        queueAction({ action: 'place', gx, gy, itemType: selectedBuildItem });
                        updateBuildMenu();
                        return;
                    }
                    // Start box selection
                    isBoxSelecting = true;
                    selectionBox = { sx: world.x, sy: world.y, ex: world.x, ey: world.y };
                } else if (e.button === 2) { // Right click
                    e.preventDefault();
                    if (selectedBuildItem) { selectedBuildItem = null; updateBuildMenu(); return; }
                    // Set rally for active selected barracks and spawners
                    let selSpawners = getActiveEntities().filter(e => ['barrack', 'spawner', 'salvager', 'builder_spawner'].includes(e.type) && e.owner === localPlayerId);
                    if (selSpawners.length > 0) {
                        for (let b of selSpawners) {
                            queueAction({ action: 'setRally', gx: b.gx, gy: b.gy, targetX: world.x, targetY: world.y });
                            b.rallyX = world.x; b.rallyY = world.y;
                        }
                        // If no units selected, just update and return
                        if (getActiveUnits().length === 0) { updateInfoPanel(); return; }
                    }
                    // Right-click own barrack to queue unit (only if no workers or combat units selected)
                    if (selSpawners.length === 0) {
                        for (let b of barracks) {
                            if (b.owner === localPlayerId && b.hp > 0 && !b.underConstruction && Math.hypot(b.x - world.x, b.y - world.y) < 20) {
                                queueAction({ action: 'queueUnit', gx: b.gx, gy: b.gy });
                                return;
                            }
                        }
                    }
                    let activeUnits = getActiveUnits();
                    if (activeUnits.length > 0) {
                        let gx = Math.floor(world.x / TILE), gy = Math.floor(world.y / TILE);

                        // --- Worker targeting logic ---
                        let builderUnits = activeUnits.filter(u => u.workerType === 'builder');
                        let collectorUnits = activeUnits.filter(u => u.workerType === 'collector');
                        let workerIds = [...builderUnits, ...collectorUnits].map(u => u.id);

                        if (builderUnits.length > 0) {
                            // Check if right-clicking a building under construction (own)
                            let buildTarget = null;
                            // Check towers
                            for (let t of towers) {
                                if (t.owner === localPlayerId && t.underConstruction && Math.hypot(t.x - world.x, t.y - world.y) < 22) {
                                    buildTarget = t; break;
                                }
                            }
                            // Check barracks
                            if (!buildTarget) for (let b of barracks) {
                                if (b.owner === localPlayerId && b.underConstruction && Math.hypot(b.x - world.x, b.y - world.y) < 22) {
                                    buildTarget = b; break;
                                }
                            }
                            // Check spawners
                            if (!buildTarget) for (let s of collectorSpawners) {
                                if (s.owner === localPlayerId && s.underConstruction && Math.hypot(s.x - world.x, s.y - world.y) < 22) {
                                    buildTarget = s; break;
                                }
                            }
                            // Check floor items
                            if (!buildTarget && gx >= 0 && gx < GRID_W && gy >= 0 && gy < GRID_H) {
                                let cell = grid[gy][gx];
                                if (cell.item && cell.item.underConstruction && cell.owner === localPlayerId) buildTarget = cell.item;
                            }
                            if (buildTarget) {
                                queueAction({ action: 'workerAssign', unitIds: builderUnits.map(u => u.id), targetType: 'build', targetGx: buildTarget.gx, targetGy: buildTarget.gy });
                                updateInfoPanel();
                                // If no non-worker units, return
                                let nonWorkers = activeUnits.filter(u => !u.workerType);
                                if (nonWorkers.length === 0) return;
                            }
                        }

                        if (collectorUnits.length > 0) {
                            // Check if right-clicking a gold mine
                            let mine = null;
                            for (let m of goldMines) {
                                if (m.gold > 0 && Math.hypot(m.x - world.x, m.y - world.y) < 22) { mine = m; break; }
                            }
                            if (mine) {
                                queueAction({ action: 'workerAssign', unitIds: collectorUnits.map(u => u.id), targetType: 'mine', targetGx: mine.gx, targetGy: mine.gy });
                                updateInfoPanel();
                                let nonWorkers = activeUnits.filter(u => !u.workerType);
                                if (nonWorkers.length === 0) return;
                            }
                        }

                        // --- Normal combat unit targeting ---
                        let combatUnits = activeUnits.filter(u => !u.workerType);
                        if (combatUnits.length > 0) {
                            let targetUnit = null, targetBuilding = null;
                            for (let u of units) {
                                if (u.owner === localPlayerId || u.dead) continue;
                                if (Math.hypot(u.x - world.x, u.y - world.y) < u.r + 8) { targetUnit = u; break; }
                            }
                            if (!targetUnit) {
                                for (let t of towers) { if (t.owner !== localPlayerId && t.hp > 0 && Math.hypot(t.x - world.x, t.y - world.y) < 20) { targetBuilding = t; break; } }
                                if (!targetBuilding) for (let b of barracks) { if (b.owner !== localPlayerId && b.hp > 0 && Math.hypot(b.x - world.x, b.y - world.y) < 20) { targetBuilding = b; break; } }
                                if (!targetBuilding) for (let s of collectorSpawners) { if (s.owner !== localPlayerId && s.hp > 0 && Math.hypot(s.x - world.x, s.y - world.y) < 20) { targetBuilding = s; break; } }
                                if (!targetBuilding && gx >= 0 && gx < GRID_W && gy >= 0 && gy < GRID_H) {
                                    let cell = grid[gy][gx];
                                    if (cell.item && cell.owner !== localPlayerId && cell.item.hp > 0) targetBuilding = cell.item;
                                }
                            }
                            let unitIds = combatUnits.map(u => u.id);
                            if (targetUnit) {
                                queueAction({ action: 'attack', unitIds, targetId: targetUnit.id });
                            } else if (targetBuilding) {
                                queueAction({ action: 'attackBuilding', unitIds, targetGx: targetBuilding.gx, targetGy: targetBuilding.gy });
                            } else if (attackMoveMode) {
                                queueAction({ action: 'attackMove', unitIds, targetX: world.x, targetY: world.y });
                                attackMoveMode = false;
                            } else {
                                // Workers also move to the position if no special target found
                                let allIds = activeUnits.map(u => u.id);
                                queueAction({ action: 'move', unitIds: allIds, targetX: world.x, targetY: world.y });
                            }
                        } else if (workerIds.length > 0) {
                            // Only workers selected and no special target — move them
                            queueAction({ action: 'move', unitIds: workerIds, targetX: world.x, targetY: world.y });
                        }
                    }
                    updateInfoPanel();
                }
            });

            gameArea.addEventListener('mousemove', (e) => {
                let world = screenToWorld(e.clientX, e.clientY);
                mouseWorldX = world.x; mouseWorldY = world.y;
                mouseScreenX = e.clientX; mouseScreenY = e.clientY;
                if (isBoxSelecting && selectionBox) {
                    selectionBox.ex = world.x; selectionBox.ey = world.y;
                }
            });

            gameArea.addEventListener('mouseup', (e) => {
                if (e.button === 0 && isBoxSelecting) {
                    isBoxSelecting = false;
                    if (selectionBox) {
                        let sx = Math.min(selectionBox.sx, selectionBox.ex);
                        let sy = Math.min(selectionBox.sy, selectionBox.ey);
                        let ex = Math.max(selectionBox.sx, selectionBox.ex);
                        let ey = Math.max(selectionBox.sy, selectionBox.ey);
                        let w = ex - sx, h = ey - sy;

                        if (w < 5 && h < 5) {
                            // Click select
                            let clicked = null;
                            for (let u of units) {
                                if (u.owner !== localPlayerId || u.dead) continue;
                                if (Math.hypot(u.x - selectionBox.sx, u.y - selectionBox.sy) < u.r + 8) { clicked = u; break; }
                            }
                            if (clicked) {
                                if (e.shiftKey) {
                                    let idx = selectedUnits.indexOf(clicked);
                                    if (idx >= 0) selectedUnits.splice(idx, 1);
                                    else selectedUnits.push(clicked);
                                } else { selectedUnits = [clicked]; selectedEntities = []; }
                            } else {
                                // Check if clicking any entity: barrack, tower, floor item, gold mine, collector
                                let cx = selectionBox.sx, cy = selectionBox.sy;
                                let clickedEntity = null;
                                for (let b of barracks) { if (b.hp > 0 && Math.hypot(b.x - cx, b.y - cy) < 20) { clickedEntity = b; break; } }
                                if (!clickedEntity) for (let t of towers) { if (t.hp > 0 && Math.hypot(t.x - cx, t.y - cy) < 20) { clickedEntity = t; break; } }
                                if (!clickedEntity) for (let s of collectorSpawners) { if (s.hp > 0 && Math.hypot(s.x - cx, s.y - cy) < 20) { clickedEntity = s; break; } }
                                if (!clickedEntity) {
                                    let gx = Math.floor(cx / TILE), gy = Math.floor(cy / TILE);
                                    if (gx >= 0 && gx < GRID_W && gy >= 0 && gy < GRID_H && grid[gy][gx].item) {
                                        clickedEntity = grid[gy][gx].item;
                                        clickedEntity._gx = gx; clickedEntity._gy = gy; clickedEntity._cell = grid[gy][gx];
                                    }
                                }
                                if (!clickedEntity) for (let m of goldMines) { if (Math.hypot(m.x - cx, m.y - cy) < 20) { clickedEntity = m; clickedEntity._isGoldMine = true; break; } }
                                if (clickedEntity) {
                                    if (e.shiftKey) {
                                        let idx = selectedEntities.indexOf(clickedEntity);
                                        if (idx >= 0) selectedEntities.splice(idx, 1);
                                        else selectedEntities.push(clickedEntity);
                                    } else { selectedEntities = [clickedEntity]; selectedUnits = []; }
                                } else if (!e.shiftKey) { selectedUnits = []; selectedEntities = []; }
                            }
                        } else {
                            // Box select — pick up units AND buildings
                            let newUnits = [];
                            let newEntities = [];
                            for (let u of units) {
                                if (u.owner !== localPlayerId || u.dead) continue;
                                if (u.x >= sx && u.x <= ex && u.y >= sy && u.y <= ey) newUnits.push(u);
                            }
                            for (let b of barracks) {
                                if (b.hp > 0 && b.owner === localPlayerId && b.x >= sx && b.x <= ex && b.y >= sy && b.y <= ey) newEntities.push(b);
                            }
                            for (let t of towers) {
                                if (t.hp > 0 && t.owner === localPlayerId && t.x >= sx && t.x <= ex && t.y >= sy && t.y <= ey) newEntities.push(t);
                            }
                            for (let s of collectorSpawners) {
                                if (s.hp > 0 && s.owner === localPlayerId && s.x >= sx && s.x <= ex && s.y >= sy && s.y <= ey) newEntities.push(s);
                            }
                            // Floor items within box
                            let minGx = Math.max(0, Math.floor(sx / TILE)), maxGx = Math.min(GRID_W - 1, Math.floor(ex / TILE));
                            let minGy = Math.max(0, Math.floor(sy / TILE)), maxGy = Math.min(GRID_H - 1, Math.floor(ey / TILE));
                            for (let gy = minGy; gy <= maxGy; gy++) {
                                for (let gx = minGx; gx <= maxGx; gx++) {
                                    let cell = grid[gy][gx];
                                    if (cell.item && cell.owner === localPlayerId && !newEntities.includes(cell.item)) {
                                        cell.item._gx = gx; cell.item._gy = gy; cell.item._cell = cell;
                                        newEntities.push(cell.item);
                                    }
                                }
                            }
                            // Gold mines within box
                            for (let m of goldMines) {
