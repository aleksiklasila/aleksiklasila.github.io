                                if (m.x >= sx && m.x <= ex && m.y >= sy && m.y <= ey) { m._isGoldMine = true; newEntities.push(m); }
                            }
                            if (e.shiftKey) {
                                for (let u of newUnits) { if (!selectedUnits.includes(u)) selectedUnits.push(u); }
                                for (let ent of newEntities) { if (!selectedEntities.includes(ent)) selectedEntities.push(ent); }
                            } else {
                                selectedUnits = newUnits;
                                selectedEntities = newEntities;
                            }
                        }
                        activeSubGroups = {};
                        selectionBox = null;
                    }
                    updateInfoPanel();
                }
            });

            gameArea.addEventListener('contextmenu', e => e.preventDefault());

            gameArea.addEventListener('wheel', (e) => {
                // Zoom centered on mouse cursor position
                let worldBeforeX = mouseWorldX;
                let worldBeforeY = mouseWorldY;
                let rect = gameArea.getBoundingClientRect();
                let screenX = e.clientX - rect.left;
                let screenY = e.clientY - rect.top;
                let oldZoom = camera.zoom;
                if (e.deltaY < 0) camera.zoom = Math.min(2, camera.zoom * 1.2);
                else camera.zoom = Math.max(0.4, camera.zoom / 1.2);
                // Adjust camera so world point under cursor stays under cursor
                camera.x = worldBeforeX - screenX / camera.zoom;
                camera.y = worldBeforeY - screenY / camera.zoom;
                clampCamera();
            });

            // Minimap click
            minimapCanvas.addEventListener('mousedown', (e) => {
                let rect = minimapCanvas.getBoundingClientRect();
                let mx = (e.clientX - rect.left) * (MINIMAP_SIZE / rect.width);
                let my = (e.clientY - rect.top) * (MINIMAP_SIZE / rect.height);
                let scale = MINIMAP_SIZE / GRID_W;
                camera.x = (mx / scale) * TILE - viewW / camera.zoom / 2;
                camera.y = (my / scale) * TILE - viewH / camera.zoom / 2;
                clampCamera();
            });

            // Keyboard
            document.addEventListener('keydown', (e) => {
                keysDown[e.key.toLowerCase()] = true;
                if (!gameStarted) return;
                if (e.key === 'Escape') { selectedBuildItem = null; selectedUnits = []; selectedEntities = []; activeSubGroups = {}; attackMoveMode = false; updateBuildMenu(); updateInfoPanel(); }
                if ((e.key === 'a' || e.key === 'A') && selectedUnits.length > 0) attackMoveMode = true;
                if ((e.key === 's' || e.key === 'S') && selectedUnits.length > 0) { let au = getActiveUnits(); if (au.length) queueAction({ action: 'stop', unitIds: au.map(u => u.id) }); }
                if (e.key === 'h' || e.key === 'H') { let au = getActiveUnits(); if (au.length) queueAction({ action: 'hold', unitIds: au.map(u => u.id) }); }
                // Control groups
                if (e.key >= '1' && e.key <= '9') {
                    let num = e.key;
                    if (e.ctrlKey) { controlGroups[num] = [...selectedUnits]; }
                    else if (controlGroups[num]) { selectedUnits = controlGroups[num].filter(u => !u.dead); updateInfoPanel(); }
                }
            });
            document.addEventListener('keyup', (e) => { keysDown[e.key.toLowerCase()] = false; });
        }

        function queueAction(action) {
            let tick = currentTick + INPUT_DELAY;
            if (!localInputBuffer[tick]) localInputBuffer[tick] = [];
            localInputBuffer[tick].push(action);

            // In multiplayer, send to peer (individual action, tick confirmation sent separately in tick loop)
            if (isMultiplayer && connections.length > 0) {
                connections.forEach(c => c.send({ type: 'TICK_INPUT', tick, actions: [action] }));
            }
        }

        function processActions(actions, playerId) {
            for (let a of actions) {
                if (a.action === 'place') {
                    placeBuilding(a.gx, a.gy, a.itemType, playerId);
                } else if (a.action === 'move') {
                    let targetGx = Math.floor(a.targetX / TILE), targetGy = Math.floor(a.targetY / TILE);
                    for (let u of units) {
                        if (a.unitIds.includes(u.id) && u.owner === playerId && !u.dead) {
                            u.targetUnit = null; u.targetBuilding = null;
                            u.commandState = CMD_MOVING;
                            if (u.workerState) { Object.assign(u, { workerState: 'MANUAL_MOVE', workerTarget: null, workerTargetType: null }); }
                            if (pathfindBudget < MAX_PATHS_PER_TICK) {
                                let ugx = Math.floor(u.x / TILE), ugy = Math.floor(u.y / TILE);
                                u.path = findPathAStar(ugx, ugy, targetGx, targetGy, u.isFlying);
                                u.pathIndex = (u.path && u.path.length > 1 && u.path[0].x === ugx && u.path[0].y === ugy) ? 1 : 0;
                                u._pendingPathTarget = null;
                                pathfindBudget++;
                            } else {
                                // Defer pathfinding to a later tick
                                u._pendingPathTarget = { gx: targetGx, gy: targetGy, cmd: CMD_MOVING };
                                u.path = null; u.pathIndex = 0;
                            }
                        }
                    }
                } else if (a.action === 'attackMove') {
                    let targetGx = Math.floor(a.targetX / TILE), targetGy = Math.floor(a.targetY / TILE);
                    for (let u of units) {
                        if (a.unitIds.includes(u.id) && u.owner === playerId && !u.dead) {
                            u.targetUnit = null; u.targetBuilding = null;
                            u.commandState = CMD_ATTACK_MOVING;
                            if (u.workerState) { Object.assign(u, { workerState: 'MANUAL_MOVE', workerTarget: null, workerTargetType: null }); }
                            if (pathfindBudget < MAX_PATHS_PER_TICK) {
                                let ugx = Math.floor(u.x / TILE), ugy = Math.floor(u.y / TILE);
                                u.path = findPathAStar(ugx, ugy, targetGx, targetGy, u.isFlying);
                                u.pathIndex = (u.path && u.path.length > 1 && u.path[0].x === ugx && u.path[0].y === ugy) ? 1 : 0;
                                u._pendingPathTarget = null;
                                pathfindBudget++;
                            } else {
                                u._pendingPathTarget = { gx: targetGx, gy: targetGy, cmd: CMD_ATTACK_MOVING };
                                u.path = null; u.pathIndex = 0;
                            }
                        }
                    }
                } else if (a.action === 'attack') {
                    let target = units.find(u => u.id === a.targetId);
                    if (target) {
                        for (let u of units) {
                            if (a.unitIds.includes(u.id) && u.owner === playerId && !u.dead) {
                                u.targetUnit = target; u.commandState = CMD_ATTACKING; u.targetBuilding = null;
                            }
                        }
                    }
                } else if (a.action === 'attackBuilding') {
                    let tb = towers.find(t => t.gx === a.targetGx && t.gy === a.targetGy && t.hp > 0) ||
                        barracks.find(b => b.gx === a.targetGx && b.gy === a.targetGy && b.hp > 0) ||
                        collectorSpawners.find(s => s.gx === a.targetGx && s.gy === a.targetGy && s.hp > 0) ||
                        (grid[a.targetGy] && grid[a.targetGy][a.targetGx] && grid[a.targetGy][a.targetGx].item && grid[a.targetGy][a.targetGx].item.hp > 0 ? grid[a.targetGy][a.targetGx].item : null);
                    if (tb) {
                        let dest = findNearestWalkable(tb.gx, tb.gy);
                        for (let u of units) {
                            if (a.unitIds.includes(u.id) && u.owner === playerId && !u.dead) {
                                u.targetBuilding = tb; u.commandState = CMD_ATTACKING; u.targetUnit = null;
                                if (pathfindBudget < MAX_PATHS_PER_TICK) {
                                    u.path = findPathAStar(Math.floor(u.x / TILE), Math.floor(u.y / TILE), dest.x, dest.y, u.isFlying);
                                    u.pathIndex = 0; u._pendingPathTarget = null;
                                    pathfindBudget++;
                                } else {
                                    u._pendingPathTarget = { gx: dest.x, gy: dest.y, cmd: CMD_ATTACKING };
                                    u.path = null; u.pathIndex = 0;
                                }
                            }
                        }
                    }
                } else if (a.action === 'stop') {
                    for (let u of units) {
                        if (a.unitIds.includes(u.id) && u.owner === playerId) { u.commandState = CMD_IDLE; u.path = null; u.targetUnit = null; u.targetBuilding = null; u._pendingPathTarget = null; }
                    }
                } else if (a.action === 'hold') {
                    for (let u of units) {
                        if (a.unitIds.includes(u.id) && u.owner === playerId) { u.commandState = CMD_HOLDING; u.path = null; u.targetUnit = null; u.targetBuilding = null; u._pendingPathTarget = null; }
                    }
                } else if (a.action === 'queueUnit') {
                    let b = barracks.find(b => b.gx === a.gx && b.gy === a.gy && b.owner === playerId);
                    if (b && b.hp > 0 && !b.underConstruction) {
                        let cost = b.getUnitCost();
                        if (players[playerId].money >= cost && b.spawnQueue.length < 20) {
                            players[playerId].money -= cost;
                            b.spawnQueue.push(b.unitType);
                        }
                    }
                } else if (a.action === 'queueWorker') {
                    let s = collectorSpawners.find(s => s.gx === a.gx && s.gy === a.gy && s.owner === playerId);
                    if (s && s.hp > 0 && !s.underConstruction) {
                        let cost = s.getUnitCost();
                        if (players[playerId].money >= cost && s.spawnQueue.length < 10) {
                            players[playerId].money -= cost;
                            s.spawnQueue.push(s.type === 'spawner' ? 'collector' : s.type === 'builder_spawner' ? 'builder_unit' : 'salvager');
                        }
                    }
                } else if (a.action === 'workerAssign') {
                    // Assign selected worker units to a specific target
                    for (let u of units) {
                        if (!a.unitIds.includes(u.id) || u.owner !== playerId || u.dead || !u.workerState) continue;
                        let myGx = Math.floor(u.x / TILE), myGy = Math.floor(u.y / TILE);
                        if (u.workerType === 'builder' && a.targetType === 'build') {
                            // Find the target building
                            let target = towers.find(t => t.gx === a.targetGx && t.gy === a.targetGy && t.underConstruction) ||
                                barracks.find(b => b.gx === a.targetGx && b.gy === a.targetGy && b.underConstruction) ||
                                collectorSpawners.find(s => s.gx === a.targetGx && s.gy === a.targetGy && s.underConstruction) ||
                                (grid[a.targetGy] && grid[a.targetGy][a.targetGx] && grid[a.targetGy][a.targetGx].item && grid[a.targetGy][a.targetGx].item.underConstruction ? grid[a.targetGy][a.targetGx].item : null);
                            if (target) {
                                u.workerTarget = null; // clear old target
                                _builderAssignTarget(u, target, myGx, myGy);
                            }
                        } else if (u.workerType === 'collector' && a.targetType === 'mine') {
                            let mine = goldMines.find(m => m.gx === a.targetGx && m.gy === a.targetGy && m.gold > 0);
                            if (mine) {
                                u.workerTarget = null;
                                _collectorAssignMine(u, mine, myGx, myGy);
                            }
                        }
                    }
                } else if (a.action === 'setRally') {
                    let b = barracks.find(b => b.gx === a.gx && b.gy === a.gy && b.owner === playerId) ||
                        collectorSpawners.find(s => s.gx === a.gx && s.gy === a.gy && s.owner === playerId);
                    if (b) { b.rallyX = a.targetX; b.rallyY = a.targetY; }
                } else if (a.action === 'dequeueUnit') {
                    let b = barracks.find(b => b.gx === a.gx && b.gy === a.gy && b.owner === playerId);
                    if (b && b.spawnQueue.length > 0) {
                        let cost = b.getUnitCost();
                        b.spawnQueue.shift();
                        players[playerId].money += cost * 0.1;
                    }
                } else if (a.action === 'dequeueWorker') {
                    let s = collectorSpawners.find(s => s.gx === a.gx && s.gy === a.gy && s.owner === playerId);
                    if (s && s.spawnQueue.length > 0) {
                        let cost = s.getUnitCost();
                        s.spawnQueue.shift();
                        players[playerId].money += cost * 0.1;
                    }
                } else if (a.action === 'markSalvage') {
                    // Toggle salvage mark on a building at gx,gy
                    let t = towers.find(t => t.gx === a.gx && t.gy === a.gy && t.owner === playerId);
                    if (t) { t.markedForSalvage = !t.markedForSalvage; }
                    let b = barracks.find(b => b.gx === a.gx && b.gy === a.gy && b.owner === playerId);
                    if (b) { b.markedForSalvage = !b.markedForSalvage; }
                    let s = collectorSpawners.find(s => s.gx === a.gx && s.gy === a.gy && s.owner === playerId);
                    if (s) { s.markedForSalvage = !s.markedForSalvage; }
                    let cell = grid[a.gy][a.gx];
                    if (cell.item && cell.owner === playerId && !t && !b && !s) { cell.item.markedForSalvage = !cell.item.markedForSalvage; }
                } else if (a.action === 'killUnit') {
                    let u = units.find(u => u.id === a.unitId && u.owner === playerId);
                    if (u && !u.dead) { u.hp = 0; u.dead = true; players[playerId].popCount--; }
                }
            }
        }

        // ============================================================
        // CAMERA CONTROLS
        // ============================================================
        function clampCamera() {
            let maxX = WORLD_W - viewW / camera.zoom;
            let maxY = WORLD_H - viewH / camera.zoom;
            camera.x = Math.max(0, Math.min(maxX, camera.x));
            camera.y = Math.max(0, Math.min(maxY, camera.y));
        }

        function updateCamera() {
            let speed = 12 / camera.zoom;
            if (keysDown['arrowup'] || keysDown['w']) camera.y -= speed;
            if (keysDown['arrowdown'] || keysDown['s']) camera.y += speed;

        function updateInfoPanel() {
            let panel = document.getElementById('info-panel');

            // Remove dead entities
            selectedEntities = selectedEntities.filter(e => !(e.hp !== undefined && e.hp <= 0));
            selectedUnits = selectedUnits.filter(u => !u.dead);

            let totalSel = selectedEntities.length + selectedUnits.length;
            if (totalSel === 0) { panel.style.display = 'none'; panel.innerHTML = ''; return; }
            panel.style.display = 'block';

            let html = '';
            // --- GROUP ENTITIES by key ---
            let entityGroups = {};
            for (let e of selectedEntities) {
                let key = getEntityGroupKey(e);
                if (!entityGroups[key]) entityGroups[key] = { label: getEntityGroupLabel(e), items: [], isEntity: true };
                entityGroups[key].items.push(e);
            }
            // Group units by type
            let unitGroups = {};
            for (let u of selectedUnits) {
                let key = 'unit_' + u.unitType;
                if (!unitGroups[key]) unitGroups[key] = { label: u.unitType.toUpperCase(), items: [], isUnit: true };
                unitGroups[key].items.push(u);
            }

            let allGroups = [...Object.entries(entityGroups), ...Object.entries(unitGroups)];
            let showSubGroupToggles = allGroups.length > 1;

            // Ensure all groups have an explicit entry (default true)
            for (let [k] of allGroups) {
                if (activeSubGroups[k] === undefined) activeSubGroups[k] = true;
            }

            // --- SUB-GROUP ICON TOGGLE BAR ---
            if (showSubGroupToggles) {
                html += `<div id="subgroup-bar" style="display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px;align-items:flex-end">`;
                for (let [key, grp] of allGroups) {
                    let isActive = activeSubGroups[key] !== false;
                    let borderColor = isActive ? getGroupBorderColor(grp) : '#333';
                    let opacity = isActive ? '1' : '0.35';
                    let lvl = getGroupLevel(key, grp);
                    let thumbKey = getGroupThumbKey(grp);
                    html += `<div class="subgroup-toggle" data-key="${key}" data-thumb="${thumbKey || ''}" style="cursor:pointer;opacity:${opacity};width:36px;text-align:center;position:relative">`;
                    html += `<div class="sg-icon-box" style="width:34px;height:34px;border:2px solid ${borderColor};border-radius:3px;background:#111;display:flex;align-items:center;justify-content:center;position:relative">`;
                    if (lvl !== null) html += `<span style="position:absolute;top:-1px;left:1px;font-size:7px;color:#aaa;z-index:1">L${lvl}</span>`;
                    html += `<span style="position:absolute;bottom:-1px;right:1px;font-size:8px;color:#fd0;font-weight:bold;z-index:1">x${grp.items.length}</span>`;
                    html += `</div></div>`;
                }
                // Select All / Deselect All
                html += `<div style="display:flex;flex-direction:column;gap:1px;margin-left:auto">`;
                html += `<span class="subgroup-all" data-action="all" style="cursor:pointer;font-size:8px;color:#4f4;padding:1px 4px;border:1px solid #333;border-radius:2px;background:#1a1a1a">All</span>`;
                html += `<span class="subgroup-all" data-action="none" style="cursor:pointer;font-size:8px;color:#f44;padding:1px 4px;border:1px solid #333;border-radius:2px;background:#1a1a1a">None</span>`;
                html += `</div>`;
                html += `</div>`;
                html += `<div style="border-bottom:1px solid #333;margin:4px 0"></div>`;
            }

            // --- SUMMARY HEADER ---
            if (totalSel > 1) {
                let totalHp = 0, totalMaxHp = 0;
                for (let e of selectedEntities) { if (e.hp !== undefined) { totalHp += e.hp; totalMaxHp += e.maxHp; } }

                if (grp.isUnit) {
                    let u0 = items[0];
                    let prefix = items.length > 1 ? `${items.length}x ` : '';
                    html += infoHeaderUnit(prefix + label, u0);

                        html += renderUnitInfo(items[0]);

                        html += renderUnitGroupInfo(items);

            // Wire up buy buttons for single barracks

            // Wire up group buy buttons - dynamically find barrack with lowest queue

                btn.onclick = () => {

                    let best = null, bestQueue = Infinity;
                    for (let c of coords) {
                        let b = barracks.find(b => b.gx === c.gx && b.gy === c.gy && b.owner === localPlayerId && b.hp > 0);

            panel.querySelectorAll('.info-buy-worker-group-btn').forEach(btn => {

                    let best = null, bestQueue = Infinity;

                        let s = collectorSpawners.find(s => s.gx === c.gx && s.gy === c.gy && s.owner === localPlayerId && s.hp > 0);

                    queueAction({ action: type, gx, gy });
                };
            });

            // Wire up dequeue group buttons (removes from building with highest queue)
            panel.querySelectorAll('.info-dequeue-group-btn').forEach(btn => {
                btn.onclick = () => {
                    let coords = btn.dataset.coords.split(';').map(c => { let [x, y] = c.split(','); return { gx: parseInt(x), gy: parseInt(y) }; });
                    let best = null, bestQueue = -1;
                    let isWorker = btn.dataset.type === 'worker';
                    for (let c of coords) {
                        if (isWorker) {
                            let s = collectorSpawners.find(s => s.gx === c.gx && s.gy === c.gy && s.owner === localPlayerId && s.hp > 0);
                            if (s && (s.spawnQueue || []).length > bestQueue) { best = s; bestQueue = (s.spawnQueue || []).length; }
                        } else {
                            let b = barracks.find(b => b.gx === c.gx && b.gy === c.gy && b.owner === localPlayerId && b.hp > 0);
                            if (b && b.spawnQueue.length > bestQueue) { best = b; bestQueue = b.spawnQueue.length; }
                        }
                    }
                    if (best && bestQueue > 0) {
                        queueAction({ action: isWorker ? 'dequeueWorker' : 'dequeueUnit', gx: best.gx, gy: best.gy });
                    }
                };
            });

            // Wire up sub-group toggle buttons (simple toggle, doesn't affect others)
            panel.querySelectorAll('.subgroup-toggle').forEach(btn => {
                btn.onclick = () => {
                    let key = btn.dataset.key;
                    activeSubGroups[key] = !activeSubGroups[key];

            // Wire up select all / deselect all
            panel.querySelectorAll('.subgroup-all').forEach(btn => {

            // Wire up salvage buttons (single building)

                    setTimeout(updateInfoPanel, 50);

            // Wire up salvage group buttons
            panel.querySelectorAll('.info-salvage-group-btn').forEach(btn => {
                btn.onclick = () => {
                    let coords = btn.dataset.coords.split(';').map(c => { let [x, y] = c.split(','); return { gx: parseInt(x), gy: parseInt(y) }; });
                    for (let c of coords) queueAction({ action: 'markSalvage', gx: c.gx, gy: c.gy });
                    setTimeout(updateInfoPanel, 50);
                };
            });
            // Wire up kill group buttons (units)
            panel.querySelectorAll('.info-kill-group-btn').forEach(btn => {
                btn.onclick = () => {
                    let ids = btn.dataset.ids.split(',').map(Number);
                    for (let id of ids) queueAction({ action: 'killUnit', unitId: id });
                    setTimeout(updateInfoPanel, 50);
                };
            });
        }

        function showGameOver() {
            let el = document.getElementById('game-over');
            el.style.display = 'flex';
            document.getElementById('go-title').textContent = winner === localPlayerId ? 'VICTORY' : 'DEFEAT';
            document.getElementById('go-title').style.color = winner === localPlayerId ? '#4f4' : '#f44';
            let secs = Math.floor(gameTime / TICK_RATE);
            document.getElementById('go-stats').textContent = `Game lasted ${Math.floor(secs / 60)}m ${secs % 60}s`;
        }

        // ============================================================
        // MULTIPLAYER (PeerJS)
        // ============================================================
        function initPeer(cb) {
            if (peer) return;
            peer = new Peer();
            peer.on('open', id => { myPeerId = id; if (cb) cb(id); });
            peer.on('connection', conn => setupConnection(conn));
            peer.on('error', err => {
                console.error(err);
                if (err.type === 'peer-unavailable') {
                    document.getElementById('lobby-status').textContent = 'Game not found. Host may have left.';
                    document.getElementById('lobby-status').style.color = '#f44';
                }
            });
        }

        function setupConnection(conn) {
            connections.push(conn);
            conn.on('data', data => {
                if (data.type === 'START_GAME') {
                    gameSeed = data.seed;
                    localPlayerId = data.playerId;
                    isMultiplayer = true;
                    if (data.cfg) {
                        GRID_W = data.cfg.gridW; GRID_H = data.cfg.gridW;
                        WORLD_W = GRID_W * TILE; WORLD_H = GRID_H * TILE;
                        GOLD_MINE_COUNT = data.cfg.goldCount;
                        GOLD_MINE_MIN = data.cfg.goldMin;
                        GOLD_MINE_MAX = data.cfg.goldMax;
                        GOLD_MINE_AREA = data.cfg.goldArea;
                        fullVisibility = data.cfg.fullVis || false;
                    }
                    startGame();
                } else if (data.type === 'TICK_INPUT') {
                    if (!remoteInputBuffer[data.tick]) remoteInputBuffer[data.tick] = [];
                    remoteInputBuffer[data.tick].push(...data.actions);
                    remoteTickConfirmed[data.tick] = true;
                } else if (data.type === 'TICK_CONFIRM') {
                    remoteTickConfirmed[data.tick] = true;
                } else if (data.type === 'CHECKSUM') {
                    let localHash = computeChecksum();
                    if (localHash !== data.hash && performance.now() - lastDesyncWarning > 5000) {
                        lastDesyncWarning = performance.now();
                        console.warn(`DESYNC at tick ${data.tick}: local=${localHash} remote=${data.hash}`);
                    }
                }
            });
            conn.on('open', () => {
                if (isHost) {
                    // Opponent connected - auto-start the game
                    document.getElementById('lobby-status').textContent = 'Opponent connected! Starting...';
                    setTimeout(() => {
                        readConfigFromMenu();
                        gameSeed = Date.now();
                        localPlayerId = 0;
                        isMultiplayer = true;
                        connections.forEach(c => c.send({
                            type: 'START_GAME', seed: gameSeed, playerId: 1,
                            cfg: { gridW: GRID_W, goldCount: GOLD_MINE_COUNT, goldMin: GOLD_MINE_MIN, goldMax: GOLD_MINE_MAX, goldArea: GOLD_MINE_AREA, fullVis: fullVisibility }
                        }));
                        startGame();
                    }, 500);
                }
            });
            conn.on('close', () => { connections = connections.filter(c => c !== conn); });
        }

        function copyGameLink() {
            if (!myPeerId) return;
            let url = `${window.location.origin}${window.location.pathname}?game=${myPeerId}`;
            navigator.clipboard.writeText(url).then(() => {
                let msg = document.getElementById('invite-msg');
                msg.style.display = 'block'; setTimeout(() => msg.style.display = 'none', 2000);
            }).catch(() => prompt("Copy this URL:", url));
        }

        function hostOnlineGame() {
            isHost = true;
            let waitDiv = document.getElementById('lobby-waiting');
            waitDiv.style.display = 'block';
            document.getElementById('lobby-status').textContent = 'Creating game...';
            document.getElementById('btn-online').disabled = true;
            initPeer(id => {
                // Update URL with game ID (without reloading)
                let url = new URL(window.location);
                url.searchParams.set('game', id);
                window.history.replaceState({}, '', url);
                document.getElementById('lobby-status').textContent = 'Waiting for opponent...';
                document.getElementById('btn-copy-link').style.display = 'inline-block';
            });
        }

        function joinGame(hostId) {
            if (!hostId) return;
            let waitDiv = document.getElementById('lobby-waiting');
            waitDiv.style.display = 'block';
            document.getElementById('lobby-settings').style.display = 'none';
            document.getElementById('lobby-buttons').style.display = 'none';
            document.getElementById('lobby-status').textContent = 'Connecting to host...';
            initPeer(() => {
                let conn = peer.connect(hostId);
                setupConnection(conn);
                conn.on('open', () => {
                    document.getElementById('lobby-status').textContent = 'Connected! Waiting for host to start...';
                });
            });
        }

        function readConfigFromMenu() {
            let size = parseInt(document.getElementById('cfg-mapsize').value) || 80;
            GRID_W = size; GRID_H = size;
            WORLD_W = GRID_W * TILE; WORLD_H = GRID_H * TILE;
            GOLD_MINE_COUNT = parseInt(document.getElementById('cfg-gold-count').value) || 18;
            GOLD_MINE_MIN = parseInt(document.getElementById('cfg-gold-min').value) || 500;
            GOLD_MINE_MAX = parseInt(document.getElementById('cfg-gold-max').value) || 1500;
            let areaPct = parseInt(document.getElementById('cfg-gold-area').value) || 85;
            GOLD_MINE_AREA = Math.floor(size * areaPct / 100);
            fullVisibility = document.getElementById('cfg-full-vis').checked;
        }

        function startSoloGame() {
            readConfigFromMenu();
            isMultiplayer = false;
            gameSeed = Date.now();
            localPlayerId = 0;
            startGame();
        }

        // ============================================================
        // GAME INIT & MAIN LOOP
        // ============================================================
        function startGame() {
            document.getElementById('lobby').style.display = 'none';


            rng = mulberry32(gameSeed);
            visualRng = mulberry32(gameSeed ^ 0xDEADBEEF); // separate RNG for visual effects
            initSpatialHash();
            initGrid();
            generateAreas();
            generateGoldMines();

            // Place starting builder spawner + 3 builder units for each player
            let p0gx = 5, p0gy = 5, p1gx = GRID_W - 6, p1gy = GRID_H - 6;
            let s0 = new BuilderSpawner(p0gx, p0gy, 0);
            s0.underConstruction = false; // starts ready
            collectorSpawners.push(s0); grid[p0gy][p0gx].item = s0; grid[p0gy][p0gx].owner = 0;
            let s1 = new BuilderSpawner(p1gx, p1gy, 1);
            s1.underConstruction = false;
            collectorSpawners.push(s1); grid[p1gy][p1gx].item = s1; grid[p1gy][p1gx].owner = 1;

            // Spawn 3 builder units for each player
            for (let pid = 0; pid < 2; pid++) {
                let bgx = pid === 0 ? p0gx : p1gx, bgy = pid === 0 ? p0gy : p1gy;
                let spawner = pid === 0 ? s0 : s1;
                for (let i = 0; i < 3; i++) {
                    let sp = findNearestWalkable(bgx, bgy);
                    let u = new Unit('builder_unit', pid, sp.x * TILE + 16, sp.y * TILE + 16);
                    u.workerState = 'IDLE'; u.workerType = 'builder'; u.carryingValue = 0; u.workerTarget = null;
                    u.builderDps = spawner.getBuilderDps();
                    units.push(u); players[pid].popCount++;
                }
            }

            // Center camera on own base
            if (localPlayerId === 0) { camera.x = p0gx * TILE - viewW / 2; camera.y = p0gy * TILE - viewH / 2; }
            else { camera.x = p1gx * TILE - viewW / 2; camera.y = p1gy * TILE - viewH / 2; }
            clampCamera();

            recalculateAdjacency();
            dirtyGrid = true; dirtyAreas = true;
            gameStarted = true;
            updateBuildMenu();

            // Pre-confirm initial ticks (before INPUT_DELAY, no inputs possible)
            // Both sides do this locally, and also send confirmations to the peer
            for (let t = 0; t < INPUT_DELAY; t++) {
                remoteTickConfirmed[t] = true;
                if (isMultiplayer && connections.length > 0) {
                    connections.forEach(c => c.send({ type: 'TICK_CONFIRM', tick: t }));
                }
            }

            // Start unified game loop
            _lastTickTime = performance.now();
            _tickAccumulator = 0;
            requestAnimationFrame(gameFrame);
        }

        let _lastTickTime = 0;
        let _tickAccumulator = 0;

        function runOneTick() {
            // Send confirmation for upcoming ticks (tell remote we have no more actions for tick currentTick+INPUT_DELAY)
            if (isMultiplayer && connections.length > 0) {
                let confirmTick = currentTick + INPUT_DELAY;
                // Only send confirm if we haven't already sent actions for this tick
                if (!localInputBuffer[confirmTick] || localInputBuffer[confirmTick].length === 0) {
                    connections.forEach(c => c.send({ type: 'TICK_CONFIRM', tick: confirmTick }));
                } else {
                    // We have actions - send them bundled with a confirm flag
                    connections.forEach(c => c.send({ type: 'TICK_CONFIRM', tick: confirmTick }));
                }
            }

            // Reset pathfinding budget before processing actions
            pathfindBudget = 0;

            // CRITICAL: Both players must process actions in the same order (player 0 first, then player 1)
            let p0Actions, p1Actions;
            if (localPlayerId === 0) {
                p0Actions = localInputBuffer[currentTick] || [];
                p1Actions = remoteInputBuffer[currentTick] || [];
            } else {
                p0Actions = remoteInputBuffer[currentTick] || [];
                p1Actions = localInputBuffer[currentTick] || [];
            }
            processActions(p0Actions, 0);
            processActions(p1Actions, 1);

            delete localInputBuffer[currentTick];
            delete remoteInputBuffer[currentTick];
            delete remoteTickConfirmed[currentTick];

            gameTick();

            // Periodic checksum exchange (every 60 ticks = 3 seconds)
            if (isMultiplayer && currentTick % 60 === 0) {
                let hash = computeChecksum();
                connections.forEach(c => c.send({ type: 'CHECKSUM', tick: currentTick, hash }));
            }

            currentTick++;
        }

        let _buildMenuRefreshCounter = 0;
        let _fpsFrameCount = 0, _fpsLastTime = performance.now(), _fpsDisplay = 0;
        function gameFrame(timestamp) {
            // v2 unified rAF loop (no MessageChannel)
            // --- Process ticks ---
            if (gameStarted && !gameOver) {
                let dt = timestamp - _lastTickTime;
                _lastTickTime = timestamp;
                if (dt > 200) dt = 200; // cap to prevent spiral of death
                _tickAccumulator += dt;

                let ticksProcessed = 0;
                while (_tickAccumulator >= TICK_MS && ticksProcessed < 5) {
                    if (isMultiplayer && !remoteTickConfirmed[currentTick]) {
                        _tickAccumulator = TICK_MS; // wait for remote
                        break;
                    }
                    runOneTick();
                    ticksProcessed++;
                    _tickAccumulator -= TICK_MS;
                }
            }

            // --- Render ---
            tickAlpha = Math.min(_tickAccumulator / TICK_MS, 1);
            updateCamera();
            let dpr = window.devicePixelRatio || 1;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            draw();
            updateHUD();

            // FPS counter
            _fpsFrameCount++;
            if (timestamp - _fpsLastTime >= 1000) {
                _fpsDisplay = Math.round(_fpsFrameCount * 1000 / (timestamp - _fpsLastTime));
                _fpsFrameCount = 0; _fpsLastTime = timestamp;
            }
            // Refresh build menu and info panel every ~30 frames
            if (++_buildMenuRefreshCounter >= 30) { _buildMenuRefreshCounter = 0; updateBuildMenu(); updateInfoPanel(); }
            requestAnimationFrame(gameFrame);
        }

        // ============================================================
        // INIT
        // ============================================================
        window.addEventListener('load', () => {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            minimapCanvas = document.getElementById('minimapCanvas');
            minimapCtx = minimapCanvas.getContext('2d');

            // HiDPI minimap
            let mmDpr = window.devicePixelRatio || 1;
            minimapCanvas.width = MINIMAP_SIZE * mmDpr;
            minimapCanvas.height = MINIMAP_SIZE * mmDpr;
            minimapCanvas.style.width = MINIMAP_SIZE + 'px';
            minimapCanvas.style.height = MINIMAP_SIZE + 'px';
            minimapCtx.scale(mmDpr, mmDpr);

            function resize() {
                let gameArea = document.getElementById('game-area');
                viewW = gameArea.clientWidth;
                viewH = gameArea.clientHeight;
                let dpr = window.devicePixelRatio || 1;
                canvas.width = viewW * dpr;
                canvas.height = viewH * dpr;
                canvas.style.width = viewW + 'px';
                canvas.style.height = viewH + 'px';
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            resize();
            window.addEventListener('resize', resize);

            initInput();
            initBuildTabs();
            updateBuildMenu();

            // Auto-join if URL has ?game=xxx
            let params = new URLSearchParams(window.location.search);
            let gameId = params.get('game');
            if (gameId) {
                joinGame(gameId);
            }
        });
    </script>
</body>
