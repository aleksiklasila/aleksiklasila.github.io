                if (!ikTargetHelper) {
                    ikTargetHelper = new THREE.Mesh(
                        new THREE.SphereGeometry(0.1, 8, 8),
                        new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5 })
                    );
                    ikTargetHelper.visible = false;
                    scene.add(ikTargetHelper);
                }

                // If bone already selected, attach helper there
                if (selectedBone) {
                    transformControl.setMode('translate');
                    startIKSession(selectedBone);
                }
            } else {
                // Disable
                if (ikTargetHelper) ikTargetHelper.visible = false;
                transformControl.setMode('rotate');
                // Re-attach gizmo to bone if selected
                if (selectedBone) {
                    transformControl.attach(selectedBone);
                }
            }
        };

        function startIKSession(bone) {
            if (!ikEnabled || !bone) return;

            // Build Chain (up to 2 parents)
            ikChain = [];
            let curr = bone;
            // Limit chain length logic
            for (let i = 0; i < 3; i++) {
                if (!curr || !curr.isBone) break;
                ikChain.push(curr);
                curr = curr.parent;
            }

            if (ikChain.length < 2) {
                console.log("Bone has no parent, cannot IK.");
                return;
            }

            // Move Helper to Bone World Pos
            const worldPos = new THREE.Vector3();
            bone.getWorldPosition(worldPos);
            ikTargetHelper.position.copy(worldPos);
            ikTargetHelper.visible = true;

            // Attach Gizmo to HELPER, not Bone
            transformControl.attach(ikTargetHelper);
        }



        let selectionHighlighter = null;

        window.toggleFocusSelected = function () {
            const chk = document.getElementById('chk-focus-selected');
            if (chk && chk.checked && selectedBone) {
                focusOnObject(selectedBone);
            }
        };

        function focusOnObject(obj) {
            if (!obj) return;
            // Animate or snap? Existing logic was snap.
            const pos = new THREE.Vector3();
            obj.getWorldPosition(pos);
            orbit.target.copy(pos);
            orbit.update();
        }

        // Define global selectBone
        window.selectBone = function (bone, fromTree) {
            selectedBone = bone;

            // Update UI
            if (window.updateGizmoVisibility) {
                window.updateGizmoVisibility();
            } else {
                // Fallback / Initial load before function defined
                document.getElementById('selection-info').innerText = "Selected: " + (bone ? bone.name : "None");
                if (bone) transformControl.attach(bone);
                else transformControl.detach();
            }

            // Auto Focus Logic
            if (bone) {
                // Focus Camera if toggle enabled
                const chkFocus = document.getElementById('chk-focus-selected');
                if (chkFocus && chkFocus.checked) {
                    focusOnObject(bone);
                }

                if (!fromTree) {
                    // Clicked in Viewer -> Focus in Tree
                    if (window.focusInTree) focusInTree(bone);
                }
            }

            // Update Highlight Visual
            if (!selectionHighlighter) {
                // Diamond shape
                const geo = new THREE.OctahedronGeometry(0.1, 0);
                const mat = new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true, depthTest: false });
                selectionHighlighter = new THREE.Mesh(geo, mat);
                selectionHighlighter.renderOrder = 999;
                scene.add(selectionHighlighter);
            }

            // Update Tree UI Selection
            if (window.updateHierarchySelection) {
                updateHierarchySelection(bone);
            } else {
                renderBoneHierarchy();
            }

            if (bone) {
                selectionHighlighter.visible = true;

                // Sync Gizmo Mode with IK
                if (ikEnabled) {
                    transformControl.setMode('translate');
                    startIKSession(bone); // This attaches to helper
                } else {
                    // Gizmo attachment handled by updateGizmoVisibility
                    if (ikTargetHelper) ikTargetHelper.visible = false;
                }
            } else {
                selectionHighlighter.visible = false;
                if (ikTargetHelper) ikTargetHelper.visible = false;
            }
        };

        window.updateGizmoVisibility = function () {
            if (!selectedBone) {
                transformControl.detach();
                document.getElementById('selection-info').innerText = "No bone selected";
                return;
            }

            // Check Control Strictness
            let isControlled = false;
            let clipName = null;

            if (window.hierarchicalController) {
                const layer = window.hierarchicalController.getLayerForBone(selectedBone.name);
                if (layer) {
                    isControlled = true;
                    clipName = layer.clipName;
                }
            }

            // If not controlled by any ACTIVE layer, disable editing (unless we want to allow base pose editing? User implies strictness)
            // "if user selects keyframes for an animation... user must have keyframes selected for an animation that currently controls a specific bone"

            if (!isControlled) {
                transformControl.detach();
                document.getElementById('selection-info').innerText = selectedBone.name + " (Not controlled by active animation)";
                return;
            }

            // Check Keyframes
            const hasKeys = selectedKeyframes.has(clipName) && selectedKeyframes.get(clipName).size > 0;
            if (!hasKeys) {
                transformControl.detach();
                document.getElementById('selection-info').innerText = selectedBone.name + " (Select Keyframes to Edit)";
                return;
            }

            // Allowed
            if (transformControl.object !== selectedBone) {
                transformControl.attach(selectedBone);
            }
            document.getElementById('selection-info').innerText = "Selected: " + selectedBone.name;
        };

        // CCD Solver
        function solveIK(chain, targetPos) {
            const endEffector = chain[0];
            const tolerance = 0.01;
            const maxIter = 5;

            // Solve loop
            for (let iter = 0; iter < maxIter; iter++) {
                let endPos = new THREE.Vector3();
                endEffector.getWorldPosition(endPos);
                if (endPos.distanceTo(targetPos) < tolerance) return;

                // Iterate ancestors
                for (let i = 1; i < chain.length; i++) {
                    const bone = chain[i];

                    endEffector.getWorldPosition(endPos);

                    const bonePos = new THREE.Vector3();
                    bone.getWorldPosition(bonePos);

                    const toEnd = endPos.clone().sub(bonePos).normalize();
                    const toTarget = targetPos.clone().sub(bonePos).normalize();

                    let angle = toEnd.angleTo(toTarget);
                    if (angle < 0.001) continue;

                    const axis = toEnd.clone().cross(toTarget).normalize();

                    bone.rotateOnWorldAxis(axis, angle);
                    bone.updateMatrixWorld(true);
                }
            }
        }

        // --- BONE VISUALS HELPERS ---
        window.ensureAllBoneVisuals = function () {
            if (!currentModel) return;
            if (!window.boneVisuals) window.boneVisuals = new Map();

            // Ensure model size logic
            if (!window.modelSize) {
                const box = new THREE.Box3().setFromObject(currentModel);
                const size = new THREE.Vector3();
                box.getSize(size);
                window.modelSize = Math.max(size.x, size.y, size.z) || 10;
            }
            const baseRadius = (window.modelSize || 10) * 0.015;

            currentModel.traverse(o => {
                if (o.isBone) {
                    let mesh = window.boneVisuals.get(o.name);
                    if (!mesh) {
                        // Create visual
                        const geo = new THREE.SphereGeometry(1, 8, 8);
                        const mat = new THREE.MeshBasicMaterial({
                            color: 0xffffff,
                            transparent: true,
                            opacity: 0.0, // Invisible but selectable (Raycaster hits transparent)
                            depthTest: false
                        });
                        mesh = new THREE.Mesh(geo, mat);
                        mesh.userData.isBoneHelper = true;
                        mesh.userData.boneName = o.name;
                        o.add(mesh);
                        window.boneVisuals.set(o.name, mesh);
                    }
                    // Ensure scale
                    mesh.scale.setScalar(baseRadius);
                }
            });
        };

        // --- RESIZERS ---
        function initResizers() {
            const sidebar = document.getElementById('sidebar');
            const timeline = document.getElementById('timeline-panel');

            const rSidebar = document.getElementById('resizer-sidebar');
            const rTimeline = document.getElementById('resizer-timeline');

            // Sidebar Resize (Left Edge)
            rSidebar.onmousedown = (e) => {
                e.preventDefault();
                document.documentElement.style.cursor = 'ew-resize';

                const onMove = (em) => {
                    const newWidth = window.innerWidth - em.clientX;
                    if (newWidth > 150 && newWidth < 800) {
                        sidebar.style.width = newWidth + 'px';
                        updateCameraOffset();
                    }
                };

                const onUp = () => {
                    document.documentElement.style.cursor = '';
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    SaveLocalStorage();
                    updateCameraOffset();
                };

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            };

            // Timeline Resize (Top Edge)
            rTimeline.onmousedown = (e) => {
                e.preventDefault();
                document.documentElement.style.cursor = 'ns-resize';

                const onMove = (em) => {
                    const newHeight = window.innerHeight - em.clientY;
                    if (newHeight > 50 && newHeight < 600) {
                        timeline.style.height = newHeight + 'px';
                        sidebar.style.bottom = newHeight + 'px'; // Update sidebar bottom to match
                        updateCameraOffset();
                    }
                };

                const onUp = () => {
                    document.documentElement.style.cursor = '';
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    SaveLocalStorage();
                    updateCameraOffset();
                };

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            };
        }

        // --- MAIN LOOP ---

        function onWindowResize() {
            updateCameraOffset();
        }


        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (mixer && isPlaying && !isScrubbing) {
                mixer.update(delta);
            }

            orbit.update();

            // Sync Highlight
            if (selectedBone && selectionHighlighter && selectionHighlighter.visible) {
                const worldPos = new THREE.Vector3();
                selectedBone.getWorldPosition(worldPos);
                selectionHighlighter.position.copy(worldPos);
                // Maybe scale it based on bone? or just kept constant. 
                // Constant is better for visibility.
            }

            // Sync UI (Playheads & Trimming)
            if (renderedTracks.length > 0) {
                renderedTracks.forEach(track => {
                    if (track.action && track.playhead) {
                        // Handle Trimming Loop
                        if (track.userData && track.action.isRunning()) {
                            const trimStart = track.userData.trimStart || 0;
                            const trimEnd = track.userData.trimEnd || 0;
                            const duration = track.duration; // Use cached duration
                            const endTime = Math.max(trimStart, duration - trimEnd);

                            // Custom Loop Logic needed because THREE.Action loop is global/clip based
                            if (track.action.time > endTime) {
                                // Wrap around
                                track.action.time = trimStart;
                            }
                            if (track.action.time < trimStart) {
                                track.action.time = trimStart;
                            }
                        }

                        const t = track.action.time;
                        const pct = (t / track.duration) * 100;
                        track.playhead.style.left = pct + '%';
                    }
                });
            }

            renderer.render(scene, camera);
        }

        // --- CONTEXT MENU SYSTEM ---
        window.showContextMenu = function (e, items) {
            e.preventDefault();
            e.stopPropagation();

            const menu = document.getElementById('context-menu');
            menu.innerHTML = '';

            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'context-menu-item';
                if (item.danger) div.classList.add('danger');
                div.innerText = item.label;
                div.onclick = (evt) => {
                    evt.stopPropagation();
                    menu.style.display = 'none';
                    item.action();
                };
                menu.appendChild(div);
            });

            menu.style.display = 'block';

            // Positioning (Basic)
            let x = e.pageX;
            let y = e.pageY;

            // Simple boundary check
            if (x + 150 > window.innerWidth) x -= 150;
            if (y + menu.offsetHeight > window.innerHeight) y -= menu.offsetHeight;

            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
        };

        // Close context menu on global click
        window.addEventListener('click', () => {
            const menu = document.getElementById('context-menu');
            if (menu) menu.style.display = 'none';
        });

        // Close when right-clicking elsewhere
        window.addEventListener('contextmenu', (e) => {
            const menu = document.getElementById('context-menu');
            if (menu && menu.style.display === 'block') {
                if (!e.target.closest('.tree-item') && !e.target.closest('.anim-item') && !e.target.closest('.prop-item')) {
                    menu.style.display = 'none';
                }
            }
        });

        // Start
        init();
    </script>
