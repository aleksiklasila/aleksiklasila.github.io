<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightMator: very lightweight glb animator</title>
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --panel-bg: #252526;
            --text-main: #d4d4d4;
            --accent: #007acc;
            --accent-hover: #0062a3;
            --border: #3e3e42;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* Layout */
        #viewport {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Top Toolbar */
        #toolbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            justify-content: space-between;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: #444;
        }

        .btn-danger {
            background: #b93636;
        }

        input[type="file"] {
            display: none;
        }

        /* Animation List (Right Panel) */
        #sidebar {
            position: absolute;
            top: 50px;
            right: 0;
            width: 250px;
            bottom: 150px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .tab-header {
            display: flex;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: #333;
            color: #888;
            border: none;
            cursor: pointer;
            font-size: 12px;
        }

        .tab-btn.active {
            background: var(--panel-bg);
            color: white;
            border-bottom: 2px solid var(--accent);
        }

        #anim-list {
            flex-grow: 1;
            overflow-y: auto;
        }

        #model-setup-panel {
            padding: 10px;
            display: none;
            /* Hidden by default */
            flex-grow: 1;
            overflow-y: auto;
        }

        .anim-item {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .anim-item:hover {
            background: #333;
        }

        .anim-item.active {
            background: #37373d;
            border-left: 3px solid var(--accent);
        }



        /* Timeline (Bottom Panel) */
        #timeline-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
        }

        #timeline-controls {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        #scrubber-container {
            position: relative;
            width: 100%;
            height: 30px;
            background: #1e1e1e;
            border-radius: 4px;
            cursor: pointer;
        }

        #scrubber-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: rgba(0, 122, 204, 0.3);
            pointer-events: none;
        }

        #playhead {
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 100%;
            background: red;
            pointer-events: none;
            z-index: 100;
        }

        .keyframe-marker {
            position: absolute;
            top: 2px;
            /* Centered in 20px height */
            height: 16px;
            width: 6px;
            background: yellow;
            border-radius: 2px;
            transform: translateX(-50%);
            cursor: pointer;
            z-index: 50;
            border: 1px solid #333;
        }

        .keyframe-marker:hover {
            background: #fff;
        }

        .tool-btn {
            width: 40px;
            height: 40px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 4px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #333;
        }

        .tool-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .tool-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Hierarchy Tree */
        .tree-container {
            margin-top: 10px;
            border: 1px solid #444;
            background: #1e1e1e;
            max-height: 400px;
            overflow-y: auto;
            font-size: 12px;
        }

        .tree-item {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 2px 0;
            color: #aaa;
        }

        .tree-item:hover {
            background-color: #333;
            color: #fff;
        }

        .tree-item.selected {
            background-color: #37373d;
            color: #fff;
            border-left: 2px solid var(--accent);
        }

        .tree-indent {
            display: inline-block;
            width: 16px;
            height: 100%;
            flex-shrink: 0;
        }

        .tree-toggle {
            width: 16px;
            text-align: center;
            font-size: 10px;
            color: #888;
            cursor: pointer;
            margin-right: 4px;
        }

        .tree-label {
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tree-label {
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Resizers */
        .resizer-v {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            cursor: ew-resize;
            z-index: 10;
        }

        .resizer-h {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            cursor: ns-resize;
            z-index: 10;
        }

        /* Context Menu */
        #context-menu {
            display: none;
            position: absolute;
            z-index: 10000;
            background: #252526;
            border: 1px solid #454545;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
            min-width: 150px;
            padding: 5px 0;
            border-radius: 4px;
        }

        .context-menu-item {
            padding: 5px 15px;
            cursor: pointer;
            color: #ccc;
            font-size: 13px;
        }

        .context-menu-item:hover {
            background: #094771;
            color: white;
        }

        .context-menu-item.danger {
            color: #ce9178;
        }

        .context-menu-item.danger:hover {
            background: #800000;
        }

        /* New Timeline Styles */
        .anim-track-row {
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid #333;
            background: #252526;
            margin-bottom: 2px;
        }

        .track-controls {
            display: flex;
            align-items: center;
            padding: 4px;
            background: #2d2d30;
            border-bottom: 1px solid #1e1e1e;
            font-size: 12px;
        }

        .track-timeline {
            position: relative;
            height: 24px;
            background: #1e1e1e;
            cursor: pointer;
            overflow: hidden;
        }

        .track-btn {
            background: transparent;
            border: 1px solid transparent;
            color: #ccc;
            cursor: pointer;
            padding: 2px 5px;
            border-radius: 3px;
        }

        .track-btn:hover {
            background: #444;
        }

        .track-btn.active {
            color: #4CAF50;
        }

        .track-input {
            background: transparent;
            border: 1px solid transparent;
            color: #ddd;
            font-family: inherit;
            font-size: 12px;
            width: 100px;
        }

        .track-input:focus {
            background: #333;
            border-color: #555;
        }

        .selection-box {
            position: absolute;
            background: rgba(0, 122, 204, 0.3);
            border: 1px solid #007acc;
            pointer-events: none;
            z-index: 100;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body>
    <div id="context-menu"></div>
    <div id="toolbar">
        <div style="display:flex; align-items:center;">
            <h3 style="margin:0 20px 0 0;">GLB Animator</h3>
            <button class="btn" onclick="document.getElementById('file-input').click()">Import .GLB</button>
            <input type="file" id="file-input" accept=".glb,.gltf">
            <input type="text" id="project-name" value="MyProject"

            <button class="btn btn-secondary" onclick="exportProjectZip()">Export Project (.zip)</button>
            <button class="btn btn-secondary" onclick="saveProject()">Save Work</button>
            <button class="btn btn-secondary" onclick="document.getElementById('project-input').click()">Load

            <input type="file" id="project-input" accept=".json,.lightmator" style="display:none"

        </div>
        <div style="flex-grow:1"></div>

    </div>

    <!-- Right Side Floating Toolbar -->
    <div id="transform-toolbar"
        style="position:absolute; top:70px; left:10px; display:flex; flex-direction:column; gap:10px; z-index:100;">
        <button class="tool-btn" id="btn-move" title="Move" onclick="setTransformMode('translate')">✢</button>

    <canvas id="viewport"></canvas>

    <div id="info-overlay">

    <div id="sidebar">
        <!-- Setup Panel -->
        <div id="model-setup-panel" style="display:flex; flex-direction:column; height:100%;">

            <div style="display:flex; gap:10px; margin-bottom:0px; padding: 10px; border-bottom: 1px solid #444;">
                <button class="btn btn-secondary" style="flex:1;"

            <input type="file" id="prop-input" accept=".glb,.gltf,.obj" style="display:none"

            <h4 style="margin:10px 0 5px 0; font-size:12px; color:#ddd; border-top:1px solid #444; padding-top:10px;">

            </div>
        </div>
        <div id="resizer-sidebar" class="resizer-v"></div>
    </div>

    <div id="timeline-panel">
        <div id="resizer-timeline" class="resizer-h"></div>

        <!-- Top Toolbar for Timeline -->
        <div id="timeline-general-controls"
            style="display:flex; align-items:center; padding-bottom:5px; border-bottom:1px solid #444; margin-bottom:5px;">
            <!-- Play/Pause Button Removed -->
            <!-- <button class="btn" id="play-pause-btn" onclick="togglePlay()">Pause</button> -->
            <button class="btn btn-secondary" style="font-size:12px; padding:4px 8px; margin-right:15px;"
                onclick="createNewAnimation()">+ New Animation</button>

            <!-- Restored Global Inputs for Logic Compatibility -->
            <label style="margin-right:10px; font-size:12px; display:none;">Interp:
                <select id="interpolation-select" style="background:#333; color:#fff; border:1px solid #555;">
                    <option value="Linear">Linear</option>
                    <option value="Smooth">Smooth</option>

                </select>
            </label>

            <label style="margin-right:10px; font-size:12px;"><input type="checkbox" id="chk-autokey"> Auto-Key</label>
            <label style="margin-right:10px; font-size:12px;"><input type="checkbox" id="chk-skeleton" checked
                    onchange="toggleSkeleton()"> Show Bones</label>
            <label style="margin-right:10px; font-size:12px;"><input type="checkbox" id="chk-focus-selected" checked
                    onchange="toggleFocusSelected()"> Focus Selected</label>
            <label style="margin-right:10px; font-size:12px;"><input type="checkbox" id="chk-ik" onchange="toggleIK()">
                IK Mode <span id="ik-status" style="font-size:10px; color:#aaa;">OFF</span></label>
        </div>

        <!-- Scrollable Tracks Area -->
        <div id="timeline-tracks-scroll-area"
            style="flex-grow:1; overflow-y:auto; overflow-x:hidden; position:relative;">

                <!-- Tracks injected here -->
            </div>
        </div>

    </div>

    <!-- Synchronous script to prevent FOUC -->
    <script>
        // --- PERSISTENCE (Global) ---
        window.LoadLocalStorage = function () {
            try {
                const data = localStorage.getItem('lightmator_settings');
                if (!data) return;

                const settings = JSON.parse(data);
                const sidebar = document.getElementById('sidebar');
                const timeline = document.getElementById('timeline-panel');
                const toolbar = document.getElementById('transform-toolbar');

                if (sidebar && settings.sidebarWidth) {
                    sidebar.style.width = settings.sidebarWidth;
                }

                if (timeline && settings.timelineHeight) {
                    timeline.style.height = settings.timelineHeight;
                    if (sidebar) sidebar.style.bottom = settings.timelineHeight;
                }

            } catch (e) {
                console.warn("Failed to load settings:", e);
            }
        };

        window.SaveLocalStorage = function () {
            try {
                const sidebar = document.getElementById('sidebar');
                const timeline = document.getElementById('timeline-panel');

                const settings = {
                    sidebarWidth: sidebar ? sidebar.style.width : null,
                    timelineHeight: timeline ? timeline.style.height : null
                };

                localStorage.setItem('lightmator_settings', JSON.stringify(settings));
            } catch (e) {
                console.warn("Failed to save settings:", e);
            }
        };

        // Execute immediately
        window.LoadLocalStorage();
    </script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        // --- HIERARCHICAL ANIMATION SYSTEM ---

        class HierarchicalAnimationController {
            constructor(model, mixer) {
                this.model = model;
                this.mixer = mixer;
                this.activeLayers = []; // List of active assignments

                this.clipCache = new Map();
            }

            invalidateClip(originalClipName) {
                // Invalidate any sub-clips derived from this original clip
                const keysToRemove = [];
                for (const key of this.clipCache.keys()) {
                    if (key.startsWith(originalClipName + "_")) {
                        keysToRemove.push(key);
                    }
                }
                keysToRemove.forEach(k => {
                    const clip = this.clipCache.get(k);
                    // Also uncache from mixer to be safe
                    if (clip) this.mixer.uncacheClip(clip);
                    this.clipCache.delete(k);
                });
            }

            // Assign an animation to a bone
            addLayer(boneName, clipName) {
                // Allow multiple layers on same bone? Yes, for independent tracks.
                const existingIdx = this.activeLayers.findIndex(l => l.clipName === clipName);
                if (existingIdx !== -1) {
                    // Update existing assignment
                    this.activeLayers[existingIdx].boneName = boneName;
                } else {
                    this.activeLayers.push({ boneName: boneName, clipName: clipName, action: null });
                }
                this.rebuildAndPlay();
            }

            removeLayer(boneName, clipName) {
                // Fix: Match BOTH boneName and clipName (if provided) to ensure correct removal
                const idx = this.activeLayers.findIndex(l => l.boneName === boneName && (!clipName || l.clipName === clipName));
                if (idx !== -1) {
                    const l = this.activeLayers[idx];
                    if (l.action) {
                        l.action.stop();
                        this.mixer.uncacheAction(l.action.getClip());
                    }
                    this.activeLayers.splice(idx, 1);
                    this.rebuildAndPlay();
                }
            }

            clearAll() {
                this.activeLayers.forEach(l => {
                    if (l.action) l.action.stop();
                });
                this.activeLayers = [];
            }

            rebuildAndPlay() {
                this.stopGlobalActions();

                // 1. Calculate Masks
                const boneDescendants = new Map(); // BoneName -> Set<BoneName>

                this.activeLayers.forEach(layer => {
                    const set = new Set();
                    // Fix: Handle "Root" or Unassigned properly
                    if (layer.boneName === 'Root' || !layer.boneName) {
                        this.model.traverse(o => {
                            if (o.isBone) set.add(o.name);
                        });
                    } else {
                        const bone = this._findBone(layer.boneName);
                        if (bone) {
                            this._collectDescendants(bone, set);
                            set.add(bone.name);
                        }
                    }
                    boneDescendants.set(layer.boneName, set);
                });

                // 2. Compute final masks
                const layerMasks = new Map();

                this.activeLayers.forEach(layer => {
                    const myScope = new Set(boneDescendants.get(layer.boneName));

                    // Subtract any layer that is 'deeper'
                    this.activeLayers.forEach(other => {
                        if (layer === other) return;

                        // Prevent self-clobbering if independent tracks on same bone are allowed
                        // Only subtract if 'other' is strictly a child (subset)? 
                        // Simplified: Only subtract if other.boneName is in myScope AND other.boneName != layer.boneName
                        if (myScope.has(other.boneName) && other.boneName !== layer.boneName) {
                            const otherScope = boneDescendants.get(other.boneName);
                            if (otherScope) otherScope.forEach(b => myScope.delete(b));
                        }
                    });

                    layerMasks.set(layer.boneName, myScope);
                });

                this.currentLayerMasks = layerMasks;

                // Color Visuals
                if (this.updateBoneColors) this.updateBoneColors(layerMasks);

                // 3. Play
                this.activeLayers.forEach(layer => {
                    const clip = animations.find(c => c.name === layer.clipName);
                    if (!clip) return;

                    const mask = layerMasks.get(layer.boneName);
                    // Special case: If mask is empty but we want independent playback? 
                    // Usually empty mask means fully overridden.
                    if (!mask || mask.size === 0) {
                        if (layer.action) {
                            layer.action.stop();
                        }
                        return;
                    }

                    // Generate SubClip
                    const subClip = this.getOrCreateSubClip(clip, mask, layer.boneName);

                    // Play
                    let action = layer.action;
                    const newAction = this.mixer.clipAction(subClip);

                    let prevTime = 0;
                    let prevPaused = false;
                    // If we have an existing action for this layer/clip tuple, preserve state
                    if (action) {
                        prevTime = action.time;
                        prevPaused = action.paused;
                    }

                    if (action !== newAction) {
                        if (action && action.isRunning()) action.stop();

                        // Restore state
                        newAction.time = prevTime;
                        newAction.play();
                        newAction.paused = prevPaused;

                        layer.action = newAction;
                    } else {
                        if (!newAction.isRunning()) newAction.play();
                    }
                });

                // Update Multi-Track UI
                if (window.renderTimelineTracks) window.renderTimelineTracks();
            }

            updateBoneColors(layerMasks) {
                if (!window.boneVisuals) window.boneVisuals = new Map(); // BoneName -> Mesh

                // Ensure model size is known for scaling
                if (!window.modelSize && this.model) {
                    const box = new THREE.Box3().setFromObject(this.model);
                    const size = new THREE.Vector3();
                    box.getSize(size);
                    window.modelSize = Math.max(size.x, size.y, size.z) || 10;
                }
                const baseRadius = (window.modelSize || 10) * 0.015; // Increased size

                // Reset logic
                window.boneVisuals.forEach(mesh => mesh.visible = false);

                this.activeLayers.forEach(layer => {
                    const mask = layerMasks.get(layer.boneName);
                    if (!mask) return;

                    // Get Color
                    const clip = animations.find(c => c.name === layer.clipName);
                    const colorVal = (clip && clip.userData.color) ? clip.userData.color : '#ffffff';

                    mask.forEach(bName => {
                        let mesh = window.boneVisuals.get(bName);
                        if (!mesh) {
                            const geo = new THREE.SphereGeometry(1, 8, 8); // Base radius 1, scaled later
                            const mat = new THREE.MeshBasicMaterial({
                                color: colorVal,
                                transparent: true,
                                opacity: 0.6,
                                depthTest: false
                            });
                            mesh = new THREE.Mesh(geo, mat);
                            mesh.userData.isBoneHelper = true;
                            mesh.userData.boneName = bName;

                            const bone = this._findBone(bName);
                            if (bone) {
                                bone.add(mesh);
                                window.boneVisuals.set(bName, mesh);
                            }
                        }

                        if (mesh) {
                            mesh.visible = true;
                            mesh.material.color.set(colorVal);
                            mesh.material.opacity = 0.6; // Restore visibility
                            mesh.scale.setScalar(baseRadius); // Apply scale
                        }
                    });
                });
            }

            getOrCreateSubClip(originalClip, mask, suffixID) {
                // Suffix needs to be unique hash of mask? 
                // Or just random? 
                // Or "BoneName_MaskHash"?
                // Let's use simplified cache key: ClipName + "_" + LayerBoneName + "_Gen"
                // WARNING: If mask changes dynamically (e.g. adding 3rd layer), we need new clip.
                // So cache key must depend on active layers configuration?
                // For now, let's just generate fresh or simple cache.
                // Optimally: ClipName + "_" + LayerBoneName + "_" + Array.from(mask).join('_') hash

                const maskKey = Array.from(mask).sort().join('_'); // Semi-expensive
                // Simple hash
                let hash = 0;
                for (let i = 0; i < maskKey.length; i++) {
                    hash = ((hash << 5) - hash) + maskKey.charCodeAt(i);
                    hash |= 0;
                }

                const newName = originalClip.name + "_" + suffixID + "_" + hash;

                if (this.clipCache.has(newName)) return this.clipCache.get(newName);

                const newTracks = [];
                originalClip.tracks.forEach(track => {
                    const boneName = track.name.split('.')[0];
                    if (mask.has(boneName)) {
                        newTracks.push(track.clone());
                    }
                });

                const newClip = new THREE.AnimationClip(newName, originalClip.duration, newTracks);
                this.clipCache.set(newName, newClip);
                return newClip;
            }

            getLayerForBone(boneName) {
                if (!this.currentLayerMasks) return null;
                // Find which layer owns this bone
                // iterate activeLayers
                for (const layer of this.activeLayers) {

                this.addLayer("Root", clipName);

                // Find the new action and set loop to once
                const layer = this.activeLayers.find(l => l.clipName === clipName && l.boneName === "Root");
                if (layer && layer.action) {

                    action.reset();
                    action.setLoop(THREE.LoopOnce);

                        }

            clip.duration = newDur;

            // Truncate keys if new duration is shorter (Logic adapted from previous updateDuration)
            let changed = false;
            clip.tracks.forEach(track => {
                const times = track.times;
                if (times.length > 0 && times[times.length - 1] > newDur) {
                    const newTimes = [];
                    const newValues = [];
                    const itemSize = track.getValueSize();

                    for (let i = 0; i < times.length; i++) {
                        if (times[i] <= newDur) {
                            newTimes.push(times[i]);
                            for (let k = 0; k < itemSize; k++) {
                                newValues.push(track.values[i * itemSize + k]);
                            }
                        }
                    }
                    track.times = new Float32Array(newTimes);
                    track.values = new Float32Array(newValues);
                    changed = true;
                }
            });

            // Persistence & Refresh
            const jsonAfter = clip.toJSON();

            // Refresh Logic
            if (window.hierarchicalController) {
                window.hierarchicalController.invalidateClip(clip.name);
                window.hierarchicalController.rebuildAndPlay();

                if (window.restoreClipState) window.restoreClipState(clip, jsonAfter);

                    if (window.renderTimelineTracks) window.renderTimelineTracks();

                        const chainStart = transformControl.userData.chainStart;
                        let clipsModified = new Set(); // Set<ClipObject>

                        if (ikEnabled && obj === ikTargetHelper && ikChain.length > 0) {

                            ikChain.forEach(bone => {

                            if (!dragStartPos.equals(endP) || !dragStartRot.equals(endQ) || !dragStartScale.equals(endS)) {

                                const dQ = dragStartRot.clone().invert().multiply(endQ);

                                    dragStartScale.x !== 0 ? endS.x / dragStartScale.x : 1,

        // --- CAMERA OFFSET LOGIC ---
        window.updateCameraOffset = function () {
            const w = window.innerWidth;
            const h = window.innerHeight;

            // Dimensions
            const sidebar = document.getElementById('sidebar');
            const timeline = document.getElementById('timeline-panel');
            const toolbar = document.getElementById('toolbar');

            const sbW = sidebar ? parseFloat(getComputedStyle(sidebar).width) : 0;
            const tlH = timeline ? parseFloat(getComputedStyle(timeline).height) : 0;
            const tbH = toolbar ? parseFloat(getComputedStyle(toolbar).height) : 0;

            // Visible Area Center calculation
            // Visible Width range: [0, w - sbW]
            // Visible Height range: [tbH, h - tlH]

            const cx = (w - sbW) / 2;
            const cy = tbH + (h - tbH - tlH) / 2;

            // Standard Center
            const sx = w / 2;
            const sy = h / 2;

            // Shift needed
            // Positive x in setViewOffset shifts the "window" right, moving content left.
            const x = sx - cx;
            const y = sy - cy;

            camera.setViewOffset(w, h, x, y, w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        };

        // --- FILE HANDLING ---
        function loadFile(e) {
            const file = e.target.files[0];

            loader.load(url, (gltf) => {

        function setupLoadedModel(gltf) {
            // Cleanup previous
            if (currentModel) {
                scene.remove(currentModel);
                scene.remove(skeletonHelper);
            }

            currentModel = gltf.scene;
            scene.add(currentModel);

            // POST-LOAD FIX: Restore Custom Bones
            ensureBones(currentModel);

            // Expand roots by default
            expandedBones.clear();
            currentModel.traverse((obj) => {
                if (obj.parent === currentModel) {
                    expandedBones.add(obj.uuid);
                }
            });
            // Ensure Armature/Hips are expanded
            currentModel.children.forEach(child => {
                expandedBones.add(child.uuid);
                if (child.children.length > 0) {
                    child.children.forEach(grandChild => expandedBones.add(grandChild.uuid));
                }
            });

            renderBoneHierarchy();

            // Auto-scale
            const box = new THREE.Box3().setFromObject(currentModel);
            const size = box.getSize(new THREE.Vector3()).length();
            const center = box.getCenter(new THREE.Vector3());

            window.modelSize = size; // Store globally for visuals

            // Reset camera based on size
            orbit.target.copy(center);
            camera.position.copy(center);
            camera.position.x += size;
            camera.position.y += size / 3;
            camera.position.z += size;

            // Helper
            skeletonHelper = new THREE.SkeletonHelper(currentModel);
            skeletonHelper.visible = true;
            scene.add(skeletonHelper);

            // Ensure Visuals
            ensureAllBoneVisuals();

            // Animations
            mixer = new THREE.AnimationMixer(currentModel);
            window.hierarchicalController = new HierarchicalAnimationController(currentModel, mixer);
            animations = gltf.animations;

            updateAnimList();

            if (animations.length > 0) {
                playAnimation(0);
            } else {
                createNewAnimation(); // Auto create default if none
            }
        }

        function ensureBones(model) {
            const toReplace = [];
            model.traverse(obj => {
                const isMarked = obj.userData && obj.userData.isCustomBone;
                if ((isMarked) && !obj.isBone) {
                    toReplace.push(obj);
                }
            });

            toReplace.forEach(obj => {
                const bone = new THREE.Bone();
                bone.name = obj.name;
                bone.position.copy(obj.position);
                bone.quaternion.copy(obj.quaternion);
                bone.scale.copy(obj.scale);
                bone.userData = obj.userData;

                // Transfer children
                while (obj.children.length > 0) {
                    bone.add(obj.children[0]);
                }

                // Replace in parent
                if (obj.parent) {
                    obj.parent.add(bone);
                    obj.parent.remove(obj);
                }
            });
        }

        window.exportProjectZip = async function () {
            if (!currentModel || !window.JSZip) {
                if (!window.JSZip) alert("JSZip library not loaded.");
                return;
            }

            const projectName = document.getElementById('project-name').value || "MyProject";
            const zip = new JSZip();
            const folder = zip.folder(projectName);

            // Helper to Promisify Export
            const exportToBlob = (object) => {
                return new Promise((resolve, reject) => {
                    const exporter = new GLTFExporter();
                    exporter.parse(object, (result) => {
                        let blob;
                        if (result instanceof ArrayBuffer) {
                            blob = new Blob([result], { type: 'application/octet-stream' });
                        } else {
                            const output = JSON.stringify(result, null, 2);
                            blob = new Blob([output], { type: 'text/plain' });
                        }
                        resolve(blob);
                    }, (err) => reject(err), { binary: true, animations: animations, truncateDrawRange: true });
                });
            };

            // Detach Separate Props & Editor Visuals
            const parentsMap = new Map(); // Store parent/index to restore

            const separateProps = props.filter(p => p.userData.exportSeparate);

            // Temporarily Remove Separate Props from hierarchy
            separateProps.forEach(p => {
                if (p.parent) {
                    parentsMap.set(p, p.parent);
                    p.parent.remove(p);
                }
            });

            // Hide Editor Visuals (AxesHelpers in Locators)
            const hiddenVisuals = [];
            currentModel.traverse(obj => {
                if (obj.userData.isEditorVisual) {
                    obj.visible = false;
                    hiddenVisuals.push(obj);
                }
            });
            const visualParents = new Map();
            const visualsToDetach = [];
            currentModel.traverse(obj => {
                // Traverse puts currentModel first.
                if (obj.userData.isEditorVisual && obj.parent) {
                    visualsToDetach.push(obj);
                }
            });

            visualsToDetach.forEach(obj => {
                visualParents.set(obj, obj.parent);
                obj.parent.remove(obj);
            });

            // Cleanup helper
            const wasHelperVisible = skeletonHelper.visible;
            scene.remove(skeletonHelper);
            transformControl.detach();

            try {
                // Get Project Name
                const nameInput = document.getElementById('project-name');
                if (nameInput && nameInput.value.trim()) {
                    projectName = nameInput.value.trim();
                }

                // Export Main
                const mainBlob = await exportToBlob(currentModel);
                folder.file(projectName + ".glb", mainBlob);

                // Export Separate Props
                for (const prop of separateProps) {
                    const propBlob = await exportToBlob(prop);
                    folder.file((prop.name || "Prop") + ".glb", propBlob);
                }

                // Generate Zip
                const content = await zip.generateAsync({ type: "blob" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = projectName + ".zip";
                link.click();

            } catch (err) {
                console.error("Export failed", err);
                alert("Export failed: " + err);
            } finally {
                // RESTORE everything

            input.onclick = (e) => e.stopPropagation();
            input.ondblclick = (e) => e.stopPropagation();

            const commit = () => {
                const newVal = input.value.trim();
                input.remove();
                span.style.display = '';
                if (newVal && newVal !== initialValue) {
                    onSave(newVal);
                }
            };

            const cancel = () => {
                input.remove();
                span.style.display = '';
            };

            input.addEventListener('blur', commit);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    commit();
                } else if (e.key === 'Escape') {
                    cancel();
                }
                e.stopPropagation(); // Prevent global hotkeys

            span.parentNode.insertBefore(input, span);
            input.focus();

        // Box Select Implementation
        window.startBoxSelect = function (e, container, clip, viewDuration) {
            const rect = container.getBoundingClientRect();
            const startX = e.clientX - rect.left;

            const box = document.createElement('div');
            box.className = 'selection-box';
            box.style.left = startX + 'px';
            box.style.top = '0';
            box.style.height = '100%';
            box.style.width = '0px';
            container.appendChild(box);

            const onMove = (ev) => {
                const currX = ev.clientX - rect.left;
                const min = Math.min(startX, currX);
                const max = Math.max(startX, currX);
                box.style.left = min + 'px';
                box.style.width = (max - min) + 'px';
            };

            const onUp = (ev) => {
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);

                const boxLeft = parseFloat(box.style.left);
                const boxWidth = parseFloat(box.style.width);

                const tStart = (boxLeft / rect.width) * viewDuration;
                const tEnd = ((boxLeft + boxWidth) / rect.width) * viewDuration;

                if (!ev.ctrlKey) selectedKeyframes.clear();

                // Ensure Set exists for this clip
                if (!selectedKeyframes.has(clip.name)) {
                    selectedKeyframes.set(clip.name, new Set());
                }
                const set = selectedKeyframes.get(clip.name);

                const uniqueTimes = new Set();
                clip.tracks.forEach(t => t.times.forEach(tv => uniqueTimes.add(tv)));

                uniqueTimes.forEach(t => {
                    if (t >= tStart && t <= tEnd) {
                        set.add(t);
                    }
                });

                box.remove();
                renderTimelineTracks();
                if (window.updateGizmoVisibility) window.updateGizmoVisibility();
            };

            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        };

        window.deleteSelectedKeyframes = function (clip) {
            if (selectedKeyframes.size === 0) return;

            clip.tracks.forEach(track => {

                const stride = track.getValueSize();

                // Filter
                const kept = [];
                times.forEach((t, idx) => {

                    let isSel = false;
                    for (let selT of selectedKeyframes) {
                        if (Math.abs(selT - t) < 0.001) { isSel = true; break; }

                    if (!isSel) {
                        kept.push({
                            t: t,
                            v: values.slice(idx * stride, (idx + 1) * stride)
                        });
                    }
                });

                track.times = new Float32Array(kept.map(d => d.t));

            function processClone(node, originalName) {
                // Generate unique name

                // Strip existing suffixes if any logic needed, but simple append is safer
                let newName = baseName + "_copy";
                let counter = 1;

                node.name = newName;

                if (node === clone) {

                        props.push(node);
                        // If it's a locator, we might need to recreate the visual sprite if clone didn't handle it perfectly
                        // (Clone copies children, so sprite is there, but unique name needs update on sprite?)
                        if (node.userData.isLocator) {
                            // Find old sprite and replace/update
                            const oldSprite = node.children.find(c => c.isSprite && c.userData.isEditorVisual);
                            if (oldSprite) {

        function createTextSprite(message) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const fontSize = 32;
            context.font = "Bold " + fontSize + "px Arial";
            const metrics = context.measureText(message);
            const textWidth = metrics.width;

            canvas.width = textWidth + 20;
            canvas.height = fontSize + 20;

            // Background
            context.fillStyle = "rgba(0, 0, 0, 0.5)";
            context.fillRect(0, 0, canvas.width, canvas.height);

            // Text
            context.fillStyle = "white";
            context.textAlign = "center";
            context.textBaseline = "middle";
            context.fillText(message, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, depthTest: false, depthWrite: false });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(canvas.width / 100, canvas.height / 100, 1);
            sprite.renderOrder = 999;
            return sprite;
        }

        // --- KEYFRAME EDITING ---

        window.updateOrAddKeyframe = function (clip, timeOrBone, timeOverride, restPose) {
            // Overload: (clip, object, time) OR (clip, time)
            let object = selectedBone;
            let time = timeOrBone;

            if (timeOrBone && timeOrBone.isBone) {
                object = timeOrBone;
                time = timeOverride;
            } else if (typeof timeOrBone === 'number') {
                time = timeOrBone;
                object = selectedBone;
            }

            if (!object) { alert("Select a bone to keyframe."); return; }
            if (!clip) return;

            const trackNameBase = object.name;

            // Properties to check
            const props = ['position', 'quaternion', 'scale'];
            const trackNames = {
                'position': trackNameBase + '.position',
                'quaternion': trackNameBase + '.quaternion',
                'scale': trackNameBase + '.scale'
            };

            // Interpolation mode
            const modeVal = document.getElementById('interpolation-select').value;
            let interp = THREE.InterpolateLinear;
            if (modeVal === "Smooth") interp = THREE.InterpolateSmooth;
            if (modeVal === "Step") interp = THREE.InterpolateDiscrete;

            props.forEach(prop => {
                const trackName = trackNames[prop];
                let track = clip.tracks.find(t => t.name === trackName);

                // Get current value
                let value;
                if (prop === 'position') value = object.position.toArray();
                if (prop === 'quaternion') value = object.quaternion.toArray();
                if (prop === 'scale') value = object.scale.toArray();

                if (!track) {
                    // Collect all unique times from other tracks to seed default values
                    const allTimes = new Set();
                    allTimes.add(time); // Ensure current time is there
                    clip.tracks.forEach(t => t.times.forEach(timeVal => allTimes.add(timeVal)));
                    const sortedTimes = Array.from(allTimes).sort((a, b) => a - b);

                    // Create values array
                    const values = [];
                    const itemSize = (prop === 'quaternion') ? 4 : 3;

                    sortedTimes.forEach(t => {
                        if (Math.abs(t - time) < 0.001) {
                            // Current time = Current Value
                            values.push(...value);
                        } else {
                            // Other times = Rest Pose (if provided) OR Current Value (Fallback)
                            if (restPose && restPose[prop]) {
                                values.push(...restPose[prop].toArray());
                            } else {
                                values.push(...value);
                            }
                        }
                    });

                    // Create Track
                    if (prop === 'quaternion') {
                        track = new THREE.QuaternionKeyframeTrack(trackName, sortedTimes, values);
                    } else {
                        track = new THREE.VectorKeyframeTrack(trackName, sortedTimes, values);
                    }
                    track.setInterpolation(interp);
                    clip.tracks.push(track);
                } else {
                    // Update or Add Key
                    const times = Array.from(track.times);
                    const values = Array.from(track.values);
                    const itemSize = track.getValueSize();

                    const idx = times.findIndex(t => Math.abs(t - time) < 0.001);

                    if (idx !== -1) {
                        // Update
                        for (let k = 0; k < itemSize; k++) {
                            values[idx * itemSize + k] = value[k];
                        }
                    } else {
                        // Add
                        times.push(time);
                        values.push(...value);

                        // Sort
                        const data = times.map((t, i) => ({
                            time: t,
                            val: values.slice(i * itemSize, (i + 1) * itemSize)
                        }));
                        data.sort((a, b) => a.time - b.time);

                        track.times = new Float32Array(data.map(d => d.time));
                        track.values = new Float32Array(data.flatMap(d => d.val));
                    }

                    // Update track data
                    track.times = new Float32Array(track.times); // ensure typed array if recreated
                    track.values = new Float32Array(track.values);
                }
            });
        };

        window.applyDeltaToKeyframes = function (clip, bone, timesSet, dP, dQ, dS) {
            if (!timesSet || timesSet.size === 0) return false;
            let modified = false;
            const name = bone.name;
            const props = ['.position', '.quaternion', '.scale'];
            const strideMap = { '.position': 3, '.quaternion': 4, '.scale': 3 };

            console.log(`[ApplyDelta] Bone: ${name}, Times: ${Array.from(timesSet).join(', ')}`);

            props.forEach((prop, i) => {
                const trackName = name + prop;
                const track = clip.tracks.find(t => t.name === trackName);
                if (!track) return;

                let values = Array.from(track.values);
                const s = strideMap[prop];

                let trackMod = false;

                // Iterate times in track to find matches
                track.times.forEach((t, idx) => {
                    // Check fuzzy match
                    let isSel = false;
                    for (let selT of timesSet) {
                        if (Math.abs(selT - t) < 0.001) { isSel = true; break; }
                    }

                    if (isSel) {
                        const baseIdx = idx * s;
                        if (prop === '.position') {
                            // vNew = vOld + dP
                            const v = new THREE.Vector3().fromArray(values, baseIdx);
                            v.add(dP);
                            v.toArray(values, baseIdx);
                            trackMod = true;
                        } else if (prop === '.quaternion') {
                            // qNew = qOld * dQ (apply delta rotation locally)
                            const q = new THREE.Quaternion().fromArray(values, baseIdx);
                            q.multiply(dQ);
                            q.toArray(values, baseIdx);
                            trackMod = true;
                        } else if (prop === '.scale') {
                            // sNew = sOld * dS (component-wise)
                            const v = new THREE.Vector3().fromArray(values, baseIdx);
                            v.multiply(dS);
                            v.toArray(values, baseIdx);
                            trackMod = true;
                        }
                    }
                });

                if (trackMod) {
                    console.log(`[ApplyDelta] Modifying track ${trackName}`);
                    track.values = new Float32Array(values);
                    modified = true;
                }
            });
            return modified;
        };

        window.addKeyframeToClipAtTime = function (clip, time) {
            // 1. Identify Target Bones
            let bonesToKey = [];

            // Find all bones controlled by this clip
            if (window.hierarchicalController) {
                // Brute force check all bones
                const allBones = [];
                if (skeletonHelper) allBones.push(...skeletonHelper.bones);
                else currentModel.traverse(o => { if (o.isBone) allBones.push(o); });

                allBones.forEach(b => {
                    const layer = window.hierarchicalController.getLayerForBone(b.name);
                    if (layer && layer.clipName === clip.name) {
                        bonesToKey.push(b);
                    }
                });
            }

            // Fallback: If no hierarchy logic or unassigned, keyframe selected bone if it matches?
            // Or just alert if empty.
            if (bonesToKey.length === 0) {
                if (selectedBone) bonesToKey.push(selectedBone);
                else {
                    // Try to be smart. If clip is "Animation 1" and assigned to Root, chances are it affects everything.
                    // But getLayerForBone should have caught it.
                    // If it didn't, maybe the method returned null?
                    alert("No bones found controlled by this clip.");
                    return;
                }
            }

            // 2. Snapshot
            const jsonBefore = clip.toJSON();

            // 3. Apply
            bonesToKey.forEach(bone => {
                // Pass explicit bone and time
                updateOrAddKeyframe(clip, bone, time);
            });

            // 4. Persistence & Refresh
            mixer.uncacheClip(clip);
            if (window.hierarchicalController) {
                window.hierarchicalController.invalidateClip(clip.name);
                window.hierarchicalController.rebuildAndPlay();
            }
            drawKeyframeMarkers(clip);

            const jsonAfter = clip.toJSON();
            addCommand({
                execute: () => restoreClipState(clip, jsonAfter),
                undo: () => restoreClipState(clip, jsonBefore)
            });

        window.fixAnimationLoop = function (clip) {
            if (!clip) return;
            // Strategy: For every track, read value at t=0, set keyframe at t=duration
            // Effectively making it cyclic.

            const jsonBefore = clip.toJSON();
            let changed = false;

            clip.tracks.forEach(track => {
                if (track.times.length === 0) return;

                const firstTime = track.times[0];
                const itemSize = track.getValueSize();
                const firstValue = [];
                for (let k = 0; k < itemSize; k++) firstValue.push(track.values[k]);

                // We want to set this value at 'clip.duration'
                const endTime = clip.duration;

                // Check if keyframe exists at exactly duration
                let existIdx = -1;
                for (let i = 0; i < track.times.length; i++) {
                    if (Math.abs(track.times[i] - endTime) < 0.0001) {
                        existIdx = i;
                        break;
                    }
                }

                if (existIdx !== -1) {
                    // Update exisiting
                    for (let k = 0; k < itemSize; k++) track.values[existIdx * itemSize + k] = firstValue[k];
                    changed = true;
                } else {
                    // Add new
                    const newTimes = Array.from(track.times);
                    const newValues = Array.from(track.values);
                    newTimes.push(endTime);
                    newValues.push(...firstValue);

                    // Re-sort required? Yes.
                    // Map to objects
                    const data = newTimes.map((t, i) => ({
                        t: t,
                        v: newValues.slice(i * itemSize, (i + 1) * itemSize)
                    }));
                    data.sort((a, b) => a.t - b.t);

                    track.times = new Float32Array(data.map(d => d.t));
                    track.values = new Float32Array(data.flatMap(d => d.v));
                    changed = true;
                }
            });

            if (changed) {
                // Refresh
                if (window.hierarchicalController) {
                    window.hierarchicalController.invalidateClip(clip.name);
                    window.hierarchicalController.rebuildAndPlay();
                } else {
                    mixer.uncacheClip(clip);
                    // Simple reload
                    if (currentAction && currentAction.getClip().name === clip.name) {
                        const t = currentAction.time;
                        currentAction.stop();
                        currentAction = mixer.clipAction(clip);
                        currentAction.time = t;
                        currentAction.play();
                    }
                }
                drawKeyframeMarkers(clip);

                const jsonAfter = clip.toJSON();
                addCommand({
                    execute: () => restoreClipState(clip, jsonAfter),
                    undo: () => restoreClipState(clip, jsonBefore)
                });
            }
        };

        window.copyKeyframesToTime = function (clip, targetTime) {
            if (!selectedKeyframes.has(clip.name)) return;
            const selTimes = Array.from(selectedKeyframes.get(clip.name)).sort((a, b) => a - b);
            if (selTimes.length === 0) return;

            const startTime = selTimes[0];
            const offset = targetTime - startTime;

            const jsonBefore = clip.toJSON();
            let changed = false;

            clip.tracks.forEach(track => {
                const times = track.times;
                const values = track.values;
                const itemSize = track.getValueSize();

                // Identify keyframes to copy
                // We'll gather them first
                const keysToCopy = [];
                for (let i = 0; i < times.length; i++) {
                    const t = times[i];
                    // Exact match check
                    for (let sel of selTimes) {
                        if (Math.abs(t - sel) < 0.001) {
                            // Copy this key
                            keysToCopy.push({
                                t: t + offset,
                                v: values.slice(i * itemSize, (i + 1) * itemSize)
                            });
                            break;
                        }
                    }
                }

                if (keysToCopy.length > 0) {
                    // Merge into track
                    const newTimes = Array.from(times);
                    const newValues = Array.from(values);

                    keysToCopy.forEach(k => {
                        // Check if key exists at k.t
                        // We use a simple overwrite logic or insert
                        let found = false;
                        for (let j = 0; j < newTimes.length; j++) {
                            if (Math.abs(newTimes[j] - k.t) < 0.001) {
                                // Overwrite
                                for (let m = 0; m < itemSize; m++) {
                                    newValues[j * itemSize + m] = k.v[m];
                                }
                                found = true;
                                break;
                            }
                        }
                        if (!found) {
                            newTimes.push(k.t);
                            newValues.push(...k.v);
                        }
                    });

                    // Sort
                    const map = newTimes.map((t, i) => ({ t: t, v: newValues.slice(i * itemSize, (i + 1) * itemSize) }));
                    map.sort((a, b) => a.t - b.t);

                    track.times = new Float32Array(map.map(d => d.t));
                    track.values = new Float32Array(map.flatMap(d => d.v));
                    changed = true;
                }
            });

            if (changed) {
                if (window.hierarchicalController) {
                    window.hierarchicalController.invalidateClip(clip.name);
                    window.hierarchicalController.rebuildAndPlay();
                } else {
                    mixer.uncacheClip(clip);
                    if (currentAction && currentAction.getClip().name === clip.name) {
                        const t = currentAction.time;
                        currentAction.stop();
                        currentAction = mixer.clipAction(clip);
                        currentAction.time = t;
                        currentAction.play();

                addCommand({

                    undo: () => restoreClipState(clip, jsonBefore)
                });
            }

                reader.readAsDataURL(blob);
                reader.onloadend = function () {
                    const base64data = reader.result;

                    const project = {

                        modelData: base64data,
                        meta: {

                        animState: {

        function onPointerDown(event) {
            if (event.button !== 0) return; // Only Left Click

            const rect = renderer.domElement.getBoundingClientRect();
            const mouse = new THREE.Vector2(
                ((event.clientX - rect.left) / rect.width) * 2 - 1,
                -((event.clientY - rect.top) / rect.height) * 2 + 1
            );

            // CTRL Logic: Strict Selection Mode
            if (event.ctrlKey) {

                // If picking parent
                if (pickingParentFor) {
                    // We need to raycast for bones (existing logic below does this)
                    // Let's reuse the logic but intercept the result
                }

                orbit.enabled = false;

                // New Geometric Selection (Ray to Segment)
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(mouse, camera);
                const ray = raycaster.ray;

                let closestBone = null;
                let minDistanceSq = Infinity;

                // 1. Check Bone Visualizers (Ray intersection)
                // Use window.boneVisuals
                if (window.boneVisuals && window.boneVisuals.size > 0) {
                    const visuals = Array.from(window.boneVisuals.values());
                    const intersects = raycaster.intersectObjects(visuals, false); // Objects are spheres

                    if (intersects.length > 0) {
                        // Closest hit
                        const hit = intersects[0];
                        if (hit.object.userData && hit.object.userData.isBoneHelper) {
                            closestBone = hit.object.parent; // The bone is the parent
                            minDistanceSq = hit.distance; // Use linear distance for consistency logic if mixed? 
                            // But here we just take the hit.
                        }
                    }
                }

                // If no visual hit, should we fallback? 
                // Maybe the visuals are hidden or missing? 
                // We ensureAllBoneVisuals() on load.
                // If opacity is 0, raycast still hits them in Three.js IF valid material?
                // Actually Raycaster hits invisible objects ONLY if raycaster.params.Mesh.threshold is handled or we pass proper flag?
                // NO, Raycaster intersects invisible objects? 
                // By default, it does NOT?
                // We must check. Three.js Raycaster usually ignores visible=false.
                // But our spheres are visible=true, opacity=0 (or low). So they are "visible".
                // So it should work.

                // 2. Check Props
                let closestProp = null;
                if (props.length > 0) {
                    const propIntersects = raycaster.intersectObjects(props, true);
                    if (propIntersects.length > 0) {
                        closestProp = propIntersects[0].object;
                        // Determine if prop is closer than bone
                        // propIntersects[0].distance is Camera -> Object distance
                        // minDistanceSq is Ray -> Object perpendicular distance (squared)

                        // We need comparable metrics. 
                        // Let's check the ray distance for the prop hit point?
                        // Actually, Raycaster gives accurate hit.
                        // If we hit a prop, we usually want to select it unless a bone is *visually in front*?
                        // But Bone "lines" are thin. 

                        // User Preference: "just calculate distance to the clicked raycast from each bone"
                        // This implies we prioritize bones if we are "close enough" to them.
                    }
                }

                // 3. Selection Decision

                // Prioritize Bone Visual Hit
                if (closestBone) {
                    if (pickingParentFor) {
                        // Execution Attachment
                        closestBone.attach(pickingParentFor);
                        document.getElementById('selection-info').innerText = "Attached " + (pickingParentFor.name || "Prop") + " to " + closestBone.name;
                        document.getElementById('selection-info').style.color = "";
                        pickingParentFor = null;
                        transformControl.attach(closestBone.children[closestBone.children.length - 1]);
                        return;
                    }
                    selectBone(closestBone);
                } else if (closestProp) {
                    if (pickingParentFor) {
                        alert("Please select a bone.");
                        return;
                    }
                    // Select Prop
                    let target = closestProp;
                    while (target.parent && target.parent !== scene && !props.includes(target)) {
                        target = target.parent;
                    }
                    if (props.includes(target)) {
                        transformControl.attach(target);
                        selectedBone = null;
                        document.getElementById('selection-info').innerText = "Prop: " + (target.name || "Prop");
                        if (ikTargetHelper) ikTargetHelper.visible = false;
                    }
                } else {
                    selectBone(null);
                }

                return;
            }

            // Normal Logic (No Ctrl)
            if (transformControl.axis) {
                orbit.enabled = false;
                return;
            }
            orbit.enabled = true;
        }
