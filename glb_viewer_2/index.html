<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal GLB Viewer</title>
    <link rel="stylesheet" href="style.css">

    <!-- Pako for deflate/inflate compression -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

    <!-- Import Map for Three.js (MUST be before any type="module" scripts) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- Import Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>

<body>

    <!-- STATE 1: Model Input (Shown if no ?model= parameter) -->
    <div id="input-screen" class="screen active">
        <div class="input-container">
            <h1>GLB Viewer</h1>
            <p>Enter a URL to a .glb or .gltf file to view it.</p>
            <input type="text" id="model-url-input" placeholder="https://example.com/model.glb">
            <div class="input-buttons">
                <button id="load-btn">View Model</button>
                <button id="edit-btn" class="btn-editor">Edit Scene</button>
            </div>
        </div>
    </div>

    <!-- STATE 2: Editor Screen -->
    <div id="editor-screen" class="screen">
        <div id="editor-main">
            <canvas id="editor-canvas"></canvas>
            <div id="bottom-panel-wrapper">
                <div id="panel-drag-handle" class="panel-drag-handle">
                    <div class="handle-bar"></div>
                </div>
                <div id="editor-toolbar">
                    <div class="toolbar-center">
                        <button class="back-btn tool-btn" id="btn-back" data-target="input-screen">←</button>
                        <button class="tool-btn active" id="btn-none" title="View Only (V)"
                            data-mode="none">👁️</button>
                        <button class="tool-btn" id="btn-generic" title="Generic Interaction (G)"
                            data-mode="generic">👆</button>
                        <button class="tool-btn" id="btn-cursor" title="Set Pivot / Cursor (C)"
                            data-mode="cursor">📍</button>
                        <div class="toolbar-sep"></div>
                        <button class="tool-btn" id="btn-move" title="Move (W)" data-mode="translate">✢</button>
                        <button class="tool-btn" id="btn-rotate" title="Rotate (E)" data-mode="rotate">↻</button>
                        <button class="tool-btn" id="btn-scale" title="Scale (R)" data-mode="scale">⤢</button>
                        <div class="toolbar-sep"></div>
                        <button class="tool-btn" id="btn-space" title="Toggle World/Local (Q)">L</button>
                    </div>
                    <div class="toolbar-right">
                        <button class="btn btn-accent" id="btn-open-viewer" title="Open in Model Viewer">👁</button>
                        <button class="btn btn-share" id="btn-share" title="Copy shareable link">🔗</button>
                    </div>
                </div>
                <div id="object-panel">
                    <div class="panel-header">Objects</div>
                    <div id="object-list"></div>
                    <div class="panel-actions">
                        <button class="btn btn-small" id="btn-clone" title="Clone Selected (Ctrl+D)">📋 Clone</button>
                        <button class="btn btn-small btn-danger" id="btn-delete" title="Delete Selected (Del)">🗑️
                            Delete</button>
                    </div>
                    <div id="transform-info" class="transform-info"></div>
                </div>
            </div>
        </div>
        <div id="editor-status">Ready</div>
    </div>

    <!-- STATE 3: Standard Viewer (Full Screen) -->
    <div id="standard-viewer-screen" class="screen">
        <button class="back-btn" data-target="input-screen">← Back</button>
        <button class="btn btn-accent edit-from-viewer" id="btn-edit-from-viewer" title="Open in Editor">✏️
            Edit</button>
        <model-viewer id="main-model-viewer" src="" alt="3D Model" environment-image="neutral" camera-controls
            interaction-prompt="auto" shadow-intensity="1" touch-action="none" min-camera-orbit="auto auto 0m">
            <div class="progress-bar hide" slot="progress-bar">
                <div class="update-bar"></div>
            </div>
        </model-viewer>
        <button id="ar-launch-btn" class="ar-launch-btn">View in your space</button>
    </div>

    <!-- AR Overlay (custom Three.js WebXR) -->
    <div id="ar-overlay" class="ar-overlay">
        <!-- AR Toolbar -->
        <div id="ar-toolbar-container">
            <div id="ar-toolbar-drag-handle">
                <div class="handle-bar"></div>
            </div>
            <div id="ar-toolbar">
                <button class="ar-tool-btn" data-mode="placement" title="Place Object">🎯</button>
                <button class="ar-tool-btn" data-mode="cursor" title="Set Pivot (Cursor)">📍</button>
                <button class="ar-tool-btn" data-mode="generic" title="Generic (Touch)">👆</button>
                <div class="ar-toolbar-sep"></div>
                <button class="ar-tool-btn" data-mode="translate" title="Move">✢</button>
                <button class="ar-tool-btn" data-mode="rotate" title="Rotate">↻</button>
                <button class="ar-tool-btn" data-mode="scale" title="Scale">⤢</button>
                <div class="ar-toolbar-sep"></div>
                <button class="ar-tool-btn danger" id="ar-exit-btn" title="Exit AR">✕</button>
            </div>
        </div>
    </div>

    <!-- Loading overlay for scene composition -->
    <div id="loading-overlay" class="screen">
        <div class="loading-content">
            <div class="spinner"></div>
            <p id="loading-text">Composing scene...</p>
        </div>
    </div>

    <script>
        // --- Bottom panel drag-to-resize/hide ---
        (function () {
            const handle = document.getElementById('panel-drag-handle');
            const panel = document.getElementById('object-panel');
            const editorMain = document.getElementById('editor-main');
            if (!handle || !panel || !editorMain) return;

            let isDragging = false;
            let handleOffset = 0;
            const MIN_HEIGHT = 40;
            const TOOLBAR_HEIGHT = 50;
            const DEFAULT_HEIGHT = TOOLBAR_HEIGHT;
            const HANDLE_HEIGHT = 24;

            function getClientY(e) {
                if (e.clientY != null) return e.clientY;
                if (e.touches && e.touches.length) return e.touches[0].clientY;
                return null;
            }

            function onPointerDown(e) {
                const clientY = getClientY(e);
                if (clientY == null) return;
                isDragging = true;
                handleOffset = clientY - handle.getBoundingClientRect().top;
                panel.style.transition = 'none';
                handle.classList.add('dragging');
                document.body.style.cursor = 'ns-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                const clientY = getClientY(e);
                if (clientY == null) return;
                const containerRect = editorMain.getBoundingClientRect();
                const handleTop = clientY - handleOffset;
                const handleBottom = handleTop + HANDLE_HEIGHT;
                let newHeight = containerRect.bottom - handleBottom;
                const maxHeight = containerRect.height - HANDLE_HEIGHT - 20;
                newHeight = Math.max(0, Math.min(newHeight, maxHeight));
                panel.style.height = newHeight + 'px';
                if (newHeight < MIN_HEIGHT) {
                    panel.classList.add('collapsed');
                } else {
                    panel.classList.remove('collapsed');
                }
            }

            function onPointerUp() {
                if (!isDragging) return;
                isDragging = false;
                panel.style.transition = '';
                handle.classList.remove('dragging');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                if (panel.offsetHeight < MIN_HEIGHT) {
                    panel.style.height = '0px';
                    panel.classList.add('collapsed');
                }
            }

            handle.addEventListener('dblclick', () => {
                if (panel.classList.contains('collapsed') || panel.offsetHeight < MIN_HEIGHT) {
                    panel.style.height = DEFAULT_HEIGHT + 'px';
                    panel.classList.remove('collapsed');
                } else {
                    panel.style.height = '0px';
                    panel.classList.add('collapsed');
                }
            });

            handle.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('mouseup', onPointerUp);
            handle.addEventListener('touchstart', onPointerDown, { passive: false });
            document.addEventListener('touchmove', onPointerMove, { passive: false });
            document.addEventListener('touchend', onPointerUp);
        })();
    </script>

    <script type="module" src="app.js"></script>
</body>

</html>
