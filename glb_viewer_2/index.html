<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal GLB Viewer</title>
    <link rel="stylesheet" href="style.css">

    <!-- Pako for deflate/inflate compression -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

    <!-- Import Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <!-- Import Map for Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <!-- STATE 1: Model Input (Shown if no ?model= parameter) -->
    <div id="input-screen" class="screen active">
        <div class="input-container">
            <h1>GLB Viewer</h1>
            <p>Enter a URL to a .glb or .gltf file to view it.</p>
            <input type="text" id="model-url-input" placeholder="https://example.com/model.glb">
            <div class="input-buttons">
                <button id="load-btn">View Model</button>
                <button id="edit-btn" class="btn-editor">Edit Scene</button>
            </div>
        </div>
    </div>

    <!-- STATE 2: Editor Screen -->
    <div id="editor-screen" class="screen">
        <div id="editor-toolbar">
            <div class="toolbar-left">
                <button class="back-btn" data-target="input-screen">←</button>
                <h3 id="editor-title">Scene Editor</h3>
            </div>
            <div class="toolbar-center">
                <button class="tool-btn active" id="btn-move" title="Move (W)" data-mode="translate">✢</button>
                <button class="tool-btn" id="btn-rotate" title="Rotate (E)" data-mode="rotate">↻</button>
                <button class="tool-btn" id="btn-scale" title="Scale (R)" data-mode="scale">⤢</button>
                <div class="toolbar-sep"></div>
                <button class="tool-btn" id="btn-space" title="Toggle World/Local (Q)">L</button>
            </div>
            <div class="toolbar-right">
                <button class="btn btn-accent" id="btn-open-viewer" title="Open in Model Viewer">👁 View</button>
                <button class="btn btn-share" id="btn-share" title="Copy shareable link">🔗 Share</button>
            </div>
        </div>
        <div id="editor-main">
            <canvas id="editor-canvas"></canvas>
            <div id="object-panel">
                <div class="panel-header">Objects</div>
                <div id="object-list"></div>
                <div class="panel-actions">
                    <button class="btn btn-small" id="btn-clone" title="Clone Selected (Ctrl+D)">📋 Clone</button>
                    <button class="btn btn-small btn-danger" id="btn-delete" title="Delete Selected (Del)">🗑️
                        Delete</button>
                </div>
                <div id="transform-info" class="transform-info"></div>
            </div>
        </div>
        <div id="editor-status">Ready</div>
    </div>

    <!-- STATE 3: Standard Viewer (Full Screen) -->
    <div id="standard-viewer-screen" class="screen">
        <button class="back-btn" data-target="input-screen">← Back</button>
        <button class="btn btn-accent edit-from-viewer" id="btn-edit-from-viewer" title="Open in Editor">✏️
            Edit</button>
        <model-viewer id="main-model-viewer" src="" alt="3D Model" ar ar-modes="scene-viewer quick-look"
            ar-placement="floor" environment-image="neutral" camera-controls shadow-intensity="1"
            min-camera-orbit="auto auto 0m">
            <div class="progress-bar hide" slot="progress-bar">
                <div class="update-bar"></div>
            </div>
            <button slot="ar-button" id="ar-button">
                View in your space
            </button>
        </model-viewer>
    </div>

    <!-- Loading overlay for scene composition -->
    <div id="loading-overlay" class="screen">
        <div class="loading-content">
            <div class="spinner"></div>
            <p id="loading-text">Composing scene...</p>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
