<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal GLB Viewer</title>
    <link rel="stylesheet" href="style.css">

    <!-- Pako for deflate/inflate compression -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

    <!-- Import Map for Three.js (MUST be before any type="module" scripts) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@huggingface/transformers": "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3"
            }
        }
    </script>

    <!-- Import Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>

<body>
    <!-- TOP NAVIGATION BAR -->
    <div id="top-nav-bar" class="top-nav">
        <button id="nav-tab-editor" class="nav-tab" data-target="editor">🖥️ Viewer</button>
        <button id="nav-tab-ar" class="nav-tab" data-target="ar">👓 AR Viewer</button>
        <button id="nav-tab-scanner" class="nav-tab" data-target="scanner">📡 AR Scanner</button>
        <div style="flex-grow: 1;"></div>
        <button id="btn-export-glb" class="btn btn-accent" title="Export GLB">💾 Export GLB</button>
    </div>

    <!-- STATE 1: Model Input (Shown if no ?model= parameter) -->
    <div id="input-screen" class="screen active">
        <div class="input-container">
            <h1>GLB Viewer</h1>
            <p>Enter a URL to a .glb or .gltf file to view it.</p>
            <input type="text" id="model-url-input" placeholder="https://example.com/model.glb">
            <div class="input-buttons">
                <button id="btn-start-editor" class="btn-editor">Normal Viewer</button>
                <button id="btn-start-ar">AR Viewer</button>
                <button id="btn-start-scanner" style="background-color: #6f42c1;">AR Scanner</button>
            </div>
        </div>
    </div>

    <!-- STATE 2: Editor Screen -->
    <div id="editor-screen" class="screen">
        <div id="editor-main">
            <canvas id="editor-canvas"></canvas>
            <div id="bottom-panel-wrapper" class="bottom-panel-wrapper">
                <div id="panel-drag-handle" class="panel-drag-handle">
                    <div class="handle-bar"></div>
                </div>
                <div id="editor-toolbar" class="toolbar-container">
                    <div class="toolbar-center">
                        <button class="back-btn tool-btn" id="btn-back" data-target="input-screen">←</button>
                        <button class="tool-btn active" id="btn-none" title="View Only (V)"
                            data-mode="none">👁️</button>
                        <button class="tool-btn" id="btn-select" title="Select (S)" data-mode="select">🖱️</button>
                        <button class="tool-btn" id="btn-generic" title="Generic Interaction (G)"
                            data-mode="generic">👆</button>
                        <button class="tool-btn" id="btn-cursor" title="Set Pivot / Cursor (C)"
                            data-mode="cursor">📍</button>
                        <div class="toolbar-sep"></div>
                        <button class="tool-btn" id="btn-move" title="Move (W)" data-mode="translate">✢</button>
                        <button class="tool-btn" id="btn-rotate" title="Rotate (E)" data-mode="rotate">↻</button>
                        <button class="tool-btn" id="btn-scale" title="Scale (R)" data-mode="scale">⤢</button>
                        <div class="toolbar-sep"></div>
                        <button class="tool-btn" id="btn-space" title="Toggle World/Local (Q)">L</button>
                        <button class="tool-btn" id="btn-editor-undo" title="Undo (Ctrl+Z)">↩️</button>
                    </div>
                    <div class="toolbar-right">
                        <button class="btn btn-share" id="btn-share" title="Copy shareable link">🔗</button>
                    </div>
                </div>
                <div id="object-panel" class="object-panel">
                    <div class="panel-header">Objects</div>
                    <div id="object-list"></div>
                    <div class="panel-actions">
                        <button class="btn btn-small" id="btn-clone" title="Clone Selected (Ctrl+D)">📋 Clone</button>
                        <button class="btn btn-small btn-danger" id="btn-delete" title="Delete Selected (Del)">🗑️
                            Delete</button>
                    </div>
                    <div id="transform-info" class="transform-info"></div>
                    <div id="editor-debug-console" class="debug-console">Ready</div>
                </div>
            </div>
        </div>
    </div>

    <!-- STATE 3: Standard Viewer (Full Screen) -->
    <div id="standard-viewer-screen" class="screen">
        <button class="back-btn" data-target="input-screen">← Back</button>
        <button class="btn btn-accent edit-from-viewer" id="btn-edit-from-viewer" title="Open in Editor">✏️
            Edit</button>
        <model-viewer id="main-model-viewer" src="" alt="3D Model" environment-image="neutral" camera-controls
            interaction-prompt="auto" shadow-intensity="1" touch-action="none" min-camera-orbit="auto auto 0m">
            <div class="progress-bar hide" slot="progress-bar">
                <div class="update-bar"></div>
            </div>
        </model-viewer>
        <button id="ar-launch-btn" class="ar-launch-btn">View in your space</button>
    </div>

    <!-- AR Overlay (custom Three.js WebXR) -->
    <div id="ar-overlay" class="ar-overlay">
        <!-- AR Toolbar -->
        <div id="ar-toolbar-container" class="bottom-panel-wrapper">
            <div id="ar-toolbar-drag-handle" class="panel-drag-handle">
                <div class="handle-bar"></div>
            </div>
            <div id="ar-toolbar" class="toolbar-container">
                <div class="toolbar-center">
                    <button class="tool-btn" data-mode="placement" title="Place Object">🎯</button>
                    <button class="tool-btn" data-mode="select" title="Select Object">🖱️</button>
                    <button class="tool-btn" data-mode="cursor" title="Set Pivot (Cursor)">📍</button>
                    <button class="tool-btn" data-mode="generic" title="Generic (Touch)">👆</button>
                    <div class="toolbar-sep"></div>
                    <button class="tool-btn" data-mode="translate" title="Move">✢</button>
                    <button class="tool-btn" data-mode="rotate" title="Rotate">↻</button>
                    <button class="tool-btn" data-mode="scale" title="Scale">⤢</button>
                    <div class="toolbar-sep"></div>
                    <button class="tool-btn" id="ar-undo-btn" title="Undo">↩️</button>
                </div>
            </div>
            <div id="ar-object-panel" class="object-panel collapsed" style="height: 0px;">
                <div id="ar-object-list"></div>
                <div class="panel-actions">
                    <button class="btn btn-small" id="ar-btn-clone" title="Clone Selected">📋 Clone</button>
                    <button class="btn btn-small btn-danger" id="ar-btn-delete" title="Delete Selected">🗑️
                        Delete</button>
                </div>
                <div id="ar-transform-info" class="transform-info"></div>
                <div id="ar-debug-console" class="debug-console">AR Ready</div>
            </div>
        </div>
    </div>

    <!-- AR Scanner Overlay (custom Three.js WebXR) -->
    <div id="ar-scanner-overlay" class="ar-overlay">
        <!-- Depth model loading overlay -->
        <div id="scanner-model-loading" style="display:none; position:absolute; inset:0; z-index:9999;
            background:rgba(0,0,0,0.85); color:#fff; display:none;
            flex-direction:column; align-items:center; justify-content:center; gap:12px; font-family:sans-serif;">
            <div style="font-size:1.3rem; font-weight:600;">Loading Depth Model…</div>
            <div id="scanner-model-progress" style="font-size:0.95rem; opacity:0.8;">Downloading…</div>
            <div
                style="width:60%; max-width:300px; height:6px; background:rgba(255,255,255,0.2); border-radius:3px; overflow:hidden;">
                <div id="scanner-model-progress-bar"
                    style="width:0%; height:100%; background:#00e676; border-radius:3px; transition:width 0.2s;"></div>
            </div>
        </div>
        <div id="scanner-bottom-wrapper" class="bottom-panel-wrapper">
            <div id="scanner-toolbar-drag-handle" class="panel-drag-handle">
                <div class="handle-bar"></div>
            </div>
            <div id="scanner-toolbar" class="toolbar-container"
                style="background: rgba(30,30,30,0.85); border-top: 1px solid var(--border);">
                <div class="toolbar-center">
                    <button class="tool-btn" id="scanner-scan-btn" title="Hold to Scan">📡</button>
                    <button class="tool-btn" id="scanner-undo-btn" title="Undo Last Scan">↩️</button>
                </div>
            </div>
            <div id="scanner-object-panel" class="object-panel collapsed" style="height: 0px;">
                <div id="scanner-debug-console" class="debug-console">Scanner Ready</div>
            </div>
        </div>
    </div>

    <!-- Loading overlay for scene composition -->
    <div id="loading-overlay" class="screen">
        <div class="loading-content">
            <div class="spinner"></div>
            <p id="loading-text">Composing scene...</p>
        </div>
    </div>

    <script>
        // --- Bottom panel drag-to-resize/hide ---
        function initDragPanel(handleId, panelId, containerId) {
            const handle = document.getElementById(handleId);
            const panel = document.getElementById(panelId);
            const container = containerId ? document.getElementById(containerId) : document.body;
            if (!handle || !panel || !container) return;

            let isDragging = false;
            let handleOffset = 0;
            const MIN_HEIGHT = 40;
            const TOOLBAR_HEIGHT = 50;
            const DEFAULT_HEIGHT = TOOLBAR_HEIGHT;
            const HANDLE_HEIGHT = 24;

            function getClientY(e) {
                if (e.clientY != null) return e.clientY;
                if (e.touches && e.touches.length) return e.touches[0].clientY;
                return null;
            }

            function onPointerDown(e) {
                const clientY = getClientY(e);
                if (clientY == null) return;
                isDragging = true;
                handleOffset = clientY - handle.getBoundingClientRect().top;
                panel.style.transition = 'none';
                handle.classList.add('dragging');
                document.body.style.cursor = 'ns-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                const clientY = getClientY(e);
                if (clientY == null) return;
                const containerRect = container.getBoundingClientRect();
                const handleTop = clientY - handleOffset;
                const handleBottom = handleTop + HANDLE_HEIGHT;
                let newHeight = containerRect.bottom - handleBottom;
                const maxHeight = containerRect.height - HANDLE_HEIGHT - 20;
                newHeight = Math.max(0, Math.min(newHeight, maxHeight));
                panel.style.height = newHeight + 'px';
                if (newHeight < MIN_HEIGHT) {
                    panel.classList.add('collapsed');
                } else {
                    panel.classList.remove('collapsed');
                }
            }

            function onPointerUp() {
                if (!isDragging) return;
                isDragging = false;
                panel.style.transition = '';
                handle.classList.remove('dragging');
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                if (panel.offsetHeight < MIN_HEIGHT) {
                    panel.style.height = '0px';
                    panel.classList.add('collapsed');
                }
            }

            handle.addEventListener('dblclick', () => {
                if (panel.classList.contains('collapsed') || panel.offsetHeight < MIN_HEIGHT) {
                    panel.style.height = DEFAULT_HEIGHT + 'px';
                    panel.classList.remove('collapsed');
                } else {
                    panel.style.height = '0px';
                    panel.classList.add('collapsed');
                }
            });

            handle.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('mouseup', onPointerUp);
            handle.addEventListener('touchstart', onPointerDown, { passive: false });
            document.addEventListener('touchmove', onPointerMove, { passive: false });
            document.addEventListener('touchend', onPointerUp);
        }

        initDragPanel('panel-drag-handle', 'object-panel', 'editor-main');
        initDragPanel('ar-toolbar-drag-handle', 'ar-object-panel', 'ar-overlay');
        initDragPanel('scanner-toolbar-drag-handle', 'scanner-object-panel', 'ar-scanner-overlay');
    </script>

    <script type="module" src="app.js"></script>
</body>

</html>
