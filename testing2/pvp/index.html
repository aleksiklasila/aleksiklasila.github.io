<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neon PvP Scroller</title>
    <style>
        :root { --bg: #121212; --ui-bg: rgba(20, 20, 20, 0.9); --accent: #00ffcc; }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', sans-serif; color: white; user-select: none; }
        canvas { display: block; }
        
        /* UI LAYERS */
        #ui-layer { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; }
        
        /* HUD */
        .hud { padding: 20px; display: flex; justify-content: space-between; font-size: 24px; font-weight: bold; text-shadow: 0 2px 4px black; }
        .p1-stats { color: #ff5555; }
        .p2-stats { color: #5555ff; }

        /* MENUS */
        .menu-box {
            pointer-events: auto;
            background: var(--ui-bg);
            border: 2px solid var(--accent);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            min-width: 300px;
        }
        
        /* EDITOR TOOLBAR (Bottom) */
        #editor-toolbar {
            pointer-events: auto;
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: var(--ui-bg);
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-top: 2px solid var(--accent);
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        #editor-toolbar.active { transform: translateY(0); }

        /* CONTROLS */
        button {
            background: #333; color: white; border: 1px solid #666;
            padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: bold;
            transition: 0.2s; border-radius: 4px;
        }
        button:hover { background: var(--accent); color: black; border-color: white; }
        button.active { background: var(--accent); color: black; box-shadow: 0 0 10px var(--accent); }
        
        .tile-selector {
            width: 32px; height: 32px; border: 2px solid #555; cursor: pointer;
            display: inline-block; transition: 0.2s;
        }
        .tile-selector:hover, .tile-selector.selected { border-color: white; transform: scale(1.1); box-shadow: 0 0 8px white; }

        .hidden { display: none !important; }
        h1 { margin-top: 0; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
        .hint { font-size: 12px; color: #888; margin-top: 5px; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud hidden" id="hud">
            <div class="p1-stats">P1: <span id="s1">0</span> <br><small id="g1">Pistol</small></div>
            <div style="text-align:center; font-size:14px; color:#777">JUMP PADS ONLY<br>WASD vs ARROWS</div>
            <div class="p2-stats" style="text-align:right">P2: <span id="s2">0</span> <br><small id="g2">Pistol</small></div>
        </div>

        <div id="main-menu" class="menu-box">
            <h1>Neon Arena</h1>
            <p>2 Players | Local PvP</p>
            <button onclick="startGame()">PLAY GAME</button>
            <button onclick="startEditor()">MAP EDITOR</button>
            <div class="hint">P1: WASD+E | P2: Arrows+Enter</div>
        </div>

        <div id="editor-toolbar">
            <div style="display:flex; gap:5px; border-right: 1px solid #555; padding-right:15px; margin-right:10px;" id="tile-palette"></div>
            <button onclick="saveMap()">SAVE</button>
            <button onclick="loadMap()">LOAD</button>
            <button onclick="clearMap()">CLEAR</button>
            <div style="width:20px"></div>
            <button onclick="stopEditor()" style="background:#cc4444; border-color:#f00;">PLAY THIS MAP</button>
        </div>
    </div>

<script>
/** * CONFIGURATION 
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const TILE = 32;

// Physics
const GRAVITY = 0.6;
const FRICTION = 0.85; // Higher = slidy, Lower = sticky
const ACCEL = 1.5;     // Player speed
const MAX_SPEED = 12;

// Colors & Tiles
const TILES = {
    0: { name: 'Air', color: null, solid: false },
    1: { name: 'Wall', color: '#444', solid: true },
    2: { name: 'Jump Pad', color: '#00ff00', solid: true, jump: -14, glow: true },
    3: { name: 'Super Jump', color: '#00ffff', solid: true, jump: -22, glow: true },
    4: { name: 'Spike', color: '#666', solid: false, kill: true, draw: 'tri' },
    5: { name: 'Lava', color: '#ff4400', solid: false, kill: true, glow: true },
    6: { name: 'Ice', color: '#aaddff', solid: true, friction: 0.96 },
    7: { name: 'Box Spawn', color: '#ffd700', solid: false, spawn: true, draw: 'cross' },
    8: { name: 'Heal', color: '#ff00ff', solid: false, heal: true, draw: 'heart' },
    9: { name: 'Glass', color: 'rgba(200,240,255,0.4)', solid: true, breakable: true },
};

// Guns
const GUNS = [
    { name: 'Pistol', delay: 25, speed: 12, dmg: 10, spread: 0.05, count: 1, color: '#fff' },
    { name: 'Uzi', delay: 4, speed: 14, dmg: 4, spread: 0.15, count: 1, color: '#ff0' },
    { name: 'Shotgun', delay: 45, speed: 11, dmg: 7, spread: 0.4, count: 6, color: '#f00' },
    { name: 'Sniper', delay: 70, speed: 30, dmg: 60, spread: 0, count: 1, color: '#0f0' },
    { name: 'Launcher', delay: 55, speed: 8, dmg: 35, spread: 0.1, count: 1, explode: true, color: '#fa0' }
];

/**
 * GAME STATE
 */
let state = 'MENU'; // MENU, PLAY, EDITOR
let map = [];
let cols, rows;
let width, height;
let particles = [];
let bullets = [];
let boxes = [];
let frame = 0;
let shake = 0;
let editorSelection = 1;

// Inputs
const keys = {};

/**
 * CLASSES
 */
class Player {
    constructor(id, x, y, color, ctrls) {
        this.id = id;
        this.x = x; this.y = y;
        this.w = 20; this.h = 26;
        this.vx = 0; this.vy = 0;
        this.color = color;
        this.ctrls = ctrls;
        this.hp = 100;
        this.gun = 0;
        this.cooldown = 0;
        this.score = 0;
        this.facing = 1;
        this.canJump = false; // Restricted jumping
    }

    update() {
        if (this.hp <= 0) return;

        // Move X
        if (keys[this.ctrls.left]) { this.vx -= ACCEL; this.facing = -1; }
        if (keys[this.ctrls.right]) { this.vx += ACCEL; this.facing = 1; }

        // Jump (Only if allowed by tile)
        if (keys[this.ctrls.jump] && this.canJump) {
            this.vy = this.jumpForce;
            this.canJump = false; // Consume jump
            spawnParticles(this.x + this.w/2, this.y + this.h, 10, '#fff');
        }

        // Shoot
        if (this.cooldown > 0) this.cooldown--;
        if (keys[this.ctrls.shoot] && this.cooldown <= 0) this.shoot();

        // Physics
        this.vx *= FRICTION;
        this.vy += GRAVITY;
        
        // Terminal velocity limits
        this.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, this.vx));
        this.vy = Math.min(20, this.vy);

        this.move();
        
        // Bounds
        if (this.y > height) this.die();
        if (this.x < 0) this.x = 0;
        if (this.x > width - this.w) this.x = width - this.w;
    }

    move() {
        // Horizontal Collision
        this.x += this.vx;
        if (this.checkWall()) this.x -= this.vx, this.vx = 0;

        // Vertical Collision
        this.y += this.vy;
        
        this.canJump = false; // Reset frame
        let landed = false;

        // Floor/Ceiling check
        if (this.checkWall()) {
            this.y -= this.vy;
            if (this.vy > 0) { // Landed
                landed = true;
                this.checkTileBelow(); // Check if we can jump
            }
            this.vy = 0;
        }

        // Interactions (Spikes, Pickups)
        let cx = this.x + this.w/2, cy = this.y + this.h/2;
        let t = getTileAt(cx, cy);
        if (t) {
            if (t.kill) this.die();
            if (t.heal) this.hp = Math.min(100, this.hp + 0.5);
        }
    }

    checkWall() {
        // 4 corners check
        const tl = getTileAt(this.x, this.y);
        const tr = getTileAt(this.x + this.w, this.y);
        const bl = getTileAt(this.x, this.y + this.h);
        const br = getTileAt(this.x + this.w, this.y + this.h);
        return (tl?.solid || tr?.solid || bl?.solid || br?.solid);
    }

    checkTileBelow() {
        // Check center bottom point
        let tx = Math.floor((this.x + this.w/2) / TILE);
        let ty = Math.floor((this.y + this.h + 2) / TILE);
        let t = TILES[getMapVal(tx, ty)];
        
        if (t) {
            if (t.jump) {
                this.canJump = true;
                this.jumpForce = t.jump;
            }
            if (t.friction) this.vx *= t.friction;
        }
    }

    shoot() {
        const g = GUNS[this.gun];
        this.cooldown = g.delay;
        
        for(let i=0; i<g.count; i++) {
            let angle = this.facing === 1 ? 0 : Math.PI;
            angle += (Math.random() - 0.5) * g.spread;
            bullets.push({
                x: this.x + this.w/2, y: this.y + this.h/2,
                vx: Math.cos(angle) * g.speed,
                vy: Math.sin(angle) * g.speed + (Math.random()-0.5),
                dmg: g.dmg,
                color: g.color,
                owner: this.id,
                explode: g.explode,
                life: 100
            });
        }
        this.vx -= this.facing * 2; // Recoil
    }

    die() {
        spawnParticles(this.x, this.y, 30, this.color);
        screenShake(10);
        this.hp = 100;
        this.gun = 0;
        this.vx = 0; this.vy = 0;
        
        // Point to enemy
        if (this.id === 1) p2.score++; else p1.score++;
        
        // Respawn in air
        let spawn = findSpawn();
        this.x = spawn.x; this.y = spawn.y;
        updateHud();
    }
}

class GunBox {
    constructor(x, y) {
        this.x = x; this.y = y;
        this.w = 24; this.h = 24;
        this.gun = Math.floor(Math.random() * GUNS.length);
        this.yOff = 0;
    }
    update() {
        this.yOff = Math.sin(frame * 0.1) * 5;
        // Collision
        [p1, p2].forEach(p => {
            if (rectIntersect(this.x, this.y + this.yOff, this.w, this.h, p.x, p.y, p.w, p.h)) {
                p.gun = this.gun;
                spawnParticles(this.x, this.y, 15, '#ff0');
                updateHud();
                this.respawn();
            }
        });
    }
    respawn() {
        // Find a random spawn tile
        let spawns = [];
        for(let y=0; y<rows; y++) for(let x=0; x<cols; x++) if(map[y][x] === 7) spawns.push({x,y});
        
        if (spawns.length) {
            let s = spawns[Math.floor(Math.random() * spawns.length)];
            this.x = s.x * TILE + 4;
            this.y = s.y * TILE + 4;
            this.gun = Math.floor(Math.random() * GUNS.length);
        } else {
            this.x = -100; // Hide if no spawns
        }
    }
}

let p1 = new Player(1, 100, 100, '#ff5555', {left:'a', right:'d', jump:'w', shoot:'e'});
let p2 = new Player(2, 300, 100, '#5555ff', {left:'ArrowLeft', right:'ArrowRight', jump:'ArrowUp', shoot:'Enter'});

/**
 * CORE FUNCTIONS
 */
function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Editor Palette Builder
    const p = document.getElementById('tile-palette');
    for (let k in TILES) {
        if(k==0) continue;
        let d = document.createElement('div');
        d.className = 'tile-selector';
        d.style.backgroundColor = TILES[k].color;
        if(TILES[k].draw === 'tri') d.style.clipPath = 'polygon(50% 0, 0 100%, 100% 100%)';
        d.title = TILES[k].name;
        d.onclick = () => {
            document.querySelectorAll('.tile-selector').forEach(e=>e.classList.remove('selected'));
            d.classList.add('selected');
            editorSelection = parseInt(k);
        };
        p.appendChild(d);
    }
    document.querySelector('.tile-selector').click(); // Select first

    createDefaultMap();
    loop();
}

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    cols = Math.ceil(width / TILE);
    rows = Math.ceil(height / TILE);
}

function createDefaultMap() {
    map = [];
    for(let y=0; y<rows; y++) {
        let r = [];
        for(let x=0; x<cols; x++) {
            if (x===0 || x===cols-1 || y===0 || y===rows-1) r.push(1); // Border
            else if (y===rows-2 && x%6===0) r.push(2); // Jump pads
            else if (y===rows-2) r.push(5); // Lava floor
            else if (y===rows-6 && x > 5 && x < cols-5) r.push(1); // Platform
            else if (y===rows-7 && (x==7 || x==cols-8)) r.push(7); // Box spawns
            else r.push(0);
        }
        map.push(r);
    }
}

/**
 * GAME LOOP
 */
function loop() {
    // Input Handling
    if(state === 'EDITOR') handleEditor();

    // Clear
    ctx.fillStyle = '#121212';
    ctx.fillRect(0, 0, width, height);

    ctx.save();
    
    // Shake
    if (shake > 0) {
        ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);
        shake *= 0.9;
        if(shake < 0.5) shake = 0;
    }

    drawMap();

    if (state === 'PLAY') {
        // Logic
        p1.update();
        p2.update();
        
        boxes.forEach(b => { b.update(); drawBox(b); });
        
        // Bullets
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.vx; b.y += b.vy; b.life--;
            
            // Draw
            ctx.fillStyle = b.color;
            ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, 7); ctx.fill();

            // Collision Tile
            let t = getTileAt(b.x, b.y);
            if (t && t.solid) {
                if(t.breakable) { map[Math.floor(b.y/TILE)][Math.floor(b.x/TILE)] = 0; spawnParticles(b.x, b.y, 5, '#aff'); }
                b.life = 0; spawnParticles(b.x, b.y, 3, b.color);
            }

            // Collision Player
            let target = b.owner === 1 ? p2 : p1;
            if (rectIntersect(b.x-2, b.y-2, 4, 4, target.x, target.y, target.w, target.h)) {
                target.hp -= b.dmg;
                spawnParticles(b.x, b.y, 6, '#900'); // Blood
                b.life = 0;
                if(target.hp<=0) target.die();
            }

            if(b.explode && b.life <= 0) explode(b.x, b.y);
            if(b.life <= 0) bullets.splice(i, 1);
        }

        drawPlayer(p1);
        drawPlayer(p2);
    } 
    else if (state === 'EDITOR') {
        drawGrid();
        ctx.strokeStyle = '#0f0';
        ctx.lineWidth = 2;
        ctx.strokeRect(Math.floor(mx/TILE)*TILE, Math.floor(my/TILE)*TILE, TILE, TILE);
    }

    // Particles
    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        ctx.globalAlpha = p.life / 30;
        ctx.fillStyle = p.c;
        ctx.fillRect(p.x, p.y, p.s, p.s);
        if(p.life<=0) particles.splice(i,1);
    }
    ctx.globalAlpha = 1;

    ctx.restore();
    frame++;
    requestAnimationFrame(loop);
}

/**
 * DRAWING
 */
function drawMap() {
    for(let y=0; y<rows; y++) {
        for(let x=0; x<cols; x++) {
            let id = map[y][x];
            if (id === 0) continue;
            let t = TILES[id];
            let tx = x*TILE, ty = y*TILE;

            ctx.fillStyle = t.color;
            if(t.draw === 'tri') {
                ctx.beginPath(); ctx.moveTo(tx, ty+TILE); ctx.lineTo(tx+TILE/2, ty); ctx.lineTo(tx+TILE, ty+TILE); ctx.fill();
            } else if (t.draw === 'cross') {
                ctx.strokeStyle = t.color; ctx.lineWidth=2;
                ctx.strokeRect(tx+4, ty+4, TILE-8, TILE-8);
                ctx.beginPath(); ctx.moveTo(tx+4, ty+4); ctx.lineTo(tx+TILE-4, ty+TILE-4); ctx.moveTo(tx+TILE-4, ty+4); ctx.lineTo(tx+4, ty+TILE-4); ctx.stroke();
            } else {
                ctx.fillRect(tx, ty, TILE, TILE);
                // Detail
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.fillRect(tx, ty, TILE, 2);
                ctx.fillRect(tx, ty, 2, TILE);
                if(t.glow) {
                    ctx.shadowColor = t.color; ctx.shadowBlur = 10;
                    ctx.fillRect(tx+8, ty+8, TILE-16, TILE-16);
                    ctx.shadowBlur = 0;
                }
            }
        }
    }
}

function drawPlayer(p) {
    // Jump indicator glow
    if(p.canJump) {
        ctx.shadowColor = 'white'; ctx.shadowBlur = 15;
    }
    
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.shadowBlur = 0;

    // Eyes
    ctx.fillStyle = '#fff';
    let dir = p.facing===1 ? 4 : 0;
    ctx.fillRect(p.x+dir+4, p.y+4, 4, 4);
    ctx.fillRect(p.x+dir+12, p.y+4, 4, 4);

    // HP Bar
    ctx.fillStyle = 'red'; ctx.fillRect(p.x, p.y-8, p.w, 4);
    ctx.fillStyle = '#0f0'; ctx.fillRect(p.x, p.y-8, p.w*(p.hp/100), 4);
}

function drawBox(b) {
    let y = b.y + b.yOff;
    ctx.fillStyle = '#eda'; ctx.fillRect(b.x, y, b.w, b.h);
    ctx.strokeStyle = '#000'; ctx.lineWidth=2; ctx.strokeRect(b.x, y, b.w, b.h);
    ctx.fillStyle = '#000'; ctx.font = '16px bold sans-serif'; ctx.fillText('?', b.x+8, y+18);
}

function drawGrid() {
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(let x=0; x<=width; x+=TILE) { ctx.moveTo(x,0); ctx.lineTo(x,height); }
    for(let y=0; y<=height; y+=TILE) { ctx.moveTo(0,y); ctx.lineTo(width,y); }
    ctx.stroke();
}

/**
 * HELPERS
 */
function getTileAt(x, y) {
    let tx = Math.floor(x/TILE);
    let ty = Math.floor(y/TILE);
    return TILES[getMapVal(tx, ty)];
}

function getMapVal(x, y) {
    if(y<0 || y>=rows || x<0 || x>=cols) return 0;
    if(map[y] && map[y][x] !== undefined) return map[y][x];
    return 0;
}

function rectIntersect(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x2 < x1 + w1 && x2 + w2 > x1 && y2 < y1 + h1 && y2 + h2 > y1;
}

function spawnParticles(x, y, n, c) {
    for(let i=0; i<n; i++) particles.push({x, y, vx:(Math.random()-.5)*6, vy:(Math.random()-.5)*6, life:40, c, s:Math.random()*4+2});
}

function explode(x, y) {
    spawnParticles(x, y, 20, 'orange');
    screenShake(8);
    [p1, p2].forEach(p => {
        let d = Math.hypot((p.x+p.w/2)-x, (p.y+p.h/2)-y);
        if(d < 60) p.hp -= 30;
    });
}

function screenShake(amt) { shake = amt; }

function findSpawn() {
    // Try to find open air
    for(let i=0; i<50; i++) {
        let x = Math.floor(Math.random()*(cols-4))+2;
        let y = Math.floor(Math.random()*(rows-4))+2;
        if (map[y][x]===0 && map[y+1][x]!==0 && !TILES[map[y+1][x]].kill) {
            return {x: x*TILE, y: y*TILE};
        }
    }
    return {x: width/2, y: 100};
}

function updateHud() {
    document.getElementById('s1').innerText = p1.score;
    document.getElementById('s2').innerText = p2.score;
    document.getElementById('g1').innerText = GUNS[p1.gun].name;
    document.getElementById('g2').innerText = GUNS[p2.gun].name;
}

/**
 * MENU & EDITOR LOGIC
 */
function startGame() {
    state = 'PLAY';
    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    
    // Reset players
    let s = findSpawn(); p1.x = s.x; p1.y = s.y;
    s = findSpawn(); p2.x = s.x; p2.y = s.y;
    p1.hp=100; p2.hp=100; p1.score=0; p2.score=0;
    
    // Spawn initial boxes
    boxes = [];
    for(let i=0; i<4; i++) { let b = new GunBox(0,0); b.respawn(); boxes.push(b); }
    updateHud();
}

function startEditor() {
    state = 'EDITOR';
    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('editor-toolbar').classList.add('active');
    // Ensure map size matches screen
    if(map.length < rows) {
        for(let y=map.length; y<rows; y++) map.push(new Array(cols).fill(0));
    }
}

function stopEditor() {
    document.getElementById('editor-toolbar').classList.remove('active');
    startGame();
}

function saveMap() {
    localStorage.setItem('neon_map', JSON.stringify(map));
    alert('Map Saved!');
}

function loadMap() {
    let d = localStorage.getItem('neon_map');
    if(d) {
        map = JSON.parse(d);
        // Recalculate size just in case
        rows = map.length;
        cols = map[0].length;
        alert('Map Loaded!');
    } else {
        alert('No saved map found.');
    }
}

function clearMap() {
    if(confirm('Clear map?')) {
        map = Array(rows).fill().map(()=>Array(cols).fill(0));
    }
}

// Editor Input
let mx=0, my=0, mBtn=0;
function handleEditor() {
    if(mBtn === 0) return;
    let tx = Math.floor(mx/TILE), ty = Math.floor(my/TILE);
    if(tx>=0 && tx<cols && ty>=0 && ty<rows) {
        if(mBtn === 1) map[ty][tx] = editorSelection; // Left: Place
        if(mBtn === 3) map[ty][tx] = 0; // Right: Erase
    }
}

window.addEventListener('mousedown', e => {
    if(e.target.tagName !== 'CANVAS') return;
    mBtn = e.which;
});
window.addEventListener('mouseup', () => mBtn=0);
window.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
window.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
    // Prevent scrolling for arrows
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
        e.preventDefault();
    }
    keys[e.key] = true;
});
window.addEventListener('keyup', e => keys[e.key] = false);

init();

</script>
</body>
</html>
