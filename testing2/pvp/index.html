<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live-Edit PvP Arena</title>
    <style>
        :root { --bg: #121212; --ui: rgba(0, 0, 0, 0.8); --accent: #0f0; }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', monospace; color: white; user-select: none; }
        canvas { display: block; cursor: crosshair; }
        
        /* UI OVERLAYS */
        #ui { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        
        .hud { padding: 15px; display: flex; justify-content: space-between; font-size: 20px; font-weight: 900; text-shadow: 2px 2px 0 #000; }
        .p1 { color: #ff5555; } .p2 { color: #5555ff; }
        
        .controls-hint { text-align: center; color: #666; font-size: 12px; margin-top: -10px; }
        
        /* EDITOR TOOLBAR */
        #toolbar {
            pointer-events: auto; background: var(--ui);
            padding: 8px; border-top: 1px solid #444;
            display: flex; gap: 4px; overflow-x: auto;
            align-items: center;
        }
        
        /* Custom Scrollbar for toolbar */
        #toolbar::-webkit-scrollbar { height: 8px; }
        #toolbar::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        .tile-btn {
            min-width: 28px; height: 28px; border: 1px solid #555; cursor: pointer;
            position: relative; transition: 0.1s;
        }
        .tile-btn:hover { transform: scale(1.1); z-index: 10; border-color: white; }
        .tile-btn.active { border: 2px solid var(--accent); transform: scale(1.15); box-shadow: 0 0 10px var(--accent); }
        
        .btn-action {
            padding: 5px 10px; background: #333; color: white; border: 1px solid #555;
            cursor: pointer; font-size: 11px; font-weight: bold; white-space: nowrap;
        }
        .btn-action:hover { background: #555; }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div id="ui">
        <div class="hud">
            <div class="p1">P1: <span id="s1">0</span> <span style="font-size:12px" id="g1">Pistol</span></div>
            <div class="controls-hint">P1: WASD+E | P2: ARROWS+ENT/L | 'R' RESTART | CLICK TO EDIT</div>
            <div class="p2" style="text-align:right">P2: <span id="s2">0</span> <span style="font-size:12px" id="g2">Pistol</span></div>
        </div>

        <div id="toolbar">
            <div style="display:flex; gap:2px;" id="palette"></div>
            <div style="width:1px; background:#444; height:20px; margin:0 5px;"></div>
            <button class="btn-action" onclick="clearMap()">CLEAR</button>
            <button class="btn-action" onclick="saveMap()">SAVE</button>
            <button class="btn-action" onclick="loadMap()">LOAD</button>
        </div>
    </div>

<script>
/** * CONFIG & ASSETS 
 */
const cvs = document.getElementById('canvas');
const ctx = cvs.getContext('2d');
const TILE = 32;

// Physics
const GRAVITY = 0.5;
const FRICTION = 0.82;
const MAX_VEL = 12;

// TILES (20 Types)
// 0:Air, 1:Wall, 2:Jump, 3:SuperJump, 4:Spike, 5:Lava, 6:Ice, 7:Mud, 8:Heal, 9:Glass
// 10:Bouncy, 11:OneWay, 12:BoostR, 13:BoostL, 14:Water, 15:Crumble, 16:TeleA, 17:TeleB, 18:Invinc, 19:Ammo
const TILES = [
    { name:'Air', c:null, solid:false },
    { name:'Wall', c:'#444', solid:true },
    { name:'Jump', c:'#0f0', solid:true, jump:-13, glow:true },
    { name:'Super', c:'#0ff', solid:true, jump:-22, glow:true },
    { name:'Spike', c:'#888', solid:false, kill:true, draw:'tri' },
    { name:'Lava', c:'#f40', solid:false, kill:true, glow:true },
    { name:'Ice', c:'#aef', solid:true, fric:0.97 },
    { name:'Mud', c:'#542', solid:true, fric:0.5 },
    { name:'Heal', c:'#f0f', solid:false, effect:'heal', draw:'heart' },
    { name:'Glass', c:'rgba(180,220,255,0.3)', solid:true, break:true },
    { name:'Bounce', c:'#d0d', solid:true, bounce:1.3 },
    { name:'Plat', c:'#666', solid:true, oneway:true, h:8 }, // One Way Platform
    { name:'BoostR', c:'#aa0', solid:true, push:2, draw:'arrowR' },
    { name:'BoostL', c:'#aa0', solid:true, push:-2, draw:'arrowL' },
    { name:'Water', c:'rgba(0,0,255,0.4)', solid:false, drag:true },
    { name:'Crumble', c:'#975', solid:true, crumble:true },
    { name:'Tele A', c:'#f90', solid:false, tele:'A' },
    { name:'Tele B', c:'#90f', solid:false, tele:'B' },
    { name:'Star', c:'#ff0', solid:false, effect:'star', draw:'star' },
    { name:'Void', c:'#000', solid:true, kill:true } // Instant death block
];

// GUNS (15 Types)
const GUNS = [
    { n:'Pistol', cd:25, spd:12, dmg:10, spr:0.02, c:1, col:'#fff' },
    { n:'Uzi', cd:5, spd:14, dmg:4, spr:0.15, c:1, col:'#ff0' },
    { n:'Shotgun', cd:45, spd:11, dmg:6, spr:0.35, c:6, col:'#f00' },
    { n:'Sniper', cd:70, spd:35, dmg:60, spr:0, c:1, col:'#0f0' },
    { n:'Bazooka', cd:60, spd:9, dmg:40, spr:0, c:1, exp:true, col:'#fa0' },
    { n:'Minigun', cd:3, spd:15, dmg:3, spr:0.2, c:1, col:'#aaa' },
    { n:'Laser', cd:40, spd:50, dmg:25, spr:0, c:1, pierce:true, col:'#0ff', w:4 },
    { n:'Spread', cd:25, spd:10, dmg:8, spr:0.3, c:3, col:'#f0f' },
    { n:'Ricochet', cd:30, spd:12, dmg:15, spr:0, c:1, bounce:true, col:'#aff' },
    { n:'Flame', cd:2, spd:7, dmg:1, spr:0.3, c:2, life:20, col:'#f80' },
    { n:'Grenade', cd:50, spd:10, dmg:45, spr:0.1, c:1, grav:0.3, exp:true, col:'#462' },
    { n:'Magnum', cd:40, spd:25, dmg:35, spr:0.01, c:1, col:'#ccc' },
    { n:'Burst', cd:30, spd:16, dmg:8, spr:0.05, c:3, burst:true, col:'#ffaa00' },
    { n:'Dart', cd:15, spd:18, dmg:5, spr:0.05, c:1, poison:true, col:'#0f0' },
    { n:'Nuke', cd:120, spd:4, dmg:100, spr:0, c:1, exp:true, rad:150, col:'#fff' } // Rare
];

// STATE
let map = [], cols, rows, w, h;
let particles = [], bullets = [], boxes = [];
let p1, p2;
let frame = 0, shake = 0;
let editTile = 1;
let mouse = { x:0, y:0, down:false, btn:0 };
const keys = {};

/**
 * CLASSES
 */
class Player {
    constructor(id, x, y, col, ctrls) {
        this.id = id;
        this.x = x; this.y = y;
        this.w = 20; this.h = 24;
        this.vx = 0; this.vy = 0;
        this.col = col;
        this.ctrls = ctrls;
        this.hp = 100;
        this.gun = 0; // Pistol
        this.cd = 0;
        this.score = 0;
        this.face = 1;
        this.ground = false;
        this.invinc = 0;
    }

    update() {
        if (this.hp <= 0) return;
        
        // Movement
        let acc = 1.0;
        let fric = FRICTION;
        
        // Check current tile effects
        let cx = this.x + this.w/2, cy = this.y + this.h/2;
        let t = getTile(cx, cy);
        
        if (t) {
            if (t.fric) fric = t.fric;
            if (t.drag) { this.vy *= 0.8; acc = 0.5; } // Water
            if (t.push) this.vx += t.push;
            if (t.effect === 'heal') this.hp = Math.min(100, this.hp+0.5);
            if (t.effect === 'star') this.invinc = 300;
            if (t.kill && this.invinc <= 0) this.die();
            if (t.tele) this.teleport(t.tele);
        }

        if (keys[this.ctrls.l]) { this.vx -= acc; this.face = -1; }
        if (keys[this.ctrls.r]) { this.vx += acc; this.face = 1; }
        
        // Jump (only if grounded or in water)
        if (keys[this.ctrls.u] && (this.ground || (t && t.drag))) {
            this.vy = -10;
            if(t && t.drag) this.vy = -5; // Swim
            this.ground = false;
        }

        // Shoot
        if (this.cd > 0) this.cd--;
        if (keys[this.ctrls.s] && this.cd <= 0) this.shoot();

        // Physics
        this.vx *= fric;
        this.vy += GRAVITY;
        if(t && t.drag) this.vy *= 0.9; // Water gravity

        // Terminal Velocity
        this.vx = Math.max(-MAX_VEL, Math.min(MAX_VEL, this.vx));
        this.vy = Math.min(18, this.vy);

        this.move();
        
        // Cooldowns
        if(this.invinc > 0) this.invinc--;

        // Bounds
        if (this.y > h) this.die();
        if (this.x < 0) this.x = 0;
        if (this.x > w-this.w) this.x = w-this.w;
    }

    move() {
        this.ground = false;
        // X Axis
        this.x += this.vx;
        this.handleCol(true);
        // Y Axis
        this.y += this.vy;
        this.handleCol(false);
    }

    handleCol(isX) {
        // Simple AABB vs Tiles
        let x1 = Math.floor(this.x/TILE), x2 = Math.floor((this.x+this.w)/TILE);
        let y1 = Math.floor(this.y/TILE), y2 = Math.floor((this.y+this.h)/TILE);

        for(let y=y1; y<=y2; y++) {
            for(let x=x1; x<=x2; x++) {
                let t = TILES[getMap(x,y)];
                if(!t || !t.solid) continue;

                // One Way Platform Logic
                if (t.oneway) {
                    if (isX) continue; // No X collision
                    // Only collide if falling and feet were above platform prev frame
                    if (this.vy > 0 && (this.y + this.h - this.vy) <= y*TILE + 4) {
                        this.y = y*TILE - this.h - 0.1;
                        this.vy = 0;
                        this.ground = true;
                        if(t.fric) this.vx *= t.fric;
                    }
                    continue;
                }

                // Solid Collision
                let tx = x*TILE, ty = y*TILE;
                // Resolve
                if (isX) {
                    if (this.vx > 0) this.x = tx - this.w;
                    else if (this.vx < 0) this.x = tx + TILE;
                    this.vx = 0;
                } else {
                    if (this.vy > 0) { // Landing
                        this.y = ty - this.h;
                        this.ground = true;
                        // Floor effects
                        if (t.jump) { this.vy = t.jump; this.ground = false; }
                        else if (t.bounce) { this.vy = -this.vy * t.bounce; this.ground = false; }
                        else this.vy = 0;
                        
                        if (t.crumble) map[y][x] = 0; // Break floor
                    } else if (this.vy < 0) { // Ceiling
                        this.y = ty + TILE;
                        this.vy = 0;
                        if(t.break) map[y][x] = 0; // Break glass
                    }
                }
            }
        }
    }

    shoot() {
        let g = GUNS[this.gun];
        this.cd = g.cd;
        for(let i=0; i<g.c; i++) {
            let a = (this.face === 1 ? 0 : Math.PI) + (Math.random()-0.5)*g.spr;
            let b = {
                x: this.x + this.w/2, y: this.y + this.h/2,
                vx: Math.cos(a)*g.spd, vy: Math.sin(a)*g.spd,
                stats: g, owner: this.id, life: g.life || 80
            };
            if(g.grav) b.vy -= 2; // Arc up
            bullets.push(b);
        }
    }

    teleport(id) {
        // Find other teleporter
        for(let y=0; y<rows; y++) for(let x=0; x<cols; x++) {
            let t = TILES[map[y][x]];
            if(t.tele && t.tele !== id) {
                this.x = x*TILE; this.y = y*TILE;
                return;
            }
        }
    }

    die() {
        part(this.x, this.y, 30, this.col);
        shake = 10;
        if(this.id==1) p2.score++; else p1.score++;
        this.hp = 100;
        this.gun = 0;
        this.invinc = 60;
        this.vx=0; this.vy=0;
        let s = findSpawn();
        this.x = s.x; this.y = s.y;
        updateHud();
    }
}

class GunBox {
    constructor() {
        this.life = 600; // 10 seconds (60fps)
        this.respawn();
    }
    
    respawn() {
        this.life = 600;
        this.gun = Math.floor(Math.random() * GUNS.length);
        // Random pos in air
        let ok = false;
        while(!ok) {
            let x = Math.floor(Math.random() * (w - 30));
            let y = Math.floor(Math.random() * (h - 30));
            // Check if inside solid
            if (!getTile(x, y)?.solid && !getTile(x+20, y+20)?.solid) {
                this.x = x; this.y = y; ok = true;
            }
        }
    }

    update() {
        this.life--;
        if(this.life <= 0) {
            part(this.x, this.y, 10, '#fff');
            this.respawn();
        }

        // Float
        let dy = Math.sin(frame*0.1) * 3;
        
        // Draw
        ctx.fillStyle = '#eda'; ctx.fillRect(this.x, this.y+dy, 20, 20);
        ctx.strokeStyle='#000'; ctx.strokeRect(this.x, this.y+dy, 20, 20);
        ctx.fillStyle = '#000'; ctx.fillText("?", this.x+6, this.y+dy+15);
        ctx.fillStyle = '#f00'; ctx.fillRect(this.x, this.y+dy-5, 20*(this.life/600), 2);

        // Pickup
        [p1, p2].forEach(p => {
            if (p.x < this.x+20 && p.x+p.w > this.x && p.y < this.y+dy+20 && p.y+p.h > this.y+dy) {
                p.gun = this.gun;
                part(this.x, this.y, 15, '#ff0');
                updateHud();
                this.respawn();
            }
        });
    }
}

/** * CORE FUNCTIONS 
 */
function init() {
    resize();
    
    // Controls
    window.onkeydown = e => {
        if(e.key === 'Enter') e.preventDefault(); // Prevent scroll
        keys[e.key] = true;
        if(e.key.toLowerCase() === 'r') startGame();
    };
    window.onkeyup = e => keys[e.key] = false;
    
    // Mouse
    cvs.onmousedown = e => { mouse.down=true; mouse.btn=e.button; handleEdit(e); };
    window.onmouseup = () => mouse.down=false;
    cvs.onmousemove = e => { 
        let r = cvs.getBoundingClientRect();
        mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top;
        if(mouse.down) handleEdit(e);
    };
    cvs.oncontextmenu = e => e.preventDefault();

    // Palette UI
    const pal = document.getElementById('palette');
    TILES.forEach((t, i) => {
        let b = document.createElement('div');
        b.className = 'tile-btn ' + (i===1?'active':'');
        b.style.background = t.c || '#222';
        if(t.draw==='tri') b.style.clipPath = 'polygon(50% 0, 0 100%, 100% 100%)';
        b.title = t.name;
        b.onclick = () => {
            document.querySelectorAll('.tile-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            editTile = i;
        }
        pal.appendChild(b);
    });

    startGame();
    loop();
}

function startGame() {
    createMap();
    p1 = new Player(1, 100, 100, '#ff5555', {l:'a', r:'d', u:'w', s:'e'});
    p2 = new Player(2, w-100, 100, '#5555ff', {l:'ArrowLeft', r:'ArrowRight', u:'ArrowUp', s:'Enter'}); // Enter/L handled in keys
    // Hack for double binding P2 Shoot
    p2.ctrls.l_alt = 'l'; 

    bullets = []; particles = []; boxes = [];
    for(let i=0; i<3; i++) boxes.push(new GunBox());
    updateHud();
}

function loop() {
    requestAnimationFrame(loop);
    
    // Alternate Input Check for P2 'L' key
    if(keys['l'] || keys['L']) keys['Enter'] = true; 

    // Update Game
    update();
    
    // Draw
    draw();
    
    frame++;
}

function update() {
    // Players
    p1.update();
    p2.update();

    // Boxes
    boxes.forEach(b => b.update());

    // Bullets
    for(let i=bullets.length-1; i>=0; i--) {
        let b = bullets[i];
        if(b.stats.grav) b.vy += b.stats.grav;
        b.x += b.vx; b.y += b.vy; b.life--;

        // Tiles
        let t = getTile(b.x, b.y);
        let hit = false;
        
        if (t && t.solid) {
            if (b.stats.pierce) { /* pass */ }
            else if (b.stats.bounce) {
                // Bounce logic (simple)
                let tx = Math.floor(b.x/TILE)*TILE;
                if (b.x <= tx+2 || b.x >= tx+28) b.vx *= -1; else b.vy *= -1;
                b.life -= 10;
                continue;
            } else {
                hit = true;
                if (t.break) map[Math.floor(b.y/TILE)][Math.floor(b.x/TILE)] = 0;
            }
        }

        // Players
        let tgt = b.owner===1 ? p2 : p1;
        if (tgt.hp>0 && tgt.invinc<=0 && b.x>tgt.x && b.x<tgt.x+tgt.w && b.y>tgt.y && b.y<tgt.y+tgt.h) {
            tgt.hp -= b.stats.dmg;
            part(b.x, b.y, 5, '#f00');
            hit = true;
            if(tgt.hp<=0) tgt.die();
        }

        if(hit || b.life<=0) {
            if(b.stats.exp) explode(b.x, b.y, b.stats.rad || 50);
            part(b.x, b.y, 3, b.stats.col);
            bullets.splice(i, 1);
        }
    }
}

function draw() {
    ctx.fillStyle = '#121212'; ctx.fillRect(0,0,w,h);
    
    ctx.save();
    if(shake>0) {
        ctx.translate((Math.random()-.5)*shake, (Math.random()-.5)*shake);
        shake *= 0.9;
    }

    // Map
    for(let y=0; y<rows; y++) {
        for(let x=0; x<cols; x++) {
            let id = map[y][x];
            if(id===0) continue;
            let t = TILES[id];
            let tx=x*TILE, ty=y*TILE;
            
            ctx.fillStyle = t.c;
            if(t.draw==='tri') {
                ctx.beginPath(); ctx.moveTo(tx, ty+TILE); ctx.lineTo(tx+16, ty+10); ctx.lineTo(tx+32, ty+TILE); ctx.fill();
            } else if(t.draw==='arrowR') {
                ctx.fillRect(tx, ty, 32, 32); ctx.fillStyle='#fff'; ctx.fillText('>>>', tx+2, ty+20);
            } else if(t.draw==='arrowL') {
                ctx.fillRect(tx, ty, 32, 32); ctx.fillStyle='#fff'; ctx.fillText('<<<', tx+2, ty+20);
            } else if(t.draw==='star') {
                ctx.fillStyle = '#ff0'; ctx.beginPath(); ctx.arc(tx+16, ty+16, 8, 0, 6.28); ctx.fill();
            } else if(t.oneway) {
                ctx.fillRect(tx, ty, 32, 8);
            } else {
                ctx.fillRect(tx, ty, 32, 32);
            }

            // Glow
            if(t.glow) {
                ctx.shadowColor = t.c; ctx.shadowBlur = 10;
                ctx.fillRect(tx+8, ty+8, 16, 16);
                ctx.shadowBlur = 0;
            }
        }
    }

    // Bullets
    bullets.forEach(b => {
        ctx.fillStyle = b.stats.col;
        if(b.stats.w) ctx.fillRect(b.x, b.y, b.stats.w*4, 4); // Laser
        else { ctx.beginPath(); ctx.arc(b.x, b.y, 3, 0, 6.28); ctx.fill(); }
    });

    // Players
    drawP(p1); drawP(p2);

    // Particles
    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x+=p.vx; p.y+=p.vy; p.l--;
        ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s);
        if(p.l<=0) particles.splice(i,1);
    }
    
    // Editor Cursor
    let mx = Math.floor(mouse.x/TILE)*TILE;
    let my = Math.floor(mouse.y/TILE)*TILE;
    ctx.strokeStyle = '#fff'; ctx.lineWidth=2;
    ctx.strokeRect(mx, my, TILE, TILE);

    ctx.restore();
}

function drawP(p) {
    if(p.invinc > 0 && frame%4===0) return; // Flicker
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    // Gun
    ctx.fillStyle = '#fff';
    let gw = 10;
    if (keys[p.ctrls.s]) gw = 15;
    ctx.fillRect(p.x + (p.face==1?10: -gw), p.y+12, gw, 4);
    // HP
    ctx.fillStyle = '#f00'; ctx.fillRect(p.x, p.y-6, 20, 3);
    ctx.fillStyle = '#0f0'; ctx.fillRect(p.x, p.y-6, 20*(p.hp/100), 3);
}

/** HELPERS */
function handleEdit(e) {
    let tx = Math.floor(mouse.x/TILE), ty = Math.floor(mouse.y/TILE);
    if(tx>=0 && tx<cols && ty>=0 && ty<rows) {
        if(mouse.btn===0) map[ty][tx] = editTile;
        if(mouse.btn===2) map[ty][tx] = 0;
    }
}
function createMap() {
    if(map.length>0 && map.length === rows) return; // Keep existing if size matches
    map = [];
    for(let y=0; y<rows; y++) {
        let r = [];
        for(let x=0; x<cols; x++) {
            if(y===0 || y===rows-1 || x===0 || x===cols-1) r.push(1);
            else if(y===rows-2 && x%8===0) r.push(2); // Jump
            else if(y===rows-5 && x>4 && x<cols-4) r.push(11); // Plat
            else r.push(0);
        }
        map.push(r);
    }
}
function getMap(x,y) { 
    if(x<0||x>=cols||y<0||y>=rows) return 1; 
    return map[y][x]; 
}
function getTile(x, y) { return TILES[getMap(Math.floor(x/TILE), Math.floor(y/TILE))]; }
function part(x,y,n,c) { for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,l:20+Math.random()*20,c,s:Math.random()*3+1}); }
function explode(x,y,r) {
    shake = 10;
    part(x,y,30,'orange');
    [p1,p2].forEach(p => {
        if(Math.hypot(p.x-x, p.y-y) < r) p.hp -= 40;
    });
}
function findSpawn() { return {x: w/2, y: 100}; }
function updateHud() {
    document.getElementById('s1').innerText = p1.score;
    document.getElementById('s2').innerText = p2.score;
    document.getElementById('g1').innerText = GUNS[p1.gun].n;
    document.getElementById('g2').innerText = GUNS[p2.gun].n;
}
function resize() {
    w = window.innerWidth; h = window.innerHeight;
    cvs.width = w; cvs.height = h;
    cols = Math.ceil(w/TILE); rows = Math.ceil(h/TILE);
    if(map.length===0) createMap();
}
window.onresize = resize;

// Save/Load
function saveMap() { localStorage.setItem('pvp_map', JSON.stringify(map)); alert('Saved!'); }
function loadMap() { 
    let d = localStorage.getItem('pvp_map'); 
    if(d) { map=JSON.parse(d); alert('Loaded!'); } 
}
function clearMap() { map = map.map(r => r.map(() => 0)); }

init();
</script>
</body>
