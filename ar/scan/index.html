<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Scanner</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js and GLTFExporter -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<script>
    window.onerror = function (msg, url, line, col, error) {
        alert("Error: " + msg + "\nLine: " + line + "\nCol: " + col + "\nStack: " + (error && error.stack));
        return false;
    };
    window.onload = function () {
        console.log("Window loaded");
        // alert("Window loaded"); // Optional, verify load
    };
</script>

<body>
    <div id="overlay">
        <header>
            <h1>AR Scanner</h1>
        </header>

        <div id="controls" class="hidden">
            <div class="quality-selector">
                <label>Quality:</label>
                <div class="toggle-group">
                    <button id="btn-fast" class="active" onclick="setQuality('fast')">Fast</button>
                    <button id="btn-detailed" onclick="setQuality('detailed')">Detailed</button>
                </div>
            </div>

            <div class="action-buttons">
                <button id="btn-scan" class="primary-btn">Scan</button>
                <button id="btn-export" class="secondary-btn" disabled>Export GLB</button>
                <button id="btn-view" class="secondary-btn" style="display:none;">Check</button>
            </div>
            <p id="status-text">Ready to scan</p>
        </div>

        <div id="start-screen">
            <p>Requires device with WebXR and Depth API support (Android + Chrome).</p>
            <button id="btn-enter-ar" class="primary-btn large-btn">Start AR</button>
        </div>
    </div>

    <!-- Viewer Debug Overlay -->
    <div id="viewer-overlay" class="hidden"
        style="position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:999; display:flex; flex-direction:column;">
        <div style="padding:10px; display:flex; justify-content:space-between;">
            <h2 style="color:white; margin:0;">Preview</h2>
            <button onclick="document.getElementById('viewer-overlay').classList.add('hidden')"
                style="padding:5px 15px;">Close</button>
        </div>
        <model-viewer id="debug-viewer" style="width:100%; flex-grow:1;" camera-controls auto-rotate></model-viewer>
    </div>

    <!-- Main Logic -->
    <script type="module" src="app.js"></script>
</body>

</html>
