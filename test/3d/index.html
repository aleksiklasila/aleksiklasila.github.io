<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Tactics: Weapon Slots</title>
    <style>
        /* --- CORE --- */
        body { margin: 0; overflow: hidden; background: #111; font-family: 'Courier New', monospace; touch-action: none; user-select: none; -webkit-user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; outline: none; }

        /* --- UI LAYERS --- */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; }
        .hidden { display: none !important; }
        
        h1 { color: #d00; font-size: 3rem; margin-bottom: 10px; text-shadow: 2px 2px 0 #000; text-align: center; }
        input, button { padding: 15px; margin: 5px; background: #222; border: 2px solid #555; color: white; font-size: 1.2rem; font-family: inherit; cursor: pointer; }
        button:hover { border-color: #d00; color: #d00; }
        button:active { background: #500; }
        input { cursor: text; text-align: center;}

        /* --- HUD --- */
        #hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: #0f0; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 4px #0f0; }
        #hud-top-right { position: absolute; top: 20px; right: 20px; text-align: right; font-size: 1.5rem; color: #fff; text-shadow: 2px 2px 0 #000; font-weight: bold; }
        #hud-bottom-right { position: absolute; bottom: 20px; right: 20px; text-align: right; font-size: 1.2rem; color: #ff0; text-shadow: 2px 2px 0 #000; font-weight: bold; }
        
        /* --- MOBILE CONTROLS --- */
        #mobile-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; display: none; }
        .stick-zone { position: absolute; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; pointer-events: auto; }
        .stick-nub { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(255, 255, 255, 0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        #stick-left { bottom: 30px; left: 30px; }
        #stick-right { bottom: 30px; right: 30px; }
        .action-btn { position: absolute; width: 80px; height: 80px; background: rgba(255, 0, 0, 0.2); border: 3px solid #f00; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; pointer-events: auto; user-select: none; }
        .action-btn:active { background: rgba(255, 0, 0, 0.5); }
        #btn-fire { bottom: 180px; right: 30px; width: 90px; height: 90px; } 
        #btn-jump { bottom: 50px; right: 140px; border-color: #00f; } 
        #btn-shop { bottom: 180px; left: 30px; width: 60px; height: 60px; border-color: #ff0; font-size: 12px; }

        /* Dynamic Shop Container */
        #shop-items-container { display: flex; flex-direction: column; margin-bottom: 20px; }
        
        /* Weapon Slot Indicator */
        .slot-indicator { font-size: 0.8rem; color: #aaa; margin-top: 5px;}
        .slot-active { color: #0f0; font-weight: bold; border: 1px solid #0f0; padding: 2px 5px; background: rgba(0, 50, 0, 0.5); }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="main-menu" class="overlay">
        <h1>ZOMBIE TACTICS</h1>
        <input type="text" id="player-name" value="Survivor" placeholder="Enter Name">
        <div id="host-panel">
            <button id="btn-copy">Copy Invite Link</button>
            <div id="lobby-status" style="margin:15px; color:#aaa">Connecting to Server...</div>
            <button id="btn-start" style="background:#0a0; width: 200px;">START GAME</button>
        </div>
        <div id="client-panel" class="hidden">
            <p>Connecting to Host...</p>
        </div>
    </div>

    <div id="shop-menu" class="overlay hidden">
        <h1 style="color:#0f0">TRADER</h1>
        <div style="color:#aaa; margin-bottom:20px;">Safe Zone - Prepare for Next Wave</div>
        
        <div id="shop-items-container"></div>

        <button id="btn-ready" style="margin-top:20px; width:200px; background:#444;">READY</button>
    </div>

    <div id="game-over-screen" class="overlay hidden">
        <h1 style="color:#d00">GAME OVER</h1>
        <div style="color:#fff; margin-bottom:20px;">All Survivors have fallen.</div>
        <button id="btn-return-lobby">Return to Lobby</button>
    </div>

    <div id="hud-layer">
        <div id="crosshair"></div>
        <div id="hud-top-right">
            <div>WAVE <span id="wave-disp">1</span></div>
            <div style="font-size:1rem; color:#aaa">Zombies: <span id="zombie-disp">0</span></div>
        </div>
        <div id="hud-bottom-right">
            <div style="color:#f44">HP: <span id="hp-disp">100</span></div>
            <div id="weapon-name-disp" style="color:#fff; font-size: 0.8em; margin-top:5px;">PISTOL</div>
            <div style="color:#ff0">AMMO: <span id="ammo-disp">30</span></div>
            <div style="color:#0f0">$<span id="money-disp">0</span></div>
            <div id="slots-disp" class="slot-indicator">
                <span id="slot-1" class="slot-active">1</span>
                <span id="slot-2">2</span>
                <span id="slot-3">3</span>
                <span id="slot-4">4</span>
            </div>
        </div>
    </div>

    <div id="mobile-controls">
        <div id="stick-left" class="stick-zone"><div class="stick-nub"></div></div>
        <div id="stick-right" class="stick-zone"><div class="stick-nub"></div></div>
        <div id="btn-fire" class="action-btn">FIRE</div>
        <div id="btn-jump" class="action-btn">JUMP</div>
        <div id="btn-shop" class="action-btn">SHOP</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon-es';

        // ==========================================
        // 1. CONFIG & WEAPON REGISTRY
        // ==========================================
        
        // Weapon Definitions
        const WEAPON_REGISTRY = {
            'pistol': { 
                name: "Pistol", 
                type: 'projectile', 
                damage: 35, 
                range: 100, 
                fireRateMs: 250, 
                speed: 80, 
                maxAmmo: 60,
                color: 0xffff00 
            },
            'knife': { 
                name: "Combat Knife", 
                type: 'melee', 
                damage: 45, 
                range: 2.5, 
                fireRateMs: 500, 
                maxAmmo: Infinity 
            }
            // Slots 3 and 4 can be populated later
        };

        const SHOP_ITEMS = [
            {
                name: "Refill Pistol",
                cost: 50,
                action: (player) => { 
                    // Find pistol in inventory
                    const slot = player.weapons.findIndex(w => w && w.id === 'pistol');
                    if(slot !== -1) {
                        player.weapons[slot].ammo = Math.min(player.weapons[slot].ammo + 30, WEAPON_REGISTRY['pistol'].maxAmmo);
                    }
                }
            },
            {
                name: "Buy Health (+50)",
                cost: 100,
                action: (player) => { player.hp = Math.min(100, player.hp + 50); }
            },
            {
                name: "Buy Max Health (+10 Max)",
                cost: 200,
                action: (player) => { player.maxHp = (player.maxHp || 100) + 10; player.hp += 10; }
            }
        ];

        const GRID_SIZE = 10; 
        const CELL_SIZE = 5; 
        const MAP_OFFSET = (GRID_SIZE * CELL_SIZE) / 2;
        const WALL_HEIGHT = 4;
        
        const PLAYER_SPEED = 15.0;
        const ZOMBIE_SPEED = 8.0; 
        const JUMP_FORCE = 12.0;

        let isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || navigator.maxTouchPoints > 1;
        
        // Network
        let myId = null;
        let isHost = true;
        let hostId = null;
        let peer;
        let conns = {};

        // State
        let gameState = 'LOBBY'; 
        let players = {}; 
        let zombies = {}; 
        let bullets = []; 
        let mapGrid = [];
        let wave = 1;
        let zombiesToSpawn = 0;

        // Physics (Host Only)
        let world; 
        let physicsBodies = {}; 
        let zombieBodies = {};  
        let defaultMaterial;

        // Visuals
        let scene, camera, renderer;
        let meshes = {}; 
        let bulletMeshes = [];
        const clock = new THREE.Clock();

        // Input
        // Added 'slot' to input state for weapon switching
        let input = { x: 0, y: 0, fire: false, jump: false, slot: 0 };
        let camYaw = 0;
        let camPitch = 0;

        // ==========================================
        // 2. INITIALIZATION FLOW
        // ==========================================

        function init() {
            document.getElementById('btn-copy').onclick = copyInvite;
            document.getElementById('btn-start').onclick = hostStartGame;
            document.getElementById('btn-ready').onclick = toggleReady;
            document.getElementById('btn-shop').onclick = openShopMobile;
            document.getElementById('btn-return-lobby').onclick = resetToLobby;
            
            initShopUI();

            if(isMobile) setupMobileControls();
            else setupPCControls();

            initNetwork();
        }

        function initShopUI() {
            const container = document.getElementById('shop-items-container');
            container.innerHTML = ''; 

            SHOP_ITEMS.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.innerText = `${item.name} ($${item.cost})`;
                btn.style.width = "250px";
                btn.style.borderColor = "#ff0";
                btn.onclick = () => { buyItem(index); };
                container.appendChild(btn);
            });
        }

        // ==========================================
        // 3. PHYSICS (HOST)
        // ==========================================

        function initPhysics() {
            if(world) return; 

            world = new CANNON.World();
            world.gravity.set(0, -25, 0); 
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 10;

            defaultMaterial = new CANNON.Material('default');
            const defaultContactMaterial = new CANNON.ContactMaterial(defaultMaterial, defaultMaterial, {
                friction: 0.0,
                restitution: 0.0 
            });
            world.addContactMaterial(defaultContactMaterial);
            
            // Floor
            const floorShape = new CANNON.Plane();
            const floorBody = new CANNON.Body({ mass: 0, material: defaultMaterial });
            floorBody.addShape(floorShape);
            floorBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
            world.addBody(floorBody);
        }

        function createPlayerPhysics(id, x, z) {
            if(!world) return; 
            const shape = new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5)); 
            const body = new CANNON.Body({
                mass: 60,
                fixedRotation: true,
                position: new CANNON.Vec3(x, 5, z), 
                material: defaultMaterial,
                linearDamping: 0.9 
            });
            body.addShape(shape);
            world.addBody(body);
            physicsBodies[id] = body;
        }

        function createZombiePhysics(id, x, z) {
            if(!world) return; 
            const shape = new CANNON.Box(new CANNON.Vec3(0.5, 1, 0.5));
            const body = new CANNON.Body({
                mass: 40,
                fixedRotation: true,
                position: new CANNON.Vec3(x, 5, z),
                material: defaultMaterial,
                linearDamping: 0.5
            });
            body.addShape(shape);
            world.addBody(body);
            zombieBodies[id] = body;
        }

        function rebuildMapPhysics() {
            if(!world) return;
            const halfExtents = new CANNON.Vec3(CELL_SIZE/2, WALL_HEIGHT/2, CELL_SIZE/2);
            const wallShape = new CANNON.Box(halfExtents);
            for(let x=0; x<GRID_SIZE; x++) {
                for(let z=0; z<GRID_SIZE; z++) {
                    if(mapGrid[x][z] === 1) {
                        const body = new CANNON.Body({ mass: 0, material: defaultMaterial });
                        body.addShape(wallShape);
                        body.position.set(
                            (x * CELL_SIZE) - MAP_OFFSET + CELL_SIZE/2,
                            WALL_HEIGHT/2,
                            (z * CELL_SIZE) - MAP_OFFSET + CELL_SIZE/2
                        );
                        world.addBody(body);
                    }
                }
            }
        }

        // ==========================================
        // 4. VISUALS (THREE.JS)
        // ==========================================

        function initThree() {
            if(scene) return;
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            scene.fog = new THREE.Fog(0x111111, 10, 80);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ'; 

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.domElement.style.touchAction = 'none'; 
            document.body.appendChild(renderer.domElement);

            const amb = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(amb);
            const dir = new THREE.DirectionalLight(0xffffff, 0.8);
            dir.position.set(50, 100, 50);
            dir.castShadow = true;
            scene.add(dir);

            requestAnimationFrame(animate);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function rebuildMapMesh() {
            if(!scene || mapGrid.length === 0) return;
            const fGeo = new THREE.PlaneGeometry(GRID_SIZE*CELL_SIZE, GRID_SIZE*CELL_SIZE);
            const fMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
            const floor = new THREE.Mesh(fGeo, fMat);
            floor.rotation.x = -Math.PI/2;
            scene.add(floor);

            const wGeo = new THREE.BoxGeometry(CELL_SIZE, WALL_HEIGHT, CELL_SIZE);
            const wMat = new THREE.MeshLambertMaterial({ color: 0x554433 });
            for(let x=0; x<GRID_SIZE; x++) {
                for(let z=0; z<GRID_SIZE; z++) {
                    if(mapGrid[x][z] === 1) {
                        const w = new THREE.Mesh(wGeo, wMat);
                        w.position.set(
                            (x * CELL_SIZE) - MAP_OFFSET + CELL_SIZE/2,
                            WALL_HEIGHT/2,
                            (z * CELL_SIZE) - MAP_OFFSET + CELL_SIZE/2
                        );
                        scene.add(w);
                    }
                }
            }
        }

        // ==========================================
        // 5. GAME LOGIC & NETWORK
        // ==========================================

        function initNetwork() {
            peer = new Peer(null, { debug: 1 });
            peer.on('open', (id) => {
                myId = id;
                const p = new URLSearchParams(window.location.search);
                if(p.get('join')) {
                    isHost = false;
                    hostId = p.get('join');
                    document.getElementById('host-panel').classList.add('hidden');
                    document.getElementById('client-panel').classList.remove('hidden');
                    initThree(); 
                    connectToHost(hostId);
                } else {
                    document.getElementById('lobby-status').innerText = "Waiting for players...";
                    isHost = true;
                    initPhysics(); 
                    generateMap(); 
                    rebuildMapPhysics(); 
                    players[myId] = createPlayer(myId, document.getElementById('player-name').value);
                    initThree(); 
                    rebuildMapMesh(); 
                    updateLobbyUI();
                }
            });

            peer.on('connection', (conn) => {
                conns[conn.peer] = conn;
                conn.on('data', data => handleData(data, conn.peer));
                conn.on('open', () => {
                    if(isHost) conn.send({ type: 'MAP_DATA', map: mapGrid });
                });
                conn.on('close', () => { 
                    if(isHost) {
                        delete players[conn.peer]; 
                        if(physicsBodies[conn.peer]) {
                            world.removeBody(physicsBodies[conn.peer]);
                            delete physicsBodies[conn.peer];
                        }
                    }
                });
            });
        }

        function connectToHost(id) {
            let conn = peer.connect(id);
            conns[id] = conn;
            conn.on('open', () => {
                conn.send({ type: 'JOIN', name: document.getElementById('player-name').value });
            });
            conn.on('data', data => handleData(data, id));
        }

        function createPlayer(id, name) {
            const p = { 
                id, name, 
                x: 0, y: 1, z: 0, 
                hp: 100, maxHp: 100, money: 0, 
                // NEW: Weapons Array (4 slots)
                weapons: [
                    { id: 'pistol', ammo: 30 }, // Slot 1
                    { id: 'knife', ammo: Infinity }, // Slot 2
                    null, // Slot 3
                    null  // Slot 4
                ],
                currentSlot: 0, // 0-indexed
                lastFire: 0,
                yaw: 0, pitch: 0, 
                dead: false, ready: false, 
                input: {x:0, y:0, fire: false, jump: false, slot: 0} 
            };
            if(isHost) createPlayerPhysics(id, 0, 0); 
            return p;
        }

        function handleData(data, sender) {
            if(data.type === 'JOIN' && isHost) {
                players[sender] = createPlayer(sender, data.name);
                broadcast({ type: 'LOBBY_UPDATE', players: players });
                updateLobbyUI();
            }
            else if(data.type === 'MAP_DATA') {
                mapGrid = data.map;
                if(scene) rebuildMapMesh();
            }
            else if(data.type === 'LOBBY_UPDATE') {
                players = data.players;
                updateLobbyUI();
            }
            else if(data.type === 'START_GAME') {
                document.getElementById('main-menu').classList.add('hidden');
                document.getElementById('game-over-screen').classList.add('hidden');
                gameState = 'PLAYING';
                if(!isMobile) document.body.requestPointerLock(); 
                if(isMobile) document.getElementById('mobile-controls').style.display = 'block';
            }
            else if(data.type === 'INPUT' && isHost) {
                if(players[sender]) {
                    players[sender].input = data.input;
                    players[sender].yaw = data.yaw;
                    players[sender].pitch = data.pitch;
                }
            }
            else if(data.type === 'BUY_ITEM' && isHost) {
                if(players[sender]) {
                    const item = SHOP_ITEMS[data.index];
                    if(item && players[sender].money >= item.cost) {
                        players[sender].money -= item.cost;
                        item.action(players[sender]);
                        // Broadcast immediately to update UI
                        broadcast({ type: 'WORLD_STATE', state: { players, zombies, bullets, wave } });
                    }
                }
            }
            else if(data.type === 'WORLD_STATE') {
                if(!isHost) syncLocalVisuals(data.state);
            }
            else if(data.type === 'SHOP_OPEN') {
                gameState = 'SHOP';
                document.getElementById('shop-menu').classList.remove('hidden');
                if(!isMobile) document.exitPointerLock();
                document.getElementById('mobile-controls').style.display = 'none';
            }
            else if(data.type === 'READY_STATE' && isHost) {
                if(players[sender]) {
                    players[sender].ready = data.ready;
                    checkAllReady();
                }
            }
            else if(data.type === 'RESET_LOBBY') {
                window.location.reload(); 
            }
        }

        function generateMap() {
            mapGrid = [];
            for(let x=0; x<GRID_SIZE; x++) {
                let row = [];
                for(let z=0; z<GRID_SIZE; z++) {
                    if (x===0 || x===GRID_SIZE-1 || z===0 || z===GRID_SIZE-1) row.push(1);
                    else if (Math.random() < 0.15 && (Math.abs(x - GRID_SIZE/2) > 3 || Math.abs(z - GRID_SIZE/2) > 3)) row.push(1);
                    else row.push(0);
                }
                mapGrid.push(row);
            }
        }

        // ==========================================
        // 6. GAME LOOP
        // ==========================================

        function animate() {
            requestAnimationFrame(animate);
            if(gameState === 'LOBBY' || !renderer) return;

            let dt = clock.getDelta();
            if(dt > 0.1) dt = 0.1;

            if(isHost) hostUpdate(dt);
            else clientUpdate();

            renderScene();
        }

        function hostUpdate(dt) {
            if(gameState !== 'PLAYING') return;
            if(checkGameOver()) return;

            if(players[myId]) {
                players[myId].input.x = input.x;
                players[myId].input.y = input.y;
                players[myId].input.fire = input.fire;
                players[myId].input.jump = input.jump;
                players[myId].input.slot = input.slot; // Sync local slot
                players[myId].yaw = camYaw;
                players[myId].pitch = camPitch;
            }

            for(let pid in players) {
                const p = players[pid];
                if(p.dead || !physicsBodies[pid]) continue;
                const body = physicsBodies[pid];

                // Weapon Switching Logic
                // Ensure the slot is valid (0-3)
                if(p.input.slot >= 0 && p.input.slot <= 3) {
                    p.currentSlot = p.input.slot;
                }

                // Movement
                const moveVec = new THREE.Vector3();
                const camDir = new THREE.Vector3(-Math.sin(p.yaw), 0, -Math.cos(p.yaw)).normalize();
                const camRight = new THREE.Vector3().crossVectors(new THREE.Vector3(0,1,0), camDir).normalize();
                
                moveVec.addScaledVector(camDir, p.input.y);
                moveVec.addScaledVector(camRight, p.input.x);
                moveVec.normalize().multiplyScalar(PLAYER_SPEED);

                body.velocity.x = moveVec.x;
                body.velocity.z = moveVec.z;
                
                if(p.input.jump && Math.abs(body.velocity.y) < 0.1 && body.position.y < 1.5) {
                    body.velocity.y = JUMP_FORCE;
                }
                body.wakeUp();

                p.x = body.position.x;
                p.y = body.position.y;
                p.z = body.position.z;

                // COMBAT
                if(p.input.fire) {
                   performAttack(pid);
                }
            }
            
            world.step(1/60, dt, 3);
            handleZombies(dt);
            handleBullets(dt);

            const state = { players, zombies, bullets, wave };
            broadcast({ type: 'WORLD_STATE', state });
            syncLocalVisuals(state); 
        }

        // ==========================================
        // NEW: UNIFIED ATTACK FUNCTION
        // ==========================================
        function performAttack(pid) {
            const p = players[pid];
            if(!p) return;

            // Get currently equipped weapon object
            const equipped = p.weapons[p.currentSlot];
            
            // If slot is empty, do nothing
            if (!equipped) return;

            // Get Static Weapon Data (Damage, Type, etc)
            const weaponStats = WEAPON_REGISTRY[equipped.id];
            if(!weaponStats) return;

            const now = Date.now();
            if (now - p.lastFire < weaponStats.fireRateMs) return;

            // Check Ammo
            if (equipped.ammo > 0) {
                // Perform Action based on Type
                if (weaponStats.type === 'projectile') {
                    spawnBullet(pid, weaponStats);
                } else if (weaponStats.type === 'melee') {
                    performMeleeAttack(pid, weaponStats);
                }

                // Decrement Ammo (if not infinite)
                if (equipped.ammo !== Infinity) {
                    equipped.ammo--;
                }
                
                p.lastFire = now;
            }
        }

        function performMeleeAttack(pid, stats) {
            const p = players[pid];
            const fx = -Math.sin(p.yaw);
            const fz = -Math.cos(p.yaw);

            for (let zid in zombies) {
                let z = zombies[zid];
                let dx = z.x - p.x;
                let dz = z.z - p.z;
                let dist = Math.sqrt(dx*dx + dz*dz);

                if (dist < stats.range) {
                    let dirX = dx / dist;
                    let dirZ = dz / dist;
                    let dot = (fx * dirX) + (fz * dirZ);
                    
                    if (dot > 0.5) {
                        z.hp -= stats.damage;
                        if (z.hp <= 0) killZombie(zid, pid);
                    }
                }
            }
        }

        function spawnBullet(pid, stats) {
            let p = players[pid];
            let speed = stats.speed;
            let vx = -Math.sin(p.yaw) * Math.cos(p.pitch) * speed;
            let vy = Math.sin(p.pitch) * speed;
            let vz = -Math.cos(p.yaw) * Math.cos(p.pitch) * speed;

            bullets.push({
                x: p.x, y: p.y + 0.5, z: p.z,
                vx: vx, vy: vy, vz: vz,
                life: 2.0,
                owner: pid,
                damage: stats.damage
            });
        }

        // ==========================================
        // GAME LOGIC CONTINUED
        // ==========================================

        function checkGameOver() {
            let allDead = true;
            let count = 0;
            for(let id in players) {
                count++;
                if(!players[id].dead) allDead = false;
            }
            if(count > 0 && allDead) {
                broadcast({ type: 'WORLD_STATE', state: { players, zombies, bullets, wave } });
                setTimeout(() => {
                    document.getElementById('game-over-screen').classList.remove('hidden');
                    document.getElementById('mobile-controls').style.display = 'none';
                    if(!isMobile) document.exitPointerLock();
                }, 500);
                gameState = 'GAME_OVER';
                return true;
            }
            return false;
        }

        function handleZombies(dt) {
            if (zombiesToSpawn > 0 && Math.random() < 0.03) {
                let gx, gz;
                let tries = 0;
                let foundSpot = false;
                while (tries < 50 && !foundSpot) {
                    gx = Math.floor(Math.random() * (GRID_SIZE - 2)) + 1;
                    gz = Math.floor(Math.random() * (GRID_SIZE - 2)) + 1;
                    if (!isWall(gx, gz) && (Math.abs(gx - GRID_SIZE / 2) > 3 || Math.abs(gz - GRID_SIZE / 2) > 3)) foundSpot = true;
                    tries++;
                }
                if (foundSpot) {
                    let id = 'z_' + Date.now() + Math.random();
                    let wx = (gx * CELL_SIZE) - MAP_OFFSET + CELL_SIZE / 2;
                    let wz = (gz * CELL_SIZE) - MAP_OFFSET + CELL_SIZE / 2;
                    zombies[id] = { id, x: wx, y: 2, z: wz, hp: 50 + (wave * 20), yaw: 0 };
                    createZombiePhysics(id, wx, wz);
                    zombiesToSpawn--;
                }
            }
            
            if(zombiesToSpawn === 0 && Object.keys(zombies).length === 0) {
                gameState = 'SHOP';
                broadcast({ type: 'SHOP_OPEN' });
                document.getElementById('shop-menu').classList.remove('hidden');
                document.getElementById('mobile-controls').style.display = 'none';
                if(!isMobile) document.exitPointerLock();
                return;
            }

            for(let zid in zombies) {
                let z = zombies[zid];
                let body = zombieBodies[zid];
                if(!body) continue;
                let target = getClosestPlayer(body.position.x, body.position.z);
                if(target) {
                    let dx = target.x - body.position.x;
                    let dz = target.z - body.position.z;
                    let dist = Math.sqrt(dx*dx + dz*dz);
                    if(dist > 0.1) {
                        body.velocity.x = (dx/dist) * ZOMBIE_SPEED;
                        body.velocity.z = (dz/dist) * ZOMBIE_SPEED;
                        z.yaw = Math.atan2(dx, dz);
                        body.wakeUp();
                    }
                    z.x = body.position.x;
                    z.y = body.position.y;
                    z.z = body.position.z;
                    if(dist < 1.5) {
                         target.hp -= 20 * dt;
                         if(target.hp <= 0) target.dead = true;
                    }
                }
            }
        }

        function handleBullets(dt) {
            for(let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                b.z += b.vz * dt;
                b.life -= dt;
                
                let g = getGridPos(b.x, b.z);
                if(isWall(g.x, g.z) || b.y < 0) { bullets.splice(i, 1); continue; }

                let hit = false;
                for(let zid in zombies) {
                    let z = zombies[zid];
                    let dx = b.x - z.x;
                    let dz = b.z - z.z;
                    let dy = b.y - z.y;
                    if(Math.sqrt(dx*dx + dz*dz) < 0.8 && Math.abs(dy) < 1.5) {
                        // Use damage from bullet object
                        z.hp -= (b.damage || 35);
                        if(z.hp <= 0) killZombie(zid, b.owner);
                        hit = true; 
                        break;
                    }
                }
                if(hit || b.life <= 0) bullets.splice(i, 1);
            }
        }

        function killZombie(zid, killerId) {
            delete zombies[zid];
            if(zombieBodies[zid]) {
                world.removeBody(zombieBodies[zid]);
                delete zombieBodies[zid];
            }
            if(players[killerId]) players[killerId].money += 25;
        }

        function clientUpdate() {
            if(myId && hostId && conns[hostId]) {
                conns[hostId].send({
                    type: 'INPUT',
                    input: { x: input.x, y: input.y, fire: input.fire, jump: input.jump, slot: input.slot },
                    yaw: camYaw,
                    pitch: camPitch
                });
            }
        }

        // ==========================================
        // 7. RENDER & UI SYNC
        // ==========================================

        function syncLocalVisuals(state) {
            players = state.players;
            zombies = state.zombies;
            bullets = state.bullets;
            wave = state.wave;
            
            if(players[myId]) {
                const p = players[myId];
                document.getElementById('hp-disp').innerText = Math.floor(p.hp);
                document.getElementById('money-disp').innerText = p.money;
                document.getElementById('wave-disp').innerText = wave;
                document.getElementById('zombie-disp').innerText = Object.keys(zombies).length + zombiesToSpawn;
                
                // --- WEAPON UI ---
                const equipped = p.weapons[p.currentSlot];
                
                // Update Slot Highlights
                for(let i=1; i<=4; i++) {
                    const el = document.getElementById('slot-'+i);
                    if(i === (p.currentSlot + 1)) el.classList.add('slot-active');
                    else el.classList.remove('slot-active');
                }

                if(equipped) {
                    const stats = WEAPON_REGISTRY[equipped.id];
                    document.getElementById('weapon-name-disp').innerText = stats.name.toUpperCase();
                    
                    if(equipped.ammo === Infinity) {
                        document.getElementById('ammo-disp').innerText = "INF";
                        document.getElementById('ammo-disp').style.color = "#fff";
                    } else {
                        document.getElementById('ammo-disp').innerText = equipped.ammo;
                        document.getElementById('ammo-disp').style.color = equipped.ammo === 0 ? "#f00" : "#ff0";
                    }
                } else {
                    document.getElementById('weapon-name-disp').innerText = "EMPTY";
                    document.getElementById('ammo-disp').innerText = "--";
                }
            }
        }

        function renderScene() {
            if(players[myId] && !players[myId].dead) {
                const p = players[myId];
                camera.position.x = p.x;
                camera.position.y = p.y + 0.6; 
                camera.position.z = p.z;
                camera.rotation.y = camYaw;
                camera.rotation.x = camPitch;
            }

            for(let id in players) {
                if(id === myId) continue; 
                let p = players[id];
                if(p.dead) {
                    if(meshes[id]) { scene.remove(meshes[id]); delete meshes[id]; }
                    continue;
                }
                if(!meshes[id]) {
                    const geo = new THREE.BoxGeometry(1, 2, 1);
                    const mat = new THREE.MeshLambertMaterial({ color: 0x0088ff });
                    meshes[id] = new THREE.Mesh(geo, mat);
                    scene.add(meshes[id]);
                }
                meshes[id].position.set(p.x, p.y, p.z);
                meshes[id].rotation.y = p.yaw;
            }

            // Clean zombies
            for(let mid in meshes) {
                if(mid.startsWith('z_') && !zombies[mid]) {
                    scene.remove(meshes[mid]);
                    delete meshes[mid];
                }
            }
            // Draw zombies
            for(let zid in zombies) {
                let z = zombies[zid];
                if(!meshes[zid]) {
                    const geo = new THREE.BoxGeometry(1, 2, 1);
                    const mat = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
                    meshes[zid] = new THREE.Mesh(geo, mat);
                    scene.add(meshes[zid]);
                }
                meshes[zid].position.set(z.x, z.y, z.z);
                meshes[zid].rotation.y = z.yaw;
            }

            // Draw bullets
            while(bulletMeshes.length > bullets.length) {
                scene.remove(bulletMeshes.pop());
            }
            while(bulletMeshes.length < bullets.length) {
                const bMesh = new THREE.Mesh(
                    new THREE.BoxGeometry(0.2, 0.2, 0.2),
                    new THREE.MeshBasicMaterial({ color: 0xffff00 })
                );
                scene.add(bMesh);
                bulletMeshes.push(bMesh);
            }
            for(let i=0; i<bullets.length; i++) {
                bulletMeshes[i].position.set(bullets[i].x, bullets[i].y, bullets[i].z);
            }

            renderer.render(scene, camera);
        }

        // ==========================================
        // 8. HELPERS & UI
        // ==========================================

        function isWall(gx, gz) {
            if(gx < 0 || gx >= GRID_SIZE || gz < 0 || gz >= GRID_SIZE) return true;
            return mapGrid[gx][gz] === 1;
        }

        function getGridPos(x, z) {
            return {
                x: Math.floor((x + MAP_OFFSET) / CELL_SIZE),
                z: Math.floor((z + MAP_OFFSET) / CELL_SIZE)
            };
        }

        function getClosestPlayer(x, z) {
            let min = 9999, target = null;
            for(let id in players) {
                if(players[id].dead) continue;
                let d = Math.sqrt((x-players[id].x)**2 + (z-players[id].z)**2);
                if(d < min) { min = d; target = players[id]; }
            }
            return target;
        }

        function broadcast(msg) {
            for(let id in conns) conns[id].send(msg);
        }

        function hostStartGame() {
            if(!isHost) return;
            broadcast({ type: 'START_GAME' });
            document.getElementById('main-menu').classList.add('hidden');
            gameState = 'PLAYING';
            startWave(1);
            if(!isMobile) document.body.requestPointerLock();
            if(isMobile) document.getElementById('mobile-controls').style.display = 'block';
        }

        function startWave(n) {
            wave = n;
            zombiesToSpawn = Math.floor(wave * wave * 2.5);
            for(let id in players) players[id].ready = false;
        }

        function toggleReady() {
            let r = !players[myId].ready;
            players[myId].ready = r;
            document.getElementById('btn-ready').style.background = r ? '#0a0' : '#444';
            if(isHost) checkAllReady();
            else conns[hostId].send({ type: 'READY_STATE', ready: r });
        }

        function buyItem(index) {
            if(isHost) {
                const item = SHOP_ITEMS[index];
                if(item && players[myId].money >= item.cost) {
                    players[myId].money -= item.cost;
                    item.action(players[myId]);
                    // Immediate UI update via loop logic since players[myId] changed
                    syncLocalVisuals({ players, zombies, bullets, wave });
                }
            } else {
                conns[hostId].send({ type: 'BUY_ITEM', index: index });
            }
        }

        function checkAllReady() {
            let all = true;
            for(let id in players) if(!players[id].dead && !players[id].ready) all = false;
            if(all) {
                document.getElementById('shop-menu').classList.add('hidden');
                gameState = 'PLAYING';
                broadcast({ type: 'START_GAME' });
                startWave(wave + 1);
            }
        }

        function resetToLobby() {
            if(isHost) broadcast({ type: 'RESET_LOBBY' });
            window.location.reload();
        }

        function updateLobbyUI() {
            let html = '';
            for(let id in players) html += `<div>${players[id].name}</div>`;
            document.getElementById('lobby-status').innerHTML = html;
        }

        function copyInvite() {
            const url = window.location.href.split('?')[0] + '?join=' + myId;
            navigator.clipboard.writeText(url);
            alert("Invite Link Copied!");
        }

        function openShopMobile() { /* Placeholder */ }

        // --- CONTROLS ---

        function setupPCControls() {
            const keyState = {};
            window.addEventListener('keydown', (e) => {
                const k = e.key.toLowerCase();
                keyState[k] = true;
                if(e.code === 'Space') input.jump = true;

                // Number Keys 1-4 for Slot Selection
                if (['1','2','3','4'].includes(e.key)) {
                    input.slot = parseInt(e.key) - 1;
                }
            });
            window.addEventListener('keyup', (e) => {
                const k = e.key.toLowerCase();
                keyState[k] = false;
                if(e.code === 'Space') input.jump = false;
            });
            
            // Scroll Wheel for Switching
            window.addEventListener('wheel', (e) => {
                if(e.deltaY > 0) input.slot = (input.slot + 1) % 4;
                else input.slot = (input.slot - 1 + 4) % 4;
            });
            
            document.addEventListener('mousemove', (e) => {
                if(document.pointerLockElement === document.body) {
                    camYaw -= e.movementX * 0.002;
                    camPitch -= e.movementY * 0.002;
                    camPitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, camPitch));
                }
            });
            
            document.addEventListener('mousedown', () => {
                if(gameState === 'PLAYING') {
                    if(document.pointerLockElement !== document.body) document.body.requestPointerLock();
                    else input.fire = true; 
                }
            });

            document.addEventListener('mouseup', () => {
                input.fire = false; 
            });

            setInterval(() => {
                let x = 0, y = 0;
                if(keyState['w']) y += 1;
                if(keyState['s']) y -= 1;
                if(keyState['a']) x += 1;
                if(keyState['d']) x -= 1;
                input.x = x; input.y = y;
            }, 16);
        }

        function setupMobileControls() {
            const handleStick = (id, cb) => {
                const el = document.getElementById(id);
                const nub = el.querySelector('.stick-nub');
                let touchId = null;
                let origin = {x:0, y:0};
                
                el.addEventListener('touchstart', e => {
                    e.preventDefault();
                    let t = e.changedTouches[0];
                    touchId = t.identifier;
                    let rect = el.getBoundingClientRect();
                    origin = {x: rect.left + rect.width/2, y: rect.top + rect.height/2};
                    update(t.clientX, t.clientY);
                });
                
                el.addEventListener('touchmove', e => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].identifier === touchId) {
                            update(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                        }
                    }
                });
                
                const end = (e) => {
                    e.preventDefault();
                    for(let i=0; i<e.changedTouches.length; i++) {
                        if(e.changedTouches[i].identifier === touchId) {
                            touchId = null;
                            nub.style.transform = `translate(-50%, -50%)`;
                            cb(0, 0);
                        }
                    }
                };
                el.addEventListener('touchend', end);
                
                function update(cx, cy) {
                    let dx = cx - origin.x;
                    let dy = cy - origin.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    let max = 35;
                    if(dist > max) {
                        dx = (dx/dist)*max;
                        dy = (dy/dist)*max;
                    }
                    nub.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                    cb(dx/max, dy/max);
                }
            };

            handleStick('stick-left', (x, y) => { input.x = x; input.y = -y; });
            handleStick('stick-right', (x, y) => {
                camYaw -= x * 0.05;
                camPitch -= y * 0.05;
                camPitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, camPitch));
            });

            const btnFire = document.getElementById('btn-fire');
            btnFire.addEventListener('touchstart', (e) => { e.preventDefault(); input.fire = true; btnFire.style.backgroundColor = "rgba(255,0,0,0.5)"; });
            btnFire.addEventListener('touchend', (e) => { e.preventDefault(); input.fire = false; btnFire.style.backgroundColor = "rgba(255,0,0,0.2)"; });

            const btnJump = document.getElementById('btn-jump');
            btnJump.addEventListener('touchstart', (e) => { e.preventDefault(); input.jump = true; btnJump.style.backgroundColor = "rgba(0,0,255,0.5)"; });
            btnJump.addEventListener('touchend', (e) => { e.preventDefault(); input.jump = false; btnJump.style.backgroundColor = "rgba(255,0,0,0.2)"; });
        }

        init();

    </script>
