<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Survival: Tactics Update</title>
    <style>
        /* --- GLOBAL --- */
        body { margin: 0; overflow: hidden; background: #000; color: #fff; touch-action: none; user-select: none; font-family: 'Courier New', monospace; }
        
        /* --- MENUS --- */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 50; }
        .hidden { display: none !important; }
        h1 { color: #e00; font-size: 3rem; text-shadow: 0 0 10px #f00; margin: 0 0 20px 0; }
        
        input, button { padding: 10px; margin: 5px; background: #222; border: 1px solid #444; color: #fff; font-family: inherit; font-size: 1.1rem; }
        button:hover { background: #e00; cursor: pointer; border-color: #f00; }
        button:active { background: #900; }
        
        /* --- HUD --- */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: #0f0; border-radius: 50%; transform: translate(-50%, -50%); z-index: 10; box-shadow: 0 0 5px #0f0; }
        
        .hud-panel { position: absolute; padding: 10px; z-index: 5; text-shadow: 1px 1px 0 #000; }
        #hud-top-right { top: 10px; right: 10px; text-align: right; font-size: 1.5rem; }
        #hud-bottom-right { bottom: 20px; right: 20px; text-align: right; font-size: 1.2rem; line-height: 1.5; }
        #hud-bottom-left { bottom: 20px; left: 20px; pointer-events: auto; }
        
        #chat-box { width: 300px; height: 150px; overflow-y: auto; background: rgba(0,0,0,0.5); font-size: 12px; padding: 5px; margin-bottom: 5px; }
        #chat-input { width: 100%; box-sizing: border-box; display: none; }

        /* --- SHOP --- */
        #shop-items { display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; }
        .shop-row { display: flex; justify-content: space-between; background: #222; padding: 10px; align-items: center; border: 1px solid #444; }

        /* --- MOBILE CONTROLS --- */
        #mobile-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; display: none; pointer-events: none; }
        
        .joystick-zone { position: absolute; width: 150px; height: 150px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; pointer-events: auto; }
        .joystick-nub { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(255,255,255,0.3); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        #stick-left { bottom: 30px; left: 30px; }
        #stick-right { bottom: 30px; right: 30px; }
        
        .action-btn { position: absolute; background: rgba(200, 0, 0, 0.3); border: 2px solid #f00; color: #fff; font-weight: bold; border-radius: 50%; display: flex; justify-content: center; align-items: center; pointer-events: auto; }
        .action-btn:active { background: rgba(255,0,0,0.6); }

        #btn-fire { bottom: 100px; right: 190px; width: 70px; height: 70px; } 
        #btn-reload { bottom: 40px; right: 190px; width: 50px; height: 50px; font-size: 12px; background: rgba(255,255,255,0.1); border-color: #fff; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="main-menu" class="overlay">
        <h1>ZOMBIE TACTICS</h1>
        <input type="text" id="player-name" value="Soldier" placeholder="Enter Name">
        
        <div id="host-panel">
            <button onclick="copyInvite()">Copy Invite Link</button>
            <div id="lobby-list" style="margin:20px; color:#aaa;">Waiting for players...</div>
            <button onclick="hostStartGame()" style="background:#0a0; border-color:#0f0; width: 200px;">START GAME</button>
        </div>

        <div id="client-panel" class="hidden">
            <p>Connecting to Host...</p>
            <div id="client-status" style="color:#ff0">Connecting...</div>
        </div>
    </div>

    <div id="shop-menu" class="overlay hidden">
        <h1 style="color:#0f0">ARMORY</h1>
        <div id="shop-items"></div>
        <button onclick="toggleReady()" id="ready-btn" style="margin-top:20px; width:100%; padding:20px; background:#005500;">READY UP</button>
    </div>

    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="hud-top-right">
            <div style="color:#e00">WAVE <span id="wave-num">1</span></div>
            <div style="font-size:1rem; color:#888">Enemies: <span id="enemy-count">0</span></div>
        </div>
        <div id="hud-bottom-right">
            <div style="font-size:1.5rem; color:#0f0">HP: <span id="hp-val">100</span></div>
            <div style="color:#ff0">AMMO: <span id="ammo-val">30</span></div>
            <div style="color:#fff">CASH: $<span id="cash-val">0</span></div>
        </div>
        <div id="hud-bottom-left">
            <div id="chat-box"></div>
            <input type="text" id="chat-input" placeholder="Press Enter to chat...">
        </div>
    </div>

    <div id="mobile-controls">
        <div id="stick-left" class="joystick-zone"><div class="joystick-nub" id="nub-left"></div></div>
        <div id="stick-right" class="joystick-zone"><div class="joystick-nub" id="nub-right"></div></div>
        <div id="btn-fire" class="action-btn">FIRE</div>
        <div id="btn-reload" class="action-btn" onclick="openShop()">SHOP</div> 
    </div>

    <script>
        // --- CONSTANTS & CONFIG ---
        const GRID_SIZE = 40; // 40x40 grid
        const CELL_SIZE = 4;  // Each cell is 4x4 units
        const MAP_OFFSET = (GRID_SIZE * CELL_SIZE) / 2;
        
        const PLAYER_SPEED = 25.0;
        const ZOMBIE_SPEED = 14.0;
        const BULLET_SPEED = 80.0;
        
        // --- GLOBALS ---
        let isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent) || navigator.maxTouchPoints > 1;
        let isHost = true;
        let myId = null, hostId = null;
        let peer = null;
        let conns = {}; // Store connections
        
        // Game State
        let gameState = 'LOBBY'; // LOBBY, PLAYING, SHOP, GAMEOVER
        let players = {};
        let zombies = {};
        let bullets = [];
        let mapGrid = []; // 0=Walkable, 1=Wall
        let wave = 1;
        let zombiesToSpawn = 0;
        let lastTime = performance.now();

        // Inputs
        const input = { x: 0, y: 0, aimX: 0, aimY: 0, shoot: false }; // x/y = move, aimX/aimY = look
        let camPitch = 0;
        let camYaw = 0;

        // Three.js
        let scene, camera, renderer, audioListener;
        let meshes = {};
        let bulletMeshes = [];
        
        // --- MAP GENERATION ---
        function generateMap() {
            mapGrid = [];
            for(let x=0; x<GRID_SIZE; x++) {
                let row = [];
                for(let z=0; z<GRID_SIZE; z++) {
                    // Borders are walls
                    if(x===0 || x===GRID_SIZE-1 || z===0 || z===GRID_SIZE-1) row.push(1);
                    // Random obstacles (10% chance), but keep center clear
                    else if(Math.random() < 0.1 && Math.abs(x-GRID_SIZE/2) > 4 && Math.abs(z-GRID_SIZE/2) > 4) row.push(1);
                    else row.push(0);
                }
                mapGrid.push(row);
            }
        }

        function getGridPos(worldX, worldZ) {
            let gx = Math.floor((worldX + MAP_OFFSET) / CELL_SIZE);
            let gz = Math.floor((worldZ + MAP_OFFSET) / CELL_SIZE);
            return { x: gx, z: gz };
        }

        function isWall(gx, gz) {
            if (gx < 0 || gx >= GRID_SIZE || gz < 0 || gz >= GRID_SIZE) return true;
            return mapGrid[gx][gz] === 1;
        }

        // --- PATHFINDING (A*) ---
        function findPath(sx, sz, ex, ez) {
            // Simplified A* on Grid
            // Optimization: Limit search depth for performance in JS
            let openSet = [{x:sx, z:sz, g:0, f:0, p:null}];
            let closed = new Set();
            let count = 0;

            while(openSet.length > 0 && count < 200) { // Limit iterations
                // Get lowest F
                let currentIdx = 0;
                for(let i=1; i<openSet.length; i++) 
                    if(openSet[i].f < openSet[currentIdx].f) currentIdx = i;
                
                let current = openSet[currentIdx];
                if(current.x === ex && current.z === ez) {
                    // Reconstruct path
                    let path = [];
                    let temp = current;
                    while(temp) { path.push({x:temp.x, z:temp.z}); temp = temp.p; }
                    return path.reverse();
                }

                openSet.splice(currentIdx, 1);
                closed.add(`${current.x},${current.z}`);
                count++;

                // Neighbors
                let dirs = [[0,1], [0,-1], [1,0], [-1,0]];
                for(let d of dirs) {
                    let nx = current.x + d[0];
                    let nz = current.z + d[1];
                    
                    if(isWall(nx, nz) || closed.has(`${nx},${nz}`)) continue;

                    let g = current.g + 1;
                    let h = Math.abs(nx-ex) + Math.abs(nz-ez); // Manhattan
                    let existing = openSet.find(n => n.x === nx && n.z === nz);

                    if(!existing) {
                        openSet.push({x:nx, z:nz, g:g, f:g+h, p:current});
                    } else if (g < existing.g) {
                        existing.g = g;
                        existing.f = g+h;
                        existing.p = current;
                    }
                }
            }
            return null; // No path found or too far
        }

        // --- NETWORK SETUP ---
        function initNetwork() {
            peer = new Peer(null, { debug: 1 });
            
            peer.on('open', (id) => {
                myId = id;
                console.log("My ID:", myId);
                const params = new URLSearchParams(window.location.search);
                if(params.get('join')) {
                    isHost = false;
                    hostId = params.get('join');
                    document.getElementById('host-panel').classList.add('hidden');
                    document.getElementById('client-panel').classList.remove('hidden');
                    connectToHost(hostId);
                } else {
                    players[myId] = createPlayer(myId, document.getElementById('player-name').value);
                    generateMap(); // Host generates map
                    updateLobby();
                }
            });

            peer.on('connection', (conn) => {
                conn.on('data', (data) => handleData(data, conn.peer));
                conn.on('open', () => {
                    if(isHost) {
                        conns[conn.peer] = conn;
                        conn.send({ type: 'MAP_DATA', map: mapGrid }); // Send map to new player
                    }
                });
                conn.on('close', () => { if(isHost) delete players[conn.peer]; });
            });
        }

        function connectToHost(id) {
            const conn = peer.connect(id);
            conns[id] = conn;
            conn.on('open', () => {
                document.getElementById('client-status').innerText = "Connected! Waiting for host...";
                conn.send({ type: 'JOIN', name: document.getElementById('player-name').value });
            });
            conn.on('data', (data) => handleData(data, id));
        }

        function handleData(data, sender) {
            if(data.type === 'JOIN' && isHost) {
                players[sender] = createPlayer(sender, data.name);
                broadcast({ type: 'LOBBY_UPDATE', players: players });
                updateLobby();
            }
            else if (data.type === 'MAP_DATA') {
                mapGrid = data.map; // Client receives map
            }
            else if (data.type === 'LOBBY_UPDATE') {
                players = data.players;
                updateLobby();
            }
            else if (data.type === 'START') {
                startGame();
            }
            else if (data.type === 'INPUT') {
                if(isHost && players[sender]) {
                    players[sender].input = data.input;
                    players[sender].yaw = data.yaw;
                    if(data.fire) spawnBullet(sender);
                }
            }
            else if (data.type === 'WORLD_STATE') {
                if(!isHost) syncWorld(data);
            }
            else if (data.type === 'SHOP_OPEN') {
                gameState = 'SHOP';
                document.getElementById('shop-menu').classList.remove('hidden');
                document.getElementById('mobile-controls').style.display = 'none';
            }
            else if (data.type === 'READY_UPDATE') {
                if(isHost) {
                    players[sender].ready = data.state;
                    checkAllReady();
                }
            }
        }

        function broadcast(msg) {
            Object.values(conns).forEach(c => c.send(msg));
        }

        function createPlayer(id, name) {
            return {
                id, name, x: 0, z: 0, hp: 100, money: 0,
                yaw: 0, dead: false, ready: false,
                input: { x:0, y:0 }, 
                lastShot: 0
            };
        }

        // --- GRAPHICS ---
        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000000, 10, 60);
            
            camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 100);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            
            // Lights
            const ambient = new THREE.AmbientLight(0x404040);
            scene.add(ambient);
            const point = new THREE.PointLight(0xffffff, 1, 50);
            point.position.set(0, 10, 0);
            scene.add(point);

            // Build Map Mesh
            const wallGeo = new THREE.BoxGeometry(CELL_SIZE, 6, CELL_SIZE);
            const wallMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
            const floorGeo = new THREE.PlaneGeometry(GRID_SIZE*CELL_SIZE, GRID_SIZE*CELL_SIZE);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
            
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI/2;
            scene.add(floor);

            for(let x=0; x<GRID_SIZE; x++) {
                for(let z=0; z<GRID_SIZE; z++) {
                    if(mapGrid[x][z] === 1) {
                        const wall = new THREE.Mesh(wallGeo, wallMat);
                        wall.position.set(
                            (x * CELL_SIZE) - MAP_OFFSET + CELL_SIZE/2, 
                            3, 
                            (z * CELL_SIZE) - MAP_OFFSET + CELL_SIZE/2
                        );
                        scene.add(wall);
                    }
                }
            }

            if(isMobile) setupTouchControls();
            else setupPCControls();

            requestAnimationFrame(animate);
        }

        // --- GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            if(gameState === 'LOBBY') return;

            let now = performance.now();
            let dt = Math.min((now - lastTime)/1000, 0.1);
            lastTime = now;

            if(isHost) hostLogic(dt);
            else clientLogic();

            renderInterpolation(dt);
            renderer.render(scene, camera);
        }

        function hostLogic(dt) {
            if(gameState === 'PLAYING') {
                // Wave Logic
                if(zombiesToSpawn > 0 && Math.random() < 0.05) {
                    spawnZombie();
                }
                
                if(zombiesToSpawn === 0 && Object.keys(zombies).length === 0) {
                    gameState = 'SHOP';
                    broadcast({ type: 'SHOP_OPEN' });
                    // Open host shop too
                    document.getElementById('shop-menu').classList.remove('hidden');
                    if(isMobile) document.getElementById('mobile-controls').style.display = 'none';
                    else document.exitPointerLock();
                    return;
                }

                // Update Zombies
                for(let zid in zombies) {
                    let z = zombies[zid];
                    
                    // Simple pathfinding update (recalc every 0.5s or if no path)
                    if(!z.path || z.path.length === 0 || Math.random() < 0.05) {
                        let target = getClosestPlayer(z.x, z.z);
                        if(target) {
                            let gStart = getGridPos(z.x, z.z);
                            let gEnd = getGridPos(target.x, target.z);
                            z.path = findPath(gStart.x, gStart.z, gEnd.x, gEnd.z);
                        }
                    }

                    // Move along path
                    let moveTarget = { x: z.x, z: z.z }; // Default stay
                    if(z.path && z.path.length > 0) {
                        // Get next cell center in world coords
                        let nextCell = z.path[0];
                        let targetX = (nextCell.x * CELL_SIZE) - MAP_OFFSET + CELL_SIZE/2;
                        let targetZ = (nextCell.z * CELL_SIZE) - MAP_OFFSET + CELL_SIZE/2;
                        
                        // Direction
                        let dx = targetX - z.x;
                        let dz = targetZ - z.z;
                        let dist = Math.sqrt(dx*dx + dz*dz);
                        
                        if(dist < 0.5) {
                            z.path.shift(); // Reached node
                        } else {
                            z.x += (dx/dist) * ZOMBIE_SPEED * dt;
                            z.z += (dz/dist) * ZOMBIE_SPEED * dt;
                            z.yaw = Math.atan2(dx, dz);
                        }
                    } else {
                        // Fallback: Line of sight move if close
                         let target = getClosestPlayer(z.x, z.z);
                         if(target) {
                             let dx = target.x - z.x;
                             let dz = target.z - z.z;
                             z.yaw = Math.atan2(dx, dz);
                             z.x += Math.sin(z.yaw) * ZOMBIE_SPEED * dt;
                             z.z += Math.cos(z.yaw) * ZOMBIE_SPEED * dt;
                         }
                    }

                    // Zombie Damage
                    let target = getClosestPlayer(z.x, z.z);
                    if(target && dist(z.x, z.z, target.x, target.z) < 1.5) {
                        target.hp -= 20 * dt;
                        if(target.hp <= 0) target.dead = true;
                    }
                }

                // Update Bullets
                for(let i=bullets.length-1; i>=0; i--) {
                    let b = bullets[i];
                    b.x += b.vx * dt;
                    b.z += b.vz * dt;
                    b.life -= dt;
                    
                    // Hit Zombies
                    let hit = false;
                    for(let zid in zombies) {
                        let z = zombies[zid];
                        if(dist(b.x, b.z, z.x, z.z) < 1.0) {
                            z.hp -= 35; 
                            if(z.hp <= 0) {
                                delete zombies[zid];
                                players[b.owner].money += 20;
                            }
                            hit = true;
                            break;
                        }
                    }
                    
                    // Hit Walls
                    let gPos = getGridPos(b.x, b.z);
                    if(isWall(gPos.x, gPos.z)) hit = true;

                    if(hit || b.life <= 0) bullets.splice(i, 1);
                }
            }

            // Move Players (Collision)
            for(let pid in players) {
                let p = players[pid];
                if(p.dead) continue;
                
                // Calculate Velocity based on Yaw and Input
                // Forward/Back moves along Yaw vector
                // Strafe moves perpendicular
                let sin = Math.sin(p.yaw);
                let cos = Math.cos(p.yaw);
                
                // Input X = Strafe, Input Y = Forward/Back
                let vx = (p.input.x * cos - p.input.y * sin) * PLAYER_SPEED;
                let vz = (-p.input.x * sin - p.input.y * cos) * PLAYER_SPEED;

                // Try X Move
                if(!checkWallCollision(p.x + vx*dt, p.z)) p.x += vx*dt;
                // Try Z Move
                if(!checkWallCollision(p.x, p.z + vz*dt)) p.z += vz*dt;
            }

            // Sync
            broadcast({ 
                type: 'WORLD_STATE', 
                state: { players, zombies, bullets: bullets.map(b => ({x:b.x, z:b.z})), wave } 
            });
            syncWorld({ state: { players, zombies, bullets, wave } }); // Update host local view
        }

        function checkWallCollision(x, z) {
            // Check bounding box radius
            let rad = 0.5;
            let checks = [
                {x: x+rad, z: z+rad}, {x: x-rad, z: z-rad},
                {x: x+rad, z: z-rad}, {x: x-rad, z: z+rad}
            ];
            for(let c of checks) {
                let g = getGridPos(c.x, c.z);
                if(isWall(g.x, g.z)) return true;
            }
            return false;
        }

        function spawnBullet(pid) {
            let p = players[pid];
            if(!p || p.dead) return;
            
            // Spawn slightly in front
            let bx = p.x + Math.sin(p.yaw) * 1.0;
            let bz = p.z + Math.cos(p.yaw) * 1.0;
            
            bullets.push({
                x: bx, z: bz,
                vx: Math.sin(p.yaw) * BULLET_SPEED,
                vz: Math.cos(p.yaw) * BULLET_SPEED,
                life: 2.0,
                owner: pid
            });
        }

        function spawnZombie() {
            let id = 'z'+Math.random();
            // Find random empty spot
            let gx, gz;
            do {
                gx = Math.floor(Math.random()*GRID_SIZE);
                gz = Math.floor(Math.random()*GRID_SIZE);
            } while(isWall(gx, gz) || dist((gx*CELL_SIZE)-MAP_OFFSET, (gz*CELL_SIZE)-MAP_OFFSET, 0, 0) < 20);

            zombies[id] = {
                x: (gx * CELL_SIZE) - MAP_OFFSET + CELL_SIZE/2,
                z: (gz * CELL_SIZE) - MAP_OFFSET + CELL_SIZE/2,
                hp: 100 + (wave*20),
                path: [],
                yaw: 0
            };
            zombiesToSpawn--;
        }

        function clientLogic() {
            if(isMobile) {
                // Mobile: Send joystick data
                // Left stick moves, Right stick sets Absolute Yaw
                // We send {x, y} for movement, and yaw for looking
                if(myId && conns[hostId]) {
                    conns[hostId].send({
                        type: 'INPUT',
                        input: { x: input.x, y: input.y },
                        yaw: camYaw,
                        fire: input.shoot
                    });
                    input.shoot = false; // Reset trigger
                }
            } else {
                // PC: Send WASD and Yaw
                if(myId && conns[hostId]) {
                    conns[hostId].send({
                        type: 'INPUT',
                        input: { x: input.x, y: input.y },
                        yaw: camYaw,
                        fire: input.shoot
                    });
                    input.shoot = false;
                }
            }
        }

        // --- RENDERER ---
        const pMat = new THREE.MeshLambertMaterial({ color: 0x0088ff });
        const zMat = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
        const bMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const charGeo = new THREE.BoxGeometry(1, 2, 1);
        const bulletGeo = new THREE.SphereGeometry(0.2, 4, 4);

        function renderInterpolation(dt) {
            // Camera Logic
            if(players[myId] && !players[myId].dead) {
                let me = players[myId];
                camera.position.set(me.x, 2, me.z);
                // On mobile, camYaw is set by right stick. On PC by mouse.
                camera.rotation.y = camYaw + Math.PI; // Invert for Three.js camera
                camera.rotation.x = camPitch;
            }

            // Sync Meshes
            // Players
            for(let pid in players) {
                if(pid === myId) continue; // Don't render self body for FPS
                let p = players[pid];
                if(p.dead) { if(meshes[pid]) { scene.remove(meshes[pid]); delete meshes[pid]; } continue; }
                
                if(!meshes[pid]) { meshes[pid] = new THREE.Mesh(charGeo, pMat); scene.add(meshes[pid]); }
                meshes[pid].position.set(p.x, 1, p.z);
                meshes[pid].rotation.y = p.yaw;
            }
            
            // Zombies
            for(let zid in zombies) {
                let z = zombies[zid];
                if(!meshes[zid]) { meshes[zid] = new THREE.Mesh(charGeo, zMat); scene.add(meshes[zid]); }
                meshes[zid].position.set(z.x, 1, z.z);
                meshes[zid].rotation.y = z.yaw;
            }
            
            // Clean dead entities
            for(let id in meshes) {
                if(id.startsWith('z') && !zombies[id]) { scene.remove(meshes[id]); delete meshes[id]; }
                if(!id.startsWith('z') && !players[id]) { scene.remove(meshes[id]); delete meshes[id]; }
            }

            // Bullets (Pool/Recreate)
            // Lazy approach: Remove all bullet meshes, re-add. 
            // Better: Pool. But strictly simpler code:
            bulletMeshes.forEach(m => scene.remove(m));
            bulletMeshes = [];
            bullets.forEach(b => {
                let m = new THREE.Mesh(bulletGeo, bMat);
                m.position.set(b.x, 2, b.z);
                scene.add(m);
                bulletMeshes.push(m);
            });

            // HUD
            if(players[myId]) {
                document.getElementById('hp-val').innerText = Math.floor(players[myId].hp);
                document.getElementById('cash-val').innerText = players[myId].money;
                document.getElementById('enemy-count').innerText = Object.keys(zombies).length + zombiesToSpawn;
                document.getElementById('wave-num').innerText = wave;
            }
        }

        // --- CONTROLS ---
        function setupTouchControls() {
            document.getElementById('mobile-controls').style.display = 'block';
            
            // Helper for joystick logic
            const handleStick = (e, stickId, callback) => {
                const stick = document.getElementById(stickId);
                const rect = stick.getBoundingClientRect();
                const center = { x: rect.left + rect.width/2, y: rect.top + rect.height/2 };
                
                for(let i=0; i<e.changedTouches.length; i++) {
                    let t = e.changedTouches[i];
                    // Check if touch is near stick
                    let dx = t.clientX - center.x;
                    let dy = t.clientY - center.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    
                    if(dist < 100) { // Interaction radius
                        // Clamp nub
                        let max = 40;
                        if(dist > max) { dx = (dx/dist)*max; dy = (dy/dist)*max; }
                        stick.children[0].style.transform = `translate(-50%, -50%) translate(${dx}px, ${dy}px)`;
                        
                        // Normalize -1 to 1
                        callback(dx/max, dy/max);
                        e.preventDefault();
                    }
                }
            };
            
            const resetStick = (stickId) => {
                document.getElementById(stickId).children[0].style.transform = `translate(-50%, -50%)`;
            };

            // LEFT STICK (Move)
            const sLeft = document.getElementById('stick-left');
            sLeft.addEventListener('touchmove', e => handleStick(e, 'stick-left', (x, y) => {
                input.x = x; 
                input.y = -y; // Invert Y: Drag Up (-1) -> Move Forward (+1)
            }));
            sLeft.addEventListener('touchend', () => { resetStick('stick-left'); input.x=0; input.y=0; });

            // RIGHT STICK (Look)
            const sRight = document.getElementById('stick-right');
            sRight.addEventListener('touchmove', e => handleStick(e, 'stick-right', (x, y) => {
                // Rotate camera based on stick deflection
                camYaw -= x * 0.1; // Turn Left/Right
                camPitch -= y * 0.05; // Look Up/Down
                camPitch = Math.max(-1.5, Math.min(1.5, camPitch));
            }));
            sRight.addEventListener('touchend', () => resetStick('stick-right'));

            // BUTTONS
            document.getElementById('btn-fire').addEventListener('touchstart', (e) => { e.preventDefault(); input.shoot = true; });
        }

        function setupPCControls() {
            document.addEventListener('keydown', e => {
                if(e.code === 'KeyW') input.y = 1;
                if(e.code === 'KeyS') input.y = -1;
                if(e.code === 'KeyA') input.x = -1;
                if(e.code === 'KeyD') input.x = 1;
            });
            document.addEventListener('keyup', e => {
                if(e.code === 'KeyW' || e.code === 'KeyS') input.y = 0;
                if(e.code === 'KeyA' || e.code === 'KeyD') input.x = 0;
            });
            document.addEventListener('mousemove', e => {
                if(document.pointerLockElement === document.body) {
                    camYaw -= e.movementX * 0.002;
                    camPitch -= e.movementY * 0.002;
                    camPitch = Math.max(-1.5, Math.min(1.5, camPitch));
                }
            });
            document.addEventListener('mousedown', () => {
                if(document.pointerLockElement !== document.body) document.body.requestPointerLock();
                else input.shoot = true;
            });
        }

        // --- UTILS ---
        function hostStartGame() {
            if(!isHost) return;
            broadcast({ type: 'START' });
            startGame();
        }

        function startGame() {
            document.getElementById('main-menu').classList.add('hidden');
            gameState = 'PLAYING';
            if(!scene) initThree();
            if(isHost) startWave(1);
        }

        function startWave(n) {
            wave = n;
            zombiesToSpawn = 5 + (wave * 3);
            gameState = 'PLAYING';
            // Reset shop readiness
            for(let id in players) players[id].ready = false;
        }

        function toggleReady() {
            if(isHost) {
                players[myId].ready = !players[myId].ready;
                checkAllReady();
            } else {
                conns[hostId].send({ type: 'READY_UPDATE', state: !players[myId].ready });
            }
            let btn = document.getElementById('ready-btn');
            btn.style.background = players[myId].ready ? '#0a0' : '#500';
            btn.innerText = players[myId].ready ? 'WAITING...' : 'READY UP';
        }

        function checkAllReady() {
            let all = true;
            for(let id in players) if(!players[id].ready) all = false;
            
            if(all) {
                document.getElementById('shop-menu').classList.add('hidden');
                if(isMobile) document.getElementById('mobile-controls').style.display = 'block';
                else document.body.requestPointerLock();
                
                startWave(wave + 1);
                broadcast({ type: 'LOBBY_UPDATE', players: players }); // Force sync hud
            }
        }

        function copyInvite() {
            const url = window.location.href.split('?')[0] + '?join=' + myId;
            navigator.clipboard.writeText(url);
            alert("Invite Link Copied!");
        }

        function updateLobby() {
            document.getElementById('lobby-list').innerHTML = Object.values(players).map(p => `<div>${p.name}</div>`).join('');
        }
        
        function getClosestPlayer(x, z) {
            let closest = null, minDist = 9999;
            for(let id in players) {
                let p = players[id];
                if(p.dead) continue;
                let d = dist(x, z, p.x, p.z);
                if(d < minDist) { minDist = d; closest = p; }
            }
            return closest;
        }

        function dist(x1, z1, x2, z2) { return Math.sqrt((x2-x1)**2 + (z2-z1)**2); }
        
        function openShop() {
            // Mobile only toggle for visual shop menu
            if(gameState === 'SHOP') return; // Logic handled by host
        }

        // --- BOOTSTRAP ---
        initNetwork();
    </script>
</body>
</html>
