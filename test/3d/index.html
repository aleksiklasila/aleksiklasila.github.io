<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Tactics: Fixed</title>
    <style>
        /* --- CORE --- */
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; touch-action: none; user-select: none; -webkit-user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* --- UI LAYERS --- */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: white; }
        .hidden { display: none !important; }
        
        h1 { color: #d00; font-size: 3rem; margin-bottom: 10px; text-shadow: 2px 2px 0 #000; }
        input, button { padding: 15px; margin: 5px; background: #222; border: 2px solid #555; color: white; font-size: 1.2rem; font-family: inherit; }
        button:hover { border-color: #d00; color: #d00; cursor: pointer; }
        button:active { background: #500; }

        /* --- HUD --- */
        #hud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: #0f0; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 4px #0f0; }
        
        .hud-text { position: absolute; text-shadow: 2px 2px 0 #000; font-weight: bold; }
        #hud-top-right { top: 20px; right: 20px; text-align: right; font-size: 1.5rem; color: #fff; }
        #hud-bottom-right { bottom: 20px; right: 20px; text-align: right; font-size: 1.2rem; color: #ff0; }
        
        /* --- MOBILE CONTROLS --- */
        #mobile-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; pointer-events: none; display: none; }
        
        .stick-zone { position: absolute; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; pointer-events: auto; }
        .stick-nub { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(255, 255, 255, 0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        /* Positioning Controls - Moved up to avoid overlap */
        #stick-left { bottom: 30px; left: 30px; }
        #stick-right { bottom: 30px; right: 30px; }
        
        .action-btn { position: absolute; width: 80px; height: 80px; background: rgba(255, 0, 0, 0.2); border: 3px solid #f00; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; pointer-events: auto; }
        .action-btn:active { background: rgba(255, 0, 0, 0.5); }
        
        /* Buttons moved higher to clear the right stick */
        #btn-fire { bottom: 180px; right: 30px; width: 90px; height: 90px; } 
        #btn-shop { bottom: 180px; left: 30px; width: 60px; height: 60px; border-color: #ff0; font-size: 12px; }

        /* --- SHOP --- */
        .shop-item { display: flex; justify-content: space-between; width: 300px; padding: 10px; background: #333; margin-bottom: 5px; align-items: center; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="main-menu" class="overlay">
        <h1>ZOMBIE TACTICS</h1>
        <input type="text" id="player-name" value="Survivor">
        <div id="host-panel">
            <button onclick="copyInvite()">Copy Invite Link</button>
            <div id="lobby-status" style="margin:15px; color:#aaa">Waiting for players...</div>
            <button onclick="hostStartGame()" style="background:#0a0; width: 200px;">START GAME</button>
        </div>
        <div id="client-panel" class="hidden">
            <p>Connecting to Host...</p>
        </div>
    </div>

    <div id="shop-menu" class="overlay hidden">
        <h1 style="color:#0f0">TRADER</h1>
        <div id="shop-list"></div>
        <button onclick="toggleReady()" id="ready-btn" style="margin-top:20px; width:200px; background:#444;">READY</button>
    </div>

    <div id="hud-layer">
        <div id="crosshair"></div>
        <div id="hud-top-right">
            <div>WAVE <span id="wave-disp">1</span></div>
            <div style="font-size:1rem; color:#aaa">Zombies: <span id="zombie-disp">0</span></div>
        </div>
        <div id="hud-bottom-right">
            <div style="color:#f44">HP: <span id="hp-disp">100</span></div>
            <div style="color:#ff0">AMMO: <span id="ammo-disp">∞</span></div>
            <div style="color:#0f0">$<span id="money-disp">0</span></div>
        </div>
        <div id="hud-bottom-left" style="position:absolute; bottom:20px; left:20px;">
            </div>
    </div>

    <div id="mobile-controls">
        <div id="stick-left" class="stick-zone"><div class="stick-nub"></div></div>
        <div id="stick-right" class="stick-zone"><div class="stick-nub"></div></div>
        <div id="btn-fire" class="action-btn">FIRE</div>
        <div id="btn-shop" class="action-btn" onclick="openShopMobile()">SHOP</div>
    </div>

    <script>
        // --- CONFIG ---
        const GRID_SIZE = 30; 
        const CELL_SIZE = 5; 
        const MAP_OFFSET = (GRID_SIZE * CELL_SIZE) / 2;
        const WALL_HEIGHT = 4;
        
        const PLAYER_SPEED = 20.0;
        const ZOMBIE_SPEED = 12.0;
        const BULLET_SPEED = 60.0;

        // --- GLOBALS ---
        let isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || navigator.maxTouchPoints > 1;
        let myId = null;
        let isHost = true;
        let hostId = null;
        let peer;
        let conns = {};
        
        // Game State
        let gameState = 'LOBBY';
        let players = {};
        let zombies = {};
        let bullets = [];
        let mapGrid = [];
        let wave = 1;
        let zombiesToSpawn = 0;
        let lastTime = performance.now();
        
        // Input State
        let input = { x: 0, y: 0, aimX: 0, aimY: 0, fire: false };
        let camPitch = 0;
        let camYaw = 0;

        // Three.js
        let scene, camera, renderer;
        let meshes = {};
        let bulletMeshes = [];

        // --- MAP SYSTEM ---
        function generateMap() {
            mapGrid = [];
            for(let x=0; x<GRID_SIZE; x++) {
                let row = [];
                for(let z=0; z<GRID_SIZE; z++) {
                    // Borders
                    if (x===0 || x===GRID_SIZE-1 || z===0 || z===GRID_SIZE-1) row.push(1);
                    // Random Walls (avoid center 6x6 area for spawn)
                    else if (Math.random() < 0.15 && (Math.abs(x - GRID_SIZE/2) > 3 || Math.abs(z - GRID_SIZE/2) > 3)) row.push(1);
                    else row.push(0);
                }
                mapGrid.push(row);
            }
        }

        function isWall(gx, gz) {
            if(gx < 0 || gx >= GRID_SIZE || gz < 0 || gz >= GRID_SIZE) return true;
            return mapGrid[gx][gz] === 1;
        }

        function getGridPos(x, z) {
            return {
                x: Math.floor((x + MAP_OFFSET) / CELL_SIZE),
                z: Math.floor((z + MAP_OFFSET) / CELL_SIZE)
            };
        }

        // --- A* PATHFINDING ---
        function findPath(sx, sz, ex, ez) {
            // Very simple bounded A* let start = {x:sx, z:sz, p:null, g:0, h:0};
            let open = [start];
            let closed = new Set();
            let count = 0;

            while(open.length > 0 && count < 100) { // Hard limit to prevent lag
                count++;
                // Sort by F cost (low to high)
                open.sort((a,b) => (a.g+a.h) - (b.g+b.h));
                let curr = open.shift();
                
                if(curr.x === ex && curr.z === ez) {
                    let path = [];
                    while(curr.p) { path.push({x:curr.x, z:curr.z}); curr = curr.p; }
                    return path.reverse();
                }

                let key = curr.x + "," + curr.z;
                if(closed.has(key)) continue;
                closed.add(key);

                // Neighbors
                const dirs = [[0,1], [0,-1], [1,0], [-1,0]];
                for(let d of dirs) {
                    let nx = curr.x + d[0];
                    let nz = curr.z + d[1];
                    if(!isWall(nx, nz)) {
                        let g = curr.g + 1;
                        let h = Math.abs(nx-ex) + Math.abs(nz-ez);
                        open.push({x:nx, z:nz, p:curr, g:g, h:h});
                    }
                }
            }
            return null; // No path found
        }

        // --- NETWORK ---
        function initNetwork() {
            peer = new Peer(null, { debug: 1 });
            peer.on('open', (id) => {
                myId = id;
                console.log("My ID:", id);
                const p = new URLSearchParams(window.location.search);
                if(p.get('join')) {
                    isHost = false;
                    hostId = p.get('join');
                    document.getElementById('host-panel').classList.add('hidden');
                    document.getElementById('client-panel').classList.remove('hidden');
                    connectToHost(hostId);
                } else {
                    generateMap();
                    players[myId] = createPlayer(myId, document.getElementById('player-name').value);
                    updateLobbyUI();
                    initThree(); // Start renderer immediately for host
                }
            });

            peer.on('connection', (conn) => {
                conn.on('data', data => handleData(data, conn.peer));
                conn.on('open', () => {
                    if(isHost) {
                        conns[conn.peer] = conn;
                        conn.send({ type: 'MAP_DATA', map: mapGrid });
                    }
                });
                conn.on('close', () => { if(isHost) delete players[conn.peer]; });
            });
        }

        function connectToHost(id) {
            let conn = peer.connect(id);
            conns[id] = conn;
            conn.on('open', () => {
                conn.send({ type: 'JOIN', name: document.getElementById('player-name').value });
            });
            conn.on('data', data => handleData(data, id));
            initThree(); // Start renderer for client
        }

        function handleData(data, sender) {
            if(data.type === 'JOIN' && isHost) {
                players[sender] = createPlayer(sender, data.name);
                broadcast({ type: 'LOBBY_UPDATE', players: players });
                updateLobbyUI();
            }
            else if(data.type === 'MAP_DATA') {
                mapGrid = data.map;
                rebuildMapMesh();
            }
            else if(data.type === 'LOBBY_UPDATE') {
                players = data.players;
                updateLobbyUI();
            }
            else if(data.type === 'START_GAME') {
                document.getElementById('main-menu').classList.add('hidden');
                gameState = 'PLAYING';
            }
            else if(data.type === 'INPUT') {
                if(isHost && players[sender]) {
                    players[sender].input = data.input;
                    players[sender].yaw = data.yaw;
                    if(data.fire) spawnBullet(sender);
                }
            }
            else if(data.type === 'WORLD_STATE') {
                if(!isHost) syncWorld(data);
            }
            else if(data.type === 'SHOP_OPEN') {
                gameState = 'SHOP';
                document.getElementById('shop-menu').classList.remove('hidden');
                document.getElementById('mobile-controls').style.display = 'none';
            }
            else if(data.type === 'READY_STATE') {
                if(isHost) {
                    players[sender].ready = data.ready;
                    checkAllReady();
                }
            }
        }

        function broadcast(msg) {
            for(let id in conns) conns[id].send(msg);
        }

        function createPlayer(id, name) {
            return {
                id, name, 
                x: 0, z: 0, // Center of map
                hp: 100, money: 0,
                yaw: 0, dead: false, ready: false,
                input: {x:0, y:0}
            };
        }

        // --- THREE.JS ENGINE ---
        function initThree() {
            if(scene) return; // Prevent double init

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111); // Dark grey background
            scene.fog = new THREE.Fog(0x111111, 10, 80);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            // Default camera high up so we don't see black screen if player not loaded
            camera.position.set(0, 40, 0); 
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Lighting (Bright enough to see!)
            const amb = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(amb);
            const dir = new THREE.DirectionalLight(0xffffff, 0.8);
            dir.position.set(50, 100, 50);
            scene.add(dir);

            rebuildMapMesh();

            if(isMobile) setupMobileControls();
            else setupPCControls();

            requestAnimationFrame(animate);
        }

        function rebuildMapMesh() {
            // Floor
            const fGeo = new THREE.PlaneGeometry(GRID_SIZE*CELL_SIZE, GRID_SIZE*CELL_SIZE);
            const fMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
            const floor = new THREE.Mesh(fGeo, fMat);
            floor.rotation.x = -Math.PI/2;
            scene.add(floor);

            // Walls
            if(mapGrid.length === 0) return;
            const wGeo = new THREE.BoxGeometry(CELL_SIZE, WALL_HEIGHT, CELL_SIZE);
            const wMat = new THREE.MeshLambertMaterial({ color: 0x554433 });
            
            for(let x=0; x<GRID_SIZE; x++) {
                for(let z=0; z<GRID_SIZE; z++) {
                    if(mapGrid[x][z] === 1) {
                        const w = new THREE.Mesh(wGeo, wMat);
                        w.position.set(
                            (x * CELL_SIZE) - MAP_OFFSET + CELL_SIZE/2,
                            WALL_HEIGHT/2,
                            (z * CELL_SIZE) - MAP_OFFSET + CELL_SIZE/2
                        );
                        scene.add(w);
                    }
                }
            }
        }

        // --- GAME LOGIC ---
        function hostStartGame() {
            if(!isHost) return;
            broadcast({ type: 'START_GAME' });
            document.getElementById('main-menu').classList.add('hidden');
            gameState = 'PLAYING';
            startWave(1);
        }

        function startWave(n) {
            wave = n;
            zombiesToSpawn = 4 + Math.floor(wave * 2.5); // Increase count
            // Reset player ready status
            for(let id in players) players[id].ready = false;
        }

        function hostUpdate(dt) {
            if(gameState !== 'PLAYING') return;

            // Spawn Zombies
            if(zombiesToSpawn > 0 && Math.random() < 0.03) {
                let gx, gz;
                // Find empty spot far from center
                let tries = 0;
                do {
                    gx = Math.floor(Math.random() * GRID_SIZE);
                    gz = Math.floor(Math.random() * GRID_SIZE);
                    tries++;
                } while( (isWall(gx, gz) || (Math.abs(gx - GRID_SIZE/2) < 5 && Math.abs(gz - GRID_SIZE/2) < 5)) && tries < 50 );
                
                let id = 'z_' + Date.now() + Math.random();
                zombies[id] = {
                    id: id,
                    x: (gx * CELL_SIZE) - MAP_OFFSET + CELL_SIZE/2,
                    z: (gz * CELL_SIZE) - MAP_OFFSET + CELL_SIZE/2,
                    hp: 50 + (wave * 20),
                    path: []
                };
                zombiesToSpawn--;
            }

            // End Wave / Shop
            if(zombiesToSpawn === 0 && Object.keys(zombies).length === 0) {
                gameState = 'SHOP';
                broadcast({ type: 'SHOP_OPEN' });
                document.getElementById('shop-menu').classList.remove('hidden');
                document.getElementById('mobile-controls').style.display = 'none';
                if(!isMobile) document.exitPointerLock();
                return;
            }

            // Update Zombies
            for(let zid in zombies) {
                let z = zombies[zid];
                let target = getClosestPlayer(z.x, z.z);
                
                if(target) {
                    // Pathfinding every ~0.5s or if empty
                    if(Math.random() < 0.05 || z.path.length === 0) {
                        let gStart = getGridPos(z.x, z.z);
                        let gEnd = getGridPos(target.x, target.z);
                        z.path = findPath(gStart.x, gStart.z, gEnd.x, gEnd.z);
                    }

                    // Move
                    let mx = 0, mz = 0;
                    if(z.path && z.path.length > 0) {
                        let next = z.path[0];
                        let wx = (next.x * CELL_SIZE) - MAP_OFFSET + CELL_SIZE/2;
                        let wz = (next.z * CELL_SIZE) - MAP_OFFSET + CELL_SIZE/2;
                        let dx = wx - z.x;
                        let dz = wz - z.z;
                        let dist = Math.sqrt(dx*dx + dz*dz);
                        if(dist < 0.5) z.path.shift();
                        else {
                            mx = dx/dist; mz = dz/dist;
                        }
                    } else {
                        // Line of sight fallback
                        let dx = target.x - z.x;
                        let dz = target.z - z.z;
                        let dist = Math.sqrt(dx*dx + dz*dz);
                        mx = dx/dist; mz = dz/dist;
                    }

                    // Apply move
                    z.x += mx * ZOMBIE_SPEED * dt;
                    z.z += mz * ZOMBIE_SPEED * dt;
                    z.yaw = Math.atan2(mx, mz);

                    // Attack
                    let distToPlayer = Math.sqrt((target.x-z.x)**2 + (target.z-z.z)**2);
                    if(distToPlayer < 1.5) {
                        target.hp -= 20 * dt;
                        if(target.hp <= 0) target.dead = true;
                    }
                }
            }

            // Update Bullets
            for(let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.vx * dt;
                b.z += b.vz * dt;
                b.life -= dt;
                
                let hit = false;
                // Wall Collision
                let g = getGridPos(b.x, b.z);
                if(isWall(g.x, g.z)) hit = true;

                // Zombie Collision
                for(let zid in zombies) {
                    let z = zombies[zid];
                    let d = Math.sqrt((b.x-z.x)**2 + (b.z-z.z)**2);
                    if(d < 1.5) { // Hit radius
                        z.hp -= 35;
                        if(z.hp <= 0) {
                            delete zombies[zid];
                            players[b.owner].money += 25;
                        }
                        hit = true;
                        break;
                    }
                }

                if(hit || b.life <= 0) bullets.splice(i, 1);
            }

            // Update Players
            for(let pid in players) {
                let p = players[pid];
                if(p.dead) continue;
                
                // Movement Logic
                let speed = PLAYER_SPEED * dt;
                let moveX = 0; 
                let moveZ = 0;
                
                // Standard FPS controls:
                // Input Y+ = Forward (-Z in 3D), Input Y- = Back (+Z)
                // Input X+ = Right (+X), Input X- = Left (-X)
                
                let sin = Math.sin(p.yaw);
                let cos = Math.cos(p.yaw);

                // Forward vector (0,0,-1) rotated by Yaw
                // Right vector (1,0,0) rotated by Yaw
                
                // Forward/Back
                moveX -= sin * p.input.y * speed; 
                moveZ -= cos * p.input.y * speed;
                
                // Strafe Left/Right
                moveX += cos * p.input.x * speed;
                moveZ -= sin * p.input.x * speed;

                // Collision & Apply
                if(!checkCollision(p.x + moveX, p.z)) p.x += moveX;
                if(!checkCollision(p.x, p.z + moveZ)) p.z += moveZ;
            }

            // Sync
            let state = { players, zombies, bullets, wave };
            broadcast({ type: 'WORLD_STATE', state });
            syncWorld({ state });
        }

        function checkCollision(x, z) {
            let r = 0.6; // Player radius
            let points = [
                {x:x+r, z:z+r}, {x:x-r, z:z-r},
                {x:x+r, z:z-r}, {x:x-r, z:z+r}
            ];
            for(let p of points) {
                let g = getGridPos(p.x, p.z);
                if(isWall(g.x, g.z)) return true;
            }
            return false;
        }

        function spawnBullet(pid) {
            let p = players[pid];
            if(!p || p.dead) return;
            bullets.push({
                x: p.x, z: p.z,
                vx: -Math.sin(p.yaw) * BULLET_SPEED, // Shoot forward
                vz: -Math.cos(p.yaw) * BULLET_SPEED,
                life: 1.5,
                owner: pid
            });
        }

        function getClosestPlayer(x, z) {
            let min = 9999, target = null;
            for(let id in players) {
                if(players[id].dead) continue;
                let d = Math.sqrt((x-players[id].x)**2 + (z-players[id].z)**2);
                if(d < min) { min = d; target = players[id]; }
            }
            return target;
        }

        // --- CLIENT ---
        function animate() {
            requestAnimationFrame(animate);
            if(gameState === 'LOBBY' || !renderer) return;

            let now = performance.now();
            let dt = Math.min((now - lastTime)/1000, 0.1);
            lastTime = now;

            if(isHost) hostUpdate(dt);
            else clientUpdate();

            renderScene();
        }

        function clientUpdate() {
            // Send Inputs
            if(myId && hostId && conns[hostId]) {
                conns[hostId].send({
                    type: 'INPUT',
                    input: { x: input.x, y: input.y }, // Stick inputs
                    yaw: camYaw,
                    fire: input.fire
                });
                input.fire = false;
            }
        }

        function syncWorld(data) {
            players = data.state.players;
            zombies = data.state.zombies;
            bullets = data.state.bullets; // Copy full bullet array
            wave = data.state.wave;
            
            // HUD
            if(players[myId]) {
                document.getElementById('hp-disp').innerText = Math.floor(players[myId].hp);
                document.getElementById('money-disp').innerText = players[myId].money;
                document.getElementById('wave-disp').innerText = wave;
                document.getElementById('zombie-disp').innerText = Object.keys(zombies).length + zombiesToSpawn;
            }
        }

        // --- RENDER ---
        const pGeo = new THREE.BoxGeometry(1, 2, 1);
        const pMat = new THREE.MeshLambertMaterial({ color: 0x0088ff });
        const zGeo = new THREE.BoxGeometry(1, 2, 1);
        const zMat = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
        const bGeo = new THREE.BoxGeometry(0.3, 0.3, 0.8);
        const bMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });

        function renderScene() {
            // Camera follow
            if(players[myId] && !players[myId].dead) {
                let p = players[myId];
                camera.position.set(p.x, 2, p.z);
                camera.rotation.set(camPitch, camYaw + Math.PI, 0); // Correct rotation
            }

            // Players
            for(let id in players) {
                if(id === myId) continue; // Don't draw self
                let p = players[id];
                if(p.dead) {
                    if(meshes[id]) { scene.remove(meshes[id]); delete meshes[id]; }
                    continue;
                }
                if(!meshes[id]) { meshes[id] = new THREE.Mesh(pGeo, pMat); scene.add(meshes[id]); }
                meshes[id].position.set(p.x, 1, p.z);
                meshes[id].rotation.y = p.yaw;
            }

            // Zombies
            for(let id in zombies) {
                let z = zombies[id];
                if(!meshes[id]) { meshes[id] = new THREE.Mesh(zGeo, zMat); scene.add(meshes[id]); }
                meshes[id].position.set(z.x, 1, z.z);
                meshes[id].rotation.y = z.yaw;
            }

            // Cleanups
            for(let id in meshes) {
                if(id.startsWith('z_') && !zombies[id]) { scene.remove(meshes[id]); delete meshes[id]; }
                if(!id.startsWith('z_') && !players[id]) { scene.remove(meshes[id]); delete meshes[id]; }
            }

            // Bullets (Recreate every frame for simplicity)
            bulletMeshes.forEach(m => scene.remove(m));
            bulletMeshes = [];
            bullets.forEach(b => {
                let m = new THREE.Mesh(bGeo, bMat);
                m.position.set(b.x, 1.5, b.z);
                m.lookAt(b.x + b.vx, 1.5, b.z + b.vz);
                scene.add(m);
                bulletMeshes.push(m);
            });

            renderer.render(scene, camera);
        }

        // --- CONTROLS SETUP ---
        function setupMobileControls() {
            document.getElementById('mobile-controls').style.display = 'block';
            
            // Joystick Logic
            const bindStick = (eid, callback) => {
                const el = document.getElementById(eid);
                const nub = el.querySelector('.stick-nub');
                
                el.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    let touch = e.targetTouches[0];
                    let rect = el.getBoundingClientRect();
                    let cx = rect.left + rect.width/2;
                    let cy = rect.top + rect.height/2;
                    let dx = touch.clientX - cx;
                    let dy = touch.clientY - cy;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    let max = 40;
                    if(dist > max) { dx = (dx/dist)*max; dy = (dy/dist)*max; }
                    
                    nub.style.transform = `translate(-50%, -50%) translate(${dx}px, ${dy}px)`;
                    callback(dx/max, dy/max);
                }, {passive:false});

                el.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    nub.style.transform = `translate(-50%, -50%)`;
                    callback(0, 0);
                });
            };

            // LEFT STICK (Move)
            bindStick('stick-left', (x, y) => {
                input.x = x; 
                input.y = -y; // Inverted: Drag Up (neg Y) -> Forward (pos Input)
            });

            // RIGHT STICK (Look)
            bindStick('stick-right', (x, y) => {
                camYaw -= x * 0.05; // Rotate Left/Right
                camPitch -= y * 0.05; // Look Up/Down
                camPitch = Math.max(-1.5, Math.min(1.5, camPitch));
            });

            // FIRE
            document.getElementById('btn-fire').addEventListener('touchstart', (e) => {
                e.preventDefault();
                input.fire = true;
            });
        }

        function setupPCControls() {
            document.addEventListener('keydown', e => {
                if(e.code === 'KeyW') input.y = 1;
                if(e.code === 'KeyS') input.y = -1;
                if(e.code === 'KeyA') input.x = -1;
                if(e.code === 'KeyD') input.x = 1;
            });
            document.addEventListener('keyup', e => {
                if(e.code === 'KeyW' || e.code === 'KeyS') input.y = 0;
                if(e.code === 'KeyA' || e.code === 'KeyD') input.x = 0;
            });
            document.addEventListener('mousedown', () => {
                if(document.pointerLockElement !== document.body) document.body.requestPointerLock();
                else input.fire = true;
            });
            document.addEventListener('mousemove', e => {
                if(document.pointerLockElement === document.body) {
                    camYaw -= e.movementX * 0.002;
                    camPitch -= e.movementY * 0.002;
                    camPitch = Math.max(-1.5, Math.min(1.5, camPitch));
                }
            });
        }

        // --- UTILS ---
        function copyInvite() {
            const url = location.href.split('?')[0] + "?join=" + myId;
            navigator.clipboard.writeText(url);
            alert("Invite Copied!");
        }

        function updateLobbyUI() {
            let html = "";
            for(let id in players) html += `<div>${players[id].name}</div>`;
            document.getElementById('lobby-status').innerHTML = html || "Waiting...";
        }

        function openShopMobile() {
            if(gameState === 'SHOP') return;
            // Only functional if game state is shop, handled by host logic
        }
        
        function toggleReady() {
            let me = players[myId];
            if(isHost) {
                me.ready = !me.ready;
                checkAllReady();
            } else {
                conns[hostId].send({ type: 'READY_STATE', ready: !me.ready });
                me.ready = !me.ready;
            }
            document.getElementById('ready-btn').style.background = me.ready ? '#0d0' : '#444';
        }

        function checkAllReady() {
            if(!isHost) return;
            let all = true;
            for(let id in players) if(!players[id].ready) all = false;
            if(all) {
                document.getElementById('shop-menu').classList.add('hidden');
                if(isMobile) document.getElementById('mobile-controls').style.display = 'block';
                else document.body.requestPointerLock();
                startWave(wave + 1);
            }
        }

        initNetwork();
    </script>
