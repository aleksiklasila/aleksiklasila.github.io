<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Co-op Zombie Survival (Balanced Speed)</title>
    <style>
        /* --- GLOBAL & RESET --- */
        body { margin: 0; overflow: hidden; font-family: 'Courier New', Courier, monospace; background: #111; color: #fff; touch-action: none; user-select: none; -webkit-user-select: none; }
        
        /* --- GAME LAYERS --- */
        #game-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        
        /* --- MENUS --- */
        .menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 50; }
        .hidden { display: none !important; }
        h1 { color: #d00; font-size: 8vw; text-shadow: 2px 2px 0 #000; margin-bottom: 20px; text-align: center; }
        @media(min-width: 800px) { h1 { font-size: 3rem; } }
        
        /* INPUTS */
        input[type=text], button, input[type=file] { padding: 12px; margin: 5px; background: #333; border: 1px solid #555; color: white; font-family: inherit; font-size: 16px; }
        button:hover { background: #d00; cursor: pointer; }
        button:active { background: #900; }
        .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
        
        /* --- HUD ELEMENTS --- */
        #hud-bottom-left { position: absolute; bottom: 20px; left: 20px; text-align: left; pointer-events: none; z-index: 5; }
        #chat-box { max-height: 100px; overflow-y: auto; width: 250px; background: rgba(0,0,0,0.5); padding: 5px; margin-bottom: 5px; pointer-events: auto; }
        .chat-msg { font-size: 12px; margin: 2px 0; text-shadow: 1px 1px 0 #000; }
        #chat-input { width: 100%; pointer-events: auto; display: none; }
        
        #hud-top-right { position: absolute; top: 10px; right: 10px; text-align: right; z-index: 5; }
        #hud-bottom-right { position: absolute; bottom: 20px; right: 20px; text-align: right; z-index: 5; }
        
        .hud-text { font-size: 1.2rem; font-weight: bold; text-shadow: 1px 1px 0 #000; margin: 2px 0; }
        #ammo-display { color: #ff0; }
        #health-display { color: #f00; }
        #wave-info { color: #fff; font-size: 1.5rem; }

        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border: 2px solid rgba(255,255,255,0.8); border-radius: 50%; transform: translate(-50%, -50%); z-index: 4; }
        
        /* --- SCOREBOARD --- */
        #scoreboard { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 10px; border: 2px solid #555; display: none; z-index: 60; max-height: 80vh; overflow: auto; }
        table { border-collapse: collapse; width: 100%; min-width: 300px; }
        th, td { border: 1px solid #444; padding: 8px; text-align: center; }
        
        /* --- MOBILE CONTROLS --- */
        #mobile-controls { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 20; pointer-events: none; }
        .mobile-btn { position: absolute; background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; pointer-events: auto; touch-action: none; display: flex; align-items: center; justify-content: center; font-weight: bold; user-select: none; }
        .mobile-btn:active { background: rgba(255, 255, 255, 0.4); }

        /* Zones */
        #touch-zone-move { position: absolute; bottom: 20px; left: 20px; width: 150px; height: 150px; background: rgba(255,255,255,0.1); border-radius: 50%; pointer-events: auto; }
        #stick-nub { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        
        #touch-zone-look { position: absolute; top: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; z-index: 19; } 

        #btn-fire { bottom: 60px; right: 40px; width: 80px; height: 80px; background: rgba(255, 0, 0, 0.3); border-color: #f00; z-index: 21; }
        #btn-jump { bottom: 160px; right: 20px; width: 60px; height: 60px; z-index: 21; }
        #btn-tab { top: 10px; left: 10px; width: 50px; height: 50px; border-radius: 10px; z-index: 21; font-size: 12px; }
        
        /* --- SHOP --- */
        #shop-menu { z-index: 55; }
        .shop-item { border: 1px solid #444; padding: 10px; margin: 5px; display: flex; justify-content: space-between; width: 90%; max-width: 400px; background: #222; align-items: center; }
        .shop-item button { padding: 5px 10px; font-size: 14px; margin: 0; }
        
        #player-list { margin-top: 20px; border: 1px solid #333; padding: 10px; width: 80%; max-width: 400px; min-height: 100px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="main-menu" class="menu-overlay">
        <h1>ZOMBIE CO-OP</h1>
        <div class="row">
            <label>Name:</label>
            <input type="text" id="player-name" value="Survivor">
        </div>
        
        <div id="host-controls">
            <h3>HOST GAME</h3>
            <div class="row">
                <button onclick="copyInvite()">Copy Invite</button>
            </div>
            <div class="row" style="margin-top:10px;">
                <label>Config JSON: <input type="file" id="file-config" onchange="loadConfig(this)"></label>
            </div>
            <div id="player-list">Waiting for players...</div>
            <button onclick="startGame()" style="margin-top: 20px; padding: 15px 30px; font-weight:bold; color: #f00;">START GAME</button>
        </div>

        <div id="client-controls" class="hidden">
            <h3>JOINING GAME...</h3>
            <p>Waiting for host...</p>
            <div id="client-status">Connecting...</div>
        </div>
    </div>

    <div id="shop-menu" class="menu-overlay hidden">
        <h1>MERCHANT</h1>
        <div id="shop-items" style="display:flex; flex-direction:column; align-items:center; width:100%;"></div>
        <button onclick="readyUpShop()" style="margin-top:20px; padding:15px; background:#0d0;">READY FOR NEXT WAVE</button>
    </div>

    <div id="game-ui">
        <div id="crosshair"></div>
        
        <div id="scoreboard">
            <button onclick="toggleScoreboard()" style="float:right; padding:5px; background:#d00;">X</button>
            <h2>SCOREBOARD</h2>
            <table id="score-table">
                <thead><tr><th>Name</th><th>K</th><th>D</th><th>$</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
        
        <div id="hud-bottom-left">
            <div id="chat-box"></div>
            <input type="text" id="chat-input" placeholder="Type here...">
        </div>

        <div id="hud-top-right">
            <div id="wave-info" class="hud-text">Wave <span id="wave-num">1</span></div>
        </div>

        <div id="hud-bottom-right">
            <div id="health-display" class="hud-text">HP: 100</div>
            <div id="ammo-display" class="hud-text">30 / 120</div>
            <div id="money-display" class="hud-text">$0</div>
        </div>
    </div>

    <div id="mobile-controls">
        <div id="touch-zone-move">
            <div id="stick-nub"></div>
        </div>
        <div id="touch-zone-look"></div>
        <div id="btn-fire" class="mobile-btn">FIRE</div>
        <div id="btn-jump" class="mobile-btn">JUMP</div>
        <div id="btn-tab" class="mobile-btn" onclick="toggleScoreboard()">SCORE</div>
    </div>

    <script>
        // --- CONSTANTS ---
        const PLAYER_SPEED = 60.0;   // Force applied for movement
        const PLAYER_FRICTION = 10.0; // Damping
        const PLAYER_JUMP = 12.0;    // Jump force (realistic ~2m jump)
        const GRAVITY = 30.0;        // Gravity force

        const ZOMBIE_BASE_SPEED = 4.0; // Units per second (Players walk at approx 6-8)

        // --- DETECTION ---
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1);

        // --- CONFIG ---
        const CONFIG = {
            spawners: [{x: 20, z: 20}, {x: -20, z: -20}, {x: 20, z: -20}, {x: -20, z: 20}],
            playerSpawns: [{x: 0, z: 0}],
            waves: [
                { count: 5, health: 100, speedMod: 1.0 },
                { count: 10, health: 150, speedMod: 1.1 },
                { count: 15, health: 200, speedMod: 1.2 },
                { count: 25, health: 250, speedMod: 1.3 }
            ]
        };

        const SHOP_ITEMS = [
            { id: 'ammo', name: 'Ammo', cost: 100, type: 'ammo' },
            { id: 'rifle', name: 'Rifle', cost: 500, type: 'gun', damage: 25 },
            { id: 'shotgun', name: 'Shotgun', cost: 1000, type: 'gun', damage: 100 },
            { id: 'heal', name: 'Medkit', cost: 200, type: 'heal' }
        ];

        // --- STATE ---
        let isHost = true;
        let myId = null;
        let hostId = null;
        let peers = {}; 
        let players = {}; 
        let zombies = {}; 
        let gameState = 'LOBBY'; 
        let myName = "Survivor";
        let wave = 1;
        let zombiesToSpawn = 0;
        let lastTime = performance.now();
        
        // --- THREE.JS GLOBALS ---
        let scene, camera, renderer;
        let controlsObject; 
        let controlsPC; 
        
        const inputState = {
            f: false, b: false, l: false, r: false, jump: false,
            yaw: 0, pitch: 0
        };
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let canJump = false;

        // --- PEERJS ---
        const peer = new Peer(null, { debug: 1 }); 

        peer.on('open', (id) => {
            myId = id;
            console.log("My ID: " + id);
            const urlParams = new URLSearchParams(window.location.search);
            const joinId = urlParams.get('join');
            
            if (joinId) {
                isHost = false;
                hostId = joinId;
                document.getElementById('host-controls').classList.add('hidden');
                document.getElementById('client-controls').classList.remove('hidden');
                connectToHost(joinId);
            } else {
                hostId = myId;
                players[myId] = createPlayerState(myId, myName);
                updateLobbyUI();
            }
        });

        peer.on('connection', (conn) => {
            conn.on('data', (data) => handleData(data, conn.peer));
            conn.on('open', () => {
                if(isHost) {
                    peers[conn.peer] = conn;
                    conn.send({ type: 'REQUEST_INFO' });
                }
            });
            conn.on('close', () => { if(isHost) delete players[conn.peer]; });
        });

        function connectToHost(id) {
            const conn = peer.connect(id);
            conn.on('open', () => {
                document.getElementById('client-status').innerText = "Connected!";
                peers[id] = conn;
                conn.send({ type: 'JOIN', name: document.getElementById('player-name').value });
            });
            conn.on('data', (data) => handleData(data, id));
        }

        function handleData(data, senderId) {
            if (data.type === 'JOIN' && isHost) {
                players[senderId] = createPlayerState(senderId, data.name || "Unknown");
                broadcast({ type: 'LOBBY_UPDATE', players: players });
                updateLobbyUI();
            }
            else if (data.type === 'LOBBY_UPDATE') {
                players = data.players;
                updateLobbyUI();
            }
            else if (data.type === 'START_GAME') {
                startGameClient(data.config);
            }
            else if (data.type === 'INPUT') {
                if(isHost && players[senderId]) {
                    players[senderId].input = data.input;
                    players[senderId].rotation = data.rotation; 
                    if(data.shoot) handleShoot(senderId);
                }
            }
            else if (data.type === 'STATE_UPDATE') {
                if(!isHost) syncWorldState(data);
            }
            else if (data.type === 'CHAT') {
                addChatMessage(data.sender, data.msg);
            }
            else if (data.type === 'SHOP_OPEN') {
                openShop();
            }
            else if (data.type === 'SHOP_READY') {
                if(isHost) {
                    players[senderId].ready = true;
                    checkAllReady();
                }
            }
            else if (data.type === 'GAME_OVER') {
                alert("GAME OVER! Host is restarting.");
                location.reload();
            }
        }

        function broadcast(data) {
            for(let id in peers) peers[id].send(data);
        }

        // --- GAME LOGIC ---

        function createPlayerState(id, name) {
            return {
                id: id, name: name,
                x: 0, y: 10, z: 0,
                hp: 100, maxHp: 100,
                dead: false,
                kills: 0, deaths: 0, money: 0,
                weapon: 'pistol', ammo: 100,
                ready: false,
                input: { f:0, b:0, l:0, r:0, jump:0 }
            };
        }

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            scene.fog = new THREE.Fog(0x111111, 0, 80);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x404040));
            const dl = new THREE.DirectionalLight(0xffffff, 0.8);
            dl.position.set(50, 100, 50);
            scene.add(dl);

            const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: 0x222222 }));
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);
            scene.add(new THREE.GridHelper(200, 50, 0x000000, 0x444444));

            const boxGeo = new THREE.BoxGeometry(4, 4, 4);
            const boxMat = new THREE.MeshLambertMaterial({ color: 0x554433 });
            for(let i=0; i<15; i++) {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set((Math.random()-0.5)*100, 2, (Math.random()-0.5)*100);
                scene.add(box);
            }

            if (isMobile) {
                controlsObject = new THREE.Group();
                controlsObject.add(camera);
                scene.add(controlsObject);
                setupMobileControls();
                document.getElementById('mobile-controls').style.display = 'block';
            } else {
                controlsPC = new THREE.PointerLockControls(camera, document.body);
                controlsObject = controlsPC.getObject();
                scene.add(controlsObject);
                setupPCControls();
            }

            lastTime = performance.now();
            requestAnimationFrame(animate);
        }

        // --- INPUT ---
        function setupPCControls() {
            document.body.addEventListener('click', () => {
                if(gameState === 'PLAYING' && !controlsPC.isLocked) controlsPC.lock();
            });
            document.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW': inputState.f = true; break;
                    case 'KeyA': inputState.l = true; break;
                    case 'KeyS': inputState.b = true; break;
                    case 'KeyD': inputState.r = true; break;
                    case 'Space': if(canJump) { velocity.y = PLAYER_JUMP; canJump = false; } break;
                    case 'Tab': e.preventDefault(); toggleScoreboard(); break;
                }
            });
            document.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': inputState.f = false; break;
                    case 'KeyA': inputState.l = false; break;
                    case 'KeyS': inputState.b = false; break;
                    case 'KeyD': inputState.r = false; break;
                }
            });
            document.addEventListener('mousedown', (e) => {
                if(controlsPC.isLocked && e.button === 0) tryShoot();
            });
        }

        function setupMobileControls() {
            const stickZone = document.getElementById('touch-zone-move');
            const stickNub = document.getElementById('stick-nub');
            let stickId = null;
            let stickOrigin = {x:0, y:0};

            stickZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                stickId = touch.identifier;
                stickOrigin = { x: touch.clientX, y: touch.clientY };
            }, {passive:false});

            stickZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for(let i=0; i<e.changedTouches.length; i++) {
                    if(e.changedTouches[i].identifier === stickId) {
                        const touch = e.changedTouches[i];
                        let dx = touch.clientX - stickOrigin.x;
                        let dy = touch.clientY - stickOrigin.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        const maxDist = 40;
                        if(dist > maxDist) {
                            dx = (dx/dist) * maxDist;
                            dy = (dy/dist) * maxDist;
                        }
                        stickNub.style.transform = `translate(-50%, -50%) translate(${dx}px, ${dy}px)`;
                        inputState.f = dy < -10;
                        inputState.b = dy > 10;
                        inputState.l = dx < -10;
                        inputState.r = dx > 10;
                    }
                }
            }, {passive:false});

            const resetStick = (e) => {
                for(let i=0; i<e.changedTouches.length; i++) {
                    if(e.changedTouches[i].identifier === stickId) {
                        stickId = null;
                        stickNub.style.transform = `translate(-50%, -50%)`;
                        inputState.f = inputState.b = inputState.l = inputState.r = false;
                    }
                }
            };
            stickZone.addEventListener('touchend', resetStick);
            stickZone.addEventListener('touchcancel', resetStick);

            const lookZone = document.getElementById('touch-zone-look');
            let lastLookX = 0, lastLookY = 0;
            
            lookZone.addEventListener('touchstart', (e) => {
                lastLookX = e.touches[0].clientX;
                lastLookY = e.touches[0].clientY;
            });
            
            lookZone.addEventListener('touchmove', (e) => {
                e.preventDefault(); 
                const touch = e.touches[0];
                const deltaX = touch.clientX - lastLookX;
                const deltaY = touch.clientY - lastLookY;
                inputState.yaw -= deltaX * 0.005;
                inputState.pitch -= deltaY * 0.005;
                inputState.pitch = Math.max(-1.5, Math.min(1.5, inputState.pitch));
                lastLookX = touch.clientX;
                lastLookY = touch.clientY;
            }, {passive:false});

            document.getElementById('btn-fire').addEventListener('touchstart', (e) => { e.preventDefault(); tryShoot(); });
            document.getElementById('btn-jump').addEventListener('touchstart', (e) => { 
                e.preventDefault(); if(canJump) { velocity.y = PLAYER_JUMP; canJump = false; }
            });
        }

        // --- HOST LOGIC ---
        function startGame() {
            if(!isHost) return;
            broadcast({ type: 'START_GAME', config: CONFIG });
            startGameClient(CONFIG);
            startWave(1);
        }
        
        function startGameClient(config) {
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-ui').style.display = 'block';
            gameState = 'PLAYING';
            initThree();
            const spawn = config.playerSpawns[0];
            controlsObject.position.set(spawn.x, 5, spawn.z);
        }

        function startWave(n) {
            wave = n;
            const wConfig = CONFIG.waves[Math.min(n-1, CONFIG.waves.length-1)];
            zombiesToSpawn = wConfig.count;
            for(let id in players) {
                players[id].dead = false;
                players[id].hp = players[id].maxHp;
            }
            broadcast({ type: 'CHAT', sender: 'SYSTEM', msg: `Wave ${n} Started!` });
        }

        function updateHostLogic(delta) {
            if(gameState !== 'PLAYING') return;

            // Spawn
            if(zombiesToSpawn > 0 && Math.random() < 0.03) {
                const id = 'z_' + Date.now() + Math.random();
                const spawner = CONFIG.spawners[Math.floor(Math.random() * CONFIG.spawners.length)];
                const wConfig = CONFIG.waves[Math.min(wave-1, CONFIG.waves.length-1)];
                zombies[id] = {
                    id: id, x: spawner.x, y: 1.5, z: spawner.z,
                    hp: wConfig.health, 
                    speed: ZOMBIE_BASE_SPEED * wConfig.speedMod
                };
                zombiesToSpawn--;
            }

            // Zombie AI
            for(let zid in zombies) {
                let z = zombies[zid];
                let closestDist = 9999, targetId = null;

                for(let pid in players) {
                    if(players[pid].dead) continue;
                    let p = players[pid];
                    let dx = p.x - z.x;
                    let dz = p.z - z.z;
                    let dist = Math.sqrt(dx*dx + dz*dz);
                    if(dist < closestDist) { closestDist = dist; targetId = pid; }
                }

                if(targetId) {
                    let p = players[targetId];
                    let angle = Math.atan2(p.x - z.x, p.z - z.z);
                    // FIXED: Zombie speed now uses delta time
                    z.x += Math.sin(angle) * z.speed * delta;
                    z.z += Math.cos(angle) * z.speed * delta;
                    
                    if(closestDist < 2.0) {
                        players[targetId].hp -= 0.5; 
                        if(players[targetId].hp <= 0) {
                            players[targetId].dead = true;
                            players[targetId].deaths++;
                            checkGameOver();
                        }
                    }
                }
            }

            if(zombiesToSpawn <= 0 && Object.keys(zombies).length === 0) {
                gameState = 'SHOP';
                broadcast({ type: 'SHOP_OPEN' });
                openShop();
            }

            if(controlsObject) {
                let pos = controlsObject.position;
                players[myId].x = pos.x;
                players[myId].y = pos.y;
                players[myId].z = pos.z;
                if(isMobile) players[myId].rotation = inputState.yaw;
                else players[myId].rotation = camera.rotation.y;
            }

            broadcast({ type: 'STATE_UPDATE', state: { players, zombies, wave } });
        }

        function checkGameOver() {
            let allDead = true;
            for(let id in players) if(!players[id].dead) allDead = false;
            if(allDead) {
                broadcast({type:'GAME_OVER'});
                setTimeout(() => location.reload(), 3000);
            }
        }

        function tryShoot() {
            if(isHost) handleShoot(myId);
            else {
                let rot = isMobile ? inputState.yaw : camera.rotation.y;
                peers[hostId].send({ type: 'INPUT', shoot: true, rotation: rot });
            }
        }

        function handleShoot(pid) {
            let p = players[pid];
            let rot = p.rotation || 0;
            let dirX = -Math.sin(rot);
            let dirZ = -Math.cos(rot);
            
            let hit = false;
            for(let zid in zombies) {
                let z = zombies[zid];
                let dx = z.x - p.x;
                let dz = z.z - p.z;
                let dist = Math.sqrt(dx*dx + dz*dz);
                let dot = (dx/dist)*dirX + (dz/dist)*dirZ;

                if(dist < 50 && dot > 0.9) {
                    z.hp -= (p.weapon === 'shotgun' ? 100 : 25);
                    if(z.hp <= 0) {
                        delete zombies[zid];
                        players[pid].kills++;
                        players[pid].money += 50;
                    }
                    hit = true;
                    break;
                }
            }
        }

        // --- RENDER ---
        const meshes = {};
        const zGeo = new THREE.BoxGeometry(1, 2, 1);
        const zMat = new THREE.MeshLambertMaterial({ color: 0x00ff00 }); 
        const pMat = new THREE.MeshLambertMaterial({ color: 0x0000ff }); 

        function syncWorldState(data) {
            players = data.state.players;
            zombies = data.state.zombies;
            wave = data.state.wave;
            
            const me = players[myId];
            if(me) {
                document.getElementById('health-display').innerText = "HP: " + Math.floor(me.hp);
                document.getElementById('money-display').innerText = "$" + me.money;
                document.getElementById('wave-num').innerText = wave;
                document.getElementById('ammo-display').innerText = me.weapon.toUpperCase();
                if(me.dead) document.getElementById('health-display').innerText = "DEAD";
            }
            updateScoreboard();
        }

        function animate() {
            requestAnimationFrame(animate);
            if(gameState === 'LOBBY' || !renderer) return;

            // FIXED: Calculate Delta Time
            const time = performance.now();
            const delta = Math.min((time - lastTime) / 1000, 0.1); // Cap at 0.1 to prevent physics explosions on lag
            lastTime = time;

            if(isHost) updateHostLogic(delta);
            else if(controlsObject && gameState === 'PLAYING') {
                let rot = isMobile ? inputState.yaw : camera.rotation.y;
                peers[hostId].send({ 
                    type: 'INPUT', 
                    input: { f:inputState.f, b:inputState.b, l:inputState.l, r:inputState.r },
                    rotation: rot 
                });
            }

            // PHYSICS (Local Prediction with fixed Time Step)
            if (controlsObject && !players[myId]?.dead) {
                if(isMobile) {
                    controlsObject.rotation.y = inputState.yaw;
                    camera.rotation.x = inputState.pitch;
                }

                // Apply Friction
                velocity.x -= velocity.x * PLAYER_FRICTION * delta;
                velocity.z -= velocity.z * PLAYER_FRICTION * delta;
                velocity.y -= GRAVITY * delta; 

                // Apply Input
                direction.z = Number(inputState.f) - Number(inputState.b);
                direction.x = Number(inputState.r) - Number(inputState.l);
                direction.normalize();

                if (inputState.f || inputState.b) velocity.z -= direction.z * PLAYER_SPEED * delta;
                if (inputState.l || inputState.r) velocity.x -= direction.x * PLAYER_SPEED * delta;

                controlsObject.translateX(-velocity.x * delta);
                controlsObject.translateZ(-velocity.z * delta);
                controlsObject.position.y += (velocity.y * delta);

                if (controlsObject.position.y < 2) {
                    velocity.y = 0;
                    controlsObject.position.y = 2;
                    canJump = true;
                }
            }

            // RENDER ENTITIES
            for(let id in zombies) {
                let z = zombies[id];
                if(!meshes[id]) { meshes[id] = new THREE.Mesh(zGeo, zMat); scene.add(meshes[id]); }
                meshes[id].position.set(z.x, z.y, z.z);
                meshes[id].lookAt(controlsObject.position); 
            }
            for(let id in players) {
                if(id === myId) continue;
                let p = players[id];
                if(!p.dead) {
                    if(!meshes[id]) { meshes[id] = new THREE.Mesh(zGeo, pMat); scene.add(meshes[id]); }
                    meshes[id].position.set(p.x, p.y, p.z);
                    meshes[id].rotation.y = p.rotation || 0;
                } else {
                    if(meshes[id]) { scene.remove(meshes[id]); delete meshes[id]; }
                }
            }
            for(let id in meshes) {
                if(id.startsWith('z_') && !zombies[id]) { scene.remove(meshes[id]); delete meshes[id]; }
            }

            renderer.render(scene, camera);
        }

        // --- UI UTILS ---
        function copyInvite() {
            const link = window.location.href.split('?')[0] + "?join=" + myId;
            navigator.clipboard.writeText(link).then(() => alert("Copied!"));
        }

        function updateLobbyUI() {
            const list = document.getElementById('player-list');
            list.innerHTML = "<h3>Connected:</h3>" + Object.values(players).map(p => `<div>${p.name}</div>`).join('');
            if(players[myId]) players[myId].name = document.getElementById('player-name').value;
        }
        
        function addChatMessage(sender, msg) {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div class="chat-msg"><span style="color:#aaa">${sender}:</span> ${msg}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function toggleScoreboard() {
            const el = document.getElementById('scoreboard');
            const chat = document.getElementById('chat-input');
            const show = el.style.display !== 'block';
            el.style.display = show ? 'block' : 'none';
            chat.style.display = show ? 'block' : 'none';
            if(show && !isMobile && controlsPC) { controlsPC.unlock(); chat.focus(); }
            else if(!show && !isMobile && controlsPC) controlsPC.lock();
        }

        function updateScoreboard() {
            const tbody = document.querySelector('#score-table tbody');
            tbody.innerHTML = '';
            Object.values(players).forEach(p => {
                tbody.innerHTML += `<tr><td>${p.name}</td><td>${p.kills}</td><td>${p.deaths}</td><td>$${p.money}</td></tr>`;
            });
        }

        function openShop() {
            document.getElementById('mobile-controls').style.display = 'none';
            document.getElementById('shop-menu').classList.remove('hidden');
            document.getElementById('shop-menu').style.display = 'flex';
            if(!isMobile && controlsPC) controlsPC.unlock();
            const c = document.getElementById('shop-items');
            c.innerHTML = '';
            SHOP_ITEMS.forEach(i => {
                const btn = document.createElement('button');
                btn.innerHTML = `<b>${i.name}</b> ($${i.cost})`;
                btn.onclick = () => buyItem(i);
                c.appendChild(btn);
            });
        }

        function buyItem(item) {
            if(isHost) {
                if(players[myId].money >= item.cost) {
                    players[myId].money -= item.cost;
                    if(item.type === 'heal') players[myId].hp = 100;
                    if(item.type === 'gun') players[myId].weapon = item.id;
                }
            }
            syncWorldState({state: {players, zombies, wave}});
        }

        function readyUpShop() {
            if(isHost) {
                players[myId].ready = true;
                checkAllReady();
            } else {
                peers[hostId].send({ type: 'SHOP_READY' });
                document.getElementById('shop-menu').innerHTML = "<h1>WAITING...</h1>";
            }
        }

        function checkAllReady() {
            let all = true;
            for(let id in players) if(!players[id].ready) all = false;
            if(all) {
                for(let id in players) players[id].ready = false;
                document.getElementById('shop-menu').style.display = 'none';
                if(isMobile) document.getElementById('mobile-controls').style.display = 'block';
                else if(controlsPC) controlsPC.lock();
                startWave(wave + 1);
            }
        }

        window.addEventListener('resize', () => {
            if(camera) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
