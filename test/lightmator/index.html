        // --- PROJECT IO ---
        window.saveProject = function () {
            if (!currentModel) return;

            // Clean up helper before export
            const wasHelperVisible = skeletonHelper.visible;
            scene.remove(skeletonHelper);
            transformControl.detach();

            const exporter = new GLTFExporter();
            const options = {
                binary: false, // Save as GLTF JSON embedded in our Project JSON? Or Base64 GLB?
                // Let's use Base64 GLB for compactness in one file
                // But GLTFExporter 'binary: true' returns ArrayBuffer. We need to convert to Base64.
                binary: true,
                animations: animations,
                truncateDrawRange: true
            };

            exporter.parse(currentModel, (buffer) => {
                // Convert to Base64
                const blob = new Blob([buffer]);
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = function () {
                    const base64data = reader.result;

                    const project = {
                        version: 1,
                        timestamp: Date.now(),
                        modelData: base64data,
                        meta: {
                            // Any extra settings?
                            duration: duration // (derived from current clip anyway)
                        }
                    };

                    const output = JSON.stringify(project, null, 2);
                    saveString(output, 'project.lightmator');

                    if (wasHelperVisible) scene.add(skeletonHelper);
                }
            }, (err) => {
                console.error(err);
                if (wasHelperVisible) scene.add(skeletonHelper);
            }, options);
        };

        window.loadProject = function (input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const json = JSON.parse(e.target.result);
                    if (json.modelData) {
                        // Load the GLB from Data URL
                        const loader = new GLTFLoader();
                        loader.load(json.modelData, (gltf) => {
                            setupLoadedModel(gltf);
                        });
                    }
                } catch (err) {
                    console.error("Failed to load project", err);
                    alert("Invalid project file");
                }
            };
            reader.readAsText(file);
        };

        function saveString(text, filename) {
            const blob = new Blob([text], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }



        function drawKeyframeMarkers(clip) {
            const container = document.getElementById('keyframes-track');
            container.innerHTML = '';

            if (!clip) return;

            const uniqueTimes = new Set();
            clip.tracks.forEach(t => {
                t.times.forEach(time => uniqueTimes.add(time));
            });

            // Convert to array and sort
            const timesArr = Array.from(uniqueTimes).sort((a, b) => a - b);

            timesArr.forEach(time => {
                const mk = document.createElement('div');
                mk.className = 'keyframe-marker';
                mk.style.left = (time / duration * 100) + '%';

                let isSelected = false;
                for (let t of selectedKeyframes) {
                    if (Math.abs(t - time) < 0.001) isSelected = true;
                }

                if (isSelected) {
                    mk.style.background = 'red';
                    mk.style.zIndex = '20';
                } else {
                    mk.style.background = 'yellow';
                }

                mk.onmousedown = (e) => {
                    e.stopPropagation();
                    if (e.ctrlKey) {
                        if (selectedKeyframes.has(time)) selectedKeyframes.delete(time);
                        else selectedKeyframes.add(time);
                    } else {
                        if (!selectedKeyframes.has(time)) {
                            selectedKeyframes.clear();
                            selectedKeyframes.add(time);
                        }
                    }

                    // Auto-jump to time
                    if (currentAction) {
                        currentAction.time = time;
                        mixer.update(0);
                    }
                    drawKeyframeMarkers(clip);
                };

                container.appendChild(mk);
            });

            // Box Select Listener
            if (!selectionBoxDiv) {
                selectionBoxDiv = document.createElement('div');
                selectionBoxDiv.style.position = 'absolute';
                selectionBoxDiv.style.border = '1px dashed white';
                selectionBoxDiv.style.background = 'rgba(255, 255, 255, 0.2)';
                selectionBoxDiv.style.pointerEvents = 'none';
                selectionBoxDiv.style.display = 'none';
                container.appendChild(selectionBoxDiv);

                container.onmousedown = (e) => {
                    // Start Box Select on the Keyframe Row
                    if (e.target !== container && e.target.className !== 'keyframe-marker') return;

                    isBoxSelecting = true;
                    // Reset selected keyframes if not Ctrl
                    if (!e.ctrlKey) selectedKeyframes.clear();

                    const rect = container.getBoundingClientRect();
                    selectionBoxStart = { x: e.clientX - rect.left };
                    selectionBoxDiv.style.left = selectionBoxStart.x + 'px';
                    selectionBoxDiv.style.top = '0px';
                    selectionBoxDiv.style.width = '0px';
                    selectionBoxDiv.style.height = '100%';
                    selectionBoxDiv.style.display = 'block';

                    // Draw markers immediately to reflect deselection
                    drawKeyframeMarkers(clip);
                    // Re-append box
                    container.appendChild(selectionBoxDiv);

                    e.stopPropagation(); // Don't trigger scrubber if they are somehow overlapping or propagation issues
                };

                // Move listeners to document to capture dragging outside slightly
                const onMove = (e) => {
                    if (!isBoxSelecting) return;
                    const container = document.getElementById('keyframes-track');
                    if (!container) return;
                    const rect = container.getBoundingClientRect();
                    // Rel to container
                    const currentX = e.clientX - rect.left;

                    const left = Math.min(selectionBoxStart.x, currentX);
                    const width = Math.abs(currentX - selectionBoxStart.x);

                    selectionBoxDiv.style.left = left + 'px';
                    selectionBoxDiv.style.width = width + 'px';
                };

                const onUp = (e) => {
                    if (!isBoxSelecting) return;
                    isBoxSelecting = false;
                    selectionBoxDiv.style.display = 'none';

                    const container = document.getElementById('keyframes-track');
                    const rect = container.getBoundingClientRect();

                    const boxLeft = parseFloat(selectionBoxDiv.style.left);
                    const boxWidth = parseFloat(selectionBoxDiv.style.width);

                    // Calc Start/End Time coverage
                    const tStart = (boxLeft / rect.width) * duration;
                    const tEnd = ((boxLeft + boxWidth) / rect.width) * duration;

                    // Select intersected
                    timesArr.forEach(time => {
                        if (time >= tStart && time <= tEnd) {
                            selectedKeyframes.add(time);
                        }
                    });

                    drawKeyframeMarkers(clip);
                };

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            }
        }

        // --- INTERACTION ---

        function onPointerDown(event) {
            if (event.button !== 0) return; // Only Left Click

            const rect = renderer.domElement.getBoundingClientRect();
            const mouse = new THREE.Vector2(
                ((event.clientX - rect.left) / rect.width) * 2 - 1,
                -((event.clientY - rect.top) / rect.height) * 2 + 1
            );

            // CTRL Logic: Strict Selection Mode
            if (event.ctrlKey) {

                // If picking parent
                if (pickingParentFor) {
                    // We need to raycast for bones (existing logic below does this)
                    // Let's reuse the logic but intercept the result
                }

                orbit.enabled = false;

                // New Geometric Selection (Ray to Segment)
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(mouse, camera);
                const ray = raycaster.ray;

                let closestBone = null;
                let minDistanceSq = Infinity;

                // 1. Check Bones (Ray distance to Bone Segments)
                const boneList = skeletonHelper ? skeletonHelper.bones : [];
                // Fallback if helper missing but model exists
                if (boneList.length === 0 && currentModel) {
                    currentModel.traverse(o => { if (o.isBone) boneList.push(o); });
                }

                boneList.forEach(bone => {
                    // Check Bone Point (Joint)
                    const bonePos = new THREE.Vector3().setFromMatrixPosition(bone.matrixWorld);
                    const distSqPoint = ray.distanceSqToPoint(bonePos);

                    if (distSqPoint < minDistanceSq) {
                        minDistanceSq = distSqPoint;
                        closestBone = bone;
                    }

                    // Check Segments (Bone to Children)
                    bone.children.forEach(child => {
                        if (!child.isBone) return;
                        const childPos = new THREE.Vector3().setFromMatrixPosition(child.matrixWorld);
                        const distSqSeg = ray.distanceSqToSegment(bonePos, childPos);

                        if (distSqSeg < minDistanceSq) {
                            minDistanceSq = distSqSeg;
                            closestBone = bone; // Select parent of segment
                        }
                    });
                });

                // 2. Check Props (Ray intersection)
                // We keep raycast for props since they are meshes
                let closestProp = null;
                let minPropDist = Infinity;

                // Filter props for intersection
                if (props.length > 0) {
                    const propIntersects = raycaster.intersectObjects(props, true);
                    if (propIntersects.length > 0) {
                        // For props, we DO care about depth usually, but let's follow the "closest to ray" philosophy 
                        // if we want to be consistent? 
                        // Actually props are meshes, standard raycast is best.
                        closestProp = propIntersects[0].object;
                        minPropDist = propIntersects[0].distance;
                        // Note: propIntersects[0].distance is distance from Camera.
                        // But minDistanceSq is distance from Ray. These are different metrics.
                        // We need to decide priority.
                        // Usually picking a Bone is the priority in Animation Mode.
                    }
                }

                // Threshold for bone selection (e.g. 0.5 units from ray)
                const SELECTION_THRESHOLD_SQ = 0.5 * 0.5;

                // Logic: If we hit a prop "directly" (raycast), select it?
                // Or if closestBone is very close to ray, select it?

                // Let's bias: If bone is reasonably close, select bone.
                if (closestBone && minDistanceSq < SELECTION_THRESHOLD_SQ) {
                    if (pickingParentFor) {
                        // Execution Attachment
                        // Use attach() to preserve world transform
                        closestBone.attach(pickingParentFor);
                        document.getElementById('selection-info').innerText = "Attached " + (pickingParentFor.name || "Prop") + " to " + closestBone.name;
                        document.getElementById('selection-info').style.color = "";
                        pickingParentFor = null;
                        // Select the prop again to keep working on it
                        transformControl.attach(closestBone.children[closestBone.children.length - 1]);
                        return;
                    }
                    selectBone(closestBone);
                } else if (closestProp) {
                    if (pickingParentFor) {
                        // Cannot attach to a prop? Or maybe yes? Let's assume only bones for now.
                        alert("Please select a bone.");
                        return;
                    }
                    // Select Prop
                    let target = closestProp;
                    while (target.parent && target.parent !== scene && !props.includes(target)) {
                        target = target.parent;
                    }
                    if (props.includes(target)) {
                        transformControl.attach(target);
                        selectedBone = null;
                        document.getElementById('selection-info').innerText = "Prop: " + (target.name || "Prop");
                        // Preserve current mode
                        if (ikTargetHelper) ikTargetHelper.visible = false;
                    }
                } else {
                    // Deselect if nothing close
                    selectBone(null);
                }

                return;
            }

            // Normal Logic (No Ctrl)
            if (transformControl.axis) {
                orbit.enabled = false;
                return;
            }
            orbit.enabled = true;
        }



        // --- TIMELINE UI LOGIC ---

        window.startScrub = function (e) {
            isScrubbing = true;
            isPlaying = false; // Pause while scrubbing
            scrub(e);

            document.addEventListener('mousemove', scrub);
            document.addEventListener('mouseup', stopScrub);
        }

        function scrub(e) {
            if (!currentAction) return;
            // Target the Scrubber Row now
            const container = document.getElementById('scrubber-row');
            if (!container) return;
            const rect = container.getBoundingClientRect();
            let x = e.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));

            const pct = x / rect.width;
            const time = pct * duration;

            currentAction.time = time;
            mixer.update(0); // Update model pose manually
        }

        function stopScrub() {
            isScrubbing = false;
            document.removeEventListener('mousemove', scrub);
            document.removeEventListener('mouseup', stopScrub);
        }



        window.setTransformMode = function (mode) {
            transformControl.setMode(mode);
            updateTransformUI();
        };
        window.toggleTransformSpace = function () {
            transformControl.setSpace(transformControl.space === 'local' ? 'world' : 'local');
            updateTransformUI();
        };

        function updateTransformUI() {
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            const mode = transformControl.getMode();
            if (mode === 'translate') document.getElementById('btn-move').classList.add('active');
            if (mode === 'rotate') document.getElementById('btn-rotate').classList.add('active');
            if (mode === 'scale') document.getElementById('btn-scale').classList.add('active');

            const space = transformControl.space;
            document.getElementById('btn-space').innerText = space === 'local' ? 'LOC' : 'WLD';
        }

        window.startBonePickMode = function (prop) {
            pickingParentFor = prop;
            document.getElementById('selection-info').innerText = "SELECT BONE to attach " + (prop.name || "Prop");
            document.getElementById('selection-info').style.color = "orange";
            // Enable bone selection visualization if needed
        };

        // --- INVERSE KINEMATICS (IK) ---

        let ikEnabled = false;
        let ikTargetHelper = null;
        let ikChain = [];

        window.toggleIK = function () {
            ikEnabled = !ikEnabled;
            const status = document.getElementById('ik-status');
            if (status) status.innerText = ikEnabled ? "ON" : "OFF";

            if (ikEnabled) {
                // Setup Helper
                if (!ikTargetHelper) {
                    ikTargetHelper = new THREE.Mesh(
                        new THREE.SphereGeometry(0.1, 8, 8),
                        new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5 })
                    );
                    ikTargetHelper.visible = false;
                    scene.add(ikTargetHelper);
                }

                // If bone already selected, attach helper there
                if (selectedBone) {
                    transformControl.setMode('translate');
                    startIKSession(selectedBone);
                }
            } else {
                // Disable
                if (ikTargetHelper) ikTargetHelper.visible = false;
                transformControl.setMode('rotate');
                // Re-attach gizmo to bone if selected
                if (selectedBone) {
                    transformControl.attach(selectedBone);
                }
            }
        };

        function startIKSession(bone) {
            if (!ikEnabled || !bone) return;

            // Build Chain (up to 2 parents)
            ikChain = [];
            let curr = bone;
            // Limit chain length logic
            for (let i = 0; i < 3; i++) {
                if (!curr || !curr.isBone) break;
                ikChain.push(curr);
                curr = curr.parent;
            }

            if (ikChain.length < 2) {
                console.log("Bone has no parent, cannot IK.");
                return;
            }

            // Move Helper to Bone World Pos
            const worldPos = new THREE.Vector3();
            bone.getWorldPosition(worldPos);
            ikTargetHelper.position.copy(worldPos);
            ikTargetHelper.visible = true;

            // Attach Gizmo to HELPER, not Bone
            transformControl.attach(ikTargetHelper);
        }



        let selectionHighlighter = null;

        // Define global selectBone
        window.selectBone = function (bone, fromTree) {
            selectedBone = bone;
            document.getElementById('selection-info').innerText = "Selected: " + (bone ? bone.name : "None");

            // Auto Focus Logic
            if (bone) {
                if (fromTree) {
                    // Clicked in Tree -> Focus Camera on Bone
                    const pos = new THREE.Vector3();
                    bone.getWorldPosition(pos);
                    orbit.target.copy(pos);
                    orbit.update();
                } else {
                    // Clicked in Viewer -> Focus in Tree
                    if (window.focusInTree) focusInTree(bone);
                }
            }

            // Update Highlight Visual
            if (!selectionHighlighter) {
                // Diamond shape
                const geo = new THREE.OctahedronGeometry(0.1, 0);
                const mat = new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true, depthTest: false });
                selectionHighlighter = new THREE.Mesh(geo, mat);
                selectionHighlighter.renderOrder = 999;
                scene.add(selectionHighlighter);
            }

            // Update Tree UI Selection
            if (window.updateHierarchySelection) {
                updateHierarchySelection(bone);
            } else {
                renderBoneHierarchy();
            }

            if (bone) {
                selectionHighlighter.visible = true;

                // If IK Enabled
                if (ikEnabled) {
                    transformControl.setMode('translate');
                    startIKSession(bone);
                } else {
                    transformControl.setMode('rotate');
                    transformControl.attach(bone);
                    if (ikTargetHelper) ikTargetHelper.visible = false;
                }
            } else {
                selectionHighlighter.visible = false;
                transformControl.detach();
                if (ikTargetHelper) ikTargetHelper.visible = false;
            }
        };

        // CCD Solver
        function solveIK(chain, targetPos) {
            const endEffector = chain[0];
            const tolerance = 0.01;
            const maxIter = 5;

            // Solve loop
            for (let iter = 0; iter < maxIter; iter++) {
                let endPos = new THREE.Vector3();
                endEffector.getWorldPosition(endPos);
                if (endPos.distanceTo(targetPos) < tolerance) return;

                // Iterate ancestors
                for (let i = 1; i < chain.length; i++) {
                    const bone = chain[i];

                    endEffector.getWorldPosition(endPos);

                    const bonePos = new THREE.Vector3();
                    bone.getWorldPosition(bonePos);

                    const toEnd = endPos.clone().sub(bonePos).normalize();
                    const toTarget = targetPos.clone().sub(bonePos).normalize();

                    let angle = toEnd.angleTo(toTarget);
                    if (angle < 0.001) continue;

                    const axis = toEnd.clone().cross(toTarget).normalize();

                    // Clamp for stability
                    angle = Math.min(angle, 0.2);

                    // Apply rotation
                    bone.rotateOnWorldAxis(axis, angle);
                    bone.updateMatrixWorld(true);
                }
            }
        }

        // --- RESIZERS ---
        function initResizers() {
            const sidebar = document.getElementById('sidebar');
            const timeline = document.getElementById('timeline-panel');

            const rSidebar = document.getElementById('resizer-sidebar');
            const rTimeline = document.getElementById('resizer-timeline');

            // Sidebar Resize (Left Edge)
            rSidebar.onmousedown = (e) => {
                e.preventDefault();
                document.documentElement.style.cursor = 'ew-resize';

                const onMove = (em) => {
                    const newWidth = window.innerWidth - em.clientX;
                    if (newWidth > 150 && newWidth < 800) {
                        sidebar.style.width = newWidth + 'px';
                    }
                };

                const onUp = () => {
                    document.documentElement.style.cursor = '';
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    SaveLocalStorage();
                };

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            };

            // Timeline Resize (Top Edge)
            rTimeline.onmousedown = (e) => {
                e.preventDefault();
                document.documentElement.style.cursor = 'ns-resize';

                const onMove = (em) => {
                    const newHeight = window.innerHeight - em.clientY;
                    if (newHeight > 50 && newHeight < 600) {
                        timeline.style.height = newHeight + 'px';
                        sidebar.style.bottom = newHeight + 'px'; // Update sidebar bottom to match
                    }
                };

                const onUp = () => {
                    document.documentElement.style.cursor = '';
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    SaveLocalStorage();
                };

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            };
        }

        // --- MAIN LOOP ---

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }


        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (mixer && isPlaying && !isScrubbing) {
                mixer.update(delta);
            }

            orbit.update();

            // Sync Highlight
            if (selectedBone && selectionHighlighter && selectionHighlighter.visible) {
                const worldPos = new THREE.Vector3();
                selectedBone.getWorldPosition(worldPos);
                selectionHighlighter.position.copy(worldPos);
                // Maybe scale it based on bone? or just kept constant. 
                // Constant is better for visibility.
            }

            // Sync UI
            if (currentAction && duration > 0) {
                const time = currentAction.time;
                const pct = (time / duration) * 100;
                document.getElementById('playhead').style.left = pct + '%';
                document.getElementById('scrubber-bar').style.width = pct + '%';

                // Only update input if not focused
                const disp = document.getElementById('time-display');
                if (document.activeElement !== disp) {
                    disp.value = time.toFixed(2) + " / " + duration.toFixed(2);
                }
            }

            renderer.render(scene, camera);
        }

        // --- CONTEXT MENU SYSTEM ---
        window.showContextMenu = function (e, items) {
            e.preventDefault();
            e.stopPropagation();

            const menu = document.getElementById('context-menu');
            menu.innerHTML = '';

            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'context-menu-item';
                if (item.danger) div.classList.add('danger');
                div.innerText = item.label;
                div.onclick = (evt) => {
                    evt.stopPropagation();
                    menu.style.display = 'none';
                    item.action();
                };
                menu.appendChild(div);
            });

            menu.style.display = 'block';

            // Positioning (Basic)
            let x = e.pageX;
            let y = e.pageY;

            // Simple boundary check
            if (x + 150 > window.innerWidth) x -= 150;
            if (y + menu.offsetHeight > window.innerHeight) y -= menu.offsetHeight;

            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
        };

        // Close context menu on global click
        window.addEventListener('click', () => {
            const menu = document.getElementById('context-menu');
            if (menu) menu.style.display = 'none';
        });

        // Close when right-clicking elsewhere
        window.addEventListener('contextmenu', (e) => {
            const menu = document.getElementById('context-menu');
            if (menu && menu.style.display === 'block') {
                if (!e.target.closest('.tree-item') && !e.target.closest('.anim-item') && !e.target.closest('.prop-item')) {
                    menu.style.display = 'none';
                }
            }
        });

        // Start
        init();
    </script>
</body>
