<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LightMator: very lightweight glb animator</title>
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --panel-bg: #252526;
            --text-main: #d4d4d4;
            --accent: #007acc;
            --accent-hover: #0062a3;
            --border: #3e3e42;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* Layout */
        #viewport {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Top Toolbar */
        #toolbar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            justify-content: space-between;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: #444;
        }

        .btn-danger {
            background: #b93636;
        }

        input[type="file"] {
            display: none;
        }

        /* Animation List (Right Panel) */
        #sidebar {
            position: absolute;
            top: 50px;
            right: 0;
            width: 250px;
            bottom: 150px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .tab-header {
            display: flex;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: #333;
            color: #888;
            border: none;
            cursor: pointer;
            font-size: 12px;
        }

        .tab-btn.active {
            background: var(--panel-bg);
            color: white;
            border-bottom: 2px solid var(--accent);
        }

        #anim-list {
            flex-grow: 1;
            overflow-y: auto;
        }

        #model-setup-panel {
            padding: 10px;
            display: none;
            /* Hidden by default */
            flex-grow: 1;
            overflow-y: auto;
        }

        .anim-item {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .anim-item:hover {
            background: #333;
        }

        .anim-item.active {
            background: #37373d;
            border-left: 3px solid var(--accent);
        }

        #add-anim-btn {
            width: 100%;
            padding: 10px;
            font-size: 20px;
            background: #333;
            border: none;
            color: #888;
            cursor: pointer;
            border-top: 1px solid var(--border);
        }

        #add-anim-btn:hover {
            background: #444;
            color: white;
        }

        /* Timeline (Bottom Panel) */
        #timeline-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: var(--panel-bg);
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 10px;
            box-sizing: border-box;
        }

        #timeline-controls {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        #scrubber-container {
            position: relative;
            width: 100%;
            height: 30px;
            background: #1e1e1e;
            border-radius: 4px;
            cursor: pointer;
        }

        #scrubber-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: rgba(0, 122, 204, 0.3);
            pointer-events: none;
        }

        #playhead {
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 100%;
            background: red;
            pointer-events: none;
            z-index: 100;
        }

        .keyframe-marker {
            position: absolute;
            top: 2px;
            /* Centered in 20px height */
            height: 16px;
            width: 6px;
            background: yellow;
            border-radius: 2px;
            transform: translateX(-50%);
            cursor: pointer;
            z-index: 50;
            border: 1px solid #333;
        }

        .keyframe-marker:hover {
            background: #fff;
        }

        .tool-btn {
            width: 40px;
            height: 40px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 4px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            background: #333;
        }

        .tool-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .tool-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Hierarchy Tree */
        .tree-container {
            margin-top: 10px;
            border: 1px solid #444;
            background: #1e1e1e;
            max-height: 400px;
            overflow-y: auto;
            font-size: 12px;
        }

        .tree-item {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 2px 0;
            color: #aaa;
        }

        .tree-item:hover {
            background-color: #333;
            color: #fff;
        }

        .tree-item.selected {
            background-color: #37373d;
            color: #fff;
            border-left: 2px solid var(--accent);
        }

        .tree-indent {
            display: inline-block;
            width: 16px;
            height: 100%;
            flex-shrink: 0;
        }

        .tree-toggle {
            width: 16px;
            text-align: center;
            font-size: 10px;
            color: #888;
            cursor: pointer;
            margin-right: 4px;
        }

        .tree-label {
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tree-label {
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Resizers */
        .resizer-v {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            cursor: ew-resize;
            z-index: 10;
        }

        .resizer-h {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            cursor: ns-resize;
            z-index: 10;
        }

        /* Context Menu */
        #context-menu {
            display: none;
            position: absolute;
            z-index: 10000;
            background: #252526;
            border: 1px solid #454545;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
            min-width: 150px;
            padding: 5px 0;
            border-radius: 4px;
        }

        .context-menu-item {
            padding: 5px 15px;
            cursor: pointer;
            color: #ccc;
            font-size: 13px;
        }

        .context-menu-item:hover {
            background: #094771;
            color: white;
        }

        .context-menu-item.danger {
            color: #ce9178;
        }

        .context-menu-item.danger:hover {
            background: #800000;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body>
    <div id="context-menu"></div>
    <div id="toolbar">
        <div style="display:flex; align-items:center;">
            <h3 style="margin:0 20px 0 0;">GLB Animator</h3>
            <button class="btn" onclick="document.getElementById('file-input').click()">Import .GLB</button>
            <input type="file" id="file-input" accept=".glb,.gltf">
            <input type="text" id="project-name" value="MyProject"
                style="background:#333; color:white; border:1px solid #555; padding:5px; margin-right:10px; width:100px;"
                title="Project Name">
            <button class="btn btn-secondary" onclick="exportProjectZip()">Export Project (.zip)</button>
            <button class="btn btn-secondary" onclick="saveProject()">Save Work</button>
            <button class="btn btn-secondary" onclick="document.getElementById('project-input').click()">Load
                Work</button>
            <input type="file" id="project-input" accept=".json,.lightmator" style="display:none"
                onchange="loadProject(this)">
        </div>
        <div style="flex-grow:1"></div>
        <div id="selection-info">No bone selected</div>
    </div>

    <!-- Right Side Floating Toolbar -->
    <div id="transform-toolbar"
        style="position:absolute; top:70px; left:10px; display:flex; flex-direction:column; gap:10px; z-index:100;">
        <button class="tool-btn" id="btn-move" title="Move" onclick="setTransformMode('translate')">✢</button>
        <button class="tool-btn" id="btn-rotate" title="Rotate" onclick="setTransformMode('rotate')">↻</button>
        <button class="tool-btn" id="btn-scale" title="Scale" onclick="setTransformMode('scale')">⤢</button>
        <div style="height:1px; background:#444; margin:5px 0;"></div>
        <button class="tool-btn" id="btn-space" title="Toggle World/Local" onclick="toggleTransformSpace()"
            style="font-size:12px; font-weight:bold;">LOC</button>
    </div>

    <canvas id="viewport"></canvas>

    <div id="info-overlay">
        <strong>Controls:</strong><br>
        Right Click Drag: Rotate Camera<br>
        Scroll: Zoom<br>
        Ctrl + Click: Select Bone<br>
        Gizmo: Rotate Selected Bone<br>
    </div>

    <div id="sidebar">
        <div class="tab-header">
            <button class="tab-btn active" onclick="switchTab('anim')">Animation</button>
            <button class="tab-btn" onclick="switchTab('setup')">Model Setup</button>
        </div>

        <!-- Animation Panel -->
        <div id="anim-panel-content" style="display:flex; flex-direction:column; height:100%;">
            <div id="anim-list"></div>
            <button id="add-anim-btn" onclick="createNewAnimation()">+</button>
        </div>

        <!-- Setup Panel -->
        <div id="model-setup-panel">
            <p style="font-size:12px; color:#aaa; margin-bottom:10px;">Import props or add helper nodes.</p>
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <button class="btn btn-secondary" style="flex:1;"
                    onclick="document.getElementById('prop-input').click()">Import Prop</button>

                <button class="btn btn-secondary" style="flex:1;" onclick="addBone()">Add Bone</button>
            </div>
            <input type="file" id="prop-input" accept=".glb,.gltf,.obj" style="display:none"
                onchange="importProp(this)">

            <div id="props-list">
                <!-- List of attached props -->
            </div>

            <h4 style="margin:10px 0 5px 0; font-size:12px; color:#ddd; border-top:1px solid #444; padding-top:10px;">
                Hierarchy</h4>
            <div id="bone-hierarchy" class="tree-container">
                <!-- Tree content -->
            </div>
        </div>
        <div id="resizer-sidebar" class="resizer-v"></div>
    </div>

    <div id="timeline-panel">
        <div id="resizer-timeline" class="resizer-h"></div>
        <div id="timeline-controls">
            <button class="btn" id="play-pause-btn" onclick="togglePlay()">Pause</button>
            <input type="text" id="time-display" value="0.00 / 0.00"
                style="margin: 0 15px; font-family: monospace; width: 120px; background: transparent; border: 1px solid transparent; color: inherit; text-align: center;"
                ondblclick="this.readOnly=false; this.style.background='#333'; this.style.borderColor='#555';"
                onblur="updateTimeFromInput(this)" onkeydown="if(event.key=='Enter') updateTimeFromInput(this)"
                readonly>
            <input type="number" id="duration-input" step="0.1" min="0.1"
                style="width:60px; margin-right:10px; padding:4px; background:#333; color:white; border:1px solid #555; border-radius:4px;"
                onchange="updateDuration(this.value)">
            <select id="interpolation-select" onchange="updateInterpolation()"
                style="margin-right:10px; padding:4px; background:#333; color:white; border:1px solid #555; border-radius:4px;">
                <option value="Linear">Linear</option>
                <option value="Smooth">Smooth</option>
                <option value="Step">Step</option>
            </select>
            <button class="btn btn-secondary" onclick="recordKeyframe()">🔴 Keyframe</button>
            <button class="btn btn-danger" onclick="deleteKeyframe()"
                style="margin-left:5px; padding: 8px 12px;">🗑</button>
            <div style="flex-grow:1"></div>
            <label style="margin-right:10px;"><input type="checkbox" id="chk-skeleton" checked
                    onchange="toggleSkeleton()"> Show Bones</label>
            <label style="margin-right:10px;"><input type="checkbox" id="chk-ik" onchange="toggleIK()"> IK Mode
                <span id="ik-status" style="font-size:10px; color:#aaa;">OFF</span></label>
        </div>
        <div id="timeline-tracks-container"
            style="position:relative; flex-grow:1; display:flex; flex-direction:column; background:#1e1e1e; border-radius:4px; overflow:hidden;">
            <!-- Row 1: Time Scrubber -->
            <div id="scrubber-row"
                style="position:relative; height:15px; background:rgba(255,255,255,0.05); cursor:ew-resize; border-bottom:1px solid #333;"
                onmousedown="startScrub(event)">
                <div id="scrubber-bar"></div>
                <!-- Playhead spans both, so we might need it outside or overlay? 
                     Actually, having two separate playheads visual or one tall one overlaying both is better.
                     Let's use a container-wide playhead. -->
            </div>

            <!-- Row 2: Keyframes -->
            <div id="keyframes-track" style="position:relative; height:20px; background:transparent; cursor:default;">
                <!-- Markers go here -->
            </div>

            <!-- Global Playhead -->
            <div id="playhead"></div>
        </div>
    </div>

    </div>

    <!-- Synchronous script to prevent FOUC -->
    <script>
        // --- PERSISTENCE (Global) ---
        window.LoadLocalStorage = function () {
            try {
                const data = localStorage.getItem('lightmator_settings');
                if (!data) return;

                const settings = JSON.parse(data);
                const sidebar = document.getElementById('sidebar');
                const timeline = document.getElementById('timeline-panel');
                const toolbar = document.getElementById('transform-toolbar');

                if (sidebar && settings.sidebarWidth) {
                    sidebar.style.width = settings.sidebarWidth;
                }

                if (timeline && settings.timelineHeight) {
                    timeline.style.height = settings.timelineHeight;
                    if (sidebar) sidebar.style.bottom = settings.timelineHeight;
                }

            } catch (e) {
                console.warn("Failed to load settings:", e);
            }
        };

        window.SaveLocalStorage = function () {
            try {
                const sidebar = document.getElementById('sidebar');
                const timeline = document.getElementById('timeline-panel');

                const settings = {
                    sidebarWidth: sidebar ? sidebar.style.width : null,
                    timelineHeight: timeline ? timeline.style.height : null
                };

                localStorage.setItem('lightmator_settings', JSON.stringify(settings));
            } catch (e) {
                console.warn("Failed to save settings:", e);
            }
        };

        // Execute immediately
        window.LoadLocalStorage();
    </script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        // --- GLOBAL STATE ---
        let scene, camera, renderer, orbit, transformControl;
        let mixer, currentAction, currentModel, skeletonHelper;
        let animations = [];
        let clock = new THREE.Clock();
        let isPlaying = true;
        let isScrubbing = false;
        let selectedBone = null;
        let duration = 0;

        // Multi-select for keyframes
        let selectedKeyframes = new Set();

        // Box Selection
        let isBoxSelecting = false;
        let selectionBoxStart = null;
        let selectionBoxDiv = null;

        // Props
        let props = []; // { mesh: Object3D, parentBone: Bone, name: string }
        let pickingParentFor = null;

        // --- UNDO/REDO SYSTEM ---
        const undoStack = [];
        const redoStack = [];
        const MAX_STACK_SIZE = 50;

        function addCommand(cmd) {
            undoStack.push(cmd);
            if (undoStack.length > MAX_STACK_SIZE) undoStack.shift();
            redoStack.length = 0; // Clear redo on new action
            console.log("Command added. Undo stack:", undoStack.length);
        }

        window.undo = function () {
            if (undoStack.length === 0) return;
            const cmd = undoStack.pop();
            cmd.undo();
            redoStack.push(cmd);
            console.log("Undo. Stack:", undoStack.length);
        };

        window.redo = function () {
            if (redoStack.length === 0) return;
            const cmd = redoStack.pop();
            cmd.execute();
            undoStack.push(cmd);
            console.log("Redo. Stack:", redoStack.length);
        };


        // --- INITIALIZATION ---
        function init() {
            const canvas = document.getElementById('viewport');

            // Renderer
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e1e1e);

            // Grid & Lights
            const grid = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
            scene.add(grid);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
            hemiLight.position.set(0, 20, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 2);
            dirLight.position.set(3, 10, 10);
            scene.add(dirLight);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(2, 2, 4);

            // Controls
            orbit = new OrbitControls(camera, renderer.domElement);
            orbit.enableDamping = true;
            orbit.mouseButtons = {
                LEFT: THREE.MOUSE.ROTATE,
                MIDDLE: THREE.MOUSE.DOLLY,
                RIGHT: THREE.MOUSE.PAN
            };

            // Gizmo
            transformControl = new TransformControls(camera, renderer.domElement);

            // Undo/Redo specific state for Dragging
            let dragStartPos = new THREE.Vector3();
            let dragStartRot = new THREE.Quaternion();
            let dragStartScale = new THREE.Vector3();

            transformControl.addEventListener('dragging-changed', function (event) {
                orbit.enabled = !event.value;
                if (event.value) {
                    // Start dragging
                    if (isPlaying) togglePlay(); // Pause

                    if (transformControl.object) {
                        dragStartPos.copy(transformControl.object.position);
                        dragStartRot.copy(transformControl.object.quaternion);
                        dragStartScale.copy(transformControl.object.scale);

                        // SNAPSHOT CLIP BEFORE (if multiple keyframes selected)
                        if (selectedKeyframes.size > 0 && currentAction) {
                            transformControl.userData.jsonBefore = currentAction.getClip().toJSON();
                        }
                    }
                } else {
                    // Stop dragging
                    if (transformControl.object) {
                        const obj = transformControl.object;

                        // Capture end state (copies)
                        const startP = dragStartPos.clone();
                        const startQ = dragStartRot.clone();
                        const startS = dragStartScale.clone();

                        const endP = obj.position.clone();
                        const endQ = obj.quaternion.clone();
                        const endS = obj.scale.clone();

                        // Only add if changed
                        if (!startP.equals(endP) || !startQ.equals(endQ) || !startS.equals(endS)) {

                            // Check for Multi-Keyframe Edit
                            if (selectedKeyframes.size > 0 && currentAction) {
                                const clip = currentAction.getClip();

                                // Calculate Deltas
                                const deltaP = endP.clone().sub(startP);
                                // For rotation: current = start * delta -> delta = inverse(start) * current
                                const deltaQ = startQ.clone().invert().multiply(endQ);
                                // For scale: current = start * delta -> delta = current / start
                                const deltaS = new THREE.Vector3(
                                    startS.x !== 0 ? endS.x / startS.x : 1,
                                    startS.y !== 0 ? endS.y / startS.y : 1,
                                    startS.z !== 0 ? endS.z / startS.z : 1
                                );

                                // Apply to ALL selected keyframes
                                applyDeltaToKeyframes(clip, obj, selectedKeyframes, deltaP, deltaQ, deltaS);

                                // Refresh Visuals / Markers if needed (usually just values changed)
                                // We might need to ensure the Current Time frame is up to date?
                                // If we are sitting on one of the keyframes, the object update above handles the visual.
                                // But if we modified OTHER frames, we are good.

                                const jsonAfter = clip.toJSON();
                                const jsonBefore = transformControl.userData.jsonBefore;

                                addCommand({
                                    execute: () => {
                                        restoreClipState(clip, jsonAfter);
                                    },
                                    undo: () => {
                                        restoreClipState(clip, jsonBefore);
                                    }
                                });

                            } else {
                                // Standard single transformation (Visual Object Update + IK)
                                // Note: This does NOT save to keyframe automatically unless 'Keyframe' button is pressed,
                                // UNLESS we want "Auto Key" mode.
                                // The User Request said: "save the modifications to those keyframes automatically".
                                // This implies if we are on a keyframe (or selected one), we modify it.
                                // My implementation of "Multi-Keyframe" handles the selection case.
                                // If NO keyframes are explicitly selected, we just move the object (standard behavior).

                                addCommand({
                                    execute: () => {
                                        obj.position.copy(endP);
                                        obj.quaternion.copy(endQ);
                                        obj.scale.copy(endS);
                                        obj.updateMatrixWorld(true);
                                        if (ikEnabled && obj === ikTargetHelper) solveIK(ikChain, obj.position);
                                    },
                                    undo: () => {
                                        obj.position.copy(startP);
                                        obj.quaternion.copy(startQ);
                                        obj.scale.copy(startS);
                                        obj.updateMatrixWorld(true);
                                        if (ikEnabled && obj === ikTargetHelper) solveIK(ikChain, obj.position);
                                    }
                                });
                            }
                        }
                    }
                }
            });

            // We only want rotation for standard skeletal animation usually
            transformControl.setMode('rotate');
            transformControl.space = 'local';
            scene.add(transformControl);

            // IK Hook
            transformControl.addEventListener('change', (e) => {
                if (ikEnabled && transformControl.object === ikTargetHelper && ikChain.length > 0) {
                    solveIK(ikChain, ikTargetHelper.position);
                }
            });

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.getElementById('file-input').addEventListener('change', loadFile);

            // Pointer Logic replacement
            canvas.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('pointerup', () => { if (!transformControl.dragging) orbit.enabled = true; });

            // Key binding for Ctrl logic
            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                // Undo/Redo
                if (e.ctrlKey) {
                    if (e.key === 'z' || e.key === 'Z') {
                        if (e.shiftKey) {
                            redo();
                        } else {
                            undo();
                        }
                        e.preventDefault();
                    } else if (e.key === 'y' || e.key === 'Y') {
                        redo();
                        e.preventDefault();
                    }
                }

                transformControl.setTranslationSnap(e.shiftKey ? 0.5 : null);
                transformControl.setRotationSnap(e.shiftKey ? THREE.MathUtils.degToRad(15) : null);
            });

            // Initialize UI state
            updateTransformUI();

            initResizers();

            LoadLocalStorage();

            animate();
        }

        // --- FILE HANDLING ---
        function loadFile(e) {

            if (!file) return;

            loader.load(url, (gltf) => {

        function setupLoadedModel(gltf) {
            // Cleanup previous
            if (currentModel) {
                scene.remove(currentModel);
                scene.remove(skeletonHelper);
            }

            currentModel = gltf.scene;
            scene.add(currentModel);

            // POST-LOAD FIX: Restore Custom Bones
            ensureBones(currentModel);

            // Expand roots by default
            expandedBones.clear();
            currentModel.traverse((obj) => {
                if (obj.parent === currentModel) {
                    expandedBones.add(obj.uuid);
                }
            });
            // Ensure Armature/Hips are expanded
            currentModel.children.forEach(child => {
                expandedBones.add(child.uuid);
                if (child.children.length > 0) {
                    child.children.forEach(grandChild => expandedBones.add(grandChild.uuid));
                }
            });

            renderBoneHierarchy();

            // Auto-scale
            const box = new THREE.Box3().setFromObject(currentModel);
            const size = box.getSize(new THREE.Vector3()).length();
            const center = box.getCenter(new THREE.Vector3());

            // Reset camera based on size
            orbit.target.copy(center);
            camera.position.copy(center);
            camera.position.x += size;
            camera.position.y += size / 3;
            camera.position.z += size;

            // Helper
            skeletonHelper = new THREE.SkeletonHelper(currentModel);
            skeletonHelper.visible = true;
            scene.add(skeletonHelper);

            // Animations
            mixer = new THREE.AnimationMixer(currentModel);
            animations = gltf.animations;

            updateAnimList();

            if (animations.length > 0) {
                playAnimation(0);
            } else {
                createNewAnimation(); // Auto create default if none
            }
        }

        function ensureBones(model) {
            const toReplace = [];
            model.traverse(obj => {
                const isMarked = obj.userData && obj.userData.isCustomBone;
                if ((isMarked) && !obj.isBone) {
                    toReplace.push(obj);
                }
            });

            toReplace.forEach(obj => {
                const bone = new THREE.Bone();
                bone.name = obj.name;
                bone.position.copy(obj.position);
                bone.quaternion.copy(obj.quaternion);
                bone.scale.copy(obj.scale);
                bone.userData = obj.userData;

                // Transfer children
                while (obj.children.length > 0) {
                    bone.add(obj.children[0]);
                }

                // Replace in parent
                if (obj.parent) {
                    obj.parent.add(bone);
                    obj.parent.remove(obj);
                }
            });
        }

        window.exportProjectZip = async function () {
            if (!currentModel || !window.JSZip) {
                if (!window.JSZip) alert("JSZip library not loaded.");
                return;
            }

            const projectName = document.getElementById('project-name').value || "MyProject";
            const zip = new JSZip();
            const folder = zip.folder(projectName);

            // Helper to Promisify Export
            const exportToBlob = (object) => {
                return new Promise((resolve, reject) => {
                    const exporter = new GLTFExporter();
                    exporter.parse(object, (result) => {
                        let blob;
                        if (result instanceof ArrayBuffer) {
                            blob = new Blob([result], { type: 'application/octet-stream' });
                        } else {
                            const output = JSON.stringify(result, null, 2);
                            blob = new Blob([output], { type: 'text/plain' });
                        }
                        resolve(blob);
                    }, (err) => reject(err), { binary: true, animations: animations, truncateDrawRange: true });
                });
            };

            // 1. Prepare Main Model (Excluding Separate Props)
            // Strategy: Clone and Clean.
            // Note: GLTFExporter animations option relies on tracks matching node names.
            // If we clone, node UUIDs or references might change if not careful? 
            // GLTFExporter matches by Object Reference usually for animation tracks?
            // Actually Three.js animation tracks use NAMES (uuid if no name). 
            // Cloning might break animation linkage if names aren't unique updates.
            // Safer: Temporarily DETACH or Hide Separate Props from the scene graph.

            // Detach Separate Props & Editor Visuals
            const parentsMap = new Map(); // Store parent/index to restore

            const separateProps = props.filter(p => p.userData.exportSeparate);

            // Temporarily Remove Separate Props from hierarchy
            separateProps.forEach(p => {
                if (p.parent) {
                    parentsMap.set(p, p.parent);
                    p.parent.remove(p);
                }
            });

            // Hide Editor Visuals (AxesHelpers in Locators)
            const hiddenVisuals = [];
            currentModel.traverse(obj => {
                if (obj.userData.isEditorVisual) {
                    obj.visible = false;
                    hiddenVisuals.push(obj);
                    // Note: Exporter might still export invisible objects unless we filter?
                    // GLTFExporter exports hidden objects by default usually?
                    // Let's check docs or just DETACH them.
                    // Safer to Detach.
                }
            });
            // Actually, for Locators, the axes is a child. We want the Group (Locator) but not the Axes.
            // Let's Detach all EditorVisuals
            const visualParents = new Map();
            const visualsToDetach = [];
            currentModel.traverse(obj => {
                // Traverse puts currentModel first.
                if (obj.userData.isEditorVisual && obj.parent) {
                    visualsToDetach.push(obj);
                }
            });

            visualsToDetach.forEach(obj => {
                visualParents.set(obj, obj.parent);
                obj.parent.remove(obj);
            });

            // Cleanup helper
            const wasHelperVisible = skeletonHelper.visible;
            scene.remove(skeletonHelper);
            transformControl.detach();

            try {
                // Get Project Name
                const nameInput = document.getElementById('project-name');
                if (nameInput && nameInput.value.trim()) {
                    projectName = nameInput.value.trim();
                }

                // Export Main
                const mainBlob = await exportToBlob(currentModel);
                folder.file(projectName + ".glb", mainBlob);

                // Export Separate Props
                for (const prop of separateProps) {
                    // Props need to be exported. 
                    // If they are attached to bones, their local matrix is relative. 
                    // Usually "Separate" means "Asset", so nice to have at origin?
                    // BUT user said "preserve scale, rotation".
                    // If we export just the Prop Object, GLTFExporter exports it.
                    // If it has local transform data, that is preserved.
                    const propBlob = await exportToBlob(prop);
                    folder.file((prop.name || "Prop") + ".glb", propBlob);
                }

                // Generate Zip
                const content = await zip.generateAsync({ type: "blob" });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = projectName + ".zip";
                link.click();

            } catch (err) {
                console.error("Export failed", err);
                alert("Export failed: " + err);
            } finally {
                // RESTORE everything
                separateProps.forEach(p => {
                    const parent = parentsMap.get(p);
                    if (parent) parent.add(p);
                });

                visualsToDetach.forEach(obj => {
                    const parent = visualParents.get(obj);
                    if (parent) parent.add(obj);
                });

                if (wasHelperVisible) scene.add(skeletonHelper);
            }
        };

        // --- ANIMATION LOGIC ---

        function enableInlineRename(span, initialValue, onSave) {
            span.style.display = 'none';
            const input = document.createElement('input');
            input.type = 'text';
            input.value = initialValue;
            input.style.width = '100px';
            input.style.background = '#111';
            input.style.color = 'white';
            input.style.border = '1px solid #007acc';
            input.style.padding = '2px';
            input.style.fontSize = '12px';

            // Stop propagation to prevent triggering parent clicks (like playAnimation)
            input.onclick = (e) => e.stopPropagation();
            input.ondblclick = (e) => e.stopPropagation();

            const commit = () => {
                const newVal = input.value.trim();
                input.remove();
                span.style.display = '';
                if (newVal && newVal !== initialValue) {
                    onSave(newVal);
                }
            };

            const cancel = () => {
                input.remove();
                span.style.display = '';
            };

            input.addEventListener('blur', commit);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    commit();
                } else if (e.key === 'Escape') {
                    cancel();
                }
                e.stopPropagation(); // Prevent global hotkeys
            });

            span.parentNode.insertBefore(input, span);
            input.focus();
            input.select();
        }

        window.addBone = function () {
            try {
                const parent = selectedBone || currentModel;
                if (!parent) {
                    alert("No model or bone selected.");
                    return;

                // Create Bone
                const bone = new THREE.Bone();
                // Naming: Child of selected

                bone.name = baseName + "_child";
                bone.userData.isCustomBone = true;

                // Ensure unique name
                let counter = 1;
                while (scene.getObjectByName(bone.name)) {
                    bone.name = baseName + "_child_" + counter++;

                // Default Transform (Small offset Y)
                bone.position.set(0, 0.2, 0);

        let expandedBones = new Set(); // Store UUIDs of expanded bones

        window.renderBoneHierarchy = function () {
            const container = document.getElementById('bone-hierarchy');
            if (!container) return;
            container.innerHTML = '';

            // Find Roots
            // If we have a skeleton helper, use its bone list to find roots effectively?
            // Or traverse from currentModel.
            if (!currentModel) return;

            // Strategy: Recursively traverse model children, filter for Bones or Groups(Locators)
            // But usually we just want the Skeleton.
            // Let's traverse currentModel.children

            currentModel.children.forEach(child => {
                buildTreeItem(child, container, 0);
            });
        };

        function buildTreeItem(obj, parentElement, depth) {
            // Filter: Only Bones, or Locators/Props if we want full hierarchy
            // Use user req: "tree / file kind of structure thing where bones can easily be selected"
            // So Bones are priority. But Props/Locators are children of Bones often.

            const isBone = obj.isBone;
            const isLocator = obj.userData && obj.userData.isLocator;
            const isMesh = obj.isMesh || obj.isGroup; // Generic props

            // Skip internal helpers (SkinnedMesh is main model usually), SkeletonHelper
            if (obj.isSkeletonHelper) return;
            if (obj === ikTargetHelper) return;
            if (obj === selectionHighlighter) return;

            // We want to show: Bones, Props (Meshes/Groups that are NOT the main character mesh?)
            // Main character mesh usually contains the skeleton? No, SkinnedMesh IS the character.
            // Skeleton is usually adjacent or inside.

            // Simple rule: Show everything that isn't a known tool helper.
            // Refine: Show Bones and objects in our 'props' list?
            // Let's show everything for now, can perform filtering.

            const hasChildren = obj.children.length > 0;
            const isExpanded = expandedBones.has(obj.uuid);

            const div = document.createElement('div');

            // Row
            const row = document.createElement('div');
            row.className = 'tree-item';
            if (selectedBone === obj || (transformControl.object === obj)) {
                row.classList.add('selected');
            }
            row.id = 'tree-row-' + obj.uuid;

            // Indent
            for (let i = 0; i < depth; i++) {
                const indent = document.createElement('span');
                indent.className = 'tree-indent';
                row.appendChild(indent);
            }

            // Expander
            const toggle = document.createElement('span');
            toggle.className = 'tree-toggle';
            if (hasChildren) {
                toggle.innerText = isExpanded ? '▼' : '▶';
                toggle.onclick = (e) => {
                    e.stopPropagation();
                    if (isExpanded) expandedBones.delete(obj.uuid);
                    else expandedBones.add(obj.uuid);
                    renderBoneHierarchy();
                };
            } else {
                toggle.innerText = '•'; // Leaf
                toggle.style.opacity = '0.3';
            }
            row.appendChild(toggle);

            // Icon
            const icon = document.createElement('span');
            icon.style.marginRight = '5px';
            if (isBone) icon.innerText = '🦴';
            else if (isLocator) icon.innerText = '📍';
            else icon.innerText = '📦';
            row.appendChild(icon);

            // Label
            const label = document.createElement('span');
            label.className = 'tree-label';
            label.innerText = obj.name || (isBone ? "Bone" : "Object");
            row.appendChild(label);

            if (isBone) {
                row.oncontextmenu = (e) => {
                    const items = [
                        {
                            label: "Rename",
                            action: () => {
                                const currentName = obj.name || "Bone";
                                enableInlineRename(label, currentName, (newName) => {
                                    obj.name = newName;
                                    renderBoneHierarchy();
                                });
                            }
                        }
                    ];
                    showContextMenu(e, items);
                };
            }

            // Click -> Select or Rename (Manual Double Click)
            // Click -> Select
            row.onclick = (e) => {
                if (isBone) selectBone(obj, true);
                else {
                    selectBone(null, true);
                    transformControl.attach(obj);
                    document.getElementById('selection-info').innerText = "Selected: " + (obj.name || "Object");
                    // If we have a helper for props, use it? For now, re-render or custom update?
                    // Usually we don't have a specific update for props selection in tree except rebuild
                    // But if selectBone rebuilds, maybe we just rebuild for consistency or add simple highlight
                    if (window.updateHierarchySelection) window.updateHierarchySelection(obj);
                    else renderBoneHierarchy();
                }
            };

            div.appendChild(row);

            // Children container
            if (hasChildren && isExpanded) {
                const childContainer = document.createElement('div');
                obj.children.forEach(child => {
                    // Filter internal stuff again mostly safe inside recursion
                    if (!child.userData.isEditorVisual && child.name !== "SelectionHighlighter") {
                        buildTreeItem(child, childContainer, depth + 1);
                    }
                });
                div.appendChild(childContainer);
            }

            parentElement.appendChild(div);
        }

        window.focusInTree = function (object) {

            while (curr && curr !== scene && curr !== currentModel) {

                curr = curr.parent;

            // Expand all parents
            path.forEach(node => {

            setTimeout(() => {

        function createTextSprite(message) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const fontSize = 32;
            context.font = "Bold " + fontSize + "px Arial";
            const metrics = context.measureText(message);
            const textWidth = metrics.width;

            canvas.width = textWidth + 20;
            canvas.height = fontSize + 20;

            // Background
            context.fillStyle = "rgba(0, 0, 0, 0.5)";
            context.fillRect(0, 0, canvas.width, canvas.height);

            // Text
            context.fillStyle = "white";
            context.textAlign = "center";
            context.textBaseline = "middle";
            context.fillText(message, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture, depthTest: false, depthWrite: false });
            const sprite = new THREE.Sprite(material);
            sprite.scale.set(canvas.width / 100, canvas.height / 100, 1);
            sprite.renderOrder = 999;
            return sprite;
        }

                chkLabel.appendChild(chk);
                chkLabel.appendChild(document.createTextNode("Separate File"));

        window.applyDeltaToKeyframes = function (clip, object, timesSet, deltaP, deltaQ, deltaS) {
            const trackNameBase = object.name; // Assumption: Track names are "BoneName.position", etc.

            // Support both exact matches and UUID based if tracks use UUIDs (GLTF Loader usually uses names)
            // But we created tracks using .name
            const posTrackName = trackNameBase + ".position";
            const rotTrackName = trackNameBase + ".quaternion";
            const sclTrackName = trackNameBase + ".scale";

            // Find Tracks
            const posTrack = clip.tracks.find(t => t.name === posTrackName);
            const rotTrack = clip.tracks.find(t => t.name === rotTrackName);
            const sclTrack = clip.tracks.find(t => t.name === sclTrackName);

            const timesToMod = Array.from(timesSet);

            // Helper to apply
            const apply = (track, type) => {
                if (!track) return;
                const times = track.times;
                const values = track.values;
                const itemSize = track.getValueSize(); // 3 or 4

                for (let i = 0; i < times.length; i++) {
                    // Check if this keyframe time is in our selection
                    // Use epsilon
                    const t = times[i];
                    let isSelected = false;
                    for (let selT of timesToMod) {
                        if (Math.abs(selT - t) < 0.001) {
                            isSelected = true;
                            break;
                        }
                    }

                    if (isSelected) {
                        if (type === 'pos') {
                            // Additive
                            values[i * 3] += deltaP.x;
                            values[i * 3 + 1] += deltaP.y;
                            values[i * 3 + 2] += deltaP.z;
                        } else if (type === 'scale') {
                            // Multiplicative
                            values[i * 3] *= deltaS.x;
                            values[i * 3 + 1] *= deltaS.y;
                            values[i * 3 + 2] *= deltaS.z;
                        } else if (type === 'rot') {
                            // Rotations are tricky. modifying the stored quaternion.
                            // Stored: q_old. New: q_new = q_old * deltaQ (Applied locally)
                            const currentQ = new THREE.Quaternion(
                                values[i * 4], values[i * 4 + 1], values[i * 4 + 2], values[i * 4 + 3]
                            );
                            currentQ.multiply(deltaQ); // multiply appends local rotation

                            values[i * 4] = currentQ.x;
                            values[i * 4 + 1] = currentQ.y;
                            values[i * 4 + 2] = currentQ.z;
                            values[i * 4 + 3] = currentQ.w;
                        }
                    }
                }
            };

            if (deltaP.lengthSq() > 0) apply(posTrack, 'pos');
            if (deltaS.distanceTo(new THREE.Vector3(1, 1, 1)) > 0.0001) apply(sclTrack, 'scale');
            if (deltaQ.angleTo(new THREE.Quaternion()) > 0.0001) apply(rotTrack, 'rot');
        };

        // --- KEYFRAME EDITING ---

        window.recordKeyframe = function () {
            if (!currentAction) {
                alert("Create an animation first.");
                return;
            }

            const clip = currentAction.getClip();

            // SHAPSHOT State BEFORE
            const jsonBefore = clip.toJSON();

            const time = currentAction.time;

            // Helper to get interpolation mode from UI
            const mode = document.getElementById('interpolation-select').value;
            let interp = THREE.InterpolateLinear;
            if (mode === "Smooth") interp = THREE.InterpolateSmooth;
            if (mode === "Step") interp = THREE.InterpolateDiscrete;

            // Iterate ALL bones
            let bones = [];
            if (skeletonHelper) {
                bones = skeletonHelper.bones;
            } else {
                scene.traverse(o => { if (o.isBone) bones.push(o); });
            }

            bones.forEach(bone => {
                const trackName = bone.name + '.quaternion';
                let track = clip.tracks.find(t => t.name === trackName);

                const q = bone.quaternion;
                const value = [q.x, q.y, q.z, q.w];

                if (!track) {
                    track = new THREE.QuaternionKeyframeTrack(trackName, [time], value);
                    track.setInterpolation(interp);
                    clip.tracks.push(track);
                } else {
                    const times = Array.from(track.times);
                    const values = Array.from(track.values);

                    const existingIndex = times.findIndex(t => Math.abs(t - time) < 0.001);

                    if (existingIndex >= 0) {
                        values[existingIndex * 4] = q.x;
                        values[existingIndex * 4 + 1] = q.y;
                        values[existingIndex * 4 + 2] = q.z;
                        values[existingIndex * 4 + 3] = q.w;
                    } else {
                        times.push(time);
                        values.push(...value);

                        // Sort
                        let data = times.map((t, i) => ({
                            time: t,
                            val: [values[i * 4], values[i * 4 + 1], values[i * 4 + 2], values[i * 4 + 3]]
                        }));
                        data.sort((a, b) => a.time - b.time);

                        track.times = new Float32Array(data.map(d => d.time));
                        track.values = new Float32Array(data.flatMap(d => d.val));
                    }
                    track.setInterpolation(interp); // Update mode
                }
            });

            // Update duration
            if (time > clip.duration) clip.duration = time;
            duration = clip.duration;
            document.getElementById('duration-input').value = duration;

            // Re-apply
            const wasPlaying = isPlaying;
            currentAction.stop();
            mixer.uncacheClip(clip);
            currentAction = mixer.clipAction(clip);
            currentAction.time = time;

            // FIX: Restore play state correctly
            if (wasPlaying) {
                currentAction.play();
                isPlaying = true;
            } else {
                currentAction.play().paused = true;
                mixer.update(0);
            }

            drawKeyframeMarkers(clip);

            // SNAPSHOT State AFTER
            const jsonAfter = clip.toJSON();

            addCommand({
                execute: () => {
                    restoreClipState(clip, jsonAfter);
                },
                undo: () => {
                    restoreClipState(clip, jsonBefore);
                }
            });
        };

        function restoreClipState(clip, json) {
            // Re-parse tracks from JSON
            // THREE.AnimationClip.parse(json) returns a new clip. 
            // We want to apply it to the EXISTING clip object to keep references valid if possible,
            // OR we replace the clip in 'animations' array and mixer.

            // Easiest is to replace in mixer and animations array
            const newClip = THREE.AnimationClip.parse(json);

            // Find index
            const idx = animations.indexOf(clip);
            if (idx !== -1) {
                animations[idx] = newClip;
            }

            // Restore Mixer
            const time = currentAction ? currentAction.time : 0;
            const wasPlaying = isPlaying;

            if (currentAction) currentAction.stop();
            mixer.uncacheClip(clip);

            // If the clip object changed, we need to update our references
            // But 'redo' might be called when 'clip' is already stale if we replaced it?
            // Actually, if we replace the object in the array, the wrapper 'clip' variable in closures might be old.
            // Better to modify the EXISTING clip's tracks.

            clip.tracks = newClip.tracks;
            clip.duration = newClip.duration;
            clip.name = newClip.name; // just in case

            // Re-bind
            currentAction = mixer.clipAction(clip);
            currentAction.time = time;

            if (wasPlaying) {
                currentAction.play();
            } else {
                currentAction.play().paused = true;
                mixer.update(0);
            }

            // If needed, update global reference
            if (animations.indexOf(clip) === -1 && idx !== -1) {
                // Determine if we need to put it back? 
                // We modified properties in place, so reference 'clip' is still in 'animations' array.
            }

            drawKeyframeMarkers(clip);
            document.getElementById('duration-input').value = clip.duration;
        }

        window.deleteKeyframe = function () {
            if (selectedKeyframes.size === 0 || !currentAction) return;
            const clip = currentAction.getClip();

            // SNAPSHOT State BEFORE
            const jsonBefore = clip.toJSON();

            // Collect times to remove
            const timesToRemove = Array.from(selectedKeyframes);

            clip.tracks.forEach(track => {
                const times = Array.from(track.times);
                const values = Array.from(track.values);

                const newTimes = [];
                const newValues = [];
                const itemSize = track.values.length / track.times.length;

                for (let i = 0; i < times.length; i++) {
                    let keep = true;
                    for (let t of timesToRemove) {
                        if (Math.abs(times[i] - t) < 0.001) {
                            keep = false;
                            break;
                        }
                    }
                    if (keep) {
                        newTimes.push(times[i]);
                        for (let k = 0; k < itemSize; k++) {
                            newValues.push(values[i * itemSize + k]);
                        }
                    }
                }

                track.times = new Float32Array(newTimes);
                track.values = new Float32Array(newValues);
            });

            // Re-init
            const t = currentAction.time;
            const wasPlaying = isPlaying;
            currentAction.stop();
            mixer.uncacheClip(clip);
            currentAction = mixer.clipAction(clip);
            currentAction.time = t;
            if (wasPlaying) {
                currentAction.play();
            } else {
                currentAction.play().paused = true;
            }

            selectedKeyframes.clear();
            drawKeyframeMarkers(clip);

            // SNAPSHOT State AFTER
            const jsonAfter = clip.toJSON();

            addCommand({
                execute: () => {
                    restoreClipState(clip, jsonAfter);
                },
                undo: () => {
                    restoreClipState(clip, jsonBefore);
                }
            });
        };

        window.updateInterpolation = function () {

            const parts = input.value.split('/');

        window.deleteKeyframe = function () {
            if (!selectedKeyframe || !currentAction) return;
            const clip = currentAction.getClip();
            const timeToDelete = selectedKeyframe.time;

            let changed = false;
            clip.tracks.forEach(track => {
                const times = Array.from(track.times);
                const values = Array.from(track.values);

                // Find index
                // Since floats are tricky, look for epsilon match
                const idx = times.findIndex(t => Math.abs(t - timeToDelete) < 0.001);

                if (idx !== -1) {
                    // Remove
                    times.splice(idx, 1);
                    // Values depend on track type, usually quaternion (4) or vector (3)
                    // But we generated mostly quaternion tracks.
                    const itemSize = track.getValueSize();
                    values.splice(idx * itemSize, itemSize);

                    track.times = new Float32Array(times);
                    track.values = new Float32Array(values);
                    changed = true;
                }
            });

            if (changed) {
                const t = currentAction.time;
                currentAction.stop();
                mixer.uncacheClip(clip);
                currentAction = mixer.clipAction(clip);
                currentAction.time = t;
                currentAction.play();
                if (!isPlaying) currentAction.paused = true;
                selectedKeyframe = null;
                drawKeyframeMarkers(clip);
            }
        };
