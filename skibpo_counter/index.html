<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skip-Bo Lite</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v3.0.3/dist/tesseract.min.js"></script>
    <script async src="https://docs.opencv.org/4.5.0/opencv.js" onload="onOpenCvReady();"></script>
    <style>
        body {
            font-family: sans-serif; background: #222; color: #fff;
            margin: 0; padding: 10px; text-align: center;
        }
        h1 { color: #f44336; margin: 0 0 10px 0; font-size: 1.5rem; }
        
        .score-container {
            background: #333; padding: 15px; border-radius: 10px; margin-bottom: 10px;
        }
        #totalScore { font-size: 3rem; font-weight: bold; color: #4caf50; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 5px;
            font-size: 1rem; font-weight: bold; cursor: pointer; color: white;
        }
        .btn-cam { background: #2196F3; }
        .btn-reset { background: #555; }
        
        /* The container for the image and boxes */
        #canvas-wrapper {
            position: relative; margin: 0 auto; display: inline-block;
            max-width: 100%; border: 1px solid #444;
        }
        #mainCanvas { width: 100%; display: block; }
        
        /* Debug Log Window */
        #log {
            text-align: left; font-family: monospace; font-size: 0.8rem;
            background: #000; color: #0f0; padding: 10px; height: 100px;
            overflow-y: scroll; border: 1px solid #333; margin-top: 10px;
            white-space: pre-wrap;
        }

        /* Overlay Buttons for Correction */
        .overlay-btn {
            position: absolute; width: 40px; height: 40px;
            background: rgba(0,0,0,0.8); border: 2px solid #fff;
            color: #fff; border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <h1>Skip-Bo Lite</h1>

    <div class="score-container">
        <div>Total Score</div>
        <div id="totalScore">0</div>
    </div>

    <div class="controls">
        <label class="btn btn-cam" id="camBtn">
            📷 Take Photo
            <input type="file" id="cameraInput" accept="image/*" hidden capture="environment">
        </label>
        <button class="btn btn-reset" onclick="resetApp()">Reset</button>
    </div>

    <div id="canvas-wrapper">
        <canvas id="mainCanvas"></canvas>
        <div id="overlays"></div>
    </div>

    <div id="log">System: Initializing...</div>

<script>
    // --- Global Variables ---
    let cvReady = false;
    let worker = null;
    let grandTotal = 0;
    let currentCards = []; // Store detected card data {id, value, x, y}

    const logEl = document.getElementById('log');
    const totalEl = document.getElementById('totalScore');
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const overlays = document.getElementById('overlays');
    const camBtn = document.getElementById('camBtn');

    // --- Logging Helper ---
    function log(msg) {
        logEl.innerText += "\n> " + msg;
        logEl.scrollTop = logEl.scrollHeight;
        console.log(msg);
    }

    // --- Initialization ---
    function onOpenCvReady() {
        cvReady = true;
        log("OpenCV Loaded.");
        initOCR();
    }

    async function initOCR() {
        try {
            log("Loading OCR...");
            worker = Tesseract.createWorker();
            await worker.load();
            await worker.loadLanguage('eng');
            await worker.initialize('eng');
            await worker.setParameters({
                tessedit_char_whitelist: '0123456789', // Only numbers
                tessedit_pageseg_mode: '10', // Treat image as a single character
            });
            log("OCR Ready. System OK.");
            camBtn.style.opacity = "1";
        } catch (e) {
            log("OCR Error: " + e.message);
        }
    }

    function resetApp() {
        grandTotal = 0;
        totalEl.innerText = "0";
        overlays.innerHTML = '';
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvas.height = 0;
        currentCards = [];
        log("Reset complete.");
    }

    // --- Camera Handler ---
    document.getElementById('cameraInput').addEventListener('change', async (e) => {
        if (!e.target.files[0]) return;
        
        log("Image selected. Loading...");
        overlays.innerHTML = ''; // Clear old buttons
        
        const img = new Image();
        img.onload = () => {
            // Use setTimeout to allow UI to update (prevent freeze)
            setTimeout(() => runPipeline(img), 50);
        };
        img.src = URL.createObjectURL(e.target.files[0]);
    });

    // --- MAIN PIPELINE (Step-by-Step) ---
    async function runPipeline(img) {
        try {
            // 1. Resize (Crucial for Mobile Memory)
            const MAX_W = 600; 
            const scale = Math.min(MAX_W / img.width, 1.0);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            log(`Resized to ${canvas.width}x${canvas.height}`);

            // 2. Setup OpenCV
            let src = cv.imread(canvas);
            let hsv = new cv.Mat();
            cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
            cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);

            // 3. Define Colors
            // Note: OpenCV Hue is 0-179
            const colors = [
                { name: "Blue",   low: [90, 80, 50, 0],  high: [130, 255, 255, 0], valid: [1,2,3,4] },
                { name: "Green",  low: [40, 60, 50, 0],  high: [85, 255, 255, 0],  valid: [5,6,7,8] },
                { name: "Red",    low: [0, 80, 50, 0],   high: [10, 255, 255, 0],  valid: [9,10,11,12], wrap: [160, 180] },
                { name: "Orange", low: [11, 100, 100, 0], high: [25, 255, 255, 0], valid: [0] } // SkipBo
            ];

            let batchTotal = 0;

            // 4. Process Each Color
            for (let c of colors) {
                log(`Scanning for ${c.name}...`);
                
                let mask = new cv.Mat();
                let low = new cv.Mat(src.rows, src.cols, src.type(), c.low);
                let high = new cv.Mat(src.rows, src.cols, src.type(), c.high);
                
                cv.inRange(hsv, low, high, mask);

                // Handle Red Wrap
                if (c.wrap) {
                    let mask2 = new cv.Mat();
                    let low2 = new cv.Mat(src.rows, src.cols, src.type(), [c.wrap[0], c.low[1], c.low[2], 0]);
                    let high2 = new cv.Mat(src.rows, src.cols, src.type(), [c.wrap[1], c.high[1], c.high[2], 0]);
                    cv.inRange(hsv, low2, high2, mask2);
                    cv.add(mask, mask2, mask);
                    mask2.delete(); low2.delete(); high2.delete();
                }

                // Clean Noise
                let k = cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(3, 3));
                cv.morphologyEx(mask, mask, cv.MORPH_OPEN, k);
                
                // Find Contours
                let contours = new cv.MatVector();
                let hierarchy = new cv.Mat();
                cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                // 5. Check Detected Blobs
                for (let i = 0; i < contours.size(); ++i) {
                    let cnt = contours.get(i);
                    let area = cv.contourArea(cnt);
                    
                    // Filter small noise
                    if (area > 800) {
                        let rect = cv.boundingRect(cnt);
                        // Is it card shaped?
                        let ratio = rect.width / rect.height;
                        if (ratio > 0.4 && ratio < 2.0) {
                            
                            // It's a card candidate!
                            let val = 0;
                            
                            if (c.name === "Orange") {
                                // Skip-Bo is always 0
                                val = 0;
                            } else {
                                // Try to read it
                                val = await attemptRead(src, rect, c.valid);
                            }

                            // Add button to UI
                            createOverlayButton(rect, val, c.name);
                            batchTotal += val;
                        }
                    }
                }

                // Cleanup OpenCV objects for this loop
                mask.delete(); low.delete(); high.delete(); 
                contours.delete(); hierarchy.delete(); k.delete();
            }

            // Cleanup main objects
            src.delete(); hsv.delete();

            grandTotal += batchTotal;
            totalEl.innerText = grandTotal;
            log(`Done! Added ${batchTotal}. Tap circles to edit.`);

        } catch (err) {
            log("CRASH: " + err.message);
            console.error(err);
        }
    }

    // --- OCR Logic ---
    async function attemptRead(fullSrc, rect, validList) {
        // Crop the card
        let roi = fullSrc.roi(rect);
        
        // Preprocess: Convert to Grey, Threshold
        let gray = new cv.Mat();
        cv.cvtColor(roi, gray, cv.COLOR_RGBA2GRAY);
        
        // Skip-Bo cards have white text on color.
        // We invert so text is black, background is white.
        cv.threshold(gray, gray, 0, 255, cv.THRESH_BINARY_INV + cv.THRESH_OTSU);

        // Crop center (ignore corners)
        let centerRect = new cv.Rect(
            Math.floor(rect.width * 0.2), 
            Math.floor(rect.height * 0.2), 
            Math.floor(rect.width * 0.6), 
            Math.floor(rect.height * 0.6)
        );
        let centerRoi = gray.roi(centerRect);

        // Put on temp canvas
        let cCanvas = document.createElement('canvas');
        cCanvas.width = centerRect.width;
        cCanvas.height = centerRect.height;
        cv.imshow(cCanvas, centerRoi);

        // Run Tesseract
        let result = 0;
        try {
            const { data: { text } } = await worker.recognize(cCanvas);
            let clean = text.replace(/[^0-9]/g, '');
            let num = parseInt(clean);

            if (validList.includes(num)) {
                result = num;
            } else {
                // Heuristics
                if (num === 1 && validList.includes(11)) result = 11; // 1 reads as 11 sometimes
                else if (num === 0 && validList.includes(10)) result = 10;
                else if (clean.includes("12") && validList.includes(12)) result = 12;
            }
        } catch (e) {
            console.warn("OCR failed for card");
        }

        // Cleanup
        roi.delete(); gray.delete(); centerRoi.delete();
        return result;
    }

    // --- UI Overlay Logic ---
    function createOverlayButton(rect, value, colorName) {
        let btn = document.createElement('div');
        btn.className = 'overlay-btn';
        
        // Position
        btn.style.left = (rect.x + rect.width/2 - 20) + 'px';
        btn.style.top = (rect.y + rect.height/2 - 20) + 'px';
        
        // Color
        let colorMap = { "Blue": "#2196F3", "Green": "#4CAF50", "Red": "#f44336", "Orange": "#ff9800" };
        btn.style.borderColor = colorMap[colorName] || '#fff';
        
        // Text
        btn.innerText = (value === 0 && colorName === "Orange") ? "SB" : value;
        
        // Click to Edit
        btn.onclick = () => {
            let newVal = prompt("Correct value:", value);
            if (newVal !== null) {
                let n = parseInt(newVal);
                if (!isNaN(n)) {
                    // Update total
                    let diff = n - (value === "SB" ? 0 : value);
                    grandTotal += diff;
                    totalEl.innerText = grandTotal;
                    
                    // Update Button
                    value = n;
                    btn.innerText = n;
                    
                    // Update underlying data if we were tracking it strictly
                    log(`Manual Edit: ${diff > 0 ? '+' : ''}${diff}`);
                }
            }
        };

        overlays.appendChild(btn);
    }
</script>
</body>
</html>
