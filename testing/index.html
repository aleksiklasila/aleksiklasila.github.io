<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Golf & Editor: Mobile Edition</title>
<style>
    :root { --bg: #2c3e50; --ui: #ecf0f1; --accent: #e74c3c; }
    body { margin: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', sans-serif; color: var(--ui); touch-action: none; user-select: none; -webkit-user-select: none; }
    canvas { display: block; }
    
    /* UI Overlay Layer */
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
    
    .panel { background: rgba(0,0,0,0.85); padding: 20px; border-radius: 8px; pointer-events: auto; text-align: center; max-width: 600px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    h1 { margin: 0 0 20px 0; color: #2ecc71; text-transform: uppercase; letter-spacing: 2px; font-size: 24px; }
    button { background: var(--accent); color: white; border: none; padding: 12px 24px; margin: 5px; font-size: 16px; cursor: pointer; border-radius: 4px; transition: 0.2s; touch-action: manipulation; }
    button:active { transform: scale(0.95); }
    
    /* Editor UI */
    #editor-ui { position: absolute; bottom: 0; left: 0; width: 100%; height: 100px; background: rgba(0,0,0,0.9); display: none; pointer-events: auto; overflow-x: auto; white-space: nowrap; padding: 10px; box-sizing: border-box; z-index: 20; }
    .tile-btn { width: 50px; height: 50px; display: inline-block; margin-right: 8px; border: 2px solid #555; cursor: pointer; position: relative; border-radius: 4px; }
    .tile-btn.selected { border-color: #2ecc71; transform: scale(1.1); box-shadow: 0 0 10px #2ecc71; }
    .tile-btn span { position: absolute; bottom: -20px; width: 100%; font-size: 10px; text-align: center; color: #aaa; pointer-events: none; }
    
    /* MOBILE CONTROLS */
    #mobile-controls { position: absolute; bottom: 20px; width: 100%; height: 150px; pointer-events: none; display: none; z-index: 5; justify-content: space-between; padding: 0 40px; box-sizing: border-box; }
    
    /* Joystick */
    #joystick-area { width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; position: relative; pointer-events: auto; touch-action: none; }
    #joystick-knob { width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; position: absolute; top: 35px; left: 35px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: transform 0.1s; }
    
    /* Shoot Button */
    #shoot-btn { width: 100px; height: 100px; background: rgba(231, 76, 60, 0.8); border-radius: 50%; border: 4px solid white; color: white; font-weight: bold; font-size: 18px; pointer-events: auto; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); user-select: none; touch-action: none; -webkit-touch-callout: none; }
    #shoot-btn:active { background: #c0392b; transform: scale(0.95); }

    /* Show controls only when playing */
    body.playing #mobile-controls { display: flex; }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <div id="main-menu" class="panel">
        <h1>Pocket Golf Split-Screen</h1>
        <p>Map Editor | Controller | Mobile Touch</p>
        <div style="margin: 20px 0;">
            <label>Players: <input type="number" id="player-count" min="1" max="4" value="1" style="width:50px; height: 30px; text-align:center; font-size: 18px;"></label>
        </div>
        <button onclick="startGame()">Play Map</button>
        <button onclick="openEditor()">Map Editor</button>
        <button onclick="generateRandomMap()">New Random Map</button>
    </div>

    <div id="pause-menu" class="panel" style="display:none;">
        <h1>Paused</h1>
        <button onclick="resumeGame()">Resume</button>
        <button onclick="exitToMenu()">Exit to Menu</button>
    </div>
</div>

<div id="editor-ui"></div>

<div id="mobile-controls">
    <div id="joystick-area">
        <div id="joystick-knob"></div>
    </div>
    <div id="shoot-btn">HOLD</div>
</div>

<script>
/** * CONFIGURATION & GLOBALS
 */
const CANVAS = document.getElementById('gameCanvas');
const CTX = CANVAS.getContext('2d', { alpha: false }); // Optimize
const TILE_SIZE = 40;
const FRICTION = 0.98;
const MAX_POWER = 15;

let STATE = 'MENU';
let PLAYERS = [];
let MAP = [];
let MAP_WIDTH = 30;
let MAP_HEIGHT = 20;

// Mobile Input State
let TOUCH_INPUT = {
    active: false,
    dx: 0,
    dy: 0,
    angle: 0,
    shooting: false
};

// Tile Types
const TILES = {
    0: { name: 'Grass', color: '#27ae60', type: 'floor' },
    1: { name: 'Start', color: '#f1c40f', type: 'floor' },
    2: { name: 'Hole',  color: '#2c3e50', type: 'hole' },
    3: { name: 'Block', color: '#7f8c8d', type: 'wall' },
    4: { name: 'Water', color: '#3498db', type: 'hazard' },
    5: { name: 'Sand',  color: '#e67e22', type: 'slow' },
    6: { name: 'Ice',   color: '#ecf0f1', type: 'slide' },
    7: { name: 'Jump',  color: '#9b59b6', type: 'jump' },
    8: { name: 'Bst ^', color: '#c0392b', type: 'boost', dx:0, dy:-1 },
    9: { name: 'Bst >', color: '#c0392b', type: 'boost', dx:1, dy:0 },
    10:{ name: 'Bst v', color: '#c0392b', type: 'boost', dx:0, dy:1 },
    11:{ name: 'Bst <', color: '#c0392b', type: 'boost', dx:-1, dy:0 },
    20:{ name: 'Wood',  color: '#8e44ad', type: 'wall' }, 
    99:{ name: 'ERASE', color: '#ff0000', type: 'empty' } // Special Editor tool
};

let EDITOR_SELECTED_TILE = 1;

/** * SYSTEM INIT 
 */
function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Keyboard
    window.addEventListener('keydown', handleKey);
    window.addEventListener('keyup', handleKeyUp);
    
    // Mouse (Editor)
    CANVAS.addEventListener('mousedown', handleMouse);
    CANVAS.addEventListener('mousemove', handleMouseMove);
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('contextmenu', e => e.preventDefault());

    // Mobile Control Setup
    setupMobileControls();
    setupEditorUI();
    
    generateRandomMap();
    requestAnimationFrame(loop);
}

function resize() {
    CANVAS.width = window.innerWidth;
    CANVAS.height = window.innerHeight;
}

/**
 * MOBILE CONTROL LOGIC
 */
function setupMobileControls() {
    const joyArea = document.getElementById('joystick-area');
    const joyKnob = document.getElementById('joystick-knob');
    const shootBtn = document.getElementById('shoot-btn');

    // Joystick Logic
    joyArea.addEventListener('touchstart', (e) => {
        e.preventDefault();
        TOUCH_INPUT.active = true;
        updateJoystick(e.touches[0], joyArea, joyKnob);
    }, {passive: false});

    joyArea.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if(TOUCH_INPUT.active) updateJoystick(e.touches[0], joyArea, joyKnob);
    }, {passive: false});

    const resetJoystick = (e) => {
        e.preventDefault();
        TOUCH_INPUT.active = false;
        TOUCH_INPUT.dx = 0;
        TOUCH_INPUT.dy = 0;
        joyKnob.style.transform = `translate(0px, 0px)`;
    };
    
    joyArea.addEventListener('touchend', resetJoystick);
    joyArea.addEventListener('touchcancel', resetJoystick);

    // Shoot Button Logic
    shootBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        TOUCH_INPUT.shooting = true;
        shootBtn.style.background = '#c0392b';
        shootBtn.innerText = "AIM...";
    }, {passive: false});

    const releaseShoot = (e) => {
        e.preventDefault();
        TOUCH_INPUT.shooting = false;
        shootBtn.style.background = 'rgba(231, 76, 60, 0.8)';
        shootBtn.innerText = "FIRE";
    };

    shootBtn.addEventListener('touchend', releaseShoot);
    shootBtn.addEventListener('touchcancel', releaseShoot);
}

function updateJoystick(touch, area, knob) {
    const rect = area.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    let x = touch.clientX - centerX;
    let y = touch.clientY - centerY;
    
    // Calculate Angle
    let angle = Math.atan2(y, x);
    TOUCH_INPUT.angle = angle;

    // Clamp visual knob
    let dist = Math.min(Math.hypot(x, y), rect.width/2 - 25);
    let kx = Math.cos(angle) * dist;
    let ky = Math.sin(angle) * dist;

    knob.style.transform = `translate(${kx}px, ${ky}px)`;
    
    // Normalized input (not fully used yet but good to have)
    TOUCH_INPUT.dx = kx / (rect.width/2);
    TOUCH_INPUT.dy = ky / (rect.height/2);
}


/** * EDITOR UI GENERATION
 */
function setupEditorUI() {
    const ui = document.getElementById('editor-ui');
    ui.innerHTML = '';
    
    // Add Tiles
    for (let id in TILES) {
        if(id == 0) continue; 
        let btn = document.createElement('div');
        btn.className = 'tile-btn';
        if(id == EDITOR_SELECTED_TILE) btn.classList.add('selected');
        
        btn.style.backgroundColor = TILES[id].color;
        // Icon logic
        if(id == 99) btn.innerHTML = `<span style="color:white; font-size:20px; bottom:12px;">✖</span><span>Erase</span>`;
        else btn.innerHTML = `<span>${TILES[id].name}</span>`;
        
        btn.onclick = (e) => {
            e.stopPropagation();
            document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            EDITOR_SELECTED_TILE = parseInt(id);
        };
        ui.appendChild(btn);
    }
}

/** * MAP GENERATION 
 */
function createEmptyMap() {
    MAP = [];
    for(let y=0; y<MAP_HEIGHT; y++) {
        let row = [];
        for(let x=0; x<MAP_WIDTH; x++) row.push(0);
        MAP.push(row);
    }
}

function generateRandomMap() {
    createEmptyMap();
    // Borders
    for(let x=0; x<MAP_WIDTH; x++) { MAP[0][x]=3; MAP[MAP_HEIGHT-1][x]=3; }
    for(let y=0; y<MAP_HEIGHT; y++) { MAP[y][0]=3; MAP[y][MAP_WIDTH-1]=3; }
    
    MAP[2][2] = 1; // Start
    MAP[MAP_HEIGHT-3][MAP_WIDTH-3] = 2; // Hole

    for(let i=0; i<40; i++) {
        let rx = Math.floor(Math.random() * (MAP_WIDTH-2)) + 1;
        let ry = Math.floor(Math.random() * (MAP_HEIGHT-2)) + 1;
        if(MAP[ry][rx] === 0) MAP[ry][rx] = Math.floor(Math.random() * 5) + 3; 
    }
}

/** * PLAYER LOGIC 
 */
class Player {
    constructor(id) {
        this.id = id;
        this.color = ['#e74c3c', '#3498db', '#f1c40f', '#9b59b6'][id % 4];
        this.reset();
        this.strokes = 0;
        this.finished = false;
        this.angle = 0;
        this.power = 0;
        this.charging = false;
        this.powerDir = 1;
    }

    reset() {
        let started = false;
        for(let y=0; y<MAP_HEIGHT; y++){
            for(let x=0; x<MAP_WIDTH; x++){
                if(MAP[y][x] == 1) {
                    this.x = x * TILE_SIZE + TILE_SIZE/2;
                    this.y = y * TILE_SIZE + TILE_SIZE/2;
                    started = true;
                }
            }
        }
        if(!started) { this.x = 100; this.y = 100; }
        this.vx = 0; this.vy = 0; this.z = 0; this.vz = 0;
    }

    update() {
        if (this.finished) return;

        // Physics
        this.x += this.vx;
        this.y += this.vy;

        if (this.z <= 0) {
            let tile = getTileAt(this.x, this.y);
            let friction = FRICTION;
            if(tile.type === 'slow') friction = 0.90;
            if(tile.type === 'slide') friction = 0.995;
            
            this.vx *= friction;
            this.vy *= friction;
            
            if(Math.abs(this.vx) < 0.05 && Math.abs(this.vy) < 0.05) { this.vx = 0; this.vy = 0; }
            if(tile.type === 'hazard') { this.reset(); this.strokes++; }
            if(tile.type === 'boost') { this.vx += tile.dx * 0.5; this.vy += tile.dy * 0.5; }
            if(tile.type === 'jump' && this.vz === 0) this.vz = 4;
            if(tile.type === 'hole') {
                let dist = Math.hypot(this.x - (Math.floor(this.x/TILE_SIZE)*TILE_SIZE+TILE_SIZE/2), 
                                      this.y - (Math.floor(this.y/TILE_SIZE)*TILE_SIZE+TILE_SIZE/2));
                if(dist < 10 && (Math.abs(this.vx) + Math.abs(this.vy)) < 5) {
                    this.finished = true;
                    this.vx = 0; this.vy = 0;
                }
            }
        } else {
            this.vx *= 0.99; this.vy *= 0.99;
        }

        this.z += this.vz;
        if(this.z > 0 || this.vz !== 0) this.vz -= 0.2;
        if(this.z < 0) { this.z = 0; this.vz = 0; }

        if (this.z <= 10) this.handleCollision();
        this.handleInput();
    }

    handleCollision() {
        let checkTile = (x, y) => {
            let t = getTileAt(x, y);
            return (t.type === 'wall');
        };
        let r = 8;
        if(checkTile(this.x + this.vx + (this.vx>0?r:-r), this.y)) this.vx *= -0.8;
        if(checkTile(this.x, this.y + this.vy + (this.vy>0?r:-r))) this.vy *= -0.8;
    }

    handleInput() {
        if (Math.abs(this.vx) > 0.1 || Math.abs(this.vy) > 0.1) return;

        let gp = navigator.getGamepads()[this.id];
        let shootPressed = false;

        // 1. Keyboard
        if(this.id === 0) {
            if(keys['KeyA']) this.angle -= 0.05;
            if(keys['KeyD']) this.angle += 0.05;
            if(keys['Space']) shootPressed = true;
            
            // 2. Touch Input (Mapped to Player 1)
            if(TOUCH_INPUT.active) this.angle = TOUCH_INPUT.angle;
            if(TOUCH_INPUT.shooting) shootPressed = true;
        } 
        else if (this.id === 1) {
            if(keys['ArrowLeft']) this.angle -= 0.05;
            if(keys['ArrowRight']) this.angle += 0.05;
            if(keys['Enter']) shootPressed = true;
        }

        // 3. Gamepad Overrides
        if(gp) {
            if(Math.abs(gp.axes[0]) > 0.2 || Math.abs(gp.axes[1]) > 0.2) 
                this.angle = Math.atan2(gp.axes[1], gp.axes[0]);
            if(gp.buttons[0].pressed) shootPressed = true;
        }

        // Shooting Logic (Charge & Release)
        if(shootPressed) {
            this.charging = true;
            this.power += 0.5 * this.powerDir;
            if(this.power >= MAX_POWER || this.power <= 0) this.powerDir *= -1;
        } else if (this.charging) {
            this.charging = false;
            this.vx = Math.cos(this.angle) * this.power;
            this.vy = Math.sin(this.angle) * this.power;
            this.power = 0;
            this.strokes++;
            this.powerDir = 1;
        }
    }

    draw(ctx, width, height) {
        let camX = Math.max(0, Math.min(this.x - width/2, MAP_WIDTH*TILE_SIZE - width));
        let camY = Math.max(0, Math.min(this.y - height/2, MAP_HEIGHT*TILE_SIZE - height));

        ctx.save();
        ctx.translate(-camX, -camY);

        drawMap(ctx, camX, camY, width, height);

        PLAYERS.forEach(p => { if(p !== this) drawBall(ctx, p, true); });
        drawBall(ctx, this, false);

        if (Math.abs(this.vx) < 0.1 && Math.abs(this.vy) < 0.1 && !this.finished) {
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x + Math.cos(this.angle)*40, this.y + Math.sin(this.angle)*40);
            ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();

            if(this.charging) {
                ctx.fillStyle = 'red';
                ctx.fillRect(this.x - 15, this.y - 25, (this.power/MAX_POWER)*30, 6);
                ctx.strokeStyle = 'white'; ctx.strokeRect(this.x-15, this.y-25, 30, 6);
            }
        }
        ctx.restore();

        // Stats
        ctx.fillStyle = 'white'; ctx.font = 'bold 20px sans-serif'; ctx.strokeStyle = 'black'; ctx.lineWidth = 3;
        ctx.strokeText(`P${this.id+1}: ${this.strokes}`, 20, 30); ctx.fillText(`P${this.id+1}: ${this.strokes}`, 20, 30);
        if(this.finished) { ctx.fillStyle = '#f1c40f'; ctx.fillText("DONE!", width/2 - 30, height/2); }
    }
}

function getTileAt(worldX, worldY) {
    let tx = Math.floor(worldX / TILE_SIZE);
    let ty = Math.floor(worldY / TILE_SIZE);
    if(tx < 0 || tx >= MAP_WIDTH || ty < 0 || ty >= MAP_HEIGHT) return { type: 'wall' };
    return TILES[MAP[ty][tx]] || TILES[0];
}

function drawBall(ctx, p, isGhost) {
    ctx.beginPath();
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.arc(p.x, p.y + 4, 6, 0, Math.PI*2); ctx.fill(); // Shadow
    
    ctx.beginPath();
    ctx.arc(p.x, p.y - p.z, 7, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    if(isGhost) ctx.globalAlpha = 0.5;
    ctx.fill();
    ctx.globalAlpha = 1.0;
    ctx.lineWidth = 1; ctx.strokeStyle = '#000'; ctx.stroke();
}

function drawMap(ctx, cx, cy, w, h) {
    let startX = Math.floor(cx / TILE_SIZE);
    let startY = Math.floor(cy / TILE_SIZE);
    let endX = startX + (w / TILE_SIZE) + 1;
    let endY = startY + (h / TILE_SIZE) + 1;

    for(let y = startY; y <= endY; y++) {
        for(let x = startX; x <= endX; x++) {
            if(y < 0 || y >= MAP_HEIGHT || x < 0 || x >= MAP_WIDTH) continue;
            let tid = MAP[y][x];
            let t = TILES[tid] || TILES[0];
            let px = x * TILE_SIZE, py = y * TILE_SIZE;

            ctx.fillStyle = (tid === 0) ? '#27ae60' : t.color;
            ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
            ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);

            if(tid === 2) { ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(px+20, py+20, 10, 0, 7); ctx.fill(); }
            if(t.type === 'boost') { ctx.fillStyle = 'white'; ctx.fillText(">>>", px+8, py+25); }
            if(t.type === 'jump') { ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(px+20, py+20, 8, 0, 7); ctx.fill(); }
            if(tid === 3) { ctx.fillStyle = '#555'; ctx.fillRect(px+5, py+5, 30, 30); }
        }
    }
}

/** * GAME LOOP 
 */
let keys = {};
function handleKey(e) { keys[e.code] = true; if(e.key === 'Escape') togglePause(); }
function handleKeyUp(e) { keys[e.code] = false; }

function loop() {
    CTX.fillStyle = '#111';
    CTX.fillRect(0, 0, CANVAS.width, CANVAS.height);

    if(STATE === 'PLAY') {
        PLAYERS.forEach(p => p.update());
        
        let count = PLAYERS.length;
        let w = CANVAS.width, h = CANVAS.height;

        if (count === 1) renderView(0, 0, 0, w, h);
        else if (count === 2) {
            renderView(0, 0, 0, w/2, h);
            renderView(1, w/2, 0, w/2, h);
            CTX.fillStyle = '#000'; CTX.fillRect(w/2 - 2, 0, 4, h);
        } 
        else {
            let hw = w/2, hh = h/2;
            renderView(0, 0, 0, hw, hh); renderView(1, hw, 0, hw, hh);
            if(PLAYERS[2]) renderView(2, 0, hh, hw, hh);
            if(PLAYERS[3]) renderView(3, hw, hh, hw, hh);
            CTX.fillStyle = '#000'; CTX.fillRect(hw-2, 0, 4, h); CTX.fillRect(0, hh-2, w, 4);
        }
    } else if (STATE === 'EDITOR') {
        renderEditor();
    }
    requestAnimationFrame(loop);
}

function renderView(pid, x, y, w, h) {
    CTX.save();
    CTX.beginPath(); CTX.rect(x, y, w, h); CTX.clip();
    CTX.translate(x, y);
    CTX.fillStyle = '#27ae60'; CTX.fillRect(0, 0, w, h);
    PLAYERS[pid].draw(CTX, w, h);
    CTX.strokeStyle = PLAYERS[pid].color; CTX.lineWidth = 4; CTX.strokeRect(0,0,w,h);
    CTX.restore();
}

/** * STATE MANAGEMENT 
 */
function startGame() {
    let count = parseInt(document.getElementById('player-count').value);
    PLAYERS = [];
    for(let i=0; i<count; i++) PLAYERS.push(new Player(i));
    document.getElementById('ui-layer').style.display = 'none';
    document.getElementById('editor-ui').style.display = 'none';
    document.body.classList.add('playing');
    STATE = 'PLAY';
}

function openEditor() {
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('editor-ui').style.display = 'block';
    STATE = 'EDITOR';
}

function exitToMenu() {
    STATE = 'MENU';
    document.getElementById('ui-layer').style.display = 'flex';
    document.getElementById('main-menu').style.display = 'block';
    document.getElementById('pause-menu').style.display = 'none';
    document.getElementById('editor-ui').style.display = 'none';
    document.body.classList.remove('playing');
}

function togglePause() {
    if(STATE === 'PLAY') {
        STATE = 'PAUSED';
        document.getElementById('ui-layer').style.display = 'flex';
        document.getElementById('pause-menu').style.display = 'block';
        document.body.classList.remove('playing');
    }
}

function resumeGame() {
    STATE = 'PLAY';
    document.getElementById('ui-layer').style.display = 'none';
    document.body.classList.add('playing');
}

/** * EDITOR LOGIC 
 */
let isDragging = false;
let dragButton = 0; // 0 left, 2 right

function renderEditor() {
    CTX.fillStyle = '#111'; CTX.fillRect(0,0,CANVAS.width, CANVAS.height);
    let mapWpx = MAP_WIDTH * TILE_SIZE, mapHpx = MAP_HEIGHT * TILE_SIZE;
    let ox = (CANVAS.width - mapWpx)/2, oy = (CANVAS.height - mapHpx)/2;

    CTX.save();
    CTX.translate(ox, oy);
    drawMap(CTX, 0, 0, mapWpx, mapHpx);
    
    // Grid
    CTX.strokeStyle = '#333'; CTX.lineWidth = 1;
    for(let y=0; y<=MAP_HEIGHT; y++) { CTX.beginPath(); CTX.moveTo(0, y*TILE_SIZE); CTX.lineTo(mapWpx, y*TILE_SIZE); CTX.stroke(); }
    for(let x=0; x<=MAP_WIDTH; x++) { CTX.beginPath(); CTX.moveTo(x*TILE_SIZE, 0); CTX.lineTo(x*TILE_SIZE, mapHpx); CTX.stroke(); }
    CTX.restore();
}

function handleMouse(e) {
    if(STATE !== 'EDITOR' || e.target.closest('.panel')) return;
    isDragging = true;
    dragButton = e.button;
    editMap(e.clientX, e.clientY);
}

function handleMouseMove(e) {
    if(STATE === 'EDITOR' && isDragging) editMap(e.clientX, e.clientY);
}

function editMap(cx, cy) {
    let mapWpx = MAP_WIDTH * TILE_SIZE, mapHpx = MAP_HEIGHT * TILE_SIZE;
    let ox = (CANVAS.width - mapWpx)/2, oy = (CANVAS.height - mapHpx)/2;
    let tx = Math.floor((cx - ox)/TILE_SIZE);
    let ty = Math.floor((cy - oy)/TILE_SIZE);

    if(tx>=0 && tx<MAP_WIDTH && ty>=0 && ty<MAP_HEIGHT) {
        if(EDITOR_SELECTED_TILE === 99) MAP[ty][tx] = 0; // Eraser
        else if(dragButton === 0) MAP[ty][tx] = EDITOR_SELECTED_TILE;
        else if(dragButton === 2) MAP[ty][tx] = 0;
    }
}

init();
</script>
