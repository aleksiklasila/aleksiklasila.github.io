<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Darts Scorer Pro</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent: #00e676;
            --accent-dim: #00a856;
            --danger: #cf6679;
            --dart-flight: #ff4081;
            --dart-shaft: #eee;
            --dart-barrel: #333;
            --dart-tip: #aaa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            height: 100vh; height: 100dvh;
            overflow: hidden; touch-action: none; user-select: none;
        }

        /* --- Header --- */
        header {
            flex: 0 0 auto; padding: 5px 15px; background: var(--card-bg);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #333; height: 44px;
            padding-top: max(5px, env(safe-area-inset-top)); z-index: 100;
        }
        h1 { margin: 0; font-size: 1.1rem; letter-spacing: 0.5px; }
        button {
            background: var(--accent); color: #000; border: none; padding: 6px 14px;
            border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.85rem;
        }
        button.danger { background: var(--danger); color: white; }

        /* --- Scoreboard --- */
        #scoreboard {
            flex: 0 0 90px; display: flex; overflow-x: auto; background: #000;
            padding: 8px; gap: 8px; border-bottom: 1px solid #333; scroll-snap-type: x mandatory;
        }
        .player-column {
            min-width: 100px; flex: 1; background: var(--card-bg); border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 2px solid transparent; scroll-snap-align: center; padding: 5px; position: relative;
        }
        .player-column.active { border-color: var(--accent); background: #252525; box-shadow: 0 0 15px rgba(0, 230, 118, 0.1); }
        .player-column.finished { opacity: 0.6; border-color: gold; }
        .player-name { font-size: 0.85rem; font-weight: 600; color: #aaa; margin-bottom: 2px; }
        .current-score { font-size: 2.2rem; font-weight: 800; color: white; line-height: 1; letter-spacing: -1px; }
        .projected-row { margin-top: 4px; font-size: 0.75rem; color: #777; display: flex; justify-content: center; gap: 4px; }
        .next-score { color: var(--accent); font-weight: bold; }
        .next-score.bust { color: var(--danger); text-decoration: line-through; }

        /* --- View Slider --- */
        #view-slider {
            flex: 1; display: flex; overflow-x: auto; overflow-y: hidden;
            scroll-snap-type: x mandatory; scroll-behavior: smooth;
            width: 100%; background: #121212; position: relative;
            -webkit-overflow-scrolling: touch; /* Smooth scroll iOS */
        }
        .view-section {
            flex: 0 0 100%; width: 100%; height: 100%;
            scroll-snap-align: start; position: relative; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* --- View 1: Board --- */
        #board-content-wrapper {
            flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #222 0%, #121212 70%);
        }
        #dartboard-container {
            width: 90%; max-width: 420px; aspect-ratio: 1/1; position: relative;
            filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.6));
        }
        svg { width: 100%; height: 100%; }
        .view-footer {
            flex: 0 0 auto; background: var(--card-bg); width: 100%;
            border-top: 1px solid #333; padding: 10px 15px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            display: flex; flex-direction: column; gap: 10px; box-sizing: border-box;
        }

        /* --- View 2: Grid --- */
        #grid-content-wrapper { flex: 1; display: flex; flex-direction: column; background: #121212; padding: 10px; }
        
        /* Grid Tab Bar */
        #grid-tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .grid-tab {
            flex: 1; background: #252525; padding: 10px; border-radius: 8px;
            text-align: center; border: 1px solid #333; cursor: pointer; transition: 0.2s;
        }
        .grid-tab.active { background: var(--accent-dim); border-color: var(--accent); color: white; }
        .grid-tab-label { font-size: 0.75rem; font-weight: bold; color: #aaa; display: block; margin-bottom: 2px;}
        .grid-tab.active .grid-tab-label { color: rgba(255,255,255,0.8); }
        .grid-tab-val { font-size: 1.1rem; font-weight: 800; color: white; }

        /* Grid Body */
        #grid-body-container { flex: 1; overflow-y: auto; background: #181818; border-radius: 8px; padding: 5px; position: relative;}
        .grid-page { display: none; height: 100%; overflow-y: auto; }
        .grid-page.active { display: block; }
        
        .grid-matrix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding-bottom: 20px; }
        .g-btn {
            padding: 12px 2px; text-align: center; background: #333; border-radius: 4px;
            font-size: 0.9rem; font-weight: bold; color: #ddd; cursor: pointer;
            border: 1px solid #444; user-select: none;
        }
        .g-btn:active { background: #555; transform: scale(0.98); }
        .g-single { background: #222; }
        .g-double { background: #388e3c; color: white; border-color: #388e3c; }
        .g-triple { background: #d32f2f; color: white; border-color: #d32f2f; }
        .g-bull { grid-column: span 3; background: #d32f2f; color: white; margin-top: 5px; }
        .g-miss { grid-column: span 3; background: #333; color: #888; margin-top: 5px; }

        #grid-footer {
            flex: 0 0 auto; background: var(--card-bg); border-top: 1px solid #333;
            padding: 10px 15px; padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }

        /* --- Darts --- */
        #dart-dock {
            display: flex; justify-content: center; gap: 30px;
            background: rgba(0,0,0,0.3); border-radius: 12px; height: 100px;
            border: 2px dashed #333; position: relative; align-items: flex-end; padding-bottom: 10px;
        }
        .dart-obj {
            width: 40px; height: 120px; position: absolute; z-index: 1000;
            cursor: grab; filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.5));
            touch-action: none; transform-origin: 50% 95%;
            transition: opacity 0.2s; /* Fade out for grid view */
        }
        .dart-obj.hidden-in-grid { display: none !important; }

        .dart-badge {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            font-size: 11px; font-weight: 900; color: white; text-shadow: 0 1px 3px black;
            pointer-events: none; white-space: nowrap;
        }

        /* --- Magnifier --- */
        #magnifier {
            position: absolute; top: 15px; right: 15px; width: 120px; height: 120px;
            border: 3px solid var(--accent); border-radius: 50%; background: #000;
            overflow: hidden; display: none; z-index: 500; pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.9);
        }
        .magnifier-crosshair {
            position: absolute; top: 50%; left: 50%; width: 8px; height: 8px;
            background: transparent; border: 2px solid rgba(255, 255, 0, 0.8); border-radius: 50%;
            transform: translate(-50%, -50%); z-index: 502;
        }
        #magnifier-score {
            position: absolute; bottom: 10px; width: 100%; text-align: center;
            font-weight: 900; color: yellow; text-shadow: 0px 2px 4px rgba(0,0,0,1);
            z-index: 502; font-size: 1.5rem;
        }

        .action-btn {
            width: 100%; padding: 14px; font-size: 1.1rem; border-radius: 8px;
            background: #333; color: #777; pointer-events: none; border: none; font-weight: bold;
        }
        .action-btn.ready {
            background: var(--accent); color: #000; pointer-events: auto;
            box-shadow: 0 4px 12px rgba(0, 230, 118, 0.3);
        }

        /* --- Indicators & Tutorials --- */
        #swipe-indicator {
            position: absolute; bottom: 150px; left: 0; width: 100%;
            display: flex; justify-content: center; gap: 8px; pointer-events: none; z-index: 50;
        }
        .dot { width: 8px; height: 8px; background: #555; border-radius: 50%; transition: background 0.3s; }
        .dot.active { background: var(--accent); }

        .tutorial-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1500; display: none; justify-content: center; align-items: center;
        }
        .tut-text {
            position: absolute; width: 100%; text-align: center; color: white; 
            font-weight: bold; font-size: 1.4rem; text-shadow: 0 3px 6px black;
        }
        /* Hand Animations */
        #tut-drag .hand-icon { position: absolute; bottom: 250px; left: 50%; margin-left: -30px; width: 60px; height: 60px; filter: drop-shadow(0 0 10px black); animation: dragAnim 2s infinite ease-in-out; opacity: 0; }
        @keyframes dragAnim { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: 1; transform: translate(0, 0); } 60% { transform: translate(0, -200px); opacity: 1; } 80% { opacity: 0; } 100% { opacity: 0; } }
        #tut-swipe .hand-icon { position: absolute; bottom: 300px; right: 20%; width: 60px; height: 60px; filter: drop-shadow(0 0 10px black); animation: swipeAnim 2s infinite ease-in-out; opacity: 0; transform: rotate(-30deg); }
        @keyframes swipeAnim { 0% { right: 20%; opacity: 0; } 20% { opacity: 1; } 60% { right: 70%; opacity: 1; } 80% { opacity: 0; } 100% { opacity: 0; } }

        /* Modal */
        #setup-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: #222; padding: 25px; border-radius: 16px; width: 85%; max-width: 380px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 12px; background: #111; border: 1px solid #444; color: white; border-radius: 8px; margin-bottom: 12px; font-size: 1rem; box-sizing: border-box; }
        .tag-container { display: flex; flex-wrap: wrap; margin-bottom: 15px; gap: 8px; min-height: 30px;}
        .player-tag { background: #333; padding: 6px 12px; border-radius: 20px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; border: 1px solid #444; }

    </style>
</head>
<body>

<div id="setup-modal">
    <div class="modal-content">
        <h2 id="modal-title" style="margin-top:0">New Game</h2>
        <input type="text" id="new-player-input" placeholder="Player Name" maxlength="10">
        <button onclick="addPlayer()" style="width:100%; margin-bottom:15px; background: #444; color:white; border:none; padding:10px; border-radius:6px;">Add Player</button>
        <div class="tag-container" id="player-list-display"></div>
        <div style="border-top: 1px solid #333; padding-top: 15px;">
             <label style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; font-size: 0.9rem; color:#ccc;">
                Starting Score
                <select id="start-score-select" style="background:#111; color:white; border:1px solid #444; padding:5px; border-radius:4px;">
                    <option value="301">301</option>
                    <option value="501" selected>501</option>
                    <option value="701">701</option>
                </select>
            </label>
            <button onclick="startGame()" style="width:100%; padding: 12px; font-size:1rem;">Start Game</button>
        </div>
    </div>
</div>

<header>
    <h1 id="app-title">Darts Scorer Pro</h1>
    <button onclick="resetGame()" class="danger">Reset</button>
</header>

<div id="scoreboard"></div>

<div id="view-slider">
    
    <div class="view-section" id="section-visual">
        <div id="board-content-wrapper">
            <div id="magnifier">
                <div class="magnifier-crosshair"></div>
                <div id="magnifier-score"></div>
            </div>
            <div id="dartboard-container"></div>
            
            <div id="tut-drag" class="tutorial-overlay">
                <div class="tut-text" style="bottom: 320px;">Drag to Throw</div>
                <svg class="hand-icon" viewBox="0 0 24 24" fill="white"><path d="M21,14a1,1,0,0,0-1-1h-2V6a3,3,0,0,0-6,0V11H11V4a3,3,0,0,0-6,0v9a6,6,0,0,0,6,6h4.16l4.4,2.2a1,1,0,0,0,1.44-0.9Z"/></svg>
            </div>
            <div id="tut-swipe" class="tutorial-overlay">
                <div class="tut-text" style="bottom: 370px;">Swipe for Grid</div>
                <svg class="hand-icon" viewBox="0 0 24 24" fill="white"><path d="M21,14a1,1,0,0,0-1-1h-2V6a3,3,0,0,0-6,0V11H11V4a3,3,0,0,0-6,0v9a6,6,0,0,0,6,6h4.16l4.4,2.2a1,1,0,0,0,1.44-0.9Z"/></svg>
            </div>
        </div>
        
        <div class="view-footer">
            <div id="dart-dock"></div>
            <button onclick="manualNext()" class="action-btn" id="btn-next-board">Next Player</button>
        </div>
    </div>

    <div class="view-section" id="section-grid">
        <div id="grid-content-wrapper">
            <div id="grid-tabs">
                <div class="grid-tab active" onclick="switchGridTab(0)" id="tab-0"><span class="grid-tab-label">Dart 1</span><span class="grid-tab-val" id="grid-val-0">-</span></div>
                <div class="grid-tab" onclick="switchGridTab(1)" id="tab-1"><span class="grid-tab-label">Dart 2</span><span class="grid-tab-val" id="grid-val-1">-</span></div>
                <div class="grid-tab" onclick="switchGridTab(2)" id="tab-2"><span class="grid-tab-label">Dart 3</span><span class="grid-tab-val" id="grid-val-2">-</span></div>
            </div>
            
            <div id="grid-body-container"></div>
        </div>
        
        <div id="grid-footer">
            <button onclick="manualNext()" class="action-btn" id="btn-next-grid">Next Player</button>
        </div>
    </div>

</div>

<div id="swipe-indicator">
    <div class="dot active" id="dot-0"></div>
    <div class="dot" id="dot-1"></div>
</div>

<script>
    const i18n = {
        en: { next: "Rem: ", bust: "BUST", btnNext: "Next Player", btnWin: "WINNER!", win: "Wins!", confirm: "End current game?", miss: "Miss" },
        fi: { next: "Jäljellä: ", bust: "YLILYÖNTI", btnNext: "Seuraava", btnWin: "VOITTAJA!", win: "Voitti!", confirm: "Lopeta peli?", miss: "Ohi" }
    };
    const userLang = navigator.language.startsWith('fi') ? 'fi' : 'en';
    const txt = i18n[userLang];

    let players = [];
    let currentPlayerIndex = 0;
    let gameActive = false;
    let dartState = [ {val:0, mult:1, missed:false}, {val:0, mult:1, missed:false}, {val:0, mult:1, missed:false} ];
    let tutorialState = { dragShown: true, swipeShown: true };
    let currentGridTab = 0;

    const boardNumbers = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];

    function getBoardCoordinates(score, mult) {
        if(score === 0) return {x: 230, y: 230}; // Just off board
        if(score === 25) return {x:0, y:0, r: 25};
        if(score === 50) return {x:0, y:0, r: 0};
        const numberIndex = boardNumbers.indexOf(score);
        const angleDeg = numberIndex * 18;
        const angleRad = (angleDeg - 90) * (Math.PI / 180);
        let r = 0;
        if(mult === 3) r = 104;
        else if(mult === 2) r = 167;
        else r = 135;
        const jitterX = (Math.random() - 0.5) * 8;
        const jitterY = (Math.random() - 0.5) * 8;
        return {x: (r * Math.cos(angleRad)) + jitterX, y: (r * Math.sin(angleRad)) + jitterY};
    }

    function formatScore(val, mult, style) {
        const total = val * mult;
        if (val === 0) {
            if(style === 'badge') return '0';
            if(style === 'grid') return `${txt.miss.toUpperCase()}`;
            return `${txt.miss} (0)`;
        }
        if(val === 25 || val === 50) {
            const lbl = val === 50 ? "BULL" : "25";
            if(style === 'badge') return total.toString();
            return lbl;
        }
        if(style === 'badge') return total.toString();
        if(style === 'grid') return mult === 1 ? val.toString() : `${mult}x${val}`;
        if(style === 'full') return mult === 1 ? total.toString() : `${total} (${mult}x${val})`;
        return total.toString();
    }

    const NS = "http://www.w3.org/2000/svg";

    function createDartSVG(id, number) {
        const div = document.createElement('div');
        div.className = 'dart-obj'; div.id = id;
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("viewBox", "0 0 40 120");
        svg.style.pointerEvents = "none";
        const flight = document.createElementNS(NS, "path");
        flight.setAttribute("d", "M10,0 L30,0 L25,30 L15,30 Z"); flight.setAttribute("fill", "var(--dart-flight)"); svg.appendChild(flight);
        const shaft = document.createElementNS(NS, "rect");
        shaft.setAttribute("x", "18"); shaft.setAttribute("y", "30"); shaft.setAttribute("width", "4"); shaft.setAttribute("height", "40"); shaft.setAttribute("fill", "var(--dart-shaft)"); svg.appendChild(shaft);
        const barrel = document.createElementNS(NS, "path");
        barrel.setAttribute("d", "M16,70 L24,70 L23,100 L17,100 Z"); barrel.setAttribute("fill", "var(--dart-barrel)"); svg.appendChild(barrel);
        const tip = document.createElementNS(NS, "path");
        tip.setAttribute("d", "M19,100 L21,100 L20,120 Z"); tip.setAttribute("fill", "var(--dart-tip)"); svg.appendChild(tip);
        div.appendChild(svg);
        const badge = document.createElement('div'); 
        badge.className = 'dart-badge'; badge.id = `badge-${id}`; badge.innerText = number;
        div.appendChild(badge);
        return div;
    }

    function createBoardSVG() {
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("viewBox", "-205 -205 410 410");
        const numbers = boardNumbers;
        for (let i=0; i<20; i++) {
            const rot = (i*18)-9;
            const g = document.createElementNS(NS, "g");
            g.setAttribute("transform", `rotate(${rot})`);
            const c1 = i%2===0?"#121212":"#e0e0e0"; const c2 = i%2===0?"#d32f2f":"#388e3c";
            const seg = (r1,r2,m,c) => {
                const p = document.createElementNS(NS,"path");
                const rad = Math.PI/180, a=9*rad;
                const x1=r1*Math.sin(-a), y1=-r1*Math.cos(-a); const x2=r1*Math.sin(a), y2=-r1*Math.cos(a);
                const x3=r2*Math.sin(a), y3=-r2*Math.cos(a); const x4=r2*Math.sin(-a), y4=-r2*Math.cos(-a);
                p.setAttribute("d", `M${x1},${y1} L${x4},${y4} A${r2},${r2} 0 0 1 ${x3},${y3} L${x2},${y2} A${r1},${r1} 0 0 0 ${x1},${y1} Z`);
                p.setAttribute("fill", c); p.setAttribute("stroke", "#666"); p.setAttribute("stroke-width", "1");
                p.setAttribute("class", "board-segment"); p.setAttribute("data-s", numbers[i]); p.setAttribute("data-m", m);
                return p;
            };
            g.appendChild(seg(109,162,1,c1)); g.appendChild(seg(162,172,2,c2));
            g.appendChild(seg(32,99,1,c1)); g.appendChild(seg(99,109,3,c2));
            const txt = document.createElementNS(NS,"text");
            txt.setAttribute("x",0); txt.setAttribute("y",-182); txt.setAttribute("text-anchor","middle");
            txt.setAttribute("fill","white"); txt.setAttribute("font-size", "22"); txt.setAttribute("font-weight","bold");
            txt.setAttribute("transform", `rotate(${-rot} 0 -182)`); txt.textContent = numbers[i];
            txt.style.pointerEvents="none"; g.appendChild(txt);
            svg.appendChild(g);
        }
        const bull = (r,s,c) => {
            const crc = document.createElementNS(NS,"circle");
            crc.setAttribute("r",r); crc.setAttribute("fill",c); crc.setAttribute("stroke","#666");
            crc.setAttribute("class", "board-segment"); crc.setAttribute("data-s", s); crc.setAttribute("data-m", 1);
            return crc;
        };
        svg.appendChild(bull(31.8, 25, "#388e3c")); svg.appendChild(bull(12.7, 50, "#d32f2f"));
        return svg;
    }

    function init() {
        document.getElementById('dartboard-container').appendChild(createBoardSVG().cloneNode(true)).id = "main-svg";
        const magWrap = document.getElementById('magnifier');
        magWrap.insertBefore(createBoardSVG().cloneNode(true), magWrap.firstChild).id = "mag-svg";

        const dock = document.getElementById('dart-dock');
        [1,2,3].forEach(i => dock.appendChild(createDartSVG(`dart-${i}`, i)));

        document.getElementById('btn-next-board').innerText = txt.btnNext;
        document.getElementById('btn-next-grid').innerText = txt.btnNext;
        document.getElementById('new-player-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter') addPlayer(); });

        setupDragAndDrop();
        setupSwipeObserver();
        buildGridInterface();
    }

    // --- GRID INTERFACE ---
    function buildGridInterface() {
        const container = document.getElementById('grid-body-container');
        container.innerHTML = '';
        
        [0, 1, 2].forEach(dartIdx => {
            const page = document.createElement('div');
            page.className = 'grid-page';
            page.id = `grid-page-${dartIdx}`;
            
            const grid = document.createElement('div');
            grid.className = 'grid-matrix';
            
            for(let i=20; i>=1; i--) {
                grid.innerHTML += `
                    <div class="g-btn g-single" onclick="gridInput(${dartIdx}, ${i}, 1)">${formatScore(i,1,'grid')}</div>
                    <div class="g-btn g-double" onclick="gridInput(${dartIdx}, ${i}, 2)">${formatScore(i,2,'grid')}</div>
                    <div class="g-btn g-triple" onclick="gridInput(${dartIdx}, ${i}, 3)">${formatScore(i,3,'grid')}</div>
                `;
            }
            grid.innerHTML += `
                <div class="g-btn g-bull" onclick="gridInput(${dartIdx}, 50, 1)">BULL</div>
                <div class="g-btn g-bull" onclick="gridInput(${dartIdx}, 25, 1)">25</div>
                <div class="g-btn g-miss" onclick="gridInput(${dartIdx}, 0, 1)">${txt.miss.toUpperCase()}</div>
            `;
            page.appendChild(grid);
            container.appendChild(page);
        });
        switchGridTab(0);
    }

    function switchGridTab(idx) {
        currentGridTab = idx;
        // Update Tabs
        [0,1,2].forEach(i => {
            document.getElementById(`tab-${i}`).classList.toggle('active', i===idx);
            document.getElementById(`grid-page-${i}`).classList.toggle('active', i===idx);
        });
    }

    function gridInput(dartIdx, score, mult) {
        if(!gameActive) return;
        
        // Disable Drag Tutorial if grid used
        if(tutorialState.dragShown) {
            document.getElementById('tut-drag').style.display = 'none';
            tutorialState.dragShown = false;
        }

        // Logic
        dartState[dartIdx] = { val: score, mult: mult, missed: (score===0) };
        moveDartToBoardLocation(dartIdx, score, mult);
        updateDartVisuals(dartIdx, score, mult);
        updateGameState();
        
        // Auto Advance Tab
        if(dartIdx < 2) switchGridTab(dartIdx + 1);
    }

    function moveDartToBoardLocation(dartIdx, score, mult) {
        const d = document.getElementById(`dart-${dartIdx+1}`);
        const container = document.getElementById('dartboard-container');
        const rect = container.getBoundingClientRect();
        
        const coords = getBoardCoordinates(score, mult);
        
        // If the board is currently hidden (we are in grid view), rect dimensions might be weird or off-screen.
        // We need to calculate based on the 'virtual' board position in the other slide.
        // However, since we are moving the ABSOLUTE position of the dart, 
        // we need to know where the board WILL BE when we swipe back.
        // The board is centered in #board-content-wrapper.
        
        // Since board size is relative (90% width max 420px), we re-calc width
        const sliderWidth = document.getElementById('view-slider').offsetWidth;
        const boardWidth = Math.min(sliderWidth * 0.9, 420);
        // Center of board in visual view:
        const boardCenterX = sliderWidth / 2; // Center of first slide
        
        // Vertical center: The board wrapper takes up the flex space.
        // Approx center based on header height. 
        // Safer way: Get the boardRect regardless of scroll.
        // But since we are likely scrolled to grid, the board is off screen left.
        
        // Simple Fix: We set top/left relative to the Container's offsetParent, 
        // but since dart is fixed, we need screen coordinates.
        // Let's assume standard layout.
        
        // BETTER FIX: The dart is hidden in grid view. We set its style.top/left
        // such that when it becomes visible in board view, it's correct.
        // The easiest way is to use calculation based on board width and center it relative to the board container's offset.
        
        const scale = boardWidth / 410;
        
        // We need to find the board's bounding rect relative to the viewport IF it were visible.
        // Since we are in horizontal scroll, the board is at scrollLeft 0.
        // The Grid is at scrollLeft = width.
        // If we are currently at Grid, the Board is at left = -width.
        // BUT, Fixed positioning disregards scroll. 
        
        // So, we just need the Board's position relative to the screen when Scrolled to 0.
        // Board Center X = Screen Width / 2.
        // Board Center Y: Let's grab the board container vertical position.
        const boardContainer = document.getElementById('dartboard-container');
        const boardRect = boardContainer.getBoundingClientRect(); 
        // Note: top/height are usually correct even if scrolled off horizontally. Left is wrong.
        
        const trueBoardCenterX = window.innerWidth / 2; 
        const trueBoardCenterY = boardRect.top + (boardRect.height/2);

        const pixelX = (coords.x * scale) + trueBoardCenterX;
        const pixelY = (coords.y * scale) + trueBoardCenterY;

        d.style.left = (pixelX - 20) + 'px'; 
        d.style.top = (pixelY - 120) + 'px';
        d.style.transform = 'scale(0.8) rotate(0deg)';
        d.style.zIndex = 1000 + dartIdx;
    }

    function updateDartVisuals(idx, score, mult) {
        document.getElementById(`grid-val-${idx}`).innerText = formatScore(score, mult, 'badge');
        const badge = document.getElementById(`badge-dart-${idx+1}`);
        if(badge) badge.innerText = formatScore(score, mult, 'badge');
    }

    // --- VIEW / SWIPE ---
    function setupSwipeObserver() {
        const slider = document.getElementById('view-slider');
        const dots = [document.getElementById('dot-0'), document.getElementById('dot-1')];
        slider.addEventListener('scroll', () => {
            const index = Math.round(slider.scrollLeft / slider.offsetWidth);
            dots.forEach((d, i) => d.classList.toggle('active', i===index));
            
            // Toggle Dart Visibility based on View
            const darts = document.querySelectorAll('.dart-obj');
            darts.forEach(d => {
                if(index === 1) d.classList.add('hidden-in-grid'); // Grid View
                else d.classList.remove('hidden-in-grid'); // Board View
            });

            if(index > 0 && tutorialState.swipeShown) {
                document.getElementById('tut-swipe').style.display = 'none';
                tutorialState.swipeShown = false;
            }
        });
    }

    // --- DRAG ---
    function setupDragAndDrop() {
        const darts = [1,2,3].map(i => document.getElementById(`dart-${i}`));
        const magnifier = document.getElementById('magnifier');
        const magSVG = document.getElementById('mag-svg');
        const magScore = document.getElementById('magnifier-score');
        const mainSVG = document.getElementById('main-svg');

        darts.forEach((dart, idx) => {
            const onStart = (e) => {
                if(!gameActive) return;
                // Prevent drag if scrolled to grid
                if(document.getElementById('view-slider').scrollLeft > 100) return;

                if(tutorialState.dragShown) {
                    document.getElementById('tut-drag').style.display = 'none';
                    tutorialState.dragShown = false;
                    if(tutorialState.swipeShown) document.getElementById('tut-swipe').style.display = 'flex';
                }

                e.preventDefault();
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;

                dart.style.position = 'fixed'; dart.style.zIndex = 9999; dart.style.transition = 'none';
                dart.style.transform = 'scale(1.2) rotate(-10deg)'; 
                darts.forEach(d => d.style.pointerEvents = 'none');
                magnifier.style.display = 'block';

                const updatePos = (mx, my) => {
                    dart.style.left = (mx - 20) + 'px'; dart.style.top = (my - 120) + 'px';
                    const hit = document.elementFromPoint(mx, my);
                    if(hit && hit.classList.contains('board-segment')) {
                        const pt = mainSVG.createSVGPoint(); pt.x = mx; pt.y = my;
                        const svgP = pt.matrixTransform(mainSVG.getScreenCTM().inverse());
                        magSVG.setAttribute("viewBox", `${svgP.x - 20} ${svgP.y - 20} 40 40`);
                        const s = parseInt(hit.getAttribute('data-s')), m = parseInt(hit.getAttribute('data-m'));
                        magScore.innerText = formatScore(s, m, 'full');
                        magScore.style.color = (m===3?'#00e676':(m===2?'#ff4081':'white'));
                    } else {
                        magScore.innerText = txt.miss; magScore.style.color = '#aaa';
                        magSVG.setAttribute("viewBox", "-205 -205 410 410");
                    }
                };
                updatePos(cx, cy);

                const onMove = (em) => { em.preventDefault(); updatePos(em.touches?em.touches[0].clientX:em.clientX, em.touches?em.touches[0].clientY:em.clientY); };
                const onEnd = (ee) => {
                    document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onEnd);
                    document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onEnd);
                    magnifier.style.display = 'none';
                    const mx = ee.changedTouches?ee.changedTouches[0].clientX:ee.clientX;
                    const my = ee.changedTouches?ee.changedTouches[0].clientY:ee.clientY;
                    
                    dart.hidden = true; let el = document.elementFromPoint(mx, my); dart.hidden = false;
                    darts.forEach(d => d.style.pointerEvents = 'auto');

                    if(el && el.classList.contains('board-segment')) {
                        const s = parseInt(el.getAttribute('data-s')), m = parseInt(el.getAttribute('data-m'));
                        dart.style.transition = 'transform 0.1s ease-out'; dart.style.transform = 'scale(0.8) rotate(0deg)';
                        dart.style.left = (mx - 20) + 'px'; dart.style.top = (my - 120) + 'px';
                        dartState[idx] = { val: s, mult: m, missed: false };
                        updateDartVisuals(idx, s, m);
                        updateGameState();
                    } else {
                        resetSingleDart(idx); 
                        dartState[idx] = { val: 0, mult: 1, missed: true };
                        updateDartVisuals(idx, 0, 1);
                        updateGameState();
                    }
                };
                document.addEventListener('touchmove', onMove, {passive:false}); document.addEventListener('touchend', onEnd);
                document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onEnd);
            };
            dart.addEventListener('touchstart', onStart, {passive:false}); dart.addEventListener('mousedown', onStart);
        });
    }

    // --- GAME LOGIC ---
    function updateGameState() {
        const p = players[currentPlayerIndex];
        const res = calculateScore(p.score);
        const projEl = document.getElementById(`proj-score-${currentPlayerIndex}`);
        if(projEl) {
            if(res.isBust) projEl.innerHTML = `<span class="next-score bust">${txt.bust}</span>`;
            else if(res.isWin) projEl.innerHTML = `<span class="next-score" style="color:gold">${txt.win}</span>`;
            else {
                let w = (res.rem <= 1 && res.rem !== 0) ? `(${txt.bust})` : '';
                projEl.innerHTML = `<span>${txt.next}</span> <span class="next-score">${res.rem} ${w}</span>`;
            }
        }
        
        const thrown = dartState.filter(d => d.val > 0 || d.missed).length;
        const btnB = document.getElementById('btn-next-board');
        const btnG = document.getElementById('btn-next-grid');
        
        if(thrown === 3 || res.isWin || res.isBust) {
            btnB.classList.add('ready'); btnG.classList.add('ready');
            if(res.isWin) setTimeout(manualNext, 1000);
        } else {
            btnB.classList.remove('ready'); btnG.classList.remove('ready');
        }
    }

    function calculateScore(currentScore) {
        let temp = currentScore;
        let isBust = false, isWin = false;
        for(let i=0; i<3; i++) {
            const d = dartState[i];
            if(d.val === 0 && !d.missed) continue;
            const pts = d.val * d.mult;
            const rem = temp - pts;
            if(rem < 0 || rem === 1) { isBust = true; break; }
            else if (rem === 0) {
                if(d.mult === 2 || d.val === 50) { isWin = true; temp = 0; break; }
                else { isBust = true; break; }
            } else { temp = rem; }
        }
        return { rem: isBust ? currentScore : temp, isBust, isWin };
    }

    function manualNext() {
        if(!gameActive) return;
        const p = players[currentPlayerIndex];
        const res = calculateScore(p.score);
        if(res.isWin) { p.score = 0; p.finished = true; alert(`${p.name} ${txt.win}`); }
        else if(!res.isBust) { p.score = res.rem; }

        dartState = [{val:0, mult:1},{val:0, mult:1},{val:0, mult:1}];
        document.getElementById('btn-next-board').classList.remove('ready');
        document.getElementById('btn-next-grid').classList.remove('ready');
        
        [0,1,2].forEach(i => {
            document.getElementById(`grid-val-${i}`).innerText = '-';
            const badge = document.getElementById(`badge-dart-${i+1}`);
            if(badge) badge.innerText = i+1; 
        });
        switchGridTab(0);
        
        // Hide tutorials after first turn
        tutorialState.dragShown = false; tutorialState.swipeShown = false;
        document.getElementById('tut-drag').style.display = 'none';
        document.getElementById('tut-swipe').style.display = 'none';

        if(players.every(pl => pl.finished)) { renderScoreboard(); gameActive = false; return; }

        let loop=0;
        do { currentPlayerIndex = (currentPlayerIndex + 1) % players.length; loop++; } while(players[currentPlayerIndex].finished && loop < players.length);

        renderScoreboard();
        resetDartsPosition();
    }

    function resetDartsPosition() {
        const dock = document.getElementById('dart-dock');
        const rect = dock.getBoundingClientRect();
        let centerX, bottomY;
        // Even if hidden, calc based on window
        centerX = window.innerWidth / 2;
        bottomY = window.innerHeight - 80; // Above footer area approx

        // If visual is active, rect is good.
        if(rect.width > 0) {
             centerX = rect.left + rect.width/2;
             bottomY = rect.bottom - 15;
        }

        const gap = 50; 
        [0,1,2].forEach(i => {
            const d = document.getElementById(`dart-${i+1}`);
            d.style.position = 'fixed'; d.style.transition = 'all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            d.style.left = (centerX + (i-1)*gap - 20) + 'px'; d.style.top = (bottomY - 120) + 'px';
            d.style.transform = 'rotate(0deg)'; d.style.zIndex = 1000 + i;
        });
    }

    function resetSingleDart(i) {
        resetDartsPosition(); // Lazy reset all positions to dock to keep aligned
    }

    function addPlayer() { const inp = document.getElementById('new-player-input'); if(inp.value.trim()){ players.push({name:inp.value.trim(), score:501, finished:false}); inp.value=""; renderList(); inp.focus(); } }
    function renderList() { document.getElementById('player-list-display').innerHTML = players.map((p,i)=>`<div class="player-tag">${p.name} <span onclick="players.splice(${i},1);renderList()" style="cursor:pointer">&times;</span></div>`).join(''); }
    
    function startGame() { 
        if(players.length===0) return; 
        const s = parseInt(document.getElementById('start-score-select').value); 
        players.forEach(p => { p.score=s; p.finished=false; }); 
        gameActive = true; currentPlayerIndex = 0; 
        document.getElementById('setup-modal').style.display='none'; 
        renderScoreboard(); 
        tutorialState.dragShown = true; tutorialState.swipeShown = true;
        setTimeout(() => { 
            resetDartsPosition(); 
            document.getElementById('tut-drag').style.display = 'flex';
        }, 100); 
    }
    
    function resetGame() { if(confirm(txt.confirm)) location.reload(); }
    function renderScoreboard() {
        document.getElementById('scoreboard').innerHTML = players.map((p,i) => {
            const active = (i===currentPlayerIndex && !p.finished);
            return `<div class="player-column ${active?'active':''} ${p.finished?'finished':''}" id="p-col-${i}"><div class="player-name">${p.name}</div><div class="current-score">${p.finished ? txt.win : p.score}</div>${active ? `<div class="projected-row" id="proj-score-${i}"><span>${txt.next}</span> <span class="next-score">${p.score}</span></div>` : ''}</div>`;
        }).join('');
        const activeEl = document.querySelector('.player-column.active'); if(activeEl) activeEl.scrollIntoView({behavior:'smooth', inline:'center'});
    }

    init();
</script>
