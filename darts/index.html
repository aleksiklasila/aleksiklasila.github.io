<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Darts Scorer Pro</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent: #00e676;
            --accent-dim: #00a856;
            --danger: #cf6679;
            --highlight: #2c2c2c;
            /* Dart Colors */
            --dart-flight: #ff4081;
            --dart-shaft: #eee;
            --dart-barrel: #333;
            --dart-tip: #aaa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh; 
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }

        /* --- Header --- */
        header {
            flex: 0 0 auto;
            padding: 5px 15px;
            background: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            height: 44px;
            padding-top: max(5px, env(safe-area-inset-top)); 
            z-index: 100;
        }
        h1 { margin: 0; font-size: 1.1rem; letter-spacing: 0.5px; }
        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        button.danger { background: var(--danger); color: white; }

        /* --- Scoreboard --- */
        #scoreboard {
            flex: 0 0 90px;
            display: flex;
            overflow-x: auto;
            background: #000;
            padding: 8px;
            gap: 8px;
            border-bottom: 1px solid #333;
            scroll-snap-type: x mandatory;
        }

        .player-column {
            min-width: 100px;
            flex: 1;
            background: var(--card-bg);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid transparent;
            scroll-snap-align: center;
            padding: 5px;
            position: relative;
        }

        .player-column.active {
            border-color: var(--accent);
            background: #252525;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.1);
        }

        .player-column.finished {
            opacity: 0.6;
            border-color: gold;
        }

        .player-name { font-size: 0.85rem; font-weight: 600; color: #aaa; margin-bottom: 2px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .current-score { font-size: 2.2rem; font-weight: 800; color: white; line-height: 1; letter-spacing: -1px; }
        
        .projected-row {
            margin-top: 4px;
            font-size: 0.75rem;
            color: #777;
            display: flex;
            justify-content: center;
            gap: 4px;
        }
        .next-score { color: var(--accent); font-weight: bold; }
        .next-score.bust { color: var(--danger); text-decoration: line-through; }

        /* --- View Switcher (Swipe Area) --- */
        #view-slider {
            flex: 1;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            width: 100%;
            background: #121212;
            position: relative;
        }
        
        .view-section {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            position: relative;
            overflow: hidden;
        }

        /* --- View 1: Game Area (Visual) --- */
        #game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #222 0%, #121212 70%);
            position: relative;
        }

        #dartboard-container {
            width: 90%;
            max-width: 420px;
            aspect-ratio: 1/1;
            position: relative;
            filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.6));
        }

        svg { width: 100%; height: 100%; }

        /* --- View 2: Grid Input --- */
        #grid-area {
            display: flex;
            flex-direction: column;
            background: #181818;
            padding: 10px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .dart-accordion {
            background: #252525;
            border-radius: 8px;
            margin-bottom: 8px;
            overflow: hidden;
            border: 1px solid #333;
            transition: all 0.3s ease;
        }
        .dart-accordion.active {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .accordion-header {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            background: #2a2a2a;
        }
        .accordion-title { font-weight: bold; color: #aaa; }
        .accordion-value { font-weight: 800; font-size: 1.2rem; color: var(--accent); }
        .dart-accordion.active .accordion-title { color: white; }
        
        .accordion-body {
            max-height: 0;
            overflow: hidden; /* Hide scrollbar inside body */
            transition: max-height 0.3s ease-out;
            background: #151515;
        }
        .dart-accordion.active .accordion-body {
            max-height: 400px; /* Arbitrary large height */
            overflow-y: auto;
        }

        .grid-matrix {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Single, Double, Triple */
            gap: 4px;
            padding: 10px;
        }
        
        .g-btn {
            padding: 10px 5px;
            text-align: center;
            background: #333;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #ddd;
            cursor: pointer;
            border: 1px solid #444;
        }
        .g-btn:active { background: #555; transform: scale(0.98); }
        
        /* Specific Colors for Multipliers */
        .g-single { background: #222; }
        .g-double { background: #388e3c; color: white; border-color: #388e3c;}
        .g-triple { background: #d32f2f; color: white; border-color: #d32f2f;}
        .g-bull { grid-column: span 3; background: #d32f2f; color: white; margin-top:5px; }
        .g-miss { grid-column: span 3; background: #333; color: #888; margin-top:5px; }

        /* --- Pagination Dots --- */
        #swipe-indicator {
            position: absolute;
            bottom: 120px; /* Above Footer */
            left: 0; width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px;
            pointer-events: none;
            z-index: 50;
        }
        .dot {
            width: 8px; height: 8px;
            background: #555;
            border-radius: 50%;
            transition: background 0.3s;
        }
        .dot.active { background: var(--accent); }
        .swipe-hint-text {
            position: absolute;
            top: -25px;
            width: 100%; text-align: center;
            font-size: 0.75rem; color: #777;
            opacity: 0.8;
            animation: pulse 2s infinite;
        }

        /* --- Magnifier (Zoom) --- */
        #magnifier {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 120px;
            height: 120px;
            border: 3px solid var(--accent);
            border-radius: 50%;
            background: #000;
            overflow: hidden;
            display: none; 
            z-index: 500;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.9);
        }
        
        .magnifier-crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 8px; height: 8px;
            background: transparent;
            border: 2px solid rgba(255, 255, 0, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 502;
        }
        
        #magnifier-score {
            position: absolute;
            bottom: 10px; width: 100%;
            text-align: center; font-weight: 900;
            color: yellow;
            text-shadow: 0px 2px 4px rgba(0,0,0,1);
            z-index: 502;
            font-size: 1.5rem;
        }

        /* --- Footer / Controls --- */
        #footer-controls {
            flex: 0 0 auto;
            background: var(--card-bg);
            width: 100%;
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 200;
            padding: 10px 15px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom)); 
        }

        #dart-dock {
            display: flex;
            justify-content: center;
            gap: 30px; 
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            height: 100px;
            border: 2px dashed #333;
            position: relative;
            align-items: flex-end; 
            padding-bottom: 10px;
            /* Hide dock if using Grid? No, keep it for reference or just disable interaction */
        }

        .dart-obj {
            width: 40px; height: 120px;
            position: absolute; z-index: 1000;
            cursor: grab;
            filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.5));
            touch-action: none; transform-origin: 50% 95%; 
        }
        .dart-badge {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            font-size: 10px; font-weight: bold; color: white; text-shadow: 0 1px 2px black; pointer-events: none;
        }

        #action-btn {
            width: 100%; padding: 14px; font-size: 1.1rem; border-radius: 8px; background: #333; color: #777; pointer-events: none;
        }
        #action-btn.ready {
            background: var(--accent); color: #000; pointer-events: auto; box-shadow: 0 4px 12px rgba(0, 230, 118, 0.3);
        }

        /* --- Tutorial Overlay --- */
        #tutorial-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1500; display: none;
        }
        .tut-text {
            position: absolute; width: 100%; text-align: center; color: white; font-weight: bold; font-size: 1.1rem;
            text-shadow: 0 2px 4px black; animation: fadeText 2.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity:0.5; } 50% { opacity:1; transform: scale(1.05); } }
        @keyframes fadeText { 0%, 100% { opacity: 0; } 20%, 60% { opacity: 1; } }

        /* --- Modal --- */
        #setup-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 2000;
            display: flex; justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #222; padding: 25px; border-radius: 16px; width: 85%; max-width: 380px;
            border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        input {
            width: 100%; padding: 12px; background: #111; border: 1px solid #444; color: white; border-radius: 8px; margin-bottom: 12px; font-size: 1rem; box-sizing: border-box;
        }
        .tag-container { display: flex; flex-wrap: wrap; margin-bottom: 15px; gap: 8px; min-height: 30px;}
        .player-tag {
            background: #333; padding: 6px 12px; border-radius: 20px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; border: 1px solid #444;
        }

    </style>
</head>
<body>

<div id="setup-modal">
    <div class="modal-content">
        <h2 id="modal-title" style="margin-top:0">New Game</h2>
        <input type="text" id="new-player-input" placeholder="Player Name" maxlength="10">
        <button onclick="addPlayer()" style="width:100%; margin-bottom:15px; background: #444; color:white; border:none; padding:10px; border-radius:6px;" id="btn-add">Add Player</button>
        <div class="tag-container" id="player-list-display"></div>
        <div style="border-top: 1px solid #333; padding-top: 15px;">
             <label style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; font-size: 0.9rem; color:#ccc;">
                Starting Score
                <select id="start-score-select" style="background:#111; color:white; border:1px solid #444; padding:5px; border-radius:4px;">
                    <option value="301">301</option>
                    <option value="501" selected>501</option>
                    <option value="701">701</option>
                </select>
            </label>
            <button onclick="startGame()" style="width:100%; padding: 12px; font-size:1rem;" id="btn-start">Start Game</button>
        </div>
    </div>
</div>

<header>
    <h1 id="app-title">Darts Scorer Pro</h1>
    <button onclick="resetGame()" class="danger" id="btn-reset">Reset</button>
</header>

<div id="scoreboard"></div>

<div id="view-slider">
    
    <div class="view-section" id="section-visual">
        <div id="game-area">
            <div id="magnifier">
                <div class="magnifier-crosshair"></div>
                <div id="magnifier-score"></div>
            </div>
            <div id="dartboard-container"></div>
            
            <div id="tutorial-overlay">
                <div class="tut-text" style="bottom: 200px;">Drag to Throw</div>
            </div>
        </div>
    </div>

    <div class="view-section" id="section-grid">
        <div id="grid-area">
            </div>
    </div>

</div>

<div id="swipe-indicator">
    <div class="swipe-hint-text">&larr; SWIPE TO CHANGE INPUT &rarr;</div>
    <div class="dot active" id="dot-0"></div>
    <div class="dot" id="dot-1"></div>
</div>

<div id="footer-controls">
    <div id="dart-dock"></div>
    <button onclick="manualNext()" id="action-btn">Next Player</button>
</div>

<script>
    const i18n = {
        en: { next: "Rem: ", bust: "BUST", btnNext: "Next Player", btnWin: "WINNER!", win: "Wins!", confirm: "End current game?", miss: "Miss" },
        fi: { next: "Jäljellä: ", bust: "YLILYÖNTI", btnNext: "Seuraava", btnWin: "VOITTAJA!", win: "Voitti!", confirm: "Lopeta peli?", miss: "Ohi" }
    };
    const userLang = navigator.language.startsWith('fi') ? 'fi' : 'en';
    const txt = i18n[userLang];

    let players = [];
    let currentPlayerIndex = 0;
    let gameActive = false;
    let dartState = [ {val:0, mult:1, missed:false}, {val:0, mult:1, missed:false}, {val:0, mult:1, missed:false} ];
    let currentDartEditIndex = 0; // For Grid mode

    // --- SVG GENERATION ---
    const NS = "http://www.w3.org/2000/svg";

    function createDartSVG(id, number) {
        const div = document.createElement('div');
        div.className = 'dart-obj'; div.id = id;
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("viewBox", "0 0 40 120");
        svg.style.pointerEvents = "none";

        const flight = document.createElementNS(NS, "path");
        flight.setAttribute("d", "M10,0 L30,0 L25,30 L15,30 Z"); flight.setAttribute("fill", "var(--dart-flight)");
        svg.appendChild(flight);
        const shaft = document.createElementNS(NS, "rect");
        shaft.setAttribute("x", "18"); shaft.setAttribute("y", "30"); shaft.setAttribute("width", "4"); shaft.setAttribute("height", "40"); shaft.setAttribute("fill", "var(--dart-shaft)");
        svg.appendChild(shaft);
        const barrel = document.createElementNS(NS, "path");
        barrel.setAttribute("d", "M16,70 L24,70 L23,100 L17,100 Z"); barrel.setAttribute("fill", "var(--dart-barrel)");
        svg.appendChild(barrel);
        const tip = document.createElementNS(NS, "path");
        tip.setAttribute("d", "M19,100 L21,100 L20,120 Z"); tip.setAttribute("fill", "var(--dart-tip)");
        svg.appendChild(tip);
        div.appendChild(svg);
        const badge = document.createElement('div'); badge.className = 'dart-badge'; badge.innerText = number;
        div.appendChild(badge);
        return div;
    }

    function createBoardSVG() {
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("viewBox", "-205 -205 410 410");
        const numbers = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
        for (let i=0; i<20; i++) {
            const rot = (i*18)-9;
            const g = document.createElementNS(NS, "g");
            g.setAttribute("transform", `rotate(${rot})`);
            const c1 = i%2===0?"#121212":"#e0e0e0";
            const c2 = i%2===0?"#d32f2f":"#388e3c";
            const seg = (r1,r2,m,c) => {
                const p = document.createElementNS(NS,"path");
                const rad = Math.PI/180, a=9*rad;
                const x1=r1*Math.sin(-a), y1=-r1*Math.cos(-a); const x2=r1*Math.sin(a), y2=-r1*Math.cos(a);
                const x3=r2*Math.sin(a), y3=-r2*Math.cos(a); const x4=r2*Math.sin(-a), y4=-r2*Math.cos(-a);
                p.setAttribute("d", `M${x1},${y1} L${x4},${y4} A${r2},${r2} 0 0 1 ${x3},${y3} L${x2},${y2} A${r1},${r1} 0 0 0 ${x1},${y1} Z`);
                p.setAttribute("fill", c); p.setAttribute("stroke", "#666"); p.setAttribute("stroke-width", "1");
                p.setAttribute("class", "board-segment"); p.setAttribute("data-s", numbers[i]); p.setAttribute("data-m", m);
                return p;
            };
            g.appendChild(seg(109,162,1,c1)); g.appendChild(seg(162,172,2,c2));
            g.appendChild(seg(32,99,1,c1)); g.appendChild(seg(99,109,3,c2));
            const txt = document.createElementNS(NS,"text");
            txt.setAttribute("x",0); txt.setAttribute("y",-182); txt.setAttribute("text-anchor","middle");
            txt.setAttribute("fill","white"); txt.setAttribute("font-size", "22"); txt.setAttribute("font-weight","bold");
            txt.setAttribute("transform", `rotate(${-rot} 0 -182)`); txt.textContent = numbers[i];
            txt.style.pointerEvents="none"; g.appendChild(txt);
            svg.appendChild(g);
        }
        const bull = (r,s,c) => {
            const crc = document.createElementNS(NS,"circle");
            crc.setAttribute("r",r); crc.setAttribute("fill",c); crc.setAttribute("stroke","#666");
            crc.setAttribute("class", "board-segment"); crc.setAttribute("data-s", s); crc.setAttribute("data-m", 1);
            return crc;
        };
        svg.appendChild(bull(31.8, 25, "#388e3c")); svg.appendChild(bull(12.7, 50, "#d32f2f"));
        return svg;
    }

    function init() {
        document.getElementById('dartboard-container').appendChild(createBoardSVG().cloneNode(true)).id = "main-svg";
        const magWrap = document.getElementById('magnifier');
        magWrap.insertBefore(createBoardSVG().cloneNode(true), magWrap.firstChild).id = "mag-svg";

        const dock = document.getElementById('dart-dock');
        [1,2,3].forEach(i => dock.appendChild(createDartSVG(`dart-${i}`, i)));

        document.getElementById('action-btn').innerText = txt.btnNext;
        document.getElementById('new-player-input').addEventListener('keydown', (e)=>{ if(e.key==='Enter') addPlayer(); });

        setupDragAndDrop();
        setupSwipeObserver();
        buildGridInterface();
    }

    // --- GRID INTERFACE LOGIC ---
    function buildGridInterface() {
        const container = document.getElementById('grid-area');
        container.innerHTML = '';
        
        [0, 1, 2].forEach(dartIdx => {
            // Accordion Header
            const wrap = document.createElement('div');
            wrap.className = 'dart-accordion';
            wrap.id = `accordion-${dartIdx}`;
            
            const head = document.createElement('div');
            head.className = 'accordion-header';
            head.onclick = () => openAccordion(dartIdx);
            head.innerHTML = `<span class="accordion-title">Dart ${dartIdx+1}</span> <span class="accordion-value" id="grid-val-${dartIdx}">-</span>`;
            
            // Accordion Body (Grid)
            const body = document.createElement('div');
            body.className = 'accordion-body';
            
            const grid = document.createElement('div');
            grid.className = 'grid-matrix';
            
            // Generate Buttons 20 -> 1
            for(let i=20; i>=1; i--) {
                grid.innerHTML += `
                    <div class="g-btn g-single" onclick="gridInput(${dartIdx}, ${i}, 1)">${i}</div>
                    <div class="g-btn g-double" onclick="gridInput(${dartIdx}, ${i}, 2)">D${i}</div>
                    <div class="g-btn g-triple" onclick="gridInput(${dartIdx}, ${i}, 3)">T${i}</div>
                `;
            }
            // Bull & Miss
            grid.innerHTML += `
                <div class="g-btn g-bull" onclick="gridInput(${dartIdx}, 50, 1)">BULL (50)</div>
                <div class="g-btn g-bull" onclick="gridInput(${dartIdx}, 25, 1)">OUTER BULL (25)</div>
                <div class="g-btn g-miss" onclick="gridInput(${dartIdx}, 0, 1)">${txt.miss.toUpperCase()} (0)</div>
            `;
            
            body.appendChild(grid);
            wrap.appendChild(head);
            wrap.appendChild(body);
            container.appendChild(wrap);
        });
        
        // Open first accordion by default
        openAccordion(0);
    }

    function openAccordion(idx) {
        currentDartEditIndex = idx;
        [0,1,2].forEach(i => {
            const el = document.getElementById(`accordion-${i}`);
            if(i === idx) el.classList.add('active');
            else el.classList.remove('active');
        });
    }

    function gridInput(dartIdx, score, mult) {
        if(!gameActive) return;

        // 1. Update State
        dartState[dartIdx] = { val: score, mult: mult, missed: (score===0) };

        // 2. Update UI Text for this accordion
        const lbl = document.getElementById(`grid-val-${dartIdx}`);
        let txtVal = score === 0 ? txt.miss : score;
        if(mult===2) txtVal = "D"+score;
        if(mult===3) txtVal = "T"+score;
        if(score===25) txtVal = "25";
        if(score===50) txtVal = "BULL";
        lbl.innerText = txtVal;
        
        // 3. Move visual dart to "hidden" or dock to indicate grid usage
        // We will just place it in the dock to keep board clean
        resetSingleDart(dartIdx); 

        // 4. Update Game Score Logic
        updateGameState();

        // 5. Auto Advance
        if(dartIdx < 2) {
            openAccordion(dartIdx + 1);
        } else {
            // Close all if last dart
            document.getElementById(`accordion-2`).classList.remove('active');
        }
    }

    // --- SWIPE LOGIC ---
    function setupSwipeObserver() {
        const slider = document.getElementById('view-slider');
        const dots = [document.getElementById('dot-0'), document.getElementById('dot-1')];
        
        slider.addEventListener('scroll', () => {
            const scrollLeft = slider.scrollLeft;
            const width = slider.offsetWidth;
            const index = Math.round(scrollLeft / width);
            
            dots.forEach((d, i) => {
                if(i === index) d.classList.add('active');
                else d.classList.remove('active');
            });
            
            // Hide hint on scroll
            document.querySelector('.swipe-hint-text').style.opacity = '0';
        });
    }

    // --- DRAG LOGIC (Preserved) ---
    function setupDragAndDrop() {
        const darts = [1,2,3].map(i => document.getElementById(`dart-${i}`));
        const magnifier = document.getElementById('magnifier');
        const magSVG = document.getElementById('mag-svg');
        const magScore = document.getElementById('magnifier-score');
        const mainSVG = document.getElementById('main-svg');

        darts.forEach((dart, idx) => {
            const onStart = (e) => {
                if(!gameActive) return;
                // Check if slider is on visual view (index 0)
                const slider = document.getElementById('view-slider');
                if(slider.scrollLeft > 100) return; // Disable drag on grid view

                document.getElementById('tutorial-overlay').style.display='none';
                e.preventDefault();
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;

                dart.style.position = 'fixed'; dart.style.zIndex = 9999; dart.style.transition = 'none';
                dart.style.transform = 'scale(1.2) rotate(-10deg)'; 
                darts.forEach(d => d.style.pointerEvents = 'none');
                magnifier.style.display = 'block';

                const updatePos = (mx, my) => {
                    dart.style.left = (mx - 20) + 'px'; dart.style.top = (my - 120) + 'px';
                    const hit = document.elementFromPoint(mx, my);
                    if(hit && hit.classList.contains('board-segment')) {
                        const pt = mainSVG.createSVGPoint(); pt.x = mx; pt.y = my;
                        const svgP = pt.matrixTransform(mainSVG.getScreenCTM().inverse());
                        magSVG.setAttribute("viewBox", `${svgP.x - 20} ${svgP.y - 20} 40 40`);
                        const s = parseInt(hit.getAttribute('data-s')), m = parseInt(hit.getAttribute('data-m'));
                        magScore.innerText = (m===3?'T':(m===2?'D':'')) + s;
                        magScore.style.color = (m===3?'#00e676':(m===2?'#ff4081':'white'));
                    } else {
                        magScore.innerText = txt.miss; magScore.style.color = '#aaa';
                        magSVG.setAttribute("viewBox", "-205 -205 410 410");
                    }
                };
                updatePos(cx, cy);

                const onMove = (em) => { em.preventDefault(); updatePos(em.touches?em.touches[0].clientX:em.clientX, em.touches?em.touches[0].clientY:em.clientY); };
                const onEnd = (ee) => {
                    document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onEnd);
                    document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onEnd);
                    magnifier.style.display = 'none';
                    const mx = ee.changedTouches?ee.changedTouches[0].clientX:ee.clientX;
                    const my = ee.changedTouches?ee.changedTouches[0].clientY:ee.clientY;
                    
                    dart.hidden = true; let el = document.elementFromPoint(mx, my); dart.hidden = false;
                    darts.forEach(d => d.style.pointerEvents = 'auto');

                    if(el && el.classList.contains('board-segment')) {
                        const s = parseInt(el.getAttribute('data-s')), m = parseInt(el.getAttribute('data-m'));
                        dart.style.transition = 'transform 0.1s ease-out'; dart.style.transform = 'scale(0.8) rotate(0deg)';
                        dart.style.left = (mx - 20) + 'px'; dart.style.top = (my - 120) + 'px';
                        
                        // Sync with Grid UI
                        updateGridUIFromDrag(idx, s, m);
                    } else {
                        resetSingleDart(idx);
                        updateGridUIFromDrag(idx, 0, 1);
                    }
                };
                document.addEventListener('touchmove', onMove, {passive:false}); document.addEventListener('touchend', onEnd);
                document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onEnd);
            };
            dart.addEventListener('touchstart', onStart, {passive:false}); dart.addEventListener('mousedown', onStart);
        });
    }

    function updateGridUIFromDrag(idx, s, m) {
        dartState[idx] = { val: s, mult: m, missed: (s===0) };
        const lbl = document.getElementById(`grid-val-${idx}`);
        let txtVal = s === 0 ? txt.miss : s;
        if(m===2) txtVal = "D"+s; if(m===3) txtVal = "T"+s; if(s===25) txtVal="25"; if(s===50) txtVal="BULL";
        lbl.innerText = txtVal;
        updateGameState();
    }

    // --- GAME CORE ---
    function updateGameState() {
        const p = players[currentPlayerIndex];
        const res = calculateScore(p.score);
        const projEl = document.getElementById(`proj-score-${currentPlayerIndex}`);
        if(projEl) {
            if(res.isBust) projEl.innerHTML = `<span class="next-score bust">${txt.bust}</span>`;
            else if(res.isWin) projEl.innerHTML = `<span class="next-score" style="color:gold">${txt.win}</span>`;
            else {
                let w = (res.rem <= 1 && res.rem !== 0) ? `(${txt.bust})` : '';
                projEl.innerHTML = `<span>${txt.next}</span> <span class="next-score">${res.rem} ${w}</span>`;
            }
        }
        
        // Count attempts (either placed on board or entered in grid)
        const thrown = dartState.filter(d => d.val > 0 || d.missed).length;
        const btn = document.getElementById('action-btn');
        if(thrown === 3 || res.isWin || res.isBust) {
            btn.classList.add('ready');
            if(res.isWin) setTimeout(manualNext, 1000);
        } else {
            btn.classList.remove('ready');
        }
    }

    function calculateScore(currentScore) {
        let temp = currentScore;
        let isBust = false, isWin = false;
        for(let i=0; i<3; i++) {
            const d = dartState[i];
            if(d.val === 0 && !d.missed) continue;
            const pts = d.val * d.mult;
            const rem = temp - pts;
            if(rem < 0 || rem === 1) { isBust = true; break; }
            else if (rem === 0) {
                if(d.mult === 2 || d.val === 50) { isWin = true; temp = 0; break; }
                else { isBust = true; break; }
            } else { temp = rem; }
        }
        return { rem: isBust ? currentScore : temp, isBust, isWin };
    }

    function manualNext() {
        if(!gameActive) return;
        const p = players[currentPlayerIndex];
        const res = calculateScore(p.score);
        if(res.isWin) { p.score = 0; p.finished = true; alert(`${p.name} ${txt.win}`); }
        else if(!res.isBust) { p.score = res.rem; }

        dartState = [{val:0, mult:1},{val:0, mult:1},{val:0, mult:1}];
        document.getElementById('action-btn').classList.remove('ready');
        
        // Reset Grid UI labels
        [0,1,2].forEach(i => document.getElementById(`grid-val-${i}`).innerText = '-');
        openAccordion(0); // Reset accordion

        if(players.every(pl => pl.finished)) { renderScoreboard(); gameActive = false; return; }

        let loop=0;
        do { currentPlayerIndex = (currentPlayerIndex + 1) % players.length; loop++; } while(players[currentPlayerIndex].finished && loop < players.length);

        renderScoreboard();
        resetDartsPosition();
        
        // Reset Slider to Visual view for new turn? Or keep preference? Let's keep preference.
        // If we wanted to force visual: document.getElementById('view-slider').scrollLeft = 0;
    }

    function resetDartsPosition() {
        const dock = document.getElementById('dart-dock');
        const rect = dock.getBoundingClientRect();
        const gap = 50, centerX = rect.left + rect.width/2, bottomY = rect.bottom - 15;
        [0,1,2].forEach(i => {
            const d = document.getElementById(`dart-${i+1}`);
            d.style.position = 'fixed'; d.style.transition = 'all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            d.style.left = (centerX + (i-1)*gap - 20) + 'px'; d.style.top = (bottomY - 120) + 'px';
            d.style.transform = 'rotate(0deg)'; d.style.zIndex = 1000 + i;
        });
    }
    function resetSingleDart(i) {
        const dock = document.getElementById('dart-dock');
        const rect = dock.getBoundingClientRect();
        const gap = 50, centerX = rect.left + rect.width/2, bottomY = rect.bottom - 15;
        const d = document.getElementById(`dart-${i+1}`);
        d.style.transition = 'all 0.4s ease-out';
        d.style.left = (centerX + (i-1)*gap - 20) + 'px'; d.style.top = (bottomY - 120) + 'px'; d.style.transform = 'rotate(0deg)';
    }

    function addPlayer() { const inp = document.getElementById('new-player-input'); if(inp.value.trim()){ players.push({name:inp.value.trim(), score:501, finished:false}); inp.value=""; renderList(); inp.focus(); } }
    function renderList() { document.getElementById('player-list-display').innerHTML = players.map((p,i)=>`<div class="player-tag">${p.name} <span onclick="players.splice(${i},1);renderList()" style="cursor:pointer">&times;</span></div>`).join(''); }
    function startGame() { if(players.length===0) return; const s = parseInt(document.getElementById('start-score-select').value); players.forEach(p => { p.score=s; p.finished=false; }); gameActive = true; currentPlayerIndex = 0; document.getElementById('setup-modal').style.display='none'; renderScoreboard(); setTimeout(() => { resetDartsPosition(); document.getElementById('tutorial-overlay').style.display='block'; }, 100); }
    function resetGame() { if(confirm(txt.confirm)) location.reload(); }
    function renderScoreboard() {
        document.getElementById('scoreboard').innerHTML = players.map((p,i) => {
            const active = (i===currentPlayerIndex && !p.finished);
            return `<div class="player-column ${active?'active':''} ${p.finished?'finished':''}" id="p-col-${i}"><div class="player-name">${p.name}</div><div class="current-score">${p.finished ? txt.win : p.score}</div>${active ? `<div class="projected-row" id="proj-score-${i}"><span>${txt.next}</span> <span class="next-score">${p.score}</span></div>` : ''}</div>`;
        }).join('');
        const activeEl = document.querySelector('.player-column.active'); if(activeEl) activeEl.scrollIntoView({behavior:'smooth', inline:'center'});
    }

    init();
</script>
</body>
