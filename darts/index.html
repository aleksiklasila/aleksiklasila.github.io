<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Darts Scorer</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent: #00e676;
            --accent-dim: #00a856;
            --danger: #cf6679;
            --board-black: #121212;
            --board-white: #e0e0e0;
            --board-red: #d32f2f;
            --board-green: #388e3c;
            --highlight: #2c2c2c;
            --dart-color: #ff4081;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            
            /* --- FIX 1: Use Dynamic Viewport Height --- */
            height: 100vh; /* Fallback */
            height: 100dvh; /* Adapts to mobile address bars */
            
            overflow: hidden;
            touch-action: none;
        }

        /* --- Header --- */
        header {
            flex: 0 0 auto;
            padding: 5px 10px;
            background: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            height: 40px;
            /* Ensure header respects top notch on some devices */
            padding-top: max(5px, env(safe-area-inset-top)); 
        }
        h1 { margin: 0; font-size: 1rem; }
        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }
        button.danger { background: var(--danger); color: white; }

        /* --- Scoreboard --- */
        #scoreboard {
            flex: 0 0 85px;
            display: flex;
            overflow-x: auto;
            background: var(--bg-color);
            padding: 5px;
            gap: 5px;
            border-bottom: 1px solid #333;
            scroll-snap-type: x mandatory;
        }

        .player-column {
            min-width: 100px;
            flex: 1;
            background: var(--card-bg);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid transparent;
            scroll-snap-align: center;
            padding: 5px;
        }

        .player-column.active {
            border-color: var(--accent);
            background: var(--highlight);
        }

        .player-column.finished {
            opacity: 0.5;
            border-color: gold;
        }

        .player-name { font-size: 0.9rem; font-weight: bold; margin-bottom: 2px; text-align: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 100%;}
        .current-score { font-size: 1.8rem; font-weight: 800; color: white; line-height: 1;}
        
        .projected-row {
            margin-top: 2px;
            font-size: 0.75rem;
            color: #aaa;
            display: flex;
            justify-content: center;
            gap: 3px;
        }
        .next-score { color: var(--accent); font-weight: bold; }
        .next-score.bust { color: var(--danger); text-decoration: line-through; }

        /* --- Game Area --- */
        #game-area {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            width: 100%;
        }

        #dartboard-container {
            width: 95%;
            max-width: 400px;
            aspect-ratio: 1/1;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0px 5px 10px rgba(0,0,0,0.5));
        }

        .board-segment { transition: opacity 0.1s; }

        /* --- Magnifier (Zoom) --- */
        #magnifier {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 110px;
            height: 110px;
            border: 3px solid var(--accent);
            border-radius: 50%;
            background: #000;
            overflow: hidden;
            display: none; /* Hidden until drag */
            z-index: 500;
            pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }
        #magnifier-svg { width: 100%; height: 100%; }
        
        /* The yellow center dot */
        .magnifier-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: yellow;
            border: 1px solid rgba(0,0,0,0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 502;
        }
        
        /* Score inside magnifier */
        #magnifier-score {
            position: absolute;
            bottom: 15px;
            width: 100%;
            text-align: center;
            font-weight: 800;
            color: yellow;
            text-shadow: 0px 2px 2px rgba(0,0,0,1);
            z-index: 502;
            font-size: 1.4rem;
        }

        /* --- Footer / Controls --- */
        #footer-controls {
            flex: 0 0 auto;
            background: var(--card-bg);
            width: 100%;
            box-sizing: border-box;
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 20;

            /* --- FIX 2: Safe Area Insets for Home Bar --- */
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 5px;
            /* Base 10px + Safe Area amount */
            padding-bottom: calc(10px + env(safe-area-inset-bottom)); 
        }

        #dart-dock {
            display: flex;
            justify-content: center;
            gap: 20px;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 10px;
            min-height: 50px;
            border: 2px dashed #444;
            position: relative;
            align-items: center;
        }

        .dart-token {
            width: 40px;
            height: 40px;
            background: var(--dart-color);
            border: 2px solid white;
            border-radius: 50% 50% 0 50%;
            transform: rotate(45deg);
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            touch-action: none;
            position: absolute;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
            white-space: nowrap;
            cursor: grab;
        }
        
        .dart-token span { transform: rotate(-45deg); display: block; min-width: 25px; text-align: center; }

        #action-btn {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            margin-top: 2px;
        }

        /* --- Modal --- */
        #setup-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--card-bg); padding: 20px; border-radius: 10px; width: 90%; max-width: 400px;
        }
        input {
            width: 100%; padding: 10px; background: #333; border: 1px solid #555;
            color: white; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px;
        }
        .player-tag {
            background: var(--accent-dim); padding: 5px 10px; border-radius: 15px;
            font-size: 0.8rem; display: flex; align-items: center; gap: 5px; margin: 3px;
        }
        .tag-container { display: flex; flex-wrap: wrap; margin-bottom: 10px; }

    </style>
</head>
<body>

<div id="setup-modal">
    <div class="modal-content">
        <h2 id="modal-title">New Game</h2>
        <input type="text" id="new-player-input" placeholder="Enter name" onkeydown="if(event.key === 'Enter') addPlayer()">
        <button onclick="addPlayer()" style="width:100%; margin-bottom:10px;" id="btn-add">Add Player</button>
        
        <div class="tag-container" id="player-list-display"></div>
        
        <div style="border-top: 1px solid #444; padding-top: 10px;">
             <label style="display:block; margin-bottom:10px; font-size: 0.9rem; color:#aaa;">
                Start Score (Double Out):
                <select id="start-score-select" style="background:#333; color:white; border:none; padding:5px; margin-left:10px;">
                    <option value="301">301</option>
                    <option value="501" selected>501</option>
                </select>
            </label>
            <button onclick="startGame()" style="width:100%; padding: 10px;" id="btn-start">Start Game</button>
        </div>
    </div>
</div>

<header>
    <h1 id="app-title">Darts Scorer</h1>
    <button onclick="resetGame()" class="danger" id="btn-reset">Reset</button>
</header>

<div id="scoreboard"></div>

<div id="game-area">
    <div id="magnifier">
        <div class="magnifier-crosshair"></div>
        <div id="magnifier-score">0</div>
    </div>
    <div id="dartboard-container"></div>
</div>

<div id="footer-controls">
    <div id="dart-dock"></div>
    <button onclick="manualNext()" id="action-btn">Next Player</button>
</div>

<div id="dart-1" class="dart-token"><span>1</span></div>
<div id="dart-2" class="dart-token"><span>2</span></div>
<div id="dart-3" class="dart-token"><span>3</span></div>

<script>
    const i18n = {
        en: {
            title: "Darts Scorer", modalTitle: "New Game", addBtn: "Add Player", startBtn: "Start Game", resetBtn: "Reset",
            placeholder: "Enter name", next: "Rem: ", bust: "BUST", btnNext: "Next Player", btnWin: "WINNER!",
            win: "Wins!", needDouble: "Need Double"
        },
        fi: {
            title: "Tikkataulu", modalTitle: "Uusi Peli", addBtn: "Lisää Pelaaja", startBtn: "Aloita Peli", resetBtn: "Nollaa",
            placeholder: "Syötä nimi", next: "Jäljellä: ", bust: "YLILYÖNTI", btnNext: "Seuraava", btnWin: "VOITTAJA!",
            win: "Voitti!", needDouble: "Vaatii Tuplan"
        }
    };

    const userLang = navigator.language.startsWith('fi') ? 'fi' : 'en';
    const txt = i18n[userLang];

    // DOM Elements
    document.getElementById('app-title').innerText = txt.title;
    document.getElementById('modal-title').innerText = txt.modalTitle;
    document.getElementById('btn-add').innerText = txt.addBtn;
    document.getElementById('btn-start').innerText = txt.startBtn;
    document.getElementById('btn-reset').innerText = txt.resetBtn;
    document.getElementById('new-player-input').placeholder = txt.placeholder;
    document.getElementById('action-btn').innerText = txt.btnNext;

    // Game State
    let players = [];
    let currentPlayerIndex = 0;
    let gameActive = false;
    let dartState = [
        { val: 0, mult: 1 }, 
        { val: 0, mult: 1 }, 
        { val: 0, mult: 1 }
    ];

    // SVG Construction
    const NS = "http://www.w3.org/2000/svg";
   
    function createBoardSVG() {
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("viewBox", "-205 -205 410 410");
       
        const rBullInner = 12.7; const rBullOuter = 31.8;
        const rInnerStart = 31.8; const rTripleInner = 99;
        const rTripleOuter = 109; const rDoubleInner = 162;
        const rDoubleOuter = 172;
        const numbers = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];

        for (let i = 0; i < 20; i++) {
            const rotation = (i * 18) - 9; 
            const g = document.createElementNS(NS, "g");
            g.setAttribute("transform", `rotate(${rotation})`);
           
            const score = numbers[i];
            const isBlack = i % 2 === 0;
            const cSingle = isBlack ? "var(--board-black)" : "var(--board-white)";
            const cSpecial = isBlack ? "var(--board-red)" : "var(--board-green)";

            const createSegment = (rIn, rOut, mult, color) => {
                const path = document.createElementNS(NS, "path");
                const rad = Math.PI / 180;
                const a1 = -9 * rad; const a2 = 9 * rad;
                const x1_in = rIn * Math.sin(a1); const y1_in = -rIn * Math.cos(a1);
                const x2_in = rIn * Math.sin(a2); const y2_in = -rIn * Math.cos(a2);
                const x1_out = rOut * Math.sin(a1); const y1_out = -rOut * Math.cos(a1);
                const x2_out = rOut * Math.sin(a2); const y2_out = -rOut * Math.cos(a2);
                const d = `M ${x1_in} ${y1_in} L ${x1_out} ${y1_out} A ${rOut} ${rOut} 0 0 1 ${x2_out} ${y2_out} L ${x2_in} ${y2_in} A ${rIn} ${rIn} 0 0 0 ${x1_in} ${y1_in} Z`;
               
                path.setAttribute("d", d);
                path.setAttribute("fill", color);
                path.setAttribute("stroke", "#555");
                path.setAttribute("stroke-width", "1");
                path.setAttribute("data-score", score);
                path.setAttribute("data-mult", mult);
                path.classList.add("board-segment");
                return path;
            };

            g.appendChild(createSegment(rTripleOuter, rDoubleInner, 1, cSingle));
            g.appendChild(createSegment(rDoubleInner, rDoubleOuter, 2, cSpecial));
            g.appendChild(createSegment(rInnerStart, rTripleInner, 1, cSingle));
            g.appendChild(createSegment(rTripleInner, rTripleOuter, 3, cSpecial));
           
            const text = document.createElementNS(NS, "text");
            text.setAttribute("x", 0); text.setAttribute("y", -185);
            text.setAttribute("text-anchor", "middle");
            text.setAttribute("fill", "white");
            text.setAttribute("font-weight", "bold");
            text.setAttribute("transform", `rotate(${-rotation} 0 -185)`);
            text.textContent = score;
            text.style.pointerEvents = "none";
            g.appendChild(text);

            svg.appendChild(g);
        }

        const bullGroup = document.createElementNS(NS, "g");
        const outerBull = document.createElementNS(NS, "circle");
        outerBull.setAttribute("r", rBullOuter); outerBull.setAttribute("fill", "var(--board-green)");
        outerBull.setAttribute("stroke", "#555");
        outerBull.setAttribute("data-score", 25); outerBull.setAttribute("data-mult", 1);
        outerBull.classList.add("board-segment");
        bullGroup.appendChild(outerBull);

        const innerBull = document.createElementNS(NS, "circle");
        innerBull.setAttribute("r", rBullInner); innerBull.setAttribute("fill", "var(--board-red)");
        innerBull.setAttribute("stroke", "#555");
        innerBull.setAttribute("data-score", 50); innerBull.setAttribute("data-mult", 1); 
        innerBull.classList.add("board-segment");
        bullGroup.appendChild(innerBull);

        svg.appendChild(bullGroup);
        return svg;
    }

    function initBoard() {
        const container = document.getElementById('dartboard-container');
        const mainSVG = createBoardSVG();
        mainSVG.id = "main-svg";
        container.appendChild(mainSVG);

        const magContainer = document.getElementById('magnifier');
        const magSVG = createBoardSVG(); 
        magSVG.id = "mag-svg";
        magContainer.insertBefore(magSVG, magContainer.firstChild);
    }

    // --- Interaction ---
    function initDrag() {
        const tokens = [1,2,3].map(i => document.getElementById(`dart-${i}`));
        const mainSVG = document.getElementById('main-svg');
        const magnifier = document.getElementById('magnifier');
        const magSVG = document.getElementById('mag-svg');
        const magScore = document.getElementById('magnifier-score');

        resetDartsPosition();

        tokens.forEach((token, index) => {
            let startX, startY, initialLeft, initialTop;
            const span = token.querySelector('span');

            const onStart = (e) => {
                if(!gameActive) return;
                e.preventDefault();
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
               
                startX = cx; startY = cy;
                const rect = token.getBoundingClientRect();
                initialLeft = rect.left; initialTop = rect.top;

                // Disable pointer events on ALL darts to allow click-through
                tokens.forEach(t => t.style.pointerEvents = 'none');

                token.style.position = 'fixed';
                token.style.zIndex = 9999;
                token.style.transition = 'none';
                token.style.left = initialLeft + 'px';
                token.style.top = (initialTop - 90) + 'px'; 
                token.style.transform = 'scale(1.2) rotate(45deg)'; 
               
                magnifier.style.display = 'block';

                const onMove = (em) => {
                    em.preventDefault();
                    const mx = em.touches ? em.touches[0].clientX : em.clientX;
                    const my = em.touches ? em.touches[0].clientY : em.clientY;
                    const dx = mx - startX;
                    const dy = my - startY;

                    token.style.left = (initialLeft + dx) + 'px';
                    token.style.top = (initialTop + dy - 90) + 'px';

                    // Hit Test: Since all darts have pointer-events: none, this should hit board
                    // But we will use the drill-down logic in onEnd to be 100% sure
                    const elemBelow = document.elementFromPoint(mx, my);
                   
                    let hitLabel = "0";

                    if(elemBelow && elemBelow.classList.contains('board-segment')) {
                        let pt = mainSVG.createSVGPoint();
                        pt.x = mx; pt.y = my;
                        let svgP = pt.matrixTransform(mainSVG.getScreenCTM().inverse());
                        magSVG.setAttribute("viewBox", `${svgP.x - 25} ${svgP.y - 25} 50 50`);

                        const s = parseInt(elemBelow.getAttribute('data-score'));
                        const m = parseInt(elemBelow.getAttribute('data-mult'));
                        hitLabel = (s * m).toString();
                    } else {
                        magSVG.setAttribute("viewBox", "-205 -205 410 410");
                    }
                    span.innerText = hitLabel;
                    magScore.innerText = hitLabel;
                };

                const onEnd = (ee) => {
                    document.removeEventListener('touchmove', onMove);
                    document.removeEventListener('touchend', onEnd);
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onEnd);
                   
                    magnifier.style.display = 'none';

                    const endX = ee.changedTouches ? ee.changedTouches[0].clientX : ee.clientX;
                    const endY = ee.changedTouches ? ee.changedTouches[0].clientY : ee.clientY;

                    // --- DRILL DOWN LOGIC ---
                    // Even if pointer-events failed, this loop manually hides blocking darts to find the board
                    let elemBelow = document.elementFromPoint(endX, endY);
                    const hiddenStack = [];

                    // Loop until we find something that is NOT a dart token, or we run out of elements
                    while (elemBelow && (elemBelow.classList.contains('dart-token') || elemBelow.closest('.dart-token'))) {
                        const target = elemBelow.classList.contains('dart-token') ? elemBelow : elemBelow.closest('.dart-token');
                        if(!target) break; // sanity check
                        target.style.visibility = 'hidden';
                        hiddenStack.push(target);
                        elemBelow = document.elementFromPoint(endX, endY);
                    }

                    // We found what is underneath
                    if (elemBelow && elemBelow.classList.contains('board-segment')) {
                        const s = parseInt(elemBelow.getAttribute('data-score'));
                        const m = parseInt(elemBelow.getAttribute('data-mult'));
                        dartState[index] = { val: s, mult: m };
                       
                        token.style.transition = 'top 0.2s, left 0.2s, transform 0.2s';
                        token.style.left = (endX - 20) + 'px';
                        token.style.top = (endY - 20) + 'px'; 
                        token.style.transform = 'scale(0.6) rotate(45deg)';
                    } else {
                        // Miss
                        dartState[index] = { val: 0, mult: 1 };
                        span.innerText = index+1;
                        resetSingleDartPosition(index);
                    }

                    // Restore visibility of drilled items
                    hiddenStack.forEach(el => el.style.visibility = 'visible');
                   
                    // Re-enable pointer events for next interaction
                    tokens.forEach(t => t.style.pointerEvents = 'auto');

                    updateScoreUI();
                    checkAutoWin();
                };

                document.addEventListener('touchmove', onMove, { passive: false });
                document.addEventListener('touchend', onEnd);
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onEnd);
            };

            token.addEventListener('touchstart', onStart, { passive: false });
            token.addEventListener('mousedown', onStart);
        });
    }

    function resetDartsPosition() {
        const dock = document.getElementById('dart-dock');
        const rect = dock.getBoundingClientRect();
        const tokens = [1,2,3].map(i => document.getElementById(`dart-${i}`));
        const gap = 50;
        const startX = rect.left + (rect.width/2) - gap;
        const cy = rect.top + (rect.height/2) - 20;

        tokens.forEach((t, i) => {
            t.style.position = 'fixed';
            t.style.transition = 'all 0.3s ease';
            t.style.left = (startX + (i*gap) - 20) + 'px';
            t.style.top = cy + 'px';
            t.style.transform = 'rotate(45deg)';
            t.querySelector('span').innerText = i+1;
            t.style.pointerEvents = 'auto'; // Ensure clickable
        });
    }

    function resetSingleDartPosition(i) {
        const dock = document.getElementById('dart-dock');
        const rect = dock.getBoundingClientRect();
        const t = document.getElementById(`dart-${i+1}`);
        const gap = 50;
        const startX = rect.left + (rect.width/2) - gap;
        const cy = rect.top + (rect.height/2) - 20;
       
        t.style.transition = 'all 0.3s ease';
        t.style.left = (startX + (i*gap) - 20) + 'px';
        t.style.top = cy + 'px';
        t.style.transform = 'rotate(45deg)';
    }

    // --- Logic ---
    function calculateOutcome() {
        const p = players[currentPlayerIndex];
        let tempScore = p.score;
        let isBust = false;
        let isWin = false;
        let pointsScored = 0;

        for(let i=0; i<3; i++) {
            const d = dartState[i];
            const pts = d.val * d.mult;
           
            if (isBust || isWin) continue; 

            const rem = tempScore - pts;
           
            if (rem < 0) {
                isBust = true;
            } else if (rem === 1) {
                isBust = true; // Cannot double out
            } else if (rem === 0) {
                if (d.mult === 2 || d.val === 50) {
                    isWin = true;
                    tempScore = 0;
                } else {
                    isBust = true; // Hit 0 on single
                }
            } else {
                tempScore = rem;
            }
            pointsScored += pts;
        }
       
        return { newScore: isBust ? p.score : tempScore, isBust, isWin, pointsScored };
    }

    function updateScoreUI() {
        if (!gameActive) return;
        const res = calculateOutcome();
        const el = document.getElementById(`proj-score-${currentPlayerIndex}`);
        if(el) {
            if (res.isBust) {
                el.innerHTML = `<span class="next-score bust">${txt.bust}</span>`;
            } else if (res.isWin) {
                el.innerHTML = `<span class="next-score" style="color:gold">${txt.win}</span>`;
            } else {
                let warning = "";
                if(res.newScore <= 1 && res.newScore > 0) warning = `(${txt.bust})`;
                el.innerHTML = `<span>${txt.next}</span> <span class="next-score">${res.newScore} ${warning}</span>`;
            }
        }
    }

    function checkAutoWin() {
        const res = calculateOutcome();
        if (res.isWin) {
            setTimeout(() => manualNext(), 500);
        }
    }

    function manualNext() {
        if (!gameActive) return;
        const p = players[currentPlayerIndex];
        const res = calculateOutcome();

        if (res.isWin) {
            p.score = 0;
            p.finished = true;
        } else if (!res.isBust) {
            p.score = res.newScore;
        }

        dartState = [{ val: 0, mult: 1 }, { val: 0, mult: 1 }, { val: 0, mult: 1 }];
        resetDartsPosition();

        if (players.every(pl => pl.finished)) {
            renderScoreboard();
            alert("Game Over!");
            gameActive = false;
            return;
        }

        let loop = 0;
        do {
            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            loop++;
        } while(players[currentPlayerIndex].finished && loop < players.length);

        renderScoreboard();
    }

    function addPlayer() {
        const input = document.getElementById('new-player-input');
        if(input.value.trim()) {
            players.push({name:input.value.trim(), score:501, finished:false});
            input.value="";
            renderList();
            input.focus(); // Keep focus for next entry
        }
    }
    function renderList() {
        const d = document.getElementById('player-list-display');
        d.innerHTML = players.map((p,i) => `<div class="player-tag">${p.name} <span onclick="players.splice(${i},1);renderList()">&times;</span></div>`).join('');
    }
    function startGame() {
        if(players.length<1) return;
        const s = parseInt(document.getElementById('start-score-select').value);
        players.forEach(p => { p.score=s; p.finished=false; });
        gameActive = true; currentPlayerIndex=0;
        document.getElementById('setup-modal').style.display='none';
        setTimeout(resetDartsPosition, 100);
        renderScoreboard();
    }
    function resetGame() {
        if(confirm("Reset?")) {
            players=[]; renderList();
            document.getElementById('setup-modal').style.display='flex';
        }
    }
    function renderScoreboard() {
        const b = document.getElementById('scoreboard');
        b.innerHTML = players.map((p,i) => {
            const active = (i===currentPlayerIndex && !p.finished);
            return `
            <div class="player-column ${active?'active':''} ${p.finished?'finished':''}" id="p-col-${i}">
                <div class="player-name">${p.name}</div>
                <div class="current-score">${p.finished ? txt.win : p.score}</div>
                ${active ? `<div class="projected-row" id="proj-score-${i}"><span>${txt.next}</span> <span class="next-score">${p.score}</span></div>` : ''}
            </div>`;
        }).join('');
        const a = document.querySelector('.player-column.active');
        if(a) a.scrollIntoView({behavior:'smooth', inline:'center'});
    }

    window.addEventListener('resize', () => { if(gameActive) resetDartsPosition(); });
    
    initBoard();
    initDrag();

</script>
</body>
</html>
